"aki~Acute kidney injury in hospital~Inpatient~20~76F admitted with volume depletion, on an ACE inhibitor, furosemide and ibuprofen. Creatinine has risen from 1.1 to 2.6 over 48 hours. Urine output 0.3 mL/kg/hr. BP 102/58, HR 98.~Recognise the <b>triple whammy</b> — a RAS inhibitor plus a diuretic plus an NSAID — and stop all three; <b>furosemide does not treat AKI</b>, it treats congestion, and giving it to a hypovolaemic patient worsens the injury; you must exclude post-renal obstruction with a bladder scan and consideration of renal ultrasound; and you need the urine indices to distinguish pre-renal from intrinsic — FENa under 1 percent suggests pre-renal, but <b>FENa is unreliable on diuretics so use FEUrea</b>~IV access;Assess volume status carefully;Pulse oximetry;Hold nephrotoxic and volume-depleting medications;Bladder scan to exclude retention~BMP with creatinine and potassium;Urinalysis with microscopy for casts;Urine sodium and FENa, or FEUrea if on diuretics;CBC;Renal ultrasound if obstruction is suspected;Medication review for every nephrotoxin~Restore volume with isotonic crystalloid if hypovolaemic;Hold the RAS inhibitor, diuretic, SGLT2 inhibitor, NSAID and metformin;Relieve obstruction if present;Treat hyperkalaemia if present;Dose-adjust all renally cleared drugs~Serial creatinine and potassium;Strict hourly intake and output;Daily weights;Watch for hyperkalaemia, acidosis and pulmonary oedema~Admit or manage closely as an outpatient depending on severity;Nephrology consult if severe or the cause is unclear;Plan medication restart once euvolaemic — usually restart the RAS inhibitor with monitoring rather than abandon it;Counsel on sick-day rules and NSAID avoidance;Follow-up with repeat labs within 1 to 2 weeks",
"hfpef~Heart failure with preserved ejection fraction~Inpatient~20~79F with 3 days of worsening dyspnoea and leg oedema, known hypertension and atrial fibrillation. HR 96 irregular, BP 162/88, SpO2 90% on room air. Elevated JVP, bibasilar crackles, 2 plus pitting oedema. Echocardiogram shows ejection fraction 58 percent with diastolic dysfunction.~Recognise that <b>HFpEF accounts for roughly half of heart failure</b> and is managed differently from HFrEF — the four pillars are not all indicated here; <b>an SGLT2 inhibitor is the key evidence-based addition</b> for HFpEF regardless of ejection fraction and regardless of diabetes status; treat congestion with diuresis, and equally importantly <b>hunt and treat the precipitant</b>; and control the atrial fibrillation rate, since a rapid ventricular response is a common trigger~IV access;Cardiac monitor;Pulse oximetry;Supplemental oxygen targeting SpO2 over 90 percent;Position upright;Fingerstick glucose~BNP;ECG;Chest radiograph;CBC;BMP including potassium and creatinine;Troponin;Echocardiogram;Thyroid function tests;Iron studies~IV loop diuretic for congestion;SGLT2 inhibitor unless contraindicated;Rate control for atrial fibrillation;Blood pressure control;Treat the precipitant — infection, ischaemia, arrhythmia, dietary sodium, non-adherence;Avoid excessive fluid~Recheck vitals and respiratory status;Repeat BMP for potassium and renal function;Strict intake and output with daily weights;Telemetry~Treat and document the precipitant;Transition to oral diuretic once euvolemic;Discharge with daily-weight instructions and a scheduled follow-up appointment;Sodium restriction and adherence counselling;Influenza and pneumococcal vaccination;Address the underlying comorbidity — hypertension, sleep apnoea, obesity, atrial fibrillation",
"afib~Rapid atrial fibrillation with decompensation~ED~20~72M with palpitations, dyspnoea and light-headedness for 6 hours. HR 148 irregular, BP 104/66, RR 24, SpO2 93 percent. History of hypertension and diabetes, no prior stroke. ECG confirms atrial fibrillation.~Recognise that <b>rate control is the immediate priority in a haemodynamically stable patient</b>, and that if the patient becomes unstable — hypotension, ischaemia, pulmonary oedema or altered mentation — <b>synchronised cardioversion is the answer and no one will ask you about anticoagulation first</b>; note that <b>aspirin is not an acceptable alternative to anticoagulation</b> for stroke prevention, which is a common distractor; remember that <b>cardioversion requires either 3 weeks of prior anticoagulation or a transoesophageal echocardiogram first if the duration exceeds 48 hours or is unknown</b>; and this patient has a CHA2DS2-VASc score of at least 3, which is Class 1 for anticoagulation~IV access;Cardiac monitor;Pulse oximetry;Supplemental oxygen if hypoxaemic;Fingerstick glucose;Assess haemodynamic stability~12-lead ECG;CBC;BMP including potassium and magnesium;TSH;Troponin;Coagulation studies;Echocardiogram;Chest radiograph;Thyroid function tests~Rate control with a beta-blocker or non-dihydropyridine calcium channel blocker, chosen by comorbidity and ejection fraction;Anticoagulation with a DOAC;Treat precipitating factors — infection, thyroid disease, alcohol, electrolyte derangement;Correct potassium and magnesium;Consider rhythm control including early catheter ablation in selected patients~Serial heart rate and rhythm on telemetry;Reassess symptoms and haemodynamics;Monitor for bleeding if anticoagulated;Check renal function before dosing a DOAC~Admit if unstable or rate poorly controlled;Cardiology consult for rhythm strategy;Counsel on anticoagulation duration, bleeding precautions and adherence;Address risk factor modification — alcohol, weight, sleep apnoea, blood pressure;Follow-up appointment scheduled;Guideline-directed treatment of hypertension and diabetes",
"hypothy~Severe hypothyroidism and myxedema~Inpatient~20~68F with months of fatigue, cold intolerance and weight gain, now with increasing somnolence and confusion. HR 52, BP 92/58, temperature 35.4, RR 10 shallow. Dry skin, periorbital oedema, delayed reflexes. TSH markedly elevated with low free T4; sodium 126.~Recognise <b>myxedema coma as a clinical diagnosis that must be treated before confirmation</b> — mortality is high and waiting for labs costs lives; remember the treatment order matters: <b>give stress-dose glucocorticoids until adrenal insufficiency is excluded, because treating with thyroid hormone alone in a patient with coexisting adrenal insufficiency precipitates an adrenal crisis</b>; treat hypothermia with passive rewarming only, and support ventilation rather than stimulating; and note the hyponatraemia is part of the syndrome, correcting with treatment of the hypothyroidism rather than aggressive fluid~Airway assessment and ventilatory support;IV access;Cardiac monitor;Pulse oximetry;Passive rewarming;Continuous temperature monitoring~TSH and free T4;Morning cortisol before steroids if it does not delay treatment;CBC;BMP including sodium;ABG for hypoventilation;ECG for bradycardia and QT prolongation;Thyroid peroxidase antibodies;Consider chest radiograph and blood cultures for a precipitant~<b>Intravenous levothyroxine</b>;Stress-dose glucocorticoids until adrenal insufficiency is excluded;Passive rewarming;Ventilatory support;Treat the precipitant — infection, myocardial infarction, sedatives, cold exposure;Avoid aggressive fluid for the hyponatraemia;Avoid stimulating or invasive rewarming~Recheck temperature and haemodynamics;Serial thyroid function and electrolytes;Cardiac monitoring for arrhythmia;Neurological checks for improvement~Admit to a monitored or intensive setting;Endocrinology consult;Identify and document the precipitant;Counsel on lifelong therapy and adherence;Follow-up with repeat thyroid function in 6 to 8 weeks;Preventive: vaccination, falls assessment, medication review",
"giard~Chronic diarrhoea with malabsorption~Clinic~10~34F with 5 weeks of watery diarrhoea, bloating, fatigue and 4 kg weight loss after a hiking trip where she drank untreated stream water. No blood, no fever. Mild diffuse abdominal tenderness.~Recognise that you must <b>distinguish malabsorptive from inflammatory from osmotic diarrhoea</b> before ordering — greasy bulky stools with weight loss suggests malabsorption, blood and mucus suggests inflammation, and improvement with fasting suggests osmotic; the critical practical point is that <b>a standard stool culture will miss Giardia</b>, so you must specifically request ova and parasites and a Giardia stool antigen; and celiac disease is the other diagnosis not to miss, which requires <b>tissue transglutaminase IgA plus a total IgA</b>, because IgA deficiency causes false negatives~Assess volume status;Review of systems for alarm features;Medication review;Detailed travel and water exposure history~Stool studies including ova and parasites and Giardia antigen;Stool culture;CBC with differential and iron studies;BMP;Celiac serology with tissue transglutaminase IgA and total IgA;TSH;Faecal calprotectin to separate inflammatory from functional;Stool osmotic gap~Treat the identified pathogen;Rehydration and electrolyte replacement;Avoid lactose temporarily if secondary lactase deficiency is suspected;Consider empiric therapy if the diagnosis is strongly suspected while testing is pending;Nutritional support for the weight loss~Weight and symptom diary;Repeat stool studies if symptoms persist;Monitor electrolytes and renal function;Reassess after treatment~Follow up all results, including any referral for endoscopy if the workup is negative;Counsel on safe drinking water when travelling;Follow-up appointment scheduled;Preventive: nutrition review and iron repletion if deficient",
"thyroidca~Thyroid nodule evaluation~Clinic~10~46F with an incidentally found 2.4 cm thyroid nodule on a CT scan performed for another reason. Euthyroid on examination and bloodwork. No compressive symptoms, no hoarseness, no family history of thyroid cancer, no prior neck radiation.~Recognise that the first step is <b>TSH</b>, because a hyperfunctioning nodule essentially never needs biopsy; the size threshold for biopsy is <b>1.5 cm for a solid hypoechoic nodule with suspicious features and 2 cm for a solid isoechoic nodule</b>, so this nodule needs an ultrasound-guided fine-needle aspiration; remember the <b>Bethesda system</b> for reporting cytology and that Bethesda 3 and 4 are indeterminate categories where molecular testing helps guide management; and note that <b>routine thyroid function should be checked before any contrast study</b> in a patient with a nodule~TSH;Free T4 if TSH is abnormal;Dedicated thyroid and neck ultrasound with nodule characterisation;Ultrasound-guided fine-needle aspiration if size and features meet criteria;Cervical lymph node assessment;Calcitonin if medullary carcinoma is a concern~If TSH is suppressed, obtain a radioactive iodine uptake scan rather than biopsying a likely hyperfunctioning nodule;If thyroid function is normal and the nodule has suspicious features, proceed to fine-needle aspiration;Bethesda 5 and 6 go to surgery;Bethesda 3 and 4 consider molecular testing or repeat biopsy~Reassess the nodule with serial ultrasound if a benign aspirate is followed by growth;Monitor thyroid function if suppressed;Document nodule size and features for future comparison~Explain results and the Bethesda category;Surgical referral for Bethesda 5 and 6, or for compressive symptoms;Annual ultrasound surveillance for growth of a benign nodule;Counsel that most nodules are benign;Follow-up appointment scheduled for results and shared decision-making",
"copdasth~Asthma exacerbation in a known asthmatic with poor control~ED~20~24F with known asthma, four prior emergency visits in the past year, now with severe dyspnoea and inability to speak in full sentences. HR 126, RR 32, SpO2 90 percent on room air, peak flow 38 percent of personal best. Audible wheeze. On no controller inhaler, uses albuterol daily.~Recognise that <b>this patient needs inhaled corticosteroid-containing therapy started before discharge, not just a rescue inhaler</b> — GINA recommends against SABA-only treatment at any age, and <b>four exacerbations in a year means the preventive plan has failed, not that the patient is non-compliant</b>; remember that <b>oxygen should not be given unless saturation is below 92 percent</b> and the upper target is 95 percent; <b>over-treatment with SABA causes lactic acidosis</b>, which drives compensatory hyperventilation that can be mistaken for worsening asthma and lead to even more SABA; and <b>spirometry should be measured before discharge to confirm the diagnosis</b>~Assess severity and airway;Controlled oxygen only if SpO2 is below 92 percent;IV access if severe;Fingerstick glucose;Pulse oximetry~Objective severity assessment with peak flow;Spirometry before discharge;ABG if severe or deteriorating;Chest radiograph only if pneumothorax or pneumonia is suspected;CBC~Inhaled SABA in conservative doses with reassessment;Ipratropium for moderate to severe presentation;Systemic corticosteroids;Magnesium sulfate for severe exacerbation;Consider ICS-formoterol as a reliever;Epinephrine first if there are anaphylaxis features;Non-invasive ventilation if in respiratory failure~Review the response after the initial bronchodilator dose rather than writing repeat doses;Serial peak flow;Reassess work of breathing and speech each interval;Watch specifically for SABA toxicity and lactic acidosis~Start or optimise ICS-containing controller therapy — this is the whole point of the case;Inhaler technique with a spacer rechecked;Written asthma action plan;Follow-up appointment within 2 to 7 days;Consider referral to a specialist and biologic assessment if severe;Identify and address the trigger",
"obesity~Obesity with cardiometabolic risk~Clinic~10~48M with a BMI of 38, hypertension, prediabetes and a 10-year ASCVD risk of 11 percent. He has tried diet and exercise on his own without sustained success. BP 146/92, A1c 6.3 percent, LDL-C 138.~Recognise that obesity is a chronic disease requiring a staged, multimodal plan rather than a single intervention; <b>the foundation is an intensive multicomponent behavioural programme with more than 6 months and at least 14 sessions</b>, not generic advice to eat less; <b>pharmacotherapy is appropriate at a BMI of 30 or above, or 27 or above with comorbidity</b>, and a GLP-1 based agent is now among the most effective options; and given the 10-year risk of 11 percent, <b>he is in the high-risk primary prevention category, so a high-intensity statin is recommended with an LDL-C goal below 70</b>~Measure blood pressure with correct technique;Weight and BMI;Screen for obstructive sleep apnoea and depression;Assess diet, activity and readiness to change;Medication review including any weight-promoting agents~Fasting lipid panel;HbA1c;BMP with eGFR and liver enzymes;Urine albumin-to-creatinine ratio;TSH;Screen for obstructive sleep apnoea;CAC scoring if the statin decision remains uncertain;Calculated 10-year ASCVD risk by PREVENT~Intensive multicomponent behavioural intervention over at least 6 months;Pharmacotherapy — a GLP-1 based agent given the comorbidity, or another agent based on cost and access;High-intensity statin with an LDL-C goal below 70 and non-HDL-C below 100;Blood pressure therapy to a target below 130/80;Consider metabolic surgery, which is appropriate for a BMI of 35 or above with comorbidity;Nutrition and exercise counselling~Weight trajectory and waist circumference;Repeat A1c in about 3 months;Monitor lipids after starting the statin;Home blood pressure monitoring;Adverse effects of pharmacotherapy~Referral to a registered dietitian and a structured weight programme;Moderate-intensity statin and blood pressure follow-up;Counsel on realistic weight-loss goals and long-term maintenance;Set a specific follow-up interval rather than return as needed;Preventive: age-appropriate screening, immunisations and depression screening;Discuss the trajectory of prediabetes and monitor for progression",
"divert~Acute diverticulitis~ED~20~62F with 2 days of left lower quadrant pain, fever and nausea. HR 102, BP 128/78, T 38.4. Left lower quadrant tenderness with mild guarding, no rebound.~Recognise that <b>uncomplicated diverticulitis may be managed without antibiotics in mild cases</b>, which is a genuine change from older practice; the decision hinges on severity and complications, so <b>CT with contrast is the key study</b> to identify abscess, perforation, obstruction or fistula; <b>avoid colonoscopy during the acute episode</b> because of perforation risk — it is arranged after recovery; and remember the indications for surgery: perforation, generalised peritonitis, or failure to improve on medical management~IV access;Pulse oximetry;Fingerstick glucose;Assess for peritonitis and haemodynamic stability~CT of the abdomen and pelvis with contrast;CBC;BMP;Urinalysis to exclude a urinary source;Blood cultures if febrile;Consider pelvic ultrasound in women if the diagnosis is unclear~IV fluids;Analgesia;Antibiotics covering gram-negatives and anaerobes if complicated, immunocompromised, or systemically unwell;Percutaneous drainage for a large abscess;Surgical consult for perforation or peritonitis;Bowel rest or a low-residue diet during the acute phase~Recheck vitals, temperature and abdominal examination each interval;Serial inflammatory markers;Watch for perforation with a rising lactate and worsening examination;Monitor for obstruction~Admit if complicated or systemically unwell;Surgery consult for complicated disease;Discharge on a low-residue diet with a plan for <b>colonoscopy after recovery</b> to exclude malignancy;Counsel on a high-fibre diet and the symptoms that warrant urgent return;Follow-up appointment scheduled",
"thyroid~Suspected hyperthyroidism with atrial fibrillation~Clinic~10~58M with 3 months of palpitations, weight loss despite good appetite, heat intolerance and tremor. HR 112 irregular, BP 138/76. Diffuse smooth goitre, lid lag, fine tremor. ECG shows atrial fibrillation.~Recognise that <b>TSH is the initial test, and a suppressed TSH points to hyperthyroidism</b>, but you must then obtain free T4 and T3 to grade severity; note the diagnostic distinction — <b>diffuse uptake on a radioactive iodine uptake scan suggests Graves disease, while a high uptake in a single nodule suggests toxic adenoma, and low uptake suggests thyroiditis</b>, and these have entirely different treatments; <b>atrial fibrillation from hyperthyroidism may not rate-control well until the thyroid is treated</b>; and in a patient over 60 with new atrial fibrillation, <b>always check thyroid function</b>, because subclinical hyperthyroidism is a common and reversible cause~TSH;Free T4 and total or free T3;Thyroid stimulating immunoglobulin or TSH receptor antibody;Radioactive iodine uptake scan to distinguish Graves from toxic nodule from thyroiditis;ECG;Echocardiogram for atrial fibrillation and to assess for heart failure;Liver function tests and CBC before antithyroid drugs;Beta-hCG if pregnancy is possible~Antithyroid drug — methimazole is preferred unless the patient is in the first trimester, when propylthiouracil is used;Beta-blocker for symptomatic control and rate control;Anticoagulation for atrial fibrillation based on annual stroke risk;Radioactive iodine ablation or surgery as definitive therapy for Graves disease;Treat the atrial fibrillation and reassess the rhythm once euthyroid~Recheck thyroid function in 4 to 6 weeks;Monitor for agranulocytosis, which presents as a sore throat or fever — check a CBC and stop the drug;Monitor liver function;Reassess heart rate and rhythm;Reassess anticoagulation need once euthyroid~Endocrinology consult;Counsel on radioiodine or surgery as definitive options and the need for lifelong thyroid replacement after ablation;Counsel on the warning symptoms of agranulocytosis;Follow-up appointment in 4 to 6 weeks;Manage the atrial fibrillation with rate and anticoagulation decisions documented;Preventive: bone density assessment given the hyperthyroid state",
"nsclc~Suspected lung cancer~Clinic~10~64M with a 30 pack-year history who quit 3 years ago, presenting with 6 weeks of a persistent cough, haemoptysis and 5 kg weight loss. SpO2 94 percent, right-sided expiratory wheeze. Never had a low-dose CT. On no medications.~Recognise that <b>any haemoptysis with weight loss and a smoking history requires urgent evaluation, and the initial test is a chest radiograph or, better, low-dose CT</b>; note that <b>this patient was eligible for screening — 30 pack-years, quit 3 years ago, age 64, so he meets the criteria of age 50 to 80 with 20 or more pack-years and quitting within 15 years</b>; remember that <b>staging is the priority once cancer is found, because it determines whether the intent is curative or palliative</b>; and <b>do not delay referral waiting for the imaging to return</b> if the clinical suspicion is high~Complete history including occupational and family history;Weight and performance status;Pulse oximetry;Assess for superior vena cava syndrome, hoarseness and bone pain~Chest radiograph then CT of the chest;Low-dose CT screening eligibility review despite this being diagnostic;Complete staging with PET-CT and brain imaging;Sputum cytology or bronchoscopy for tissue and molecular diagnosis;Pulmonary function tests before any planned resection;CBC and comprehensive metabolic panel, including calcium and sodium for paraneoplastic findings~Refer urgently to pulmonology and thoracic oncology;Do not delay referral pending imaging;Tissue sampling for histology and molecular markers;Multidisciplinary tumour board for treatment planning;Treat complications such as hypercalcaemia or obstruction~Surveillance for post-obstructive pneumonia;Monitor for superior vena cava obstruction, spinal cord compression and hypercalcaemia;Reassess performance status and symptoms~Explain the diagnosis and staging clearly and with empathy;Refer to thoracic oncology, radiation oncology and a multidisciplinary tumour board;Discuss goals of care and advance care planning;Smoking cessation maintained;Cancer screening review for other sites;Referral to supportive care and symptom management",
"geriatricfall~Recurrent falls in an older adult~Clinic~10~82F with two falls in the past 6 months, no loss of consciousness, no injury. On lisinopril, hydrochlorothiazide, amitriptyline for insomnia and zolpidem as needed. BP 112/68 seated, 96/62 standing, HR 78. Lives alone, uses a cane sometimes.~Recognise that falls in older adults are <b>multifactorial and never just one cause</b>, so the evaluation must be systematic; <b>the medication list is the highest-yield finding here</b> — amitriptyline is an anticholinergic that causes orthostatic hypotension and sedation, zolpidem is a sedative-hypnotic on the Beers list, and hydrochlorothiazide contributes to volume depletion; <b>orthostatic vital signs are mandatory</b> and here confirm a 16 mmHg systolic drop; the <b>high-yield intervention is exercise, which has Grade B evidence for falls prevention</b>; and note that <b>vitamin D alone does not prevent falls</b> in modern trials though correcting deficiency remains reasonable~Orthostatic vital signs;Assess gait and balance with a timed up-and-go test;Medication review focused on sedatives, anticholinergics and antihypertensives;Vision assessment;Footwear and home hazards;Screen for cognitive impairment;Assess for cardiac causes~BMP including renal function and electrolytes;ECG;CBC and TSH;Vitamin D level;Consider Holter monitoring if syncope or palpitations;Assess vision;Check the home environment~Deprescribe <b>amitriptyline and zolpidem</b> — this is the single highest-yield intervention;Reduce or change the antihypertensive regimen given orthostatic hypotension;Refer to a <b>structured exercise programme for strength and balance</b>, the intervention with the strongest evidence;Correct vitamin D deficiency;Non-pharmacologic sleep management for insomnia;Home safety assessment and mobility aids~Blood pressure monitoring seated and standing;Gait and balance reassessment;Falls diary;Adherence to the exercise programme;Review as medications are tapered~Medication tapering plan with specific follow-up;Referral to physical therapy and a falls prevention programme;Home safety modification referral;Counsel on the causes of falls and how to get up safely;Follow-up appointment in 2 to 4 weeks to review the taper;Preventive: vaccination and screening review, driving assessment, and consideration of advance care planning",
"coloc~Screening colonoscopy with findings~Clinic~10~56M with a normal colonoscopy 9 years ago, returns for routine screening. No symptoms, no family history of colorectal cancer. Colonoscopy today finds three tubular adenomas, the largest 8 mm.~Recognise that <b>he had met the screening indication as an average-risk adult aged 45 to 75</b>, and that finding <b>three adenomas moves him from average risk to a surveillance interval of 3 years</b>, which is the key management point; note that <b>1 to 2 small tubular adenomas would mean 7 to 10 years</b> and more than 10 adenomas would raise concern for a hereditary syndrome; <b>high-risk features that shorten the interval are the number, size over 10 mm, villous histology and high-grade dysplasia</b>; and remember that <b>surveillance is based on the findings of the clearing examination</b>, and an incomplete colonoscopy does not count~Confirm the indication and screening history;Assess for any symptoms or weight loss;Review family history of colorectal cancer or polyps;Assess for anaemia~Pathology review of all three polyps for histology and dysplasia;Document the number, size, location and complete versus incomplete examination;CBC to assess for anaemia;Review of prior colonoscopy documentation~Recommend <b>surveillance colonoscopy in 3 years</b> based on three adenomas;Counsel that the finding means closer surveillance rather than a diagnosis of cancer;Address modifiable risks — smoking, alcohol, red and processed meat, obesity, sedentary behaviour;Consider aspirin only if there is another indication~No further immediate testing needed;Surveillance colonoscopy in 3 years;Review the pathology result with the patient;Assess adherence with the surveillance plan~Communicate the findings and the 3-year interval clearly and in writing;Counsel that the polyps have been removed and this prevents cancer;Follow-up appointment scheduled and the surveillance interval documented;Preventive: confirm other age-appropriate screening, immunisations and lifestyle counselling;Address family history and whether relatives need earlier screening",

"burn~Thermal burn with inhalational injury~ED~20~34M rescued from a house fire with burns to the face, neck, chest and both arms. Estimated 35 percent total body surface area. HR 128, BP 104/62, RR 28, SpO2 94 percent on room air, hoarse voice, singed nasal hairs, soot around the mouth.~The single most important recognition is that <b>a hoarse voice with singed nasal hairs and soot means inhalational injury that will progress to airway obstruction — intubate early, before the swelling makes it impossible</b>, and this is the answer most often missed because the patient looks stable at first; use the <b>Parkland formula of 4 mL per kg per percent TBSA of lactated Ringer in the first 24 hours, with half given in the first 8 hours from the time of injury</b>, not from arrival; <b>do not use colloid, and remember that the formula is a starting point, titrated to urine output of 0.5 mL per kg per hour in adults</b>; treat <b>carboxyhaemoglobin</b> with 100 percent oxygen, and note that pulse oximetry reads falsely normal in carbon monoxide poisoning so you need a co-oximetry level; and do not apply ice or ointments before assessment~Airway assessment — this is the priority;Early intubation if any sign of inhalational injury;IV access through unburned skin;Cardiac monitor;Pulse oximetry — remembering it is falsely normal in CO poisoning;100 percent oxygen;Fingerstick glucose;Analgesia~Arterial blood gas with carboxyhaemoglobin;Lactated Ringer by the Parkland formula;CBC;BMP;ECG;Urinalysis for myoglobin if deep burns;Bronchoscopy if inhalational injury is suspected;Blood type and crossmatch~<b>Early intubation for airway protection</b>;Fluid resuscitation with lactated Ringer titrated to urine output;100 percent oxygen until carboxyhaemoglobin normalises;Analgesia — opioids titrated carefully;Tetanus prophylaxis;Antibiotics only for proven infection, not prophylaxis;Escharotomy if circumferential chest or limb burns compromise ventilation or perfusion;Topical antimicrobial dressings after assessment;Early enteral nutrition~Hourly urine output targeting 0.5 mL per kg per hour;Serial carboxyhaemoglobin and ABG;Reassess airway closely for the first 24 to 48 hours;Monitor for hypothermia and keep the patient warm;Watch for compartment syndrome in circumferential limb burns~Admit to a burn centre;Surgical consult;Nutritional support;Counsel on scar management and rehabilitation;Physiotherapy referral;Follow-up with burn surgery;Preventive: tetanus and vaccination review, and smoke detector counselling",
"trauma~Blunt trauma with haemorrhagic shock~ED~20~42M after a high-speed motorcycle collision. HR 148, BP 78/48, RR 30, SpO2 92 percent. GCS 14, pale and clammy, abdomen distended and tender, pelvis unstable on examination.~The critical recognition is that <b>haemorrhage is the leading cause of preventable death in trauma, so the priority is finding and controlling bleeding rather than imaging</b>; in an unstable patient with a positive FAST examination the answer is <b>immediate operative intervention, not CT</b>; <b>do not aggressively give crystalloid</b> because it dilutes clotting factors, worsens acidosis and dislodges clot — modern practice is <b>damage control resuscitation with blood products in balanced ratios, permissive hypotension until haemorrhage is controlled, and tranexamic acid within 3 hours of injury</b>; and remember the <b>lethal triad of hypothermia, acidosis and coagulopathy</b>, so keep the patient warm, and think of <b>hypocalcaemia</b> from citrate in transfused blood, which worsens coagulopathy and hypotension~Airway with cervical spine control;Breathing assessment;Two large-bore IV lines or intraosseous access;Cardiac monitor;Pulse oximetry;Warm blankets and fluid warmers;Pelvic binder if the pelvis is unstable;FAST examination;Massive transfusion protocol activation~Blood type and crossmatch;CBC;BMP including calcium;Coagulation studies including fibrinogen;Arterial blood gas with lactate;FAST examination;Pelvic and chest radiographs;CT trauma pan-scan only if the patient is stabilised and haemodynamically stable~Activate the massive transfusion protocol with balanced blood products;<b>Tranexamic acid</b> for traumatic haemorrhage;Permissive hypotension until surgical control;Immediate operative intervention for abdominal haemorrhage;Reduce and immobilise the pelvis;Calcium replacement for citrate-induced hypocalcaemia;Damage control surgery rather than definitive repair initially~Serial haemoglobin and lactate;Monitor calcium, potassium and temperature;Reassess the abdomen and pelvis;Watch for ongoing bleeding with rising lactate and worsening acidosis;Continuous haemodynamic monitoring~Activate trauma surgery;Admit to the intensive care unit;Post-operative monitoring and second-look surgery;Counsel the family and document goals of care;Rehabilitation planning;Preventive: counsel on helmet use and safe driving, and assess alcohol and substances",
"ohe~Acute upper gastrointestinal haemorrhage from varices~ED / Inpatient~20~58M with known alcohol-related cirrhosis, presenting with massive haematemesis and melaena. HR 132, BP 84/50, RR 26, SpO2 95 percent. Scleral icterus, ascites, spider angiomata, asterixis.~Recognise that <b>variceal bleeding is a distinct emergency from ulcer bleeding and requires a different bundle — antibiotics plus a vasoactive agent plus endoscopy, not just a proton pump inhibitor</b>; the <b>antibiotic is not optional: it reduces mortality and rebleeding in cirrhotic variceal haemorrhage, with ceftriaxone being standard</b>; give <b>octreotide or terlipressin early, before endoscopy</b>; <b>transfuse restrictively to a haemoglobin of about 7 g/dL</b> because over-transfusion raises portal pressure and precipitates rebleeding; <b>avoid over-sedation and avoid NSAIDs and aminoglycosides</b> in cirrhosis; and <b>consider the balloon tamponade or TIPS pathway if endoscopic therapy fails</b>~Airway assessment — risk of aspiration with massive haematemesis;Two large-bore IV lines;Cardiac monitor;Pulse oximetry;Type and crossmatch;Isotonic fluid resuscitation;Consider intubation for airway protection if massive bleeding~CBC;BMP including creatinine and liver function;Coagulation studies including INR;Fibrinogen;Arterial blood gas with lactate;Blood type and crossmatch;Nasogastric lavage;Upper endoscopy after resuscitation;Consider CT angiography or interventional radiology if endoscopy fails~<b>Ceftriaxone</b> for bacterial prophylaxis;<b>Octreotide or terlipressin</b> started before endoscopy;Resuscitation with blood products to a restrictive haemoglobin threshold;<b>Endoscopic variceal band ligation</b>;Balloon tamponade as a temporising measure if endoscopic therapy fails;<b>TIPS</b> for refractory bleeding;Avoid over-transfusion, which raises portal pressure;Correct coagulopathy with plasma and platelets only if actively bleeding and markedly abnormal;Albumin for volume and to reduce the risk of hepatorenal syndrome;Lactulose for encephalopathy~Recheck haemoglobin and vitals each interval;Urine output and mental status as perfusion markers;Watch for rebleeding which is common in the first 72 hours;Monitor for aspiration, encephalopathy and infection;Serial lactate~Admit to the intensive care unit or a monitored bed;Gastroenterology and hepatology consult;Assess for liver transplant candidacy;Alcohol cessation counselling and referral;Secondary prophylaxis with a non-selective beta-blocker after recovery;Follow-up appointment scheduled;Preventive: hepatology follow-up, vaccination for hepatitis A and B, and nutrition review",
"pe2~Post-operative pulmonary embolism~Inpatient~20~66F on post-operative day 4 after total knee arthroplasty, with sudden dyspnoea and pleuritic chest pain. HR 124, BP 118/72, RR 30, SpO2 88 percent on room air. Right calf swollen and tender.~Recognise that <b>hypoxaemia with tachycardia on post-operative day 3 to 7 after orthopaedic surgery is pulmonary embolism until excluded</b>, and that this is the classic timing because thrombus forms around surgery and propagates; <b>the diagnostic pathway is pre-test probability then CT pulmonary angiography, with D-dimer being unhelpful post-operatively because it is routinely elevated</b> after surgery — a common trap; <b>anticoagulate empirically while awaiting confirmation if the clinical suspicion is high and there is no bleeding contraindication</b>; consider <b>thrombolysis or catheter-directed therapy if the patient is haemodynamically unstable</b>, and remember that <b>tenecteplase may be preferred over alteplase in this setting</b>; and <b>stop the pharmacologic prophylaxis and switch to therapeutic anticoagulation</b>~IV access;Cardiac monitor;Pulse oximetry;Supplemental oxygen;Fingerstick glucose;Assess haemodynamic stability for shock~CBC including platelets;BMP;Coagulation studies;ECG looking for right heart strain;Arterial blood gas;CT pulmonary angiography;Lower extremity venous ultrasound;Troponin and BNP for right heart strain;Echocardiogram if unstable~<b>Therapeutic anticoagulation — start empirically if suspicion is high</b>;Switch from prophylactic to therapeutic dosing;Thrombolysis if haemodynamically unstable;Consider catheter-directed therapy for submassive disease;Supplemental oxygen;Fluids cautiously and vasopressors if hypotensive;Stop any ongoing VTE prophylaxis~Recheck vitals and oxygenation each interval;Monitor for bleeding on anticoagulation;Reassess haemodynamics and right heart strain;Serial haemoglobin;Urine output~Admit to a monitored bed;Pulmonary or critical care consult;Determine anti "pnaasp~Hospital-acquired pneumonia~Inpatient~20~70M on hospital day 6 after a prolonged admission, now with new fever, purulent sputum and increasing oxygen requirement. HR 112, BP 108/66, RR 26, T 38.6, SpO2 90 percent on 2 L. Right lower zone crackles and dullness.~Recognise that <b>hospital-acquired pneumonia occurring after 48 hours of admission is a different disease from community-acquired pneumonia and requires broader empiric coverage including Pseudomonas and possibly MRSA</b>; <b>use local resistance patterns and prior cultures to guide the regimen</b>, and if the patient has risk factors for multidrug resistance — recent hospitalisation, prior antibiotics, structural lung disease — <b>cover with two antipseudomonal agents</b>; <b>obtain cultures before antibiotics but never delay antibiotics in an unstable patient</b>; and <b>de-escalate once culture data return</b>, which is the stewardship point that earns credit~Pulse oximetry;Supplemental oxygen;IV access if systemically unwell;Cardiac monitor if unstable;Assess for sepsis criteria~Chest radiograph;Blood cultures before antibiotics;Sputum or tracheal aspirate culture with Gram stain;CBC;BMP;Lactate if sepsis is suspected;Consider procalcitonin for antibiotic de-escalation;Assess for pleural effusion~<b>Empiric broad-spectrum antibiotics covering Pseudomonas and gram-negatives, plus MRSA coverage if risk factors are present</b>;Supplemental oxygen;Consider non-invasive ventilation if in respiratory failure;Fluids if hypoperfusing;Pleural drainage if an empyema develops;De-escalate antibiotics based on culture and susceptibility results~Recheck vitals, temperature and oxygenation each interval;Track cultures and susceptibility results;Reassess oxygenation to determine readiness for discharge;Watch for empyema and respiratory failure~Continue inpatient management until afebrile and stable and oxygenation has improved;Infectious disease or pulmonary consult;De-escalate and narrow antibiotics on culture data and document the rationale;Discharge once the oxygen requirement has resolved and the patient is tolerating oral intake;<b>Aspiration precautions and oral care</b>;Preventive: vaccination, head of bed elevation, and early mobilisation",
"ckd~Advanced chronic kidney disease with a view to dialysis~Clinic~10~64M with type 2 diabetes and stage 4 chronic kidney disease, eGFR 22, urine albumin-to-creatinine ratio 1200. BP 156/88, potassium 5.4. On an ACE inhibitor, an SGLT2 inhibitor and a statin. Reports increasing fatigue.~Recognise that <b>at eGFR around 20 to 25 you should be referring for dialysis education and planning, because preparation takes months and starting dialysis in crisis is far worse</b>; <b>do not stop the ACE inhibitor or the SGLT2 inhibitor just because the eGFR is low</b> — both confer major cardiorenal protection and the SGLT2 inhibitor can be continued down to eGFR 20; <b>add finerenone if appropriate for residual albuminuria, monitoring potassium closely</b>; <b>for advanced CKD with eGFR under 30, a GLP-1 receptor agonist is preferred for glycemic management because of lower hypoglycaemia risk and cardiovascular benefit</b>; and remember the <b>sick day rules</b> and the need to monitor potassium after any change~Blood pressure with correct technique;Weight;Assess for symptoms of uraemia;Medication review including all nephrotoxins and dose adjustments~BMP with eGFR and potassium;Urine albumin-to-creatinine ratio;CBC with iron studies;Phosphate, calcium and parathyroid hormone;Vitamin D;HbA1c;Urinalysis;Assess dialysis access options and vascular access planning~Continue the ACE inhibitor or ARB for kidney and cardiovascular protection;Continue the SGLT2 inhibitor down to eGFR 20 — expect a reversible eGFR dip;<b>Add finerenone</b> for residual albuminuria with potassium monitoring;Consider a GLP-1 receptor agonist for glycemic control and cardiovascular benefit;Statin;Blood pressure control;Sodium-glucose cotransporter inhibitor for additional cardiorenal protection;Phosphate binders and vitamin D as indicated;Erythropoiesis-stimulating agent if anaemic with iron repletion;Treat metabolic acidosis with bicarbonate~Potassium and creatinine after every medication change;Blood pressure;Albuminuria;Symptoms of uraemia;Anaemia profile;Watch for hyperkalaemia, which is the dose-limiting adverse effect of finerenone~Nephrology referral for dialysis planning and modality education;<b>Refer for vascular access evaluation — typically an arteriovenous fistula, because it needs months to mature</b>;Dietitian referral for a renal diet;Discuss conservative kidney management as an alternative;Counsel on sick day rules and avoiding NSAIDs and salt substitutes;Preventive: vaccination including hepatitis B, pneumococcal, influenza and COVID;Documented advance care planning",
"cellu~Cellulitis versus necrotising fasciitis~ED~20~61M with a spreading painful red area on the left lower leg after a minor abrasion. HR 118, BP 106/62, T 39.1. Severe pain out of proportion to the visible findings, dusky skin with a bulla, and crepitus on palpation.~Recognise immediately that <b>pain out of proportion, crepitus and bullae mean necrotising fasciitis, which is a surgical emergency and the treatment is exploration and debridement, not antibiotics alone</b>; <b>do not delay surgery for imaging — the imaging can be normal early and a delay of hours costs the limb or the life</b>; <b>mark the border of erythema to track progression</b> and reassess frequently; <b>give broad-spectrum antibiotics including MRSA coverage and antitoxin activity against streptococcal toxic shock — clindamycin is added specifically to suppress toxin production</b>; and <b>elevate the limb and give aggressive fluid resuscitation for shock</b> — this patient has tachycardia and hypotension and may be in streptococcal toxic shock~IV access with two large-bore lines;Cardiac monitor;Pulse oximetry;Fingerstick glucose;Aggressive fluid resuscitation;Mark and document the extent of erythema~CBC;BMP including creatinine and creatine kinase;Lactate;Blood cultures;Surgical consult for immediate exploration;Marked border of erythema;Consider imaging only if it will not delay surgery~<b>Immediate surgical exploration and debridement</b>;Broad-spectrum antibiotics covering gram-positives, gram-negatives and anaerobes;<b>Add clindamycin to suppress toxin production</b>;Add MRSA coverage if risk factors are present;Aggressive fluid resuscitation;Vasopressors for septic shock;Analgesia;Elevation of the limb~Recheck vitals each interval;Serial lactate;Reassess the extent of erythema against the marked border;Monitor for progression to toxic shock;Track cultures~Admit to intensive care or a surgical bed;Surgical debridement with planned re-exploration;<b>Repeat debridement is expected and sho "stroke2~Transient ischaemic attack~ED~10~68M with 45 minutes of right arm weakness and slurred speech that fully resolved 2 hours ago. Neurological examination now normal. HR 88 irregular, BP 168/92. ECG shows atrial fibrillation.~The pivotal recognition is that <b>a transient ischaemic attack is a medical emergency carrying a high early stroke risk, with the greatest risk in the first 48 hours</b>, so this patient needs admission or urgent evaluation, not an outpatient appointment next week; <b>the workup is the same as for stroke — brain and vascular imaging, cardiac evaluation and risk factor assessment</b>; <b>the ABCD2 score for risk stratification has fallen out of favour, so do not rely on it alone to decide disposition</b>; note that <b>the atrial fibrillation here is the mechanism, which changes the treatment entirely toward anticoagulation rather than antiplatelets</b>; and remember that <b>aspirin is not adequate stroke prevention in atrial fibrillation</b>~Neurological examination;Cardiac monitor;Pulse oximetry;Blood pressure assessment;Fingerstick glucose;Determine the exact timing of symptom resolution~Non-contrast head CT;CT or MR angiography of the head and neck;ECG;Echocardiogram including evaluation for a cardiac source;Telemetry or Holter monitoring;Carotid ultrasound;CBC;BMP;Coagulation studies;Lipid panel and HbA1c~<b>Anticoagulation for the atrial fibrillation — DOACs are preferred over warfarin</b>;Do not use aspirin as the sole antithrombotic;Blood pressure management with a target below 130/80;High-intensity statin;Address risk factors including diabetes and smoking~Continuous telemetry to detect atrial fibrillation burden;Recheck blood pressure;Reassess neurological status for recurrence;Monitor for bleeding once anticoagulated~Admit for urgent workup given the high early risk;<b>Neurology consult and inpatient workup rather than outpatient referral</b>;Cardiology consult for atrial fibrillation management and rhythm decision;Counsel on st "syncope~Syncope in an older adult~ED~10~79M with a single episode of loss of consciousness while standing, with no prodrome, no witnessed seizure activity and a rapid recovery. No chest pain, no dyspnoea, no palpitations. HR 56, BP 128/72 seated, 104/66 standing. On lisinopril, metoprolol, tamsulosin and furosemide.~Recognise that <b>syncope in older adults must be treated as a cardiac problem first until excluded, because cardiac causes carry the highest mortality</b>; note the medication list is the likely cause but <b>you must not stop at that explanation without excluding arrhythmia and structural heart disease</b>; <b>an ECG is mandatory in every syncope</b>, and conduction disease or QT prolongation changes disposition completely; the presence of <b>no prodrome and rapid recovery in an older patient with no structural explanation raises concern for arrhythmia</b>, so arrange rhythm monitoring; and <b>orthostatic vital signs are essential</b>, which here show a significant drop~Orthostatic vital signs after 5 minutes of supine rest;Cardiac monitor;Pulse oximetry;Fingerstick glucose;Assess for injury from the fall;Neurological examination;Assess for volume status~ECG looking for conduction disease, QT prolongation or ischaemia;CBC;BMP including electrolytes and glucose;Troponin;TSH;Echocardiogram;Consider Holter or prolonged rhythm monitoring based on the ECG and suspicion;Orthostatic vital signs documented~<b>Reduce or stop the contributing medications</b> — the metoprolol, tamsulosin and furosemide are all culprits for orthostatic hypotension and bradycardia;Correct volume depletion;Treat any identified arrhythmia, which may require pacing for conduction disease;Avoid driving until the cause is clarified;Address the fall injury~Repeat orthostatic vital signs;Rhythm monitoring;Reassess medication effect after any change;Monitor for recurrent events~Admit if a cardiac cause is suspected or the injury requires it;Cardiology consult if the ECG is abnormal;Medicat "pedsasthma~Paediatric asthma exacerbation~ED~20~7-year-old boy with known asthma and a 2-day history of cough and wheeze after a viral illness, now with increased work of breathing and difficulty completing sentences. HR 132, RR 34, SpO2 90 percent on room air. Subcostal retractions, audible wheeze, unable to speak in full sentences.~Recognise that <b>oxygen should only be given if the saturation is below 92 percent, and the upper target in a child is 95 percent</b>; <b>SABA doses in acute asthma are now more conservative because over-treatment causes lactic acidosis that drives compensatory hyperventilation, which can be misread as worsening asthma and lead to even more SABA</b>; <b>systemic corticosteroids are indicated for any moderate to severe exacerbation and should be given early</b>; <b>GINA recommends against SABA-only treatment at any age, so this child needs inhaled corticosteroid-containing controller therapy before discharge</b>; and <b>confirm the diagnosis with spirometry or, in a younger child, a documented clinical response to bronchodilators</b>~Assess severity with a validated clinical score;Controlled oxygen only if SpO2 is below 92 percent;Pulse oximetry;Fingerstick glucose;Assess for anaphylaxis features;IV access if severe~Objective severity scoring;Peak flow if age-appropriate;Spirometry before discharge or a documented response;ABG if severe;Chest radiograph only if pneumothorax or pneumonia is suspected~Nebulised SABA in conservative doses with reassessment;Ipratropium for moderate to severe presentation;Systemic corticosteroids;<b>Epinephrine first if there are features of anaphylaxis</b>;Magnesium sulfate for severe exacerbation;Consider ICS-formoterol as a reliever;Non-invasive ventilation if in respiratory failure~Review response after the initial bronchodilator dose rather than writing repeat doses;Serial severity scoring;Reassess work of breathing and speech each interval;Watch for SABA toxicity~<b>Start or optimise ICS-containing controller therapy before discharge</b>;Confirm the diagnosis with spirometry or documented bronchodilator response;Inhaler technique with a spacer taught to the child and the parent;Written asthma action plan given;Follow-up appointment within 2 to 7 days with the primary paediatrician;Identify and address environmental triggers;Preventive: influenza vaccination and a school action plan",
"men~Meningococcal meningitis with a rash~ED~20~19-year-old university student with 8 hours of fever, severe headache, neck stiffness and vomiting, now drowsy. HR 122, BP 96/58, T 39.6. Non-blanching petechial rash on the trunk and legs. GCS 13.~Recognise that <b>a non-blanching petechial rash with fever and meningism means meningococcal disease, which can progress to death within hours, so antibiotics must be given immediately</b>; <b>the single most important teaching point is that you must not delay antibiotics for a lumbar puncture — if any delay is anticipated, draw blood cultures and give antibiotics first</b>; <b>give dexamethasone with or just before the first antibiotic dose if pneumococcal meningitis is suspected</b>, but for meningococcal disease the priority is antibiotics; <b>droplet precautions are required until 24 hours of effective therapy</b>; and <b>public health notification and contact prophylaxis are mandatory</b> because this is a notifiable disease with a defined contact prophylaxis regimen~Airway and GCS assessment;IV access;Cardiac monitor;Pulse oximetry;Fingerstick glucose;Droplet precautions;Blood cultures before antibiotics if this will not cause delay~Blood cultures;CBC;BMP;Coagulation studies including fibrinogen and D-dimer;Lactate;Head CT before lumbar puncture if there is papilloedema, focal deficit, seizure or immunosuppression;Lumbar puncture with opening pressure, cell count, glucose, protein, Gram stain and culture;Meningococcal polymerase chain reaction~<b>Empiric antibiotics immediately — a third-generation cephalosporin plus vancomycin</b>;Dexamethasone with or just before the first antibiotic dose if pneumococcal is suspected;Fluid resuscitation for shock;Droplet precautions;Consider intensive care for shock and raised intracranial pressure;Notify public health;<b>Contact prophylaxis with rifampin, ciprofloxacin or ceftriaxone for close contacts</b>~Frequent neurological and GCS checks;Serial vital signs;Watch for raised int "seizure~First unprovoked seizure in an adult~ED~10~28M brought in after a witnessed generalised tonic-clonic seizure lasting 90 seconds, with a 5-minute postictal period. No prior seizures. No head trauma, no fever, no drug use reported. Neurological examination normal. HR 96, BP 136/82, temperature 37.4.~The key distinction is <b>provoked versus unprovoked seizure</b> — a provoked seizure from hypoglycaemia, hyponatraemia, alcohol withdrawal, infection or an acute structural lesion needs the cause treated and generally does not require long-term antiepileptic therapy, whereas an unprovoked seizure raises the question of epilepsy; <b>obtain a fingerstick glucose immediately in every seizure because hypoglycaemia is instantly reversible</b>; <b>a first unprovoked seizure after a normal workup does not automatically require starting an antiepileptic drug</b> — the decision depends on the recurrence risk, EEG findings and the patient's circumstances, and this is a genuine shared decision-making conversation; and <b>counsel on driving restrictions and safety</b>, which is state-specific and often the practical point~Airway assessment and recovery position;Pulse oximetry;Fingerstick glucose — immediately;<b>Assess for status epilepticus — over 5 minutes of continuous seizure or recurrent seizures without recovery</b>;IV access if ongoing;Assess for trauma from the seizure;Temperature~Fingerstick glucose;Sodium, calcium and magnesium;BMP;CBC;Toxicology screen;Blood alcohol level;Pregnancy test if applicable;<b>EEG</b>;CT or MRI of the brain;Consider lumbar puncture if fever or immunosuppression;ECG~<b>Treat the cause if provoked</b> — correct hypoglycaemia, sodium or calcium, manage alcohol withdrawal;If the seizure was prolonged or recurrent, <b>benzodiazepines are first-line for status epilepticus followed by a loading antiepileptic</b>;For a first unprovoked seizure, discuss whether to start an antiepileptic based on recurrence risk and EEG findings;If an antiepileptic is started, use a single agent at the lowest effective dose;Neurological and safety precautions~Neurological checks;Glucose monitoring if correcting hypoglycaemia;Electrolyte repletion and monitoring;Reassess for recurrent seizure activity~Admit if the cause is unclear, the seizure was prolonged, or the patient is unsafe;<b>Neurology consult for the question of starting an antiepileptic and the recurrence risk</b>;Counsel on the driving restriction, which varies by state, and on drowning and height risks;<b>Counsel on seizure first aid, including the recovery position and when to call emergency services</b>;Follow-up appointment for EEG and neurology results;Preventive: alcohol counselling and safety review at home",
"delirium~Delirium in a hospitalised older adult~Inpatient~20~84F on hospital day 3 after hip fracture repair, now with acute confusion, disorientation and visual hallucinations that fluctuate through the day. HR 104, BP 142/78, T 37.8, SpO2 94 percent. Previously cognitively intact. On oxybutynin, diphenhydramine as needed for sleep, and morphine.~The central recognition is that <b>delirium is a medical emergency in an older adult and it is the medical team's job to find the cause, not to sedate the symptom</b>; <b>the medication list is the highest-yield finding — diphenhydramine and oxybutynin are powerfully anticholinergic and morphine contributes, so the answer is to stop the culprit drugs, not to add an antipsychotic</b>; <b>you must work through the reversible causes systematically: infection, medication, pain, urinary retention, constipation, dehydration, electrolyte derangement, hypoxia, withdrawal and sensory deprivation</b>; <b>non-pharmacologic measures are first-line and include orientation, mobilisation, sleep hygiene, glasses and hearing aids and daylight exposure</b>; and <b>physical restraints increase injury and prolong delirium, so avoid them</b>~Airway assessment;Pulse oximetry;Fingerstick glucose;Assess for pain and urinary retention with a bladder scan;Assess for faecal impaction;Review every medication for anticholinergic and sedative burden~CBC;BMP including sodium, calcium and BUN;BMP with creatinine;Urinalysis and urine culture;Chest radiograph;Arterial blood gas or pulse oximetry for hypoxia;Ammonia if hepatic disease;Medication review and reconciliation;Consider head CT if there is new focal deficit or a fall;Blood cultures if febrile~<b>Stop the diphenhydramine and oxybutynin immediately</b>;Reduce or change the opioid analgesia;<b>Non-pharmacologic measures: orientation, mobilisation, sleep hygiene, glasses and hearing aids, daylight and familiar faces</b>;Treat the identified cause — antibiotics for infection, relieve retention, treat constipation, rehydrate;Correct electrolyte abnormalities;<b>Reserve antipsychotics for dangerous agitation and use them briefly</b>;Avoid physical restraints;Adequate analgesia so the patient can participate~Reassess mental status with a validated tool each shift;Monitor intake and output and bowel function;Reassess pain control;Repeat key labs;Delirium precautions documented and sustained~Continue non-pharmacologic measures every shift and document them;<b>Medication review and reduction of the anticholinergic burden — this is the most important intervention and it must be communicated to the next team</b>;Mobilisation and physiotherapy;<b>Delirium prevention is the safest and most effective strategy — use it for every at-risk older inpatient</b>;Counsel the family, who are essential to orientation and reassurance;Falls precautions;Follow-up appointment with cognitive assessment after discharge;Preventive: sleep protocol, early mobilisation and avoiding urinary catheters",
"preg~Preterm labour and preterm premature rupture of membranes~ED / OB~20~29F at 32 weeks gestation presenting with a gush of fluid and regular contractions every 4 minutes. HR 96, BP 118/72, temperature 37.2. Speculum examination shows pooling of fluid in the vagina. No bleeding.~Recognise that <b>preterm premature rupture of membranes at 32 weeks changes management substantially — the priorities are confirming the diagnosis, assessing for infection, giving antenatal corticosteroids and magnesium sulfate for neuroprotection, and deciding on expectant versus delivery</b>; <b>the diagnosis is clinical with a sterile speculum examination showing pooling, and you must avoid digital cervical examination because it introduces infection</b>; <b>give antenatal corticosteroids — betamethasone or dexamethasone — between 24 and 34 weeks to accelerate fetal lung maturity</b>; <b>give magnesium sulfate for fetal neuroprotection if delivery is anticipated before 32 weeks</b>; <b>group B streptococcus prophylaxis is indicated if the patient is unknown or positive</b>; and <b>look actively for chorioamnionitis — fever, uterine tenderness, foul discharge or fetal tachycardia — which is an indication for delivery rather than expectant management</b>~Sterile speculum examination with pooling;<b>Do NOT perform a digital cervical examination</b>;Fetal heart monitoring;Maternal vital signs including temperature;Assess for contractions and their frequency;Assess for cord prolapse;Consider a bladder scan and avoid urinary infection~Confirm pooling or use a ferning and nitrazine test if uncertain;Fetal fibronectin if the diagnosis is uncertain;Group B streptococcus culture;Urinalysis and urine culture;CBC with differential;Ultrasound to assess fetal presentation, growth and amniotic fluid index;Vaginal and rectal swab for group B streptococcus~<b>Antenatal corticosteroids between 24 and 34 weeks</b>;Magnesium sulfate for fetal neuroprotection if delivery is anticipated before 32 weeks;Gro
