"Endocrine|Primary adrenal insufficiency replacement|Hydrocortisone 15–25 mg/day in 2–3 doses plus <b>fludrocortisone about 0.1 mg daily</b>. Teach stress dosing; give a steroid card and an emergency injectable. <i>[Endocrine Society 2016 adrenal insufficiency]</i>",
"Endocrine|Glucocorticoid-induced adrenal insufficiency|<b>No taper needed under 3–4 weeks</b> at any dose. Do not test while still on supraphysiologic doses. Morning cortisol when tapering: <b>above 10 mcg/dL stop; 5–10 continue a physiologic dose and retest; below 5 continue and retest in months.</b> No fludrocortisone. <i>[Endocrine Society 2024 glucocorticoid-induced AI]</i>",
"Endocrine|Primary hyperparathyroidism diagnosis|High calcium with high or inappropriately normal PTH; <b>other causes suppress PTH</b>. Albumin-adjusted calcium (repeat it), phosphate, PTH, vitamin D, creatinine. <b>24-h urine calcium to exclude FHH</b> (below 100 mg/day, clearance ratio below 0.01). Three-site DXA including the distal radius. Genetic testing if under 30, multigland or family history. <i>[Fifth International Workshop 2020 PHPT]</i>",
"Endocrine|Prolactinoma: cabergoline|Dopamine agonist first; <b>cabergoline over bromocriptine</b> — normalises prolactin and shrinks tumours more, better tolerated. Prolactin from 1 month, MRI at 1 year, visual fields for macroadenoma. Impulse-control problems (gambling, buying, hypersexuality) → reduce or stop. Barrier contraception if pregnancy is not wanted. <i>[Endocrine Society; Pituitary Society]</i>",
"Endocrine|Prolactin pitfalls|Prolactin up to 200 ng/mL → consider macroprolactin and non-adenoma causes; <b>above 200 → prolactinoma likely</b>. Giant adenoma with normal or mildly high prolactin → <b>repeat at 1:100 dilution for the hook effect</b>. <i>[Endocrine Society; Pituitary Society]</i>",
"Psychiatry|Drugs that cause depressive symptoms|Interferon-alpha, corticosteroids, efavirenz, propranolol, isotretinoin, metoclopramide, statins, calcium channel blockers, ACE inhibitors, clonidine, methyldopa, thiazides, metronidazole, L-dopa, estrogen, vinca alkaloids. Alcohol, opioids, benzodiazepines and stimulant withdrawal too. <i>[ACLP 2024 depression guide; NICE NG222]</i>",
"Psychiatry|Depression workup|Always assess suicide risk. Physical symptoms count toward the diagnosis. CBC, BMP, liver panel, <b>TSH</b>, B12 and vitamin D, urine toxicology. Imaging only if CNS disease is suspected; EEG if atypical with possible seizures. <i>[ACLP 2024 depression guide; NICE NG222]</i>",
"Psychiatry|ECT indications|Safe, effective and fast. Precarious function, treatment-resistant depression, <b>pregnancy, psychotic depression, catatonia, depression in Parkinson disease</b>; also severe or resistant mania, mixed episodes and <b>severe mania in pregnancy</b>. <i>[ACLP 2024; APA bipolar guideline]</i>",
"Psychiatry|Acute mania treatment|Stop antidepressants, stimulants, caffeine and alcohol. <b>Severe: lithium or valproate plus an antipsychotic.</b> Less ill: monotherapy. Mixed: valproate may beat lithium. Atypical over typical antipsychotics; short-term benzodiazepine can help. No control in 10–14 days on optimised therapy → add another first-line agent. Clozapine for refractory illness. <i>[APA bipolar guideline]</i>",
"Psychopharmacology|Lithium levels and baseline tests|Before starting: BUN and creatinine, thyroid, <b>ECG if over 40</b>, pregnancy test. Therapeutic <b>0.5–1.2 mEq/L</b>; toxicity common above 1.5; <b>above 2.0 can be life-threatening and may need dialysis</b>. Levels at least every 6 months when stable; renal function every 2–3 months for 6 months, then every 6–12. <i>[APA bipolar guideline]</i>",
"Psychopharmacology|Valproate essentials|Baseline LFTs and blood counts. Mania loading 20–30 mg/kg/day, target <b>50–125 µg/mL</b>. <b>Inhibits lamotrigine metabolism — halve the lamotrigine dose.</b> Rare: liver failure, haemorrhagic pancreatitis, agranulocytosis. <i>[APA bipolar guideline]</i>",
"Psychiatry|Opioid use disorder medications|Offer medication, especially for moderate to severe OUD — it lowers overdose and death. <b>Buprenorphine: any clinician with a standard DEA registration. Methadone: only through a certified opioid treatment program. Naltrexone: only after 7–10 days opioid-free.</b> <b>Detoxification alone is not recommended.</b> <i>[CDC; SAMHSA TIP 63]</i>",
"Acute Care|Stimulant overdose|There is <b>no reversal agent like naloxone</b> — treat the complications (seizures, MI, stroke) directly. Opioid overdose reversal is naloxone or nalmefene. <i>[CDC; SAMHSA TIP 63]</i>",
"Neuro|Delirium: what not to give|<b>No antipsychotics to prevent delirium or speed resolution</b> — only for dangerous or distressing agitation after de-escalation and once causes are addressed. No benzodiazepines without a specific indication such as alcohol withdrawal. <b>No melatonin or ramelteon.</b> Dexmedetomidine preferred for ICU or surgical sedation. Restraints only if injury is imminent. <i>[APA 2025 delirium guideline; SCCM PADIS]</i>",
"Geriatrics|Delirium first-line care|Multicomponent non-drug care: reorientation, clocks, cognitive stimulation, sleep hygiene with less light and noise, less sedation, early mobilisation, glasses and hearing aids. Full medication review, baseline cognition, and a validated assessment tool. <i>[APA 2025 delirium guideline; SCCM PADIS]</i>",
"Rheumatology & MSK|Gout: who needs urate-lowering therapy|Strong: <b>tophi, radiographic damage, or frequent flares</b>. After a first flare only with CKD stage 3 or worse, urate above 9, or stones. HLA-B*5801 before allopurinol in Southeast Asian (Han Chinese, Korean, Thai) and African American patients. Flares: colchicine, an NSAID or a steroid. <i>[2020 ACR gout guideline]</i>",
"Ambulatory|Low back pain treatment (ACP)|Acute: most improve anyway; <b>heat, massage, acupuncture or spinal manipulation first</b>; an NSAID or muscle relaxant if a drug is wanted. Chronic: exercise, rehabilitation, yoga, tai chi, mindfulness, CBT and similar first; then <b>NSAID, then tramadol or duloxetine; opioids last</b>. <i>[ACP 2017 low back pain]</i>",
"Rheumatology & MSK|RA steroids and targets|Starting a csDMARD: avoid glucocorticoids for 3 months or more (strong), and preferably short courses too. Initial goal: at least low disease activity. Not at target on maximal methotrexate → add a biologic or targeted synthetic DMARD rather than triple therapy. <i>[2021 ACR RA guideline]</i>",
"Rheumatology & MSK|Septic arthritis management|Diagnose by aspiration — cell count and, above all, the organism. <b>Arthroscopic lavage</b> for native-joint infection, especially large joints. Empiric (Gram stain negative, no resistance risk): cefazolin or cloxacillin plus ceftriaxone, or amoxicillin-clavulanate. <b>IV 1–2 weeks, then oral 2–4 weeks.</b> Mobilise once controlled. Never aspirate through cellulitis. <i>[SANJO 2023 septic arthritis guideline]</i>",
"Rheumatology & MSK|Vertebral osteomyelitis|Neuro exam, <b>two blood cultures, ESR and CRP; MRI spine</b>. Usually S. aureus. Hold antibiotics until a microbiologic diagnosis if neuro status and haemodynamics are stable; start at once if septic or deficits progress. <b>6 weeks</b> of therapy (3 months for Brucella). Do not operate for worse imaging at 4–6 weeks if the patient is improving. <i>[IDSA 2015 vertebral osteomyelitis]</i>",
"Dermatology|Necrotising fasciitis treatment|<b>Surgery whenever suspected</b> — delay over 24 h raises death risk about ninefold. Empiric vancomycin or linezolid plus piperacillin-tazobactam or a carbapenem. <b>Group A strep: penicillin plus clindamycin</b> (stops toxin). Back to theatre at 24–36 h, then daily. Antibiotics until no more debridement is needed and afebrile 48–72 h. <i>[IDSA SSTI guideline; CDC]</i>",
"Dermatology|Abscess management|<b>Incision and drainage</b> for abscesses, carbuncles, large furuncles and inflamed cysts. Add an antibiotic based on SIRS; MRSA-active if initial treatment failed, the host is impaired, or SIRS with hypotension. Do not culture inflamed epidermoid cysts. <i>[IDSA 2014 SSTI guideline]</i>",
"Dermatology|Cellulitis antibiotics|Typical nonpurulent cellulitis: <b>a strep-active beta-lactam</b> (penicillin, amoxicillin, cephalexin, dicloxacillin) or clindamycin — MRSA is unusual. <b>5 days</b>, longer if slow. Severe or MRSA risk (penetrating trauma, injection drug use, MRSA colonisation, SIRS) → vancomycin. Elevate; check the toe webs. No routine cultures. <i>[IDSA 2014 SSTI guideline]</i>",
"Dermatology|Atopic dermatitis treatment ladder|Moisturisers, topical steroids, tacrolimus or pimecrolimus, crisaborole, ruxolitinib cream. <b>Twice-weekly steroid maintenance</b> cuts flares. Moderate-severe: <b>dupilumab, tralokinumab or a JAK inhibitor</b>; narrowband UVB; methotrexate and others. <b>Avoid systemic steroids</b> except as a short bridge. No topical antimicrobials, antiseptics or antihistamines. <i>[AAD 2023 atopic dermatitis]</i>",
"Dermatology|Topical therapy for psoriasis|Topical steroids up to 4 weeks for plaques (beyond 12 weeks only with supervision); <b>low potency on face and skin folds</b>, class 1 for thick plaques. Vitamin D analogues, tazarotene or calcineurin inhibitors spare steroids. <b>Acitretin is contraindicated in pregnancy.</b> Stopping systemic steroids can flare psoriasis. <i>[AAD-NPF topical psoriasis]</i>",
"Dermatology|Melanoma margins and staging|Diagnose by full-thickness excision with a narrow margin; report Breslow thickness, ulceration and mitotic rate. Wide excision: <b>in situ 0.5 cm, up to 2 mm 1 cm, over 2 mm 2 cm</b>. Sentinel node: not for pT1a, discuss for pT1b, recommended from T2a. BRAF testing in stage III–IV. <i>[AAD; ESMO melanoma]</i>",
"ID & Sepsis|HIV: when and what to start|<b>Start ART at diagnosis or as soon as possible.</b> Preferred: BIC/TAF/FTC, or dolutegravir with TAF or TDF plus FTC or 3TC; DTG/3TC except with HBV, unknown HBV status, no genotype yet, or rapid start. Raltegravir and EVG/c are no longer first-line. Prior CAB-LA PrEP → boosted darunavir regimen until the genotype is back. <i>[DHHS ART guideline]</i>",
"ID & Sepsis|HIV baseline tests|CD4, viral load, <b>genotype resistance testing</b>, CBC, chemistry, LFTs, urinalysis, hepatitis A, B and C serology, lipids, and HLA-B*5701 if abacavir is considered. <i>[DHHS ART guideline]</i>",
"ID & Sepsis|Resuscitation adjuncts|Use dynamic measures (passive leg raise, stroke volume or pulse pressure variation) over static ones; lactate clearance and capillary refill guide. <b>No starches</b>; gelatin suggested against. Add epinephrine if MAP stays low on norepinephrine plus vasopressin; terlipressin suggested against. <i>[SSC 2021]</i>",
"Renal|Kidney stone metabolic workup|At diagnosis: history, chemistries, urinalysis, <b>stone analysis at least once</b>, PTH if hyperparathyroidism is suspected. <b>One or two 24-h urine collections</b> for high-risk or interested first-time formers and all recurrent formers. Recurrence up to 50% at 10 years. <i>[AUA 2026 kidney stone guideline]</i>",
"Renal|Kidney stone diet|Urine volume 2.5 L/day or more. High urine calcium: limit sodium, keep dietary calcium 1000–1200 mg. <b>High oxalate: limit oxalate but keep normal calcium.</b> Low citrate: more fruit and vegetables, less non-dairy animal protein. Uric acid: less animal protein. Cystine: limit sodium and protein. <i>[AUA 2026 kidney stone guideline]</i>",
"Renal|Glomerular disease workup and supportive care|Biopsy is the gold standard. Adults: <b>24-hour urine protein</b>; check sediment for dysmorphic red cells, red cell casts and acanthocytes. Nephrotic oedema: loop diuretic plus sodium restriction. ACEi or ARB at maximum dose, <b>SBP below 120</b>. Treat bicarbonate below 22. Full anticoagulation for clots. Hold RAS blockers and diuretics during volume-depleting illness. <i>[KDIGO 2021 glomerular diseases]</i>",
"Renal|IgA nephropathy treatment|<b>Proteinuria above 0.5 g/day → ACEi or ARB even without hypertension</b>, aiming below 1 g/day. Six months of steroids only if high risk despite 90 days of optimal care, with PCP prophylaxis plus gut and bone protection; caution if eGFR is below 50. <i>[KDIGO 2021 glomerular diseases]</i>",
"OB/GYN|GDM: one-step vs two-step|Two-step: 50-g screen, then 100-g 3-h OGTT; <b>GDM if 2 or more values high</b> (Carpenter–Coustan 95/180/155/140). One-step: 75-g OGTT; <b>GDM if any value high</b> (92/180/153). <i>[ACOG 2024 GDM update; USPSTF]</i>",
"OB/GYN|Preeclampsia diagnosis|New BP 140/90 or more twice 4 h apart after 20 weeks, plus proteinuria (300 mg/24 h, PCR 0.3, or dipstick 2+) — <b>or, without proteinuria</b>, low platelets, renal insufficiency, liver involvement with RUQ pain, pulmonary oedema, refractory headache or visual symptoms. Up to half of gestational hypertension becomes preeclampsia. <i>[ACOG gestational hypertension and preeclampsia bulletin]</i>",
"OB/GYN|Preeclampsia: delivery and magnesium|Gestational hypertension or preeclampsia at <b>37 weeks → deliver</b>. Severe features at <b>34 weeks → deliver</b>; expectant management possible below 34. Magnesium for severe features or eclampsia, <b>continued 24 h after delivery</b>, including caesarean; watch urine output, breathing and reflexes. <i>[ACOG gestational hypertension and preeclampsia bulletin]</i>",
"OB/GYN|PPH prevention and first-line drugs|Oxytocin 10 IU IV or IM for every birth in the third stage. Treatment: <b>IV oxytocin first</b>; then methylergonovine 0.2 mg IM, carboprost 250 mcg IM, or misoprostol. Uterine massage yes; <b>uterine packing after vaginal birth no</b>; balloon tamponade if uterotonics fail. <i>[ACOG; FIGO 2022 PPH]</i>",
"OB/GYN|Tranexamic acid in PPH|<b>1 g IV over 10 min as soon as PPH is diagnosed, within 3 h of birth</b>; a second 1 g if bleeding continues after 30 min or restarts within 24 h. Crystalloid over colloid; massive transfusion at 1:1:1. <i>[ACOG; FIGO 2022 PPH]</i>",
"OB/GYN|Measuring blood loss|Quantitative measurement (drapes, weighing) is more accurate than visual estimates, which <b>underestimate large losses</b>; keep a cumulative record. PPH causes about 11% of US maternal deaths and much is preventable — escalate before coagulopathy sets in. <i>[ACOG; FIGO 2022 PPH]</i>",
"OB/GYN|PPROM antibiotics|Expectant management → <b>IV ampicillin plus erythromycin for 48 h, then oral amoxicillin plus erythromycin for 5 days</b> (azithromycin may replace erythromycin). <b>Avoid amoxicillin-clavulanate</b> (necrotising enterocolitis). Preterm labour with intact membranes: no antibiotics. <i>[ACOG; SMFM]</i>",
"OB/GYN|Antenatal corticosteroids|One course at <b>24 0/7 to 33 6/7 weeks</b> if delivery is likely within 7 days, including ruptured membranes and multiples; consider from 23 weeks per the resuscitation plan, and at 34 to 36 6/7 weeks if never given. One repeat course below 34 weeks if the first was over 14 days earlier. <i>[ACOG; SMFM]</i>",
"OB/GYN|Magnesium for fetal neuroprotection|When early preterm delivery is expected, magnesium sulfate <b>reduces cerebral palsy (RR 0.68)</b> without raising mortality. In periviable PPROM, steroids and magnesium only once neonatal resuscitation would be offered; antibiotics from 24 weeks. <i>[ACOG; SMFM]</i>",
"Pediatrics|Neonatal bilirubin screening (AAP 2022)|Measure TcB or TSB in every newborn of 35 weeks or more <b>at 24–48 h or before discharge</b>. Phototherapy thresholds by gestational age, hours of age and neurotoxicity risk (haemolysis, low albumin, sepsis, G6PD). <b>Do not subtract direct bilirubin.</b> Follow-up timing is set by distance from the threshold. <i>[AAP 2022 hyperbilirubinemia guideline]</i>",
"Pediatrics|Bilirubin escalation of care|TSB within <b>2 mg/dL of the exchange threshold</b> = emergency: intensive phototherapy, IV fluids, labs, type and cross, NICU transfer, TSB every 2 h. <b>Exchange transfusion</b> for signs of acute bilirubin encephalopathy or TSB at the threshold. IVIG optional in DAT-positive haemolysis. <i>[AAP 2022 hyperbilirubinemia guideline]</i>",
"Pediatrics|Febrile infant pathway exclusions|AAP 2021 applies only to well-appearing term infants 8–60 days with a rectal temp of 38.0 or more. <b>Excludes</b> preterm infants, suspected HSV, focal infection, <b>bronchiolitis</b>, immune compromise and <b>vaccines in the last 48 h</b>. URI symptoms or otitis media do not exclude. <i>[AAP 2021 febrile infant guideline]</i>",
"Pediatrics|RSV antibody prophylaxis|Palivizumab: high-risk infants (born before 29 weeks, significant heart disease, chronic lung disease of prematurity), up to <b>5 monthly doses of 15 mg/kg</b> in RSV season. Since 2023, nirsevimab is the main infant RSV antibody, with palivizumab kept for when it is unavailable. Encourage breastfeeding; counsel on smoke exposure. <i>[AAP bronchiolitis guideline]</i>",
"Pediatrics|Cystic fibrosis sweat test|Pilocarpine iontophoresis. <b>60 mmol/L or more = CF; below 30 unlikely; 30–59 intermediate</b> → repeat, extended CFTR genetics. Positive newborn screen → test once over 2 kg and 36 weeks corrected, after 10 days old. Do not delay treatment while confirming. <i>[CF Foundation]</i>",
"Cardiology|Marfan aortic management|Echo at 7 aortic levels with z-scores; yearly in children, more often at 45 mm or growth over 5 mm/year; MRI over CT. <b>Beta-blocker or ARB</b>, both if growing fast; <b>avoid calcium channel blockers</b>. <b>Surgery at 50 mm</b> (45 with risk factors), valve-sparing preferred. <i>[ACC Marfan aortic disease]</i>",
"Heme & Onc|Transfusion thresholds in children|Stable critically ill children: <b>7 g/dL</b>. Congenital heart disease: 7 after biventricular repair, <b>9 after single-ventricle palliation</b>, 7–9 if uncorrected. <i>[AABB 2023]</i>",
"Heme & Onc|Febrile neutropenia antibiotics|Within <b>1 hour</b>. High risk: admit for <b>cefepime, a carbapenem or piperacillin-tazobactam</b>. <b>No routine vancomycin</b> — add for instability, pneumonia, gram-positive blood culture, line or skin infection, MRSA colonisation or severe mucositis; stop at 3 days if no indication. Low risk: oral fluoroquinolone plus amoxicillin-clavulanate unless on quinolone prophylaxis. <i>[IDSA fever and neutropenia]</i>",
"Heme & Onc|Resistant organisms in neutropenic fever|MRSA → vancomycin, linezolid or daptomycin. VRE → linezolid or daptomycin. ESBL → carbapenem. KPC → colistin or tigecycline. Fever after 2–3 days → reassess. Observe at least 4 h before outpatient discharge. <i>[IDSA fever and neutropenia]</i>",
"Heme & Onc|Tumour lysis definitions|Laboratory TLS: 2 or more of high urate, potassium or phosphate or low calcium (or a 25% change), from 3 days before to 7 days after therapy. <b>Clinical TLS</b> adds creatinine 1.5 times normal, arrhythmia, seizure or sudden death. <i>[BCSH tumour lysis guideline]</i>",
"Heme & Onc|Tumour lysis prevention and treatment|Low risk: allopurinol. High risk or established: <b>rasburicase 0.2 mg/kg/day</b> — <b>never with G6PD deficiency</b>, and not combined with allopurinol. <b>No potassium in fluids, no urine alkalinisation.</b> Do not treat asymptomatic hypocalcaemia. Cardiac monitoring if potassium is 6.0 or more. <i>[BCSH tumour lysis guideline]</i>",
"Heme & Onc|ITP: when and how to treat|Adults: treat if platelets are <b>below 30</b> (with no or minor bleeding); observe at 30 or more if asymptomatic. First line: <b>rituximab or a thrombopoietic agent plus steroids</b> (with or without IVIG) over steroids alone; dexamethasone 40 mg for 4 days or prednisone, <b>steroids 6 weeks or less</b>. Delay splenectomy a year. Children with minor bleeding: observe. <i>[ASH 2026 ITP guideline]</i>",
"Heme & Onc|Oral iron replacement|<b>Ferrous sulfate once daily or every other day</b>, with vitamin C. Do not wait for GI workup to start. Expect haemoglobin up about 1 g/dL in 2 weeks; continue 3 months after it normalises. <b>IV iron</b> if intolerant, no response, or malabsorption (bariatric surgery, active IBD, ongoing bleeding). True anaphylaxis to IV iron is very rare. <i>[AGA; BSG iron deficiency]</i>",
"Heme & Onc|B12 replacement|Pernicious anaemia, total gastrectomy or terminal ileal resection → <b>lifelong IM B12</b>, maintenance every 1–3 months (oral 1 mg daily is a maintenance alternative). Other malabsorption: consider IM, or oral 1 mg daily. Improvement can take up to 3 months. <i>[NICE NG239]</i>",
"Pharm Safety|Warfarin reversal dosing|4F-PCC by INR: <b>2 to under 4 → 25 units/kg; 4–6 → 35; above 6 → 50</b>. <b>Always give vitamin K</b> — 5–10 mg IV for major bleeds, 2–5 mg for non-major. Plasma 10–15 mL/kg if PCC is unavailable. <i>[2020 ACC bleeding on oral anticoagulants pathway]</i>",
"Pharm Safety|DOAC reversal dosing|Dabigatran: <b>idarucizumab 5 g IV</b>. Factor Xa inhibitors: <b>andexanet 800 mg bolus then 8 mg/min for up to 2 h</b>. Either unavailable → PCC or aPCC 50 units/kg. Activated charcoal if taken within 2–4 h. <i>[2020 ACC bleeding on oral anticoagulants pathway]</i>",
"Pharm Safety|Protamine limits|Fully reverses UFH; <b>only about 60% of enoxaparin anti-Xa</b>; does not reverse fondaparinux. Infuse over 10 min or more — rapid infusion causes reactions, and high doses anticoagulate. <i>[2020 ACC bleeding on oral anticoagulants pathway]</i>",
"Fluids, DKA & Electrolytes|Hyperkalaemia doses|ECG changes: <b>30 mL 10% calcium gluconate over 10 min</b>, or 10 mL 10% calcium chloride in arrest. Shift: 10 units insulin with 25 g glucose; salbutamol 10–20 mg only as an adjunct. <b>No routine bicarbonate.</b> Remove: sodium zirconium cyclosilicate or patiromer, <b>not calcium resonium</b>. Check glucose for 6 h. <i>[UK Kidney Association 2023]</i>",
"Fluids, DKA & Electrolytes|Aquaresis in hyponatraemia|When the cause of water retention resolves, urine output can raise sodium more than 2 mmol/L per hour. Measure sodium often and watch urine output. <i>[2024 hyponatraemia treatment standard]</i>",
"Acute Care|Acetaminophen nomogram|Single acute ingestion: level at 4–24 h; <b>treatment line starts at 150 µg/mL at 4 h</b> — treat on or above it. The 300 line marks higher risk. Chronic or staggered: treat on suspicion using history and transaminases. Dialysis if level 900 or more with acidosis or coma. <b>NAC is safe in pregnancy.</b> King's College criteria for transplant. <i>[2023 US-Canada acetaminophen consensus]</i>",
"Acute Care|Salicylate: alkalinise or dialyse|Urine pH 7.5–8.0 with <b>IV bicarbonate</b>; replace potassium aggressively. The anion gap is unreliable. Dialysis for altered mental status, cerebral or lung oedema, seizures, renal failure, refractory acidosis or rising levels; consider near 100 mg/dL acute or 40 chronic with symptoms. <b>If intubation is unavoidable, keep ventilation high.</b> <i>[ACMT salicylate guidance]</i>",
"Allergy & Immunology|IV epinephrine in anaphylaxis|Only for peri-arrest or monitored patients with IV access, diluted to 0.05–0.1 mg/mL: 1 mg in arrest, 0.1–0.2 mg grade III, 0.01–0.05 mg grade II; infusion if 2–3 boluses fail. <b>Subcutaneous epinephrine is not recommended.</b> No absolute contraindication in life-threatening anaphylaxis. <i>[WAO 2020; 2020 emergency anaphylaxis guideline]</i>",
"Rheumatology & MSK|ANCA vasculitis treatment|PR3- and MPO-ANCA plus biopsy. Severe GPA or MPA: <b>steroids plus rituximab</b> (preferred) or cyclophosphamide; avacopan spares steroids. Plasma exchange considered for RPGN with creatinine over 300 µmol/L, not routinely for alveolar haemorrhage. Maintenance rituximab 24–48 months. <b>TMP-SMX for PCP</b>; check immunoglobulins before each rituximab. Relapsing EGPA: mepolizumab. <i>[2021 ACR/VF ANCA vasculitis guideline]</i>",
"Rheumatology & MSK|GCA relapse and alternatives|Relapse on moderate-to-high steroids → add a non-steroid immunosuppressant. Methotrexate is an alternative steroid partner. In the US, biopsy over temporal artery ultrasound. <i>[2021 ACR/VF GCA guideline]</i>",
"GI & Liver|Ascites management|SAAG 1.1 or more = portal hypertension (about 97%); protein above 2.5 suggests a cardiac cause. <b>Sodium 2 g/day</b>; fluid restriction only for hyponatraemia. Spironolactone plus a loop diuretic; weight loss <b>up to 0.5 kg/day without oedema, 1 kg with</b>. Spot urine Na/K above 1 = adequate natriuresis. <i>[AASLD 2021 ascites guidance]</i>",
"GI & Liver|SBP diagnosis and treatment|Diagnostic tap in every admitted cirrhotic with ascites. <b>PMN 250 or more = SBP.</b> IV cefotaxime plus IV albumin; prophylaxis for prior SBP or low ascitic protein. <i>[AASLD 2021 ascites guidance]</i>",
"GI & Liver|Hepatic encephalopathy treatment|<b>Lactulose first</b> — 25 mL every 1–2 h until 2 soft stools, then titrate to 2–3 a day. Overuse causes dehydration and hypernatraemia and can itself trigger HE. <b>Rifaximin is an add-on to lactulose</b> to prevent recurrence, not a solo drug. <i>[AASLD/EASL 2014 HE guideline]</i>",
"GI & Liver|Hepatitis B treatment|Preferred: <b>entecavir, tenofovir DF or tenofovir alafenamide</b>. Avoid TDF with kidney or bone disease; avoid entecavir in pregnancy, HIV coinfection without suppressive ART, or after lamivudine. Goal: prevent cirrhosis, HCC and death; HBsAg loss is the ideal endpoint. <i>[AASLD-IDSA 2025 hepatitis B]</i>",
"GI & Liver|Hepatitis B in pregnancy|HBV DNA above 200,000 IU/mL → <b>TDF or TAF from 28 weeks</b> (start at once if later). Switch entecavir to TDF or TAF. TDF has the most pregnancy data. <i>[AASLD-IDSA 2025 hepatitis B]</i>"

"obesity~Obesity with cardiometabolic risk~Clinic~10~48M with a BMI of 38, hypertension, prediabetes and a 10-year ASCVD risk of 11 percent. He has tried diet and exercise on his own without sustained success. BP 146/92, A1c 6.3 percent, LDL-C 138.~Recognise that obesity is a chronic disease requiring a staged, multimodal plan rather than a single intervention; <b>the foundation is an intensive multicomponent behavioural programme with more than 6 months and at least 14 sessions</b>, not generic advice to eat less; <b>pharmacotherapy is appropriate at a BMI of 30 or above, or 27 or above with comorbidity</b>, and a GLP-1 based agent is now among the most effective options; and given the 10-year risk of 11 percent, <b>he is in the high-risk primary prevention category, so a high-intensity statin is recommended with an LDL-C goal below 70</b>~Measure blood pressure with correct technique;Weight and BMI;Screen for obstructive sleep apnoea and depression;Assess diet, activity and readiness to change;Medication review including any weight-promoting agents~Fasting lipid panel;HbA1c;BMP with eGFR and liver enzymes;Urine albumin-to-creatinine ratio;TSH;Screen for obstructive sleep apnoea;CAC scoring if the statin decision remains uncertain;Calculated 10-year ASCVD risk by PREVENT~Intensive multicomponent behavioural intervention over at least 6 months;Pharmacotherapy — a GLP-1 based agent given the comorbidity, or another agent based on cost and access;High-intensity statin with an LDL-C goal below 70 and non-HDL-C below 100;Blood pressure therapy to a target below 130/80;Consider metabolic surgery, which is appropriate for a BMI of 35 or above with comorbidity;Nutrition and exercise counselling~Weight trajectory and waist circumference;Repeat A1c in about 3 months;Monitor lipids after starting the statin;Home blood pressure monitoring;Adverse effects of pharmacotherapy~Referral to a registered dietitian and a structured weight programme;Statin and blood pressure follow-up; "divert~Acute diverticulitis~ED~20~62F with 2 days of left lower quadrant pain, fever and nausea. HR 102, BP 128/78, T 38.4. Left lower quadrant tenderness with mild guarding, no rebound.~Recognise that <b>uncomplicated diverticulitis may be managed without antibiotics in mild cases</b>, which is a genuine change from older practice; the decision hinges on severity and complications, so <b>CT with contrast is the key study</b> to identify abscess, perforation, obstruction or fistula; <b>avoid colonoscopy during the acute episode</b> because of perforation risk — it is arranged after recovery; and remember the indications for surgery: perforation, generalised peritonitis, or failure to improve on medical management~IV access;Pulse oximetry;Fingerstick glucose;Assess for peritonitis and haemodynamic stability~CT of the abdomen and pelvis with contrast;CBC;BMP;Urinalysis to exclude a urinary source;Blood cultures if febrile;Consider pelvic ultrasound in women if the diagnosis is unclear~IV fluids;Analgesia;Antibiotics covering gram-negatives and anaerobes if complicated, immunocompromised, or systemically unwell;Percutaneous drainage for a large abscess;Surgical consult for perforation or peritonitis;Bowel rest or a low-residue diet during the acute phase~Recheck vitals, temperature and abdominal examination each interval;Serial inflammatory markers;Watch for perforation with a rising lactate and worsening examination;Monitor for obstruction~Admit if complicated or systemically unwell;Surgery consult for complicated disease;Discharge on a low-residue diet with a plan for <b>colonoscopy after recovery</b> to exclude malignancy;Counsel on a high-fibre diet and the symptoms that warrant urgent return;Follow-up appointment scheduled",
"thyroid~Suspected hyperthyroidism with atrial fibrillation~Clinic~10~58M with 3 months of palpitations, weight loss despite good appetite, heat intolerance and tremor. HR 112 irregular, BP 138/76. Diffuse smooth goitre, lid lag, fine tremor. ECG shows atrial fibrillation.~Recognise that <b>TSH is the initial test, and a suppressed TSH points to hyperthyroidism</b>, but you must then obtain free T4 and T3 to grade severity; note the diagnostic distinction — <b>diffuse uptake on a radioactive iodine uptake scan suggests Graves disease, while a high uptake in a single nodule suggests toxic adenoma, and low uptake suggests thyroiditis</b>, and these have entirely different treatments; <b>atrial fibrillation from hyperthyroidism may not rate-control well until the thyroid is treated</b>; and in a patient over 60 with new atrial fibrillation, <b>always check thyroid function</b>, because subclinical hyperthyroidism is a common and reversible cause~TSH;Free T4 and total or free T3;Thyroid stimulating immunoglobulin or TSH receptor antibody;Radioactive iodine uptake scan to distinguish Graves from toxic nodule from thyroiditis;ECG;Echocardiogram for atrial fibrillation and to assess for heart failure;Liver function tests and CBC before antithyroid drugs;Beta-hCG if pregnancy is possible~Antithyroid drug — methimazole is preferred unless the patient is in the first trimester, when propylthiouracil is used;Beta-blocker for symptomatic control and rate control;Anticoagulation for atrial fibrillation based on annual stroke risk;Radioactive iodine ablation or surgery as definitive therapy for Graves disease;Treat the atrial fibrillation and reassess the rhythm once euthyroid~Recheck thyroid function in 4 to 6 weeks;Monitor for agranulocytosis, which presents as a sore throat or fever — check a CBC and stop the drug;Monitor liver function;Reassess heart rate and rhythm;Reassess anticoagulation need once euthyroid~Endocrinology consult;Counsel on radioiodine or surgery as definitive options and the need for lifelong thyroid replacement after ablation;Counsel on the warning symptoms of agranulocytosis;Follow-up appointment in 4 to 6 weeks;Manage the atrial fibrillation with rate and anticoagulation decisions documented;Preventive: bone density assessment given the hyperthyroid state",
"nsclc~Suspected lung cancer~Clinic~10~64M with a 30 pack-year history who quit 3 years ago, presenting with 6 weeks of a persistent cough, haemoptysis and 5 kg weight loss. SpO2 94 percent, right-sided expiratory wheeze. Never had a low-dose CT. On no medications.~Recognise that <b>any haemoptysis with weight loss and a smoking history requires urgent evaluation, and the initial test is a chest radiograph or, better, low-dose CT</b>; note that <b>this patient was eligible for screening — 30 pack-years, quit 3 years ago, age 64, so he meets the criteria of age 50 to 80 with 20 or more pack-years and quitting within 15 years</b>; remember that <b>staging is the priority once cancer is found, because it determines whether the intent is curative or palliative</b>; and <b>do not delay referral waiting for the imaging to return</b> if the clinical suspicion is high~Complete history including occupational and family history;Weight and performance status;Pulse oximetry;Assess for superior vena cava syndrome, hoarseness and bone pain~Chest radiograph then CT of the chest;Low-dose CT screening eligibility review despite this being diagnostic;Complete staging with PET-CT and brain imaging;Sputum cytology or bronchoscopy for tissue and molecular diagnosis;Pulmonary function tests before any planned resection;CBC and comprehensive metabolic panel, including calcium and sodium for paraneoplastic findings~Refer urgently to pulmonology and thoracic oncology;Do not delay referral pending imaging;Tissue sampling for histology and molecular markers;Multidisciplinary tumour board for treatment planning;Treat complications such as hypercalcaemia or obstruction~Surveillance for post-obstructive pneumonia;Monitor for superior vena cava obstruction, spinal cord compression and hypercalcaemia;Reassess performance status and symptoms~Explain the diagnosis and staging clearly and with empathy;Refer to thoracic oncology, radiation oncology and a multidisciplinary tumour board;Discuss goals of "geriatricfall~Recurrent falls in an older adult~Clinic~10~82F with two falls in the past 6 months, no loss of consciousness, no injury. On lisinopril, hydrochlorothiazide, amitriptyline for insomnia and zolpidem as needed. BP 112/68 seated, 96/62 standing, HR 78. Lives alone, uses a cane sometimes.~Recognise that falls in older adults are <b>multifactorial and never just one cause</b>, so the evaluation must be systematic; <b>the medication list is the highest-yield finding here</b> — amitriptyline is an anticholinergic that causes orthostatic hypotension and sedation, zolpidem is a sedative-hypnotic on the Beers list, and hydrochlorothiazide contributes to volume depletion; <b>orthostatic vital signs are mandatory</b> and here confirm a 16 mmHg systolic drop; the <b>high-yield intervention is exercise, which has Grade B evidence for falls prevention</b>; and note that <b>vitamin D alone does not prevent falls</b> in modern trials though correcting deficiency remains reasonable~Orthostatic vital signs;Assess gait and balance with a timed up-and-go test;Medication review focused on sedatives, anticholinergics and antihypertensives;Vision assessment;Footwear and home hazards;Screen for cognitive impairment;Assess for cardiac causes~BMP including renal function and electrolytes;ECG;CBC and TSH;Vitamin D level;Consider Holter monitoring if syncope or palpitations;Assess vision;Check the home environment~Deprescribe <b>amitriptyline and zolpidem</b> — this is the single highest-yield intervention;Reduce or change the antihypertensive regimen given orthostatic hypotension;Refer to a <b>structured exercise programme for strength and balance</b>, the intervention with the strongest evidence;Correct vitamin D deficiency;Non-pharmacologic sleep management for insomnia;Home safety assessment and mobility aids~Blood pressure monitoring seated and standing;Gait and balance reassessment;Falls diary;Adherence to the exercise programme;Review as medications are tapered~Medication tapering plan with specific follow-up;Referral to physical therapy and a falls prevention programme;Home safety modification referral;Counsel on the causes of falls and how to get up safely;Follow-up appointment in 2 to 4 weeks to review the taper;Preventive: vaccination and screening review, driving assessment, and consideration of advance care planning",

"burn~Thermal burn with inhalational injury~ED~20~34M rescued from a house fire with burns to the face, neck, chest and both arms. Estimated 35 percent total body surface area. HR 128, BP 104/62, RR 28, SpO2 94 percent on room air, hoarse voice, singed nasal hairs, soot around the mouth.~The single most important recognition is that <b>a hoarse voice with singed nasal hairs and soot means inhalational injury that will progress to airway obstruction — intubate early, before the swelling makes it impossible</b>, and this is the answer most often missed because the patient looks stable at first; use the <b>Parkland formula of 4 mL per kg per percent TBSA of lactated Ringer in the first 24 hours, with half given in the first 8 hours from the time of injury</b>, not from arrival; <b>do not use colloid, and remember that the formula is a starting point, titrated to urine output of 0.5 mL per kg per hour in adults</b>; treat <b>carboxyhaemoglobin</b> with 100 percent oxygen, and note that pulse oximetry reads falsely normal in carbon monoxide poisoning so you need a co-oximetry level; and do not apply ice or ointments before assessment~Airway assessment — this is the priority;Early intubation if any sign of inhalational injury;IV access through unburned skin;Cardiac monitor;Pulse oximetry — remembering it is falsely normal in CO poisoning;100 percent oxygen;Fingerstick glucose;Analgesia~Arterial blood gas with carboxyhaemoglobin;Lactated Ringer by the Parkland formula;CBC;BMP;ECG;Urinalysis for myoglobin if deep burns;Bronchoscopy if inhalational injury is suspected;Blood type and crossmatch~<b>Early intubation for airway protection</b>;Fluid resuscitation with lactated Ringer titrated to urine output;100 percent oxygen until carboxyhaemoglobin normalises;Analgesia — opioids titrated carefully;Tetanus prophylaxis;Antibiotics only for proven infection, not prophylaxis;Escharotomy if circumferential chest or limb burns compromise ventilation or perfusion;Topical antimicrobial dressings after assessment;Early enteral nutrition~Hourly urine output targeting 0.5 mL per kg per hour;Serial carboxyhaemoglobin and ABG;Reassess airway closely for the first 24 to 48 hours;Monitor for hypothermia and keep the patient warm;Watch for compartment syndrome in circumferential limb burns~Admit to a burn centre;Surgical consult;Nutritional support;Counsel on scar management and rehabilitation;Physiotherapy referral;Follow-up with burn surgery;Preventive: tetanus and vaccination review, and smoke detector counselling",
"trauma~Blunt trauma with haemorrhagic shock~ED~20~42M after a high-speed motorcycle collision. HR 148, BP 78/48, RR 30, SpO2 92 percent. GCS 14, pale and clammy, abdomen distended and tender, pelvis unstable on examination.~The critical recognition is that <b>haemorrhage is the leading cause of preventable death in trauma, so the priority is finding and controlling bleeding rather than imaging</b>; in an unstable patient with a positive FAST examination the answer is <b>immediate operative intervention, not CT</b>; <b>do not aggressively give crystalloid</b> because it dilutes clotting factors, worsens acidosis and dislodges clot — modern practice is <b>damage control resuscitation with blood products in balanced ratios, permissive hypotension until haemorrhage is controlled, and tranexamic acid within 3 hours of injury</b>; and remember the <b>lethal triad of hypothermia, acidosis and coagulopathy</b>, so keep the patient warm, and think of <b>hypocalcaemia</b> from citrate in transfused blood, which worsens coagulopathy and hypotension~Airway with cervical spine control;Breathing assessment;Two large-bore IV lines or intraosseous access;Cardiac monitor;Pulse oximetry;Warm blankets and fluid warmers;Pelvic binder if the pelvis is unstable;FAST examination;Massive transfusion protocol activation~Blood type and crossmatch;CBC;BMP including calcium;Coagulation studies including fibrinogen;Arterial blood gas with lactate;FAST examination;Pelvic and chest radiographs;CT trauma pan-scan only if the patient is stabilised and haemodynamically stable~Activate the massive transfusion protocol with balanced blood products;<b>Tranexamic acid</b> for traumatic haemorrhage;Permissive hypotension until surgical control;Immediate operative intervention for abdominal haemorrhage;Reduce and immobilise the pelvis;Calcium replacement for citrate-induced hypocalcaemia;Damage control surgery rather than definitive repair initially~Serial haemoglobin and lactate;Monitor calcium, potassium and temperature;Reassess the abdomen and pelvis;Watch for ongoing bleeding with rising lactate and worsening acidosis;Continuous haemodynamic monitoring~Activate trauma surgery;Admit to the intensive care unit;Post-operative monitoring and second-look surgery;Counsel the family and document goals of care;Rehabilitation planning;Preventive: counsel on helmet use and safe driving, and assess alcohol and substances",
"ohe~Acute upper gastrointestinal haemorrhage from varices~ED / Inpatient~20~58M with known alcohol-related cirrhosis, presenting with massive haematemesis and melaena. HR 132, BP 84/50, RR 26, SpO2 95 percent. Scleral icterus, ascites, spider angiomata, asterixis.~Recognise that <b>variceal bleeding is a distinct emergency from ulcer bleeding and requires a different bundle — antibiotics plus a vasoactive agent plus endoscopy, not just a proton pump inhibitor</b>; the <b>antibiotic is not optional: it reduces mortality and rebleeding in cirrhotic variceal haemorrhage, with ceftriaxone being standard</b>; give <b>octreotide or terlipressin early, before endoscopy</b>; <b>transfuse restrictively to a haemoglobin of about 7 g/dL</b> because over-transfusion raises portal pressure and precipitates rebleeding; <b>avoid over-sedation and avoid NSAIDs and aminoglycosides</b> in cirrhosis; and <b>consider the balloon tamponade or TIPS pathway if endoscopic therapy fails</b>~Airway assessment — risk of aspiration with massive haematemesis;Two large-bore IV lines;Cardiac monitor;Pulse oximetry;Type and crossmatch;Isotonic fluid resuscitation;Consider intubation for airway protection if massive bleeding~CBC;BMP including creatinine and liver function;Coagulation studies including INR;Fibrinogen;Arterial blood gas with lactate;Blood type and crossmatch;Nasogastric lavage;Upper endoscopy after resuscitation;Consider CT angiography or interventional radiology if endoscopy fails~<b>Ceftriaxone</b> for bacterial prophylaxis;<b>Octreotide or terlipressin</b> started before endoscopy;Resuscitation with blood products to a restrictive haemoglobin threshold;<b>Endoscopic variceal band ligation</b>;Balloon tamponade as a temporising measure if endoscopic therapy fails;<b>TIPS</b> for refractory bleeding;Avoid over-transfusion, which raises portal pressure;Correct coagulopathy with plasma and platelets only if actively bleeding and markedly abnormal;Albumin for volume and to reduce the risk of hepatorenal syndrome;Lactulose for encephalopathy~Recheck haemoglobin and vitals each interval;Urine output and mental status as perfusion markers;Watch for rebleeding which is common in the first 72 hours;Monitor for aspiration, encephalopathy and infection;Serial lactate~Admit to the intensive care unit or a monitored bed;Gastroenterology and hepatology consult;Assess for liver transplant candidacy;Alcohol cessation counselling and referral;Secondary prophylaxis with a non-selective beta-blocker after recovery;Follow-up appointment scheduled;Preventive: hepatology follow-up, vaccination for hepatitis A and B, and nutrition review",
"pe2~Post-operative pulmonary embolism~Inpatient~20~66F on post-operative day 4 after total knee arthroplasty, with sudden dyspnoea and pleuritic chest pain. HR 124, BP 118/72, RR 30, SpO2 88 percent on room air. Right calf swollen and tender.~Recognise that <b>hypoxaemia with tachycardia on post-operative day 3 to 7 after orthopaedic surgery is pulmonary embolism until excluded</b>, and that this is the classic timing because thrombus forms around surgery and propagates; <b>the diagnostic pathway is pre-test probability then CT pulmonary angiography, with D-dimer being unhelpful post-operatively because it is routinely elevated</b> after surgery — a common trap; <b>anticoagulate empirically while awaiting confirmation if the clinical suspicion is high and there is no bleeding contraindication</b>; consider <b>advanced therapy (thrombolysis or catheter-directed therapy) only for cardiopulmonary failure — reasonable in 2026 PE Category E1 and can be considered in D1–2</b>; the old massive and submassive labels are retired; and <b>stop the pharmacologic prophylaxis and switch to therapeutic anticoagulation</b>~IV access;Cardiac monitor;Pulse oximetry;Supplemental oxygen;Fingerstick glucose;Assess haemodynamic stability for shock~CBC including platelets;BMP;Coagulation studies;ECG looking for right heart strain;Arterial blood gas;CT pulmonary angiography;Lower extremity venous ultrasound;Troponin and BNP for right heart strain;Echocardiogram if unstable~<b>Therapeutic anticoagulation — start empirically if suspicion is high</b>;Switch from prophylactic to therapeutic dosing;Thrombolysis if haemodynamically unstable;Consider catheter-directed therapy for incipient cardiopulmonary failure (Category D);Supplemental oxygen;Fluids cautiously and vasopressors if hypotensive;Stop any ongoing VTE prophylaxis~Recheck vitals and oxygenation each interval;Monitor for bleeding on anticoagulation;Reassess haemodynamics and right heart strain;Serial haemoglobin;Urine output~Admit to "pnaasp~Hospital-acquired pneumonia~Inpatient~20~70M on hospital day 6 after a prolonged admission, now with new fever, purulent sputum and increasing oxygen requirement. HR 112, BP 108/66, RR 26, T 38.6, SpO2 90 percent on 2 L. Right lower zone crackles and dullness.~Recognise that <b>hospital-acquired pneumonia occurring after 48 hours of admission is a different disease from community-acquired pneumonia and requires broader empiric coverage including Pseudomonas and possibly MRSA</b>; <b>use local resistance patterns and prior cultures to guide the regimen</b>, and if the patient has risk factors for multidrug resistance — recent hospitalisation, prior antibiotics, structural lung disease — <b>cover with two antipseudomonal agents</b>; <b>obtain cultures before antibiotics but never delay antibiotics in an unstable patient</b>; and <b>de-escalate once culture data return</b>, which is the stewardship point that earns credit~Pulse oximetry;Supplemental oxygen;IV access if systemically unwell;Cardiac monitor if unstable;Assess for sepsis criteria~Chest radiograph;Blood cultures before antibiotics;Sputum or tracheal aspirate culture with Gram stain;CBC;BMP;Lactate if sepsis is suspected;Consider procalcitonin for antibiotic de-escalation;Assess for pleural effusion~<b>Empiric broad-spectrum antibiotics covering Pseudomonas and gram-negatives, plus MRSA coverage if risk factors are present</b>;Supplemental oxygen;Consider non-invasive ventilation if in respiratory failure;Fluids if hypoperfusing;Pleural drainage if an empyema develops;De-escalate antibiotics based on culture and susceptibility results~Recheck vitals, temperature and oxygenation each interval;Track cultures and susceptibility results;Reassess oxygenation to determine readiness for discharge;Watch for empyema and respiratory failure~Continue inpatient management until afebrile and stable and oxygenation has improved;Infectious disease or pulmonary consult;De-escalate and narrow antibiotics on culture data and document the rationale;Discharge once the oxygen requirement has resolved and the patient is tolerating oral intake;<b>Aspiration precautions and oral care</b>;Preventive: vaccination, head of bed elevation, and early mobilisation",
"ckd~Advanced chronic kidney disease with a view to dialysis~Clinic~10~64M with type 2 diabetes and stage 4 chronic kidney disease, eGFR 22, urine albumin-to-creatinine ratio 1200. BP 156/88, potassium 5.4. On an ACE inhibitor, an SGLT2 inhibitor and a statin. Reports increasing fatigue.~Recognise that <b>at eGFR around 20 to 25 you should be referring for dialysis education and planning, because preparation takes months and starting dialysis in crisis is far worse</b>; <b>do not stop the ACE inhibitor or the SGLT2 inhibitor just because the eGFR is low</b> — both confer major cardiorenal protection and the SGLT2 inhibitor can be continued down to eGFR 20; <b>add finerenone if appropriate for residual albuminuria, monitoring potassium closely</b>; <b>for advanced CKD with eGFR under 30, a GLP-1 receptor agonist is preferred for glycemic management because of lower hypoglycaemia risk and cardiovascular benefit</b>; and remember the <b>sick day rules</b> and the need to monitor potassium after any change~Blood pressure with correct technique;Weight;Assess for symptoms of uraemia;Medication review including all nephrotoxins and dose adjustments~BMP with eGFR and potassium;Urine albumin-to-creatinine ratio;CBC with iron studies;Phosphate, calcium and parathyroid hormone;Vitamin D;HbA1c;Urinalysis;Assess dialysis access options and vascular access planning~Continue the ACE inhibitor or ARB for kidney and cardiovascular protection;Continue the SGLT2 inhibitor down to eGFR 20 — expect a reversible eGFR dip;<b>Add finerenone</b> for residual albuminuria with potassium monitoring;Consider a GLP-1 receptor agonist for glycemic control and cardiovascular benefit;Statin;Blood pressure control;Sodium-glucose cotransporter inhibitor for additional cardiorenal protection;Phosphate binders and vitamin D as indicated;Erythropoiesis-stimulating agent if anaemic with iron repletion;Treat metabolic acidosis with bicarbonate~Potassium and creatinine after every medication change;Blood pressure;Albuminuria;Symptoms of uraemia;Anaemia profile;Watch for hyperkalaemia, which is the dose-limiting adverse effect of finerenone~Nephrology referral for dialysis planning and modality education;<b>Refer for vascular access evaluation — typically an arteriovenous fistula, because it needs months to mature</b>;Dietitian referral for a renal diet;Discuss conservative kidney management as an alternative;Counsel on sick day rules and avoiding NSAIDs and salt substitutes;Preventive: vaccination including hepatitis B, pneumococcal, influenza and COVID;Documented advance care planning",
"cellu~Cellulitis versus necrotising fasciitis~ED~20~61M with a spreading painful red area on the left lower leg after a minor abrasion. HR 118, BP 106/62, T 39.1. Severe pain out of proportion to the visible findings, dusky skin with a bulla, and crepitus on palpation.~Recognise immediately that <b>pain out of proportion, crepitus and bullae mean necrotising fasciitis, which is a surgical emergency and the treatment is exploration and debridement, not antibiotics alone</b>; <b>do not delay surgery for imaging — the imaging can be normal early and a delay of hours costs the limb or the life</b>; <b>mark the border of erythema to track progression</b> and reassess frequently; <b>give broad-spectrum antibiotics including MRSA coverage and antitoxin activity against streptococcal toxic shock — clindamycin is added specifically to suppress toxin production</b>; and <b>elevate the limb and give aggressive fluid resuscitation for shock</b> — this patient has tachycardia and hypotension and may be in streptococcal toxic shock~IV access with two large-bore lines;Cardiac monitor;Pulse oximetry;Fingerstick glucose;Aggressive fluid resuscitation;Mark and document the extent of erythema~CBC;BMP including creatinine and creatine kinase;Lactate;Blood cultures;Surgical consult for immediate exploration;Marked border of erythema;Consider imaging only if it will not delay surgery~<b>Immediate surgical exploration and debridement</b>;Broad-spectrum antibiotics covering gram-positives, gram-negatives and anaerobes;<b>Add clindamycin to suppress toxin production</b>;Add MRSA coverage if risk factors are present;Aggressive fluid resuscitation;Vasopressors for septic shock;Analgesia;Elevation of the limb~Recheck vitals each interval;Serial lactate;Reassess the extent of erythema against the marked border;Monitor for progression to toxic shock;Track cultures~Admit to intensive care or a surgical bed;Surgical debridement with planned re-exploration;<b>Repeat debridement is expected and should be scheduled</b>;Intensive care and infectious disease consult;Counsel the patient and family on the seriousness of the condition and the likely need for further surgery;Rehabilitation and wound care planning;Preventive: skin care, treating tinea and oedema",
