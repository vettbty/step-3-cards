"Chief Complaint Approach|Anemia|By mean corpuscular volume. Microcytic — iron deficiency, thalassaemia, chronic disease, lead. Normocytic — blood loss, chronic disease, renal failure, haemolysis. Macrocytic — B12, folate, alcohol, hypothyroidism, myelodysplasia. <b>Start with the reticulocyte count</b> — low means production failure, high means loss or destruction.",
"Chief Complaint Approach|Prolonged PTT|Distinguish from a prolonged PT. <b>A prolonged PTT that corrects with mixing suggests a factor deficiency; one that does not correct suggests an inhibitor such as a lupus anticoagulant or a factor inhibitor.</b>",
"Chief Complaint Approach|Thrombocytopenia|By mechanism — decreased production, increased destruction, sequestration or dilution. <b>Peripheral destruction gives a raised platelet-associated immunoglobulin and often a normal marrow. Isolated thrombocytopenia with a normal examination suggests immune thrombocytopenia.</b>",
"Chief Complaint Approach|Raised creatinine|Determine acute versus chronic first, then pre-renal, intrinsic or post-renal. <b>Chronic kidney disease is suggested by small echogenic kidneys and anaemia; acute kidney injury by a rapid rise with preserved kidney size.</b>",
"Chief Complaint Approach|Confusion|Check glucose, oxygen, sodium, calcium, ammonia and the medication list first. <b>Then look for infection, retention, constipation, pain, withdrawal and sensory deprivation.</b> Delirium is a symptom, not a diagnosis.",
"Psychopharmacology|SSRI starting and titration|Start low and titrate over 4 to 8 weeks. <b>A full trial is 6 to 8 weeks at an adequate dose</b> before declaring failure. Follow up within 2 to 4 weeks of starting or changing.",
"Psychopharmacology|SSRI adverse effects|Early — nausea, headache, anxiety and insomnia. Persistent — sexual dysfunction and weight change. <b>Hyponatraemia from inappropriate antidiuresis is the one to watch in older adults.</b>",
"Psychopharmacology|Serotonin syndrome|Hyperthermia, hyperreflexia, clonus, mydriasis and agitation within 24 hours of a serotonergic agent. <b>Stop the agent, give supportive care and a benzodiazepine, and use cyproheptadine in severe cases.</b>",
"Psychopharmacology|Antipsychotic metabolic monitoring|Baseline and periodic weight, waist circumference, fasting glucose and lipids. Olanzapine and clozapine carry the highest risk. <b>Clozapine requires regular absolute neutrophil count monitoring because of agranulocytosis.</b>",
"Psychopharmacology|Extrapyramidal effects and their timing|Acute dystonia within hours to days. Akathisia within days. Parkinsonism within weeks. <b>Tardive dyskinesia after months to years and may be irreversible.</b> Treat acute dystonia with benztropine, and akathisia with a beta-blocker or benztropine.",
"Psychopharmacology|Mood stabilizer monitoring|Lithium has a narrow index — tremor, ataxia, confusion and seizures suggest toxicity, precipitated by dehydration, NSAIDs, thiazides and ACE inhibitors. <b>Valproate needs liver function and platelet monitoring. Lamotrigine carries a serious rash risk and must be titrated slowly.</b>",
"Psychopharmacology|Benzodiazepine pharmacology|Short-acting — alprazolam and lorazepam. Long-acting — diazepam and clonazepam. <b>In older adults they cause falls, delirium and fractures and appear on the Beers list.</b> Never stop them abruptly.",
"Psychopharmacology|Antidepressant discontinuation syndrome|Flulike symptoms, dizziness, insomnia, nausea and paraesthesia after abrupt cessation. <b>Fluoxetine is least likely to cause it because of its long half-life.</b> Taper over weeks.",
"Psychopharmacology|Bupropion specifics|Avoid in seizure disorders, eating disorders and with monoamine oxidase inhibitors. <b>It does not cause sexual dysfunction and is activating, so avoid dosing late in the day.</b>",
"Psychopharmacology|Clozapine indications and risks|For treatment-resistant schizophrenia after two failed antipsychotics. <b>Risks include agranulocytosis, myocarditis, seizures, severe constipation and orthostatic hypotension.</b>",
"Psychopharmacology|Antipsychotics in dementia|Use only for severe agitation after non-pharmacologic measures have failed, at the lowest dose and briefly. <b>The boxed warning describes increased mortality from cardiovascular events and infection in older adults with dementia-related psychosis.</b>",
"Psychopharmacology|Psychotropics in pregnancy|Untreated psychiatric illness poses substantial risk to both mother and fetus. <b>Most SSRIs are considered relatively safe; paroxetine is avoided. Valproate is the most teratogenic mood stabilizer.</b> Decide together with the patient rather than stopping treatment reflexively.",
"NBME Reasoning|Anchoring bias|Fixating on an initial impression and failing to adjust despite new data. <b>The defence is to seek the finding that would disconfirm the diagnosis, and to ask what else could explain the presentation.</b>",
"NBME Reasoning|Premature closure|Accepting a diagnosis before it is fully verified. <b>The most common cause of missed diagnoses in ambulatory care</b>, and the reason every working diagnosis needs a differential attached.",
"NBME Reasoning|Availability bias|Overweighting diagnoses that come easily to mind because they were seen recently or are memorable. <b>Rare catastrophic diagnoses are systematically underweighted.</b>",
"NBME Reasoning|Framing effect|The same data presented as a 90 percent survival or a 10 percent mortality leads to different decisions. <b>Present both the absolute benefit and the absolute harm.</b>",
"NBME Reasoning|Treating the number rather than the patient|Acting on an abnormal value that does not fit the clinical picture. <b>A potassium elevated by haemolysis, or a low blood pressure in a well patient, does not need treatment.</b> Repeat before acting on an isolated abnormal result.",
"NBME Reasoning|Diagnostic momentum|A label applied by someone else, or by the patient, becomes an unexamined assumption. <b>Re-examine the diagnosis when the patient is not following the expected course.</b>",
"NBME Reasoning|Search satisfaction|Stopping the workup at the first abnormality. <b>A patient can have more than one problem, and a second diagnosis is commonly missed when the first already explains the presentation.</b>",
"NBME Reasoning|Base-rate neglect|Ignoring how common a disease is in the population. <b>A positive test for a rare disease in a low-risk patient is more likely a false positive than a true positive.</b>",
"NBME Reasoning|Diagnostic timeout|Deliberately pausing to ask whether the working diagnosis still fits. <b>The single most practical defence against anchoring and premature closure.</b>",
"NBME Reasoning|Sunk cost in management|Continuing a failing treatment because you have already invested in it. <b>Reassess at defined intervals and change course when the expected response has not occurred.</b>",
"Fluids, DKA & Electrolytes|Corrected sodium in hyperglycaemia|Corrected Na equals measured Na plus 1.6 times (glucose minus 100) divided by 100. <b>The measured sodium is falsely low because glucose draws water out of cells.</b>",
"Fluids, DKA & Electrolytes|Hypophosphataemia in refeeding|Falls in phosphate, potassium and magnesium after restarting nutrition in a malnourished patient. <b>It causes arrhythmia, respiratory muscle weakness and heart failure. Check and replete before feeding, and feed slowly.</b>",
"Fluids, DKA & Electrolytes|Hypercalcaemia|Stones, bones, abdominal groans and psychiatric moans, plus a shortened QT interval and renal failure. Treat with aggressive saline then a bisphosphonate — and avoid thiazides, which raise calcium further.",
"Fluids, DKA & Electrolytes|Hypocalcaemia|Perioral paraesthesia, Chvostek and Trousseau signs, QT prolongation and seizures. <b>Correct magnesium at the same time, because hypocalcaemia will not correct while magnesium remains low.</b>",
"Fluids, DKA & Electrolytes|Hypermagnesemia|Occurs with magnesium administration in renal failure. Causes hyporeflexia, respiratory depression, bradycardia and hypotension. <b>Treat with calcium gluconate and dialysis.</b>",
"Fluids, DKA & Electrolytes|Acid-base systematic approach|Check the pH, then the PaCO2, then the bicarbonate, then calculate the anion gap, then check whether the bicarbonate is appropriate for the gap. <b>Compensation never fully corrects the primary problem — if the numbers look fully corrected, there is a second disorder.</b>",
"Fluids, DKA & Electrolytes|Respiratory acidosis versus alkalosis|Acidosis is hypoventilation — COPD, opioids, neuromuscular weakness, airway obstruction. Alkalosis is hyperventilation — early sepsis, pulmonary embolism, salicylates, early asthma, pain, high altitude. <b>Chronic compensation is renal and takes 3 to 5 days.</b>",
"Fluids, DKA & Electrolytes|Hyperkalaemia ECG progression|Peaked T waves, then a widened QRS and a flattened P wave, then a sine wave and ventricular fibrillation. <b>Calcium gluconate is for the membrane, not the potassium — it buys time while you shift and remove.</b>",
"Geriatrics|Urinary retention in older men|Post-void residual over 200 mL suggests retention. Causes are benign prostatic hyperplasia and anticholinergic medications. <b>An overflow bladder is worsened by antimuscarinic drugs.</b>",
"Geriatrics|Delirium prevention|Sleep protocol, early mobilisation, avoiding urinary catheters, glasses and hearing aids, adequate hydration and nutrition, and avoiding restraints. <b>Multicomponent programmes reduce delirium by roughly one third.</b>",
"Geriatrics|Goals of care and diabetes in frailty|Deintensify diabetes therapy to avoid hypoglycaemia, with deliberately higher A1c targets. <b>An A1c of 8 percent is often the correct target in a frail older adult, not 7.</b>",
"Geriatrics|Elder abuse suspicion|Unexplained injuries, injuries of differing ages, delayed presentation, poor hygiene, malnutrition, dehydration, or a caregiver who refuses to leave the room. <b>Reporting is mandatory and overrides confidentiality.</b>",
"Geriatrics|Screening in limited life expectancy|Stop routine cancer screening when life expectancy is under 10 years. <b>The time to benefit usually exceeds remaining life expectancy, while the harms are immediate.</b>",
"Geriatrics|Polypharmacy and deprescribing|Five or more medications. <b>Deprescribe one drug at a time and monitor, targeting agents without an ongoing indication.</b> Taper rather than stop abruptly for benzodiazepines, opioids, proton pump inhibitors and beta-blockers.",
"Ambulatory|Low back pain without red flags|No imaging in the first 4 to 6 weeks. Stay active, avoid bed rest beyond a day or two, use NSAIDs and heat, and refer to physical therapy.",
"Ambulatory|Contraindications to combined oral contraceptives|Migraine with aura, smoking at age 35 or older, uncontrolled hypertension, prior venous thromboembolism or thrombophilia, current breast cancer, active liver disease and known ischaemic heart disease. <b>Aura is the most commonly forgotten.</b>",
"Ambulatory|Opioid prescribing safety|Check the prescription drug monitoring programme and assess risk. <b>Never stop opioids abruptly in a patient on long-term therapy — taper. In an acute painful crisis the dose usually needs to increase rather than merely continue.</b>",
"Ambulatory|Insomnia first-line treatment|Cognitive behavioural therapy for insomnia outperforms medication long term. Its components are sleep restriction, stimulus control, sleep hygiene, relaxation and cognitive restructuring.",
"Ambulatory|Prediabetes management|Refer to a structured preventive programme — lifestyle intervention reduced progression more than medication in the Diabetes Prevention Program. Consider metformin for the highest-risk group.",
"Ambulatory|Deprescribing common targets|Benzodiazepines, opioids, proton pump inhibitors, anticholinergics, sulfonylureas and NSAIDs. <b>Deprescribe one drug at a time with a monitoring plan, not several at once.</b>",
"Safety, QI & Systems|Root cause analysis versus failure mode analysis|RCA is retrospective, after a sentinel event, asking why the system allowed harm. <b>FMEA is prospective, asking what could fail and how badly. Use FMEA before the harm and RCA after it.</b>",
"Safety, QI & Systems|Just culture categories|Human error — console and fix the system. At-risk behaviour — coach and remove the incentive. Reckless behaviour — sanction. <b>Blame-based culture suppresses reporting and hides risk.</b>",
"Safety, QI & Systems|Diagnostic stewardship examples|Avoid routine preoperative testing in asymptomatic patients, avoid reflexive imaging for uncomplicated low back pain, and avoid repeat imaging when the result will not change management.",
"Safety, QI & Systems|Screening test stewardship|Do not order a test unless you know what you will do with either result. <b>A test that cannot change management is a cost, a delay and a risk of incidental findings.</b>",
"Safety, QI & Systems|Handoff failures and hierarchy|Handoffs, hierarchical barriers and ambiguous orders are leading contributors to harm. Structured tools include I-PASS, SBAR and closed-loop communication with read-back.",
"Safety, QI & Systems|Why near misses matter more than adverse events|Near misses are far more frequent than harm, cost nothing when reported, and reveal the same latent system weaknesses. <b>Reporting and studying them prevents the harm that has not happened yet.</b>",
"Pathophysiology|Cardio: Frank-Starling in the failing heart|More stretch gives more force, up to a limit. A failing ventricle sits on a flatter curve, so extra preload mostly raises filling pressure and congestion with little gain in stroke volume. <b>This is why diuretics relieve symptoms without lowering output much.</b>",
"Pathophysiology|Cardio: Neurohormonal spiral in HFrEF|Low output is sensed as low effective volume, switching on the sympathetic system and RAAS. Short term this props up BP; long term angiotensin II, aldosterone and catecholamines cause salt retention, vasoconstriction, fibrosis and myocyte death. <b>Every HFrEF drug that lowers mortality blocks part of this loop.</b>",
"Pathophysiology|Cardio: Why beta-blockers help a failing heart|Chronic catecholamine excess is cardiotoxic. Blockade slows the rate, lengthens diastolic filling and coronary perfusion, and allows reverse remodelling. <b>Start low once euvolaemic, never in cardiogenic shock.</b> Only carvedilol, metoprolol succinate and bisoprolol have mortality benefit.",
"Pathophysiology|Cardio: Why an ARNI raises BNP but not NT-proBNP|Sacubitril blocks neprilysin, which breaks down natriuretic peptides, so BNP rises as a drug effect. NT-proBNP is not a neprilysin substrate. <b>On sacubitril-valsartan, follow NT-proBNP.</b> Neprilysin also clears bradykinin, so stop an ACE inhibitor 36 hours before starting to avoid angioedema.",
"Pathophysiology|Cardio: How SGLT2 inhibitors protect heart and kidney|Natriuresis and osmotic diuresis lower preload; restored tubuloglomerular feedback constricts the afferent arteriole and lowers glomerular pressure. <b>The small early eGFR dip is expected and protective.</b> Benefit does not depend on diabetes. Risk: euglycaemic DKA.",
"Pathophysiology|Cardio: Aldosterone antagonists in HFrEF|Aldosterone drives myocardial and vascular fibrosis as well as salt retention. Spironolactone or eplerenone lowers mortality. <b>Main risk is hyperkalaemia, especially with ACEi or ARB and CKD.</b>",
"Pathophysiology|Cardio: HFpEF mechanism|A stiff, hypertrophied or fibrotic ventricle needs high filling pressure to reach a normal volume, so small volume shifts cause big pressure jumps and flash pulmonary oedema. <b>Tachycardia and loss of atrial kick are poorly tolerated because filling time matters more.</b> Drivers: age, hypertension, obesity, diabetes, AF.",
"Pathophysiology|Cardio: Hyponatraemia in heart failure|Low effective arterial volume triggers non-osmotic ADH release and thirst. Free water retention dilutes sodium even though total body sodium is high. <b>A marker of advanced HF. Loop diuretics help; thiazides worsen it.</b>",
"Pathophysiology|Cardio: Plaque rupture and primary MI|A thin-capped lipid-rich plaque ruptures and exposes tissue factor and collagen. Platelets adhere (GPIb to vWF), activate (ADP, thromboxane) and aggregate (GPIIb/IIIa with fibrinogen); thrombin makes fibrin. <b>Occlusive thrombus gives STEMI; non-occlusive gives NSTEMI or unstable angina.</b> Each antithrombotic blocks one step.",
"Pathophysiology|Cardio: Fifth Universal Definition of MI (2026)|Numbered types retired. <b>Primary MI</b> replaces type 1 and includes SCAD, spasm and coronary embolism. <b>Secondary MI</b> replaces type 2. <b>Procedure-related MI</b> replaces types 4 and 5. Sex-specific troponin cut-offs. Question banks may still use the old numbers.",
"Pathophysiology|Cardio: Secondary MI (formerly type 2)|Supply-demand mismatch from another acute illness, such as tachyarrhythmia, anaemia, hypotension or hypoxia, without an acute coronary lesion. <b>Treat the trigger rather than giving antithrombotics or going to the cath lab by reflex.</b> Injury without ischaemia, such as myocarditis, sepsis or CKD, is myocardial injury, not MI.",
"Pathophysiology|Cardio: ST elevation versus ST depression|Transmural ischaemia shifts the injury current toward the epicardium, giving ST elevation that localises the occluded artery. <b>The subendocardium is compressed in systole and perfused last, so it is most vulnerable; subendocardial ischaemia gives ST depression that localises poorly.</b>",
"Pathophysiology|Cardio: Why one early troponin is not enough|Troponin leaks once necrotic myocyte membranes fail, detectable by high-sensitivity assays within 1 to 3 hours of injury. <b>A single early normal value does not exclude MI; use the 0/1 or 0/2 hour delta.</b>",
"Pathophysiology|Cardio: Right ventricular infarction|Usually proximal RCA. The RV cannot push blood forward, so LV preload falls: hypotension, clear lungs and a raised JVP. <b>Preload dependent: give fluids; avoid nitrates, diuretics and morphine.</b> Confirm with ST elevation in V4R.",
"Pathophysiology|Cardio: Why mechanical complications peak days 3 to 7 after MI|Macrophages have cleared the necrotic muscle but collagen is not yet laid down, so the wall is weakest. Papillary muscle rupture gives acute MR, septal rupture gives a new holosystolic murmur with an RV oxygen step-up, and free wall rupture gives tamponade. <b>Weeks later, an LV aneurysm shows persistent ST elevation and mural thrombus.</b>",
"Pathophysiology|Cardio: Why the posteromedial papillary muscle ruptures|It has a single blood supply from the posterior descending artery, while the anterolateral muscle has a dual supply. <b>Inferior MI, then sudden pulmonary oedema with a new murmur, means acute MR.</b>",
"Pathophysiology|Cardio: Early pericarditis versus Dressler syndrome|Days 1 to 3 after MI, fibrinous pericarditis sits over a transmural infarct. Dressler syndrome weeks later is autoimmune against exposed myocardial antigens. <b>Treat with aspirin; other NSAIDs and steroids impair scar healing early after MI.</b>",
"Pathophysiology|Cardio: How nitrates work and why PDE5 inhibitors clash|Nitric oxide activates guanylyl cyclase and raises cGMP, relaxing mainly venous smooth muscle, so preload, wall stress and oxygen demand fall. <b>PDE5 inhibitors also raise cGMP, and the combination causes profound hypotension.</b> Also avoid with RV infarct and severe AS.",
"Pathophysiology|Cardio: Cocaine and the heart|Blocks noradrenaline reuptake, causing alpha-mediated coronary spasm, tachycardia, hypertension and platelet activation. <b>Benzodiazepines first; nitrates and calcium channel blockers for spasm; avoid beta-blockers in acute intoxication because unopposed alpha stimulation worsens spasm.</b>",
"Pathophysiology|Cardio: Shock haemodynamics|Cardiogenic: low output, high wedge, high SVR. Hypovolaemic: low output, low wedge, high SVR. Distributive: high or normal output, low wedge, low SVR. <b>SVR rises as compensation in every shock except distributive.</b>",
"Pathophysiology|Cardio: Aortic stenosis symptoms explained|Fixed obstruction causes concentric hypertrophy. Angina comes from thick muscle demand plus a high diastolic pressure squeezing the subendocardium. Syncope comes from output that cannot rise with exertion. HF comes when the ventricle decompensates. <b>Symptoms mean survival falls sharply, so they trigger valve replacement.</b>",
"Pathophysiology|Cardio: Acute versus chronic aortic regurgitation|Chronic AR causes volume overload and eccentric hypertrophy; a huge stroke volume leaks back, giving a wide pulse pressure and bounding pulses. <b>Acute AR from dissection or endocarditis has no time to dilate: sudden pulmonary oedema and shock without a wide pulse pressure.</b>",
"Pathophysiology|Cardio: Why mitral stenosis decompensates with tachycardia|LA pressure rises to push blood across the narrowed valve, leading to LA dilation, AF, pulmonary venous then arterial hypertension, and RV failure. <b>Tachycardia shortens diastole, so pregnancy, exercise and new AF cause sudden decompensation; control the rate.</b> An opening snap closer to S2 means more severe stenosis.",
"Pathophysiology|Cardio: Why chronic MR surgery happens at an EF of 60 percent|The LV unloads part of each beat into the low-pressure LA, so ejection fraction overstates true function. <b>Operate when LVEF is 60 percent or below, or LV end-systolic diameter is 40 mm or more, even without symptoms.</b> Acute MR floods a normal-sized LA, giving pulmonary oedema with a possibly soft murmur.",
"Pathophysiology|Cardio: Logic of murmur manoeuvres|More venous return or afterload makes most murmurs louder. <b>HCM and mitral valve prolapse are the exceptions: louder with a smaller LV, on Valsalva strain or standing.</b> Handgrip increases MR, VSD and AR and softens AS and HCM. Inspiration increases right-sided murmurs.",
"Pathophysiology|Cardio: HCM dynamic obstruction|Sarcomere mutations, often autosomal dominant, cause septal hypertrophy and hypercontractility. Systolic anterior motion of the mitral leaflet obstructs the LVOT and causes MR. <b>A smaller cavity worsens obstruction: dehydration, Valsalva, standing, nitrates and vasodilators make it worse; squatting, handgrip and beta-blockers help.</b> Mavacamten inhibits cardiac myosin.",
"Pathophysiology|Cardio: Cardiac amyloidosis clues|Misfolded protein (ATTR, or AL light chain) stiffens the ventricle. Thick walls on echo with low ECG voltage, bilateral carpal tunnel, spinal stenosis, and poor tolerance of beta-blockers and ACE inhibitors. <b>Exclude AL with free light chains and immunofixation, then a technetium pyrophosphate scan for ATTR.</b> Tafamidis stabilises transthyretin.",
"Pathophysiology|Cardio: Takotsubo cardiomyopathy|A catecholamine surge after stress, mostly in postmenopausal women, stuns the apex while the base hypercontracts. <b>Mimics STEMI with non-obstructed coronaries and recovers over weeks.</b> Avoid inotropes if the base causes LVOT obstruction.",
"Pathophysiology|Cardio: Myocarditis|Usually viral; also immune checkpoint inhibitors, mRNA vaccines in young men, and giant cell myocarditis. Troponin rises with normal coronaries and non-ischaemic late gadolinium enhancement on MRI. <b>No competitive sport for 3 to 6 months because of sudden death risk.</b>",
"Pathophysiology|Cardio: Pulsus paradoxus in tamponade|Fluid fixes total heart volume. On inspiration RV filling rises, the septum bows left and LV filling falls, so systolic BP drops more than 10 mmHg. Diastolic pressures equalise and the swinging heart causes electrical alternans. <b>Preload dependent: fluids buy time, avoid diuretics, then drain.</b>",
"Pathophysiology|Cardio: Constrictive pericarditis versus restrictive cardiomyopathy|Both impair filling with a raised JVP and Kussmaul sign. Constriction has a pericardial knock, ventricular interdependence, a thick pericardium and relatively low BNP. Restriction has stiff myocardium (amyloid, sarcoid, haemochromatosis) and high BNP. <b>Constriction is curable by pericardiectomy.</b> Causes: TB worldwide; prior surgery or radiation in the US.",
"Pathophysiology|Cardio: Kussmaul sign|The JVP rises, or fails to fall, on inspiration because the right heart cannot accept the extra venous return. <b>Seen in constriction, restriction and RV infarct; classically not in tamponade.</b>",
"Pathophysiology|Cardio: Consequences of atrial fibrillation|Pulmonary vein triggers fire into a dilated, fibrotic atrium and organised contraction is lost. Stasis in the left atrial appendage causes thrombus and stroke. Losing the atrial kick plus a fast irregular rate cuts output, worst in stiff ventricles. <b>Tachycardia-induced cardiomyopathy reverses with rate or rhythm control.</b>",
"Pathophysiology|Cardio: Why AV nodal blockers are dangerous in pre-excited AF|The AV node filters fast atrial impulses; an accessory pathway does not. Blocking the node with adenosine, beta-blockers, calcium channel blockers, digoxin or IV amiodarone pushes conduction down the pathway, giving rates over 250 and VF. <b>Use procainamide or cardioversion.</b> Clue: wide, irregular QRS complexes of varying shape.",
"Pathophysiology|Cardio: Why magnesium treats torsades|Prolonged repolarisation from IKr block (drugs), low potassium, low magnesium or congenital long QT lets L-type calcium channels reactivate, producing early afterdepolarisations. <b>Magnesium suppresses these even when serum magnesium is normal.</b> Bradycardia lengthens QT further, so overdrive pacing or isoproterenol helps.",
"Pathophysiology|Cardio: Brugada syndrome mechanism|Loss-of-function SCN5A sodium channel mutation creates a voltage gradient across the RV outflow tract. <b>Fever, class IC drugs, tricyclics and cocaine unmask it; treat fever aggressively.</b> ICD after syncope or arrest; quinidine as an adjunct.",
"Pathophysiology|Cardio: How digoxin works and why low potassium is dangerous|Inhibits the Na/K-ATPase, so intracellular sodium rises, less calcium leaves by Na/Ca exchange, and contraction strengthens; it also slows the AV node via vagal tone. <b>Potassium and digoxin compete for the pump, so hypokalaemia predisposes to toxicity, while hyperkalaemia marks severe acute toxicity.</b> Treat with digoxin Fab.",
"Pathophysiology|Cardio: Digoxin toxicity signs|Nausea, confusion, yellow-green vision, atrial tachycardia with block and bidirectional VT. <b>Renal failure, amiodarone and verapamil raise digoxin levels.</b>",
"Pathophysiology|Cardio: Hyperkalaemia ECG sequence|High extracellular potassium partially depolarises the resting membrane and inactivates sodium channels, slowing conduction: peaked T, then long PR with flat P, wide QRS, sine wave, VF or asystole. <b>Calcium stabilises the membrane within minutes but does not lower potassium.</b> Insulin and beta-agonists shift it into cells; binders, diuretics and dialysis remove it.",
"Pathophysiology|Cardio: Primary aldosteronism mechanism|Autonomous aldosterone increases ENaC sodium reabsorption and potassium and hydrogen secretion: hypertension, hypokalaemia, metabolic alkalosis and low renin. No oedema because of aldosterone escape. <b>Many patients are normokalaemic, so screen resistant hypertension with an aldosterone-to-renin ratio regardless of potassium.</b>",
"Pathophysiology|Cardio: Renovascular hypertension|Low renal perfusion drives juxtaglomerular renin release. A young woman suggests fibromuscular dysplasia, treated with angioplasty. <b>An older atherosclerotic patient with flash pulmonary oedema, a bruit, asymmetric kidneys or AKI on an ACE inhibitor suggests atherosclerotic stenosis, usually managed medically.</b>",
"Pathophysiology|Cardio: Why ACE inhibitors can cause AKI|When renal perfusion is low, GFR depends on angiotensin II constricting the efferent arteriole; removing it drops GFR. <b>A creatinine rise up to 30 percent after starting is acceptable; more suggests renovascular disease.</b> NSAIDs constrict the afferent arteriole, so NSAID plus ACEi plus diuretic is the triple whammy.",
"Pathophysiology|Cardio: ACE inhibitor cough and angioedema|ACE also breaks down bradykinin, which accumulates and causes dry cough and, rarely, angioedema, more often in Black patients. <b>Not histamine-mediated, so antihistamines and epinephrine work less well.</b> Switch to an ARB for cough; never use an ACE inhibitor again after angioedema.",
"Pathophysiology|Cardio: Dihydropyridine versus non-dihydropyridine CCBs|Amlodipine and nifedipine act on vascular smooth muscle: vasodilation, reflex tachycardia and ankle oedema from precapillary dilation that diuretics do not fix. <b>Verapamil and diltiazem act on the heart: they slow the nodes and reduce contractility, so avoid them in HFrEF and take care with beta-blockers.</b>",
"Pathophysiology|Cardio: How statins, PCSK9 inhibitors and ezetimibe lower LDL|Statins inhibit HMG-CoA reductase, liver cholesterol falls and LDL receptors are upregulated. PCSK9 normally degrades LDL receptors, so blocking it raises receptor numbers. Ezetimibe blocks intestinal absorption via NPC1L1. <b>CYP3A4 inhibitors raise myopathy risk with simvastatin, lovastatin and atorvastatin.</b>",
"Pathophysiology|Cardio: Why aortic dissection gets a beta-blocker first|Propagation depends on the rate of pressure rise as well as pressure, and a vasodilator alone causes reflex tachycardia and more shear. <b>IV beta-blocker to a heart rate under 60, then a vasodilator to a systolic of 100 to 120.</b> Type A needs surgery because of tamponade, acute AR and coronary occlusion.",
"Pathophysiology|Cardio: Cholesterol embolism|After catheterisation, vascular surgery or anticoagulation, cholesterol crystals lodge in small arteries with inflammation: livedo reticularis, blue toes with palpable pulses, AKI over days to weeks, eosinophilia and low complement. <b>Biopsy shows needle-shaped clefts; care is supportive.</b> Contrast nephropathy comes earlier and has no skin signs.",
"Pathophysiology|Cardio: Infective endocarditis pathogenesis|Damaged endothelium forms a sterile platelet-fibrin nidus that transient bacteraemia seeds; organisms are shielded and slow-growing inside the vegetation, so treatment needs weeks of bactericidal IV therapy. <b>Embolic signs: Janeway lesions, splinter haemorrhages, stroke. Immune complex signs: Osler nodes, Roth spots, glomerulonephritis.</b> S. gallolyticus means colonoscopy.",
"Pathophysiology|Cardio: Rheumatic heart disease mechanism|Antibodies to group A streptococcal M protein cross-react with cardiac myosin and valve tissue (molecular mimicry) 2 to 4 weeks after pharyngitis. Acute pancarditis with MR; mitral stenosis decades later. <b>Skin infection does not cause rheumatic fever but can cause glomerulonephritis.</b> Secondary prophylaxis is benzathine penicillin.",
"Pathophysiology|Cardio: Pulmonary hypertension groups|Group 1 PAH: too much endothelin, too little nitric oxide and prostacyclin. Group 2 left heart disease, the most common. Group 3 lung disease and hypoxia. Group 4 chronic thromboembolic, screened with V/Q and potentially curable by endarterectomy. Group 5 multifactorial. <b>PAH drugs target the three pathways: endothelin antagonists, PDE5 inhibitors or sGC stimulators, prostacyclins.</b>",
"Pathophysiology|Cardio: Eisenmenger syndrome|A left-to-right shunt (VSD, ASD, PDA) overloads the pulmonary circulation until remodelling and pulmonary hypertension reverse it: cyanosis, clubbing and polycythaemia. A PDA gives cyanosis of the legs only. <b>Once reversed, the defect cannot be closed, and pregnancy is contraindicated.</b>",
"Pathophysiology|Cardio: Orthostatic, hypovolaemic and vasovagal syncope|Standing pools about 500 mL in the legs. Autonomic failure: BP falls without a heart rate rise. Hypovolaemia: BP falls with a heart rate rise. Vasovagal: sudden sympathetic withdrawal and vagal surge give bradycardia and vasodilation. <b>Syncope during exertion suggests structural disease such as AS or HCM.</b>",
"Pathophysiology|Pulm: Five causes of hypoxaemia|Low inspired oxygen and hypoventilation keep a normal A-a gradient. V/Q mismatch, shunt and diffusion limitation widen it. <b>Oxygen corrects V/Q mismatch but barely helps a true shunt, because shunted blood never meets alveolar gas.</b>",
"Pathophysiology|Pulm: Alveolar gas equation and normal A-a gradient|PAO2 = FiO2 x (barometric minus water vapour pressure) minus PaCO2/0.8, about 150 minus PaCO2/0.8 at sea level on room air. <b>A-a gradient = PAO2 minus PaO2; normal is roughly age/4 plus 4.</b>",
"Pathophysiology|Pulm: Why hypercapnia means ventilation failure|PaCO2 depends on alveolar ventilation, which is minute ventilation minus dead space. <b>Type 2 failure comes from low drive (opioids), neuromuscular weakness (follow FVC and negative inspiratory force), the chest wall or the airways.</b>",
"Pathophysiology|Pulm: Oxygen-induced hypercapnia in COPD|Mainly worse V/Q matching as oxygen releases hypoxic vasoconstriction, plus the Haldane effect (oxygenated haemoglobin holds less CO2). Loss of hypoxic drive matters less than taught. <b>Target SpO2 88 to 92 percent.</b>",
"Pathophysiology|Pulm: Reading DLCO|Low in emphysema, ILD, pulmonary vascular disease and anaemia. Normal in asthma and in chest wall or neuromuscular restriction. <b>High in alveolar haemorrhage and polycythaemia.</b> Restriction with a normal DLCO points outside the lung.",
"Pathophysiology|Pulm: Type 2 inflammation in asthma|IL-4 switches B cells to IgE, IL-5 drives eosinophils, IL-13 drives mucus and hyperresponsiveness. Mast cells cause early bronchospasm; recruited cells cause the late phase. <b>Biologics: omalizumab (IgE), mepolizumab and benralizumab (IL-5), dupilumab (IL-4 receptor), tezepelumab (TSLP, also works in low type 2 asthma).</b>",
"Pathophysiology|Pulm: Normal PaCO2 in an asthma attack|A patient in an attack should be hyperventilating with a low PaCO2. <b>A normal or rising PaCO2 means fatigue and impending respiratory failure; escalate to ICU.</b>",
"Pathophysiology|Pulm: Why SABA alone is discouraged in asthma|Albuterol relaxes smooth muscle but does not treat the inflammation, and SABA overuse is linked to asthma deaths. <b>GINA prefers ICS-formoterol as the reliever so every rescue dose carries a steroid.</b>",
"Pathophysiology|Pulm: Aspirin-exacerbated respiratory disease|COX-1 inhibition shunts arachidonic acid toward leukotrienes. <b>Triad: asthma, nasal polyps, reaction to aspirin or NSAIDs.</b> Leukotriene modifiers and aspirin desensitisation help.",
"Pathophysiology|Pulm: Protease-antiprotease imbalance in emphysema|Smoke recruits neutrophils and macrophages that release elastase while oxidants inactivate alpha-1 antitrypsin. Loss of elastic recoil and radial traction lets small airways collapse on expiration. <b>Smoking: centriacinar, upper lobe. Alpha-1 antitrypsin deficiency: panacinar, lower lobe.</b>",
"Pathophysiology|Pulm: Alpha-1 antitrypsin deficiency|In PiZZ the misfolded protein is trapped in hepatocytes (PAS-positive globules, cirrhosis), and the low serum level leaves the lung unprotected. <b>Suspect with emphysema before 45, basal emphysema, little smoking or liver disease. Augmentation helps the lung, not the liver.</b>",
"Pathophysiology|Pulm: Dynamic hyperinflation in COPD|Limited expiratory flow plus short expiratory time traps air, flattening the diaphragm and raising the work of breathing. <b>Fast breathing on exertion worsens it, so exercise dyspnoea dominates; bronchodilators help partly by deflating the lung.</b>",
"Pathophysiology|Pulm: Auto-PEEP on the ventilator|In obstruction the next breath starts before exhalation finishes. Intrathoracic pressure rises and venous return falls, causing hypotension and barotrauma. <b>Lower the rate and tidal volume and lengthen expiratory time; if crashing, briefly disconnect the ventilator.</b>",
"Pathophysiology|Pulm: Cor pulmonale and polycythaemia in COPD|Chronic alveolar hypoxia causes hypoxic pulmonary vasoconstriction, pulmonary hypertension and RV failure, and raises erythropoietin. <b>Long-term oxygen improves survival if resting PaO2 is 55 or below, or below 60 with cor pulmonale or polycythaemia.</b>",
"Pathophysiology|Pulm: Blood eosinophils in COPD|Higher counts predict benefit from inhaled steroids, strongest at 300 cells per microlitre or more, little below 100. <b>Dupilumab is an option for type 2 COPD with raised eosinophils despite triple therapy.</b>",
"Pathophysiology|Pulm: ARDS mechanism|Direct (pneumonia, aspiration) or indirect (sepsis, pancreatitis, transfusion) injury damages the alveolar-capillary membrane. Protein-rich fluid floods alveoli, surfactant is lost and hyaline membranes form. <b>Flooded alveoli act as a shunt, so hypoxaemia resists oxygen.</b>",
"Pathophysiology|Pulm: Why low tidal volume in ARDS|Only a small baby lung is aerated, and normal tidal volumes overstretch it. <b>6 mL/kg predicted body weight with plateau pressure 30 or below.</b> PEEP recruits alveoli; prone positioning when P/F is below 150 improves V/Q and lowers mortality.",
"Pathophysiology|Pulm: Global Definition of ARDS|Onset within 1 week; bilateral opacities on x-ray, CT or ultrasound; not fully explained by heart failure or overload. <b>PaO2/FiO2 300 or below, or SpO2/FiO2 315 or below with SpO2 97 percent or below.</b> Now includes patients on high-flow nasal oxygen at 30 L/min or more.",
"Pathophysiology|Pulm: Cardiogenic versus non-cardiogenic pulmonary oedema|Cardiogenic: high hydrostatic pressure, wedge above 18, low-protein fluid. <b>ARDS: permeability leak with a normal wedge and protein-rich fluid.</b> Echo and BNP help separate them.",
"Pathophysiology|Pulm: Gas exchange in pulmonary embolism|Hypoxaemia comes mostly from V/Q mismatch as flow is redirected. Extra dead space drives a higher minute ventilation, giving a respiratory alkalosis with low PaCO2. <b>Sinus tachycardia is the most common ECG finding; S1Q3T3 is uncommon.</b>",
"Pathophysiology|Pulm: Why massive PE causes shock|The RV faces a sudden pressure load, dilates, shifts the septum left and starves LV filling, while RV ischaemia worsens it. <b>Hypotension means thrombolysis; avoid large fluid boluses that overstretch the RV; support BP with norepinephrine.</b> Raised troponin or BNP marks RV strain.",
"Pathophysiology|Pulm: Idiopathic pulmonary fibrosis|Repeated alveolar epithelial injury in older ex-smokers leads to faulty repair, fibroblast foci and a UIP pattern of basal subpleural honeycombing. Restriction, low DLCO, exertional desaturation, clubbing. <b>Nintedanib or pirfenidone slow decline; steroids are harmful in IPF.</b>",
"Pathophysiology|Pulm: Why sarcoidosis causes hypercalcaemia|Granuloma macrophages express 1-alpha-hydroxylase and make calcitriol, raising gut calcium absorption: hypercalcaemia and hypercalciuria with low PTH. <b>Steroids treat it.</b> Non-caseating granulomas from a Th1 CD4 response; Löfgren syndrome has a good prognosis.",
"Pathophysiology|Pulm: Asbestosis versus silicosis|Asbestosis: lower lobes, pleural plaques, mesothelioma, and a lung cancer risk that multiplies with smoking. <b>Silicosis: upper lobes, eggshell hilar calcification, and higher TB risk because silica damages macrophages.</b>",
"Pathophysiology|Pulm: Transudate versus exudate|Transudate: Starling imbalance from high hydrostatic (HF) or low oncotic pressure (cirrhosis, nephrotic). Exudate: leak or lymphatic block. Light's: protein ratio above 0.5, LDH ratio above 0.6, or LDH above two-thirds of normal upper limit. <b>Diuresed HF can look exudative; serum-pleural albumin gradient above 1.2 means transudate.</b>",
"Pathophysiology|Pulm: When to drain a parapneumonic effusion|pH below 7.2, glucose below 60, positive Gram stain or culture, or frank pus. <b>Low pleural glucose also occurs in rheumatoid, TB and malignant effusions, because cells and organisms consume it.</b>",
"Pathophysiology|Pulm: Tension pneumothorax|A one-way valve traps air, intrathoracic pressure rises and venous return collapses: obstructive shock with the trachea pushed away. <b>Clinical diagnosis: decompress first, image later.</b>",
"Pathophysiology|Pulm: How OSA causes hypertension and AF|Pharyngeal tone drops in sleep and the airway collapses; repeated hypoxia and arousals trigger sympathetic surges. <b>Resistant hypertension, AF and daytime sleepiness follow. CPAP splints the airway.</b>",
"Pathophysiology|Pulm: Obesity hypoventilation syndrome|BMI 30 or more with daytime PaCO2 above 45 and no other cause. Chest wall load, blunted drive and leptin resistance. <b>Renal compensation raises serum bicarbonate, a useful screen. Treat with positive airway pressure.</b>",
"Pathophysiology|Pulm: Acetazolamide at altitude|Hypoxia drives hyperventilation, and the resulting respiratory alkalosis brakes breathing. <b>Acetazolamide causes bicarbonate loss in urine, a mild metabolic acidosis that lets ventilation rise.</b>",
"Pathophysiology|Pulm: Hepatopulmonary syndrome|Cirrhosis dilates lung vessels, mostly at the bases, creating a shunt. <b>Oxygenation worsens on sitting up (platypnoea-orthodeoxia).</b> A bubble echo shows bubbles reaching the left heart after a delay of several beats.",
"Pathophysiology|Pulm: Cystic fibrosis mechanism|Defective CFTR chloride channel (F508del misfolds) dehydrates secretions in airways, pancreas, biliary tree and vas deferens; sweat chloride is high because the duct cannot reabsorb it. <b>S. aureus and Pseudomonas, bronchiectasis, fat-soluble vitamin deficiency, CF diabetes, male infertility.</b> Modulators correct folding and gating.",
"Pathophysiology|Pulm: Carbon monoxide poisoning|CO binds haemoglobin about 200 times more tightly than oxygen, shifts the curve left and inhibits cytochrome oxidase. <b>Pulse oximetry and PaO2 read normal, so use co-oximetry.</b> 100 percent oxygen cuts the half-life from 4 to 6 hours to about 1 hour; hyperbaric oxygen for severe cases.",
"Pathophysiology|Pulm: Methaemoglobinaemia|Ferric iron cannot carry oxygen and shifts the curve left. Dapsone, benzocaine, nitrites. Chocolate-brown blood and SpO2 stuck near 85 percent with a normal PaO2. <b>Methylene blue needs NADPH, so use ascorbic acid in G6PD deficiency.</b>",
"Pathophysiology|Pulm: Cyanide toxicity|Blocks cytochrome c oxidase so cells cannot use oxygen: severe lactic acidosis with a high venous oxygen, so venous blood looks arterial. <b>Smoke inhalation and prolonged nitroprusside; treat with hydroxocobalamin.</b>",
"Pathophysiology|Pulm: Septic shock mechanism and lactate|Nitric oxide-driven vasodilation, capillary leak and myocardial depression. Lactate rises from hypoperfusion and from adrenaline-driven aerobic glycolysis via beta-2, so it marks severity. <b>Septic shock: vasopressors to keep MAP 65 or above and lactate above 2 despite fluids.</b>",
"Pathophysiology|Pulm: Vasopressors by receptor|Norepinephrine (alpha-1 more than beta-1) first. Vasopressin (V1) added as doses climb and still works in acidosis. Epinephrine adds beta effects. Dobutamine (beta-1) for low output. <b>Phenylephrine is pure alpha-1 and can cause reflex bradycardia.</b>",
"Pathophysiology|Pulm: Why epinephrine is the drug for anaphylaxis|IgE cross-linking on mast cells releases histamine, tryptase and leukotrienes: vasodilation, leak and bronchospasm. <b>IM epinephrine gives alpha-1 vasoconstriction, beta-1 inotropy, beta-2 bronchodilation and mast cell stabilisation.</b> Antihistamines do not treat shock. On beta-blockers, give glucagon.",
"Pathophysiology|Pulm: Lung cancer paraneoplastic syndromes|Small cell: SIADH, ectopic ACTH and Lambert-Eaton (presynaptic calcium channel antibodies; strength improves with repeated effort). Squamous: PTHrP hypercalcaemia. <b>Adenocarcinoma: hypertrophic osteoarthropathy, and the commonest lung cancer in non-smokers.</b>",
"Pathophysiology|Pulm: Pancoast tumour and SVC syndrome|A superior sulcus tumour invades the sympathetic chain (Horner syndrome) and the C8 to T1 roots (arm and hand pain). <b>SVC obstruction causes face and arm swelling with chest wall venous collaterals.</b>",
"Pathophysiology|Pulm: Why anti-TNF drugs reactivate TB|Th1 cells, interferon-gamma and TNF-alpha keep the TB granuloma intact. <b>Blocking TNF breaks it down, so screen for latent TB before starting biologics.</b>",
"Pathophysiology|GI: GERD and Barrett oesophagus|Reflux comes mostly from transient LES relaxations, worsened by hiatal hernia and slow acid clearance. Chronic acid turns squamous epithelium into intestinal columnar epithelium. <b>Barrett leads to distal adenocarcinoma; squamous cell carcinoma is linked to smoking and alcohol and sits higher.</b>",
"Pathophysiology|GI: Achalasia mechanism|Loss of inhibitory nitric oxide and VIP neurons in the myenteric plexus: the LES cannot relax and peristalsis is lost. <b>Dysphagia to solids and liquids from the start, bird's beak on barium.</b> Older patient with fast weight loss: exclude cancer (pseudoachalasia). Chagas mimics it.",
"Pathophysiology|GI: How H. pylori and NSAIDs cause ulcers|H. pylori antral gastritis lowers somatostatin, raising gastrin and acid, which favours duodenal ulcers. <b>NSAIDs block COX-1 and remove the prostaglandins that maintain mucus, bicarbonate and mucosal blood flow.</b> Duodenal pain eases with food; gastric pain worsens.",
"Pathophysiology|GI: Zollinger-Ellison syndrome|Gastrinoma causes parietal cell hyperplasia and acid overload: multiple or distal ulcers and diarrhoea, because acid inactivates lipase. <b>Fasting gastrin off PPIs with a low gastric pH; secretin paradoxically raises gastrin.</b> PPIs raise gastrin by raising pH. Think MEN1.",
"Pathophysiology|GI: Pernicious anaemia|Autoimmunity against parietal cells and intrinsic factor causes B12 malabsorption and atrophic gastritis with no acid, high gastrin and gastric carcinoid risk. <b>B12 deficiency raises methylmalonic acid and homocysteine; folate deficiency raises only homocysteine.</b>",
"Pathophysiology|GI: Why upper GI bleeding raises BUN|Blood in the gut is digested and absorbed as protein, and hypovolaemia lowers GFR. <b>BUN/creatinine above 30 suggests an upper source.</b>",
"Pathophysiology|GI: Osmotic versus secretory diarrhoea|Stool osmotic gap = 290 minus 2 x (stool Na plus K). <b>Above 125: osmotic (lactose, laxatives), stops with fasting. Below 50: secretory (cholera toxin raising cAMP, VIPoma, carcinoid), continues while fasting.</b>",
"Pathophysiology|GI: Coeliac disease mechanism|Tissue transglutaminase deamidates gliadin, which binds HLA-DQ2 or DQ8 and triggers T cells that flatten villi, worst proximally. <b>So iron, folate and calcium deficiencies dominate.</b> Test tTG-IgA with total IgA before going gluten-free. Dermatitis herpetiformis is the skin form.",
"Pathophysiology|GI: Crohn disease versus ulcerative colitis|Crohn: transmural, skip lesions, any segment (often terminal ileum), fistulas and strictures; smoking worsens it. <b>UC: mucosal, continuous from the rectum, linked to PSC; smoking is protective.</b>",
"Pathophysiology|GI: Terminal ileum loss and bile acids|Under about 100 cm lost: bile acid diarrhoea, treat with cholestyramine. More lost: bile acid pool runs out, causing steatorrhoea, gallstones and fat-soluble vitamin deficiency. <b>B12 is absorbed here too.</b>",
"Pathophysiology|GI: Why fat malabsorption causes oxalate stones|Unabsorbed fat binds calcium in the gut lumen, leaving oxalate free to be absorbed in the colon. <b>Hyperoxaluria and calcium oxalate stones in Crohn disease and after bowel resection.</b>",
"Pathophysiology|GI: C. difficile mechanism|Antibiotics clear normal flora, spores germinate, and toxins A and B inactivate Rho GTPases in colonocytes, causing colitis and pseudomembranes. PPIs raise risk. <b>Oral vancomycin or fidaxomicin, because IV vancomycin does not reach the colon lumen.</b>",
"Pathophysiology|GI: Pain out of proportion in mesenteric ischaemia|The mucosa dies before the peritoneum is irritated, so pain is severe while the abdomen stays soft. Causes: embolism (AF, to the SMA), thrombosis, low-flow shock, venous thrombosis. <b>Lactate rises late; get CT angiography.</b>",
"Pathophysiology|GI: Ischaemic colitis|Low flow injures the watershed areas, the splenic flexure and rectosigmoid, in older patients. <b>Pain then bloody diarrhoea, usually resolving with supportive care.</b>",
"Pathophysiology|GI: Colorectal cancer genetics|Adenoma-carcinoma sequence: APC, then KRAS, then TP53. <b>Lynch: germline mismatch repair defect, microsatellite instability, right-sided and endometrial cancers, responds to immunotherapy.</b> FAP: germline APC, hundreds of polyps, prophylactic colectomy.",
"Pathophysiology|GI: Refeeding syndrome|Feeding causes an insulin surge that drives phosphate, potassium and magnesium into cells. <b>Low phosphate means low ATP and 2,3-DPG: weakness, respiratory and heart failure, rhabdomyolysis.</b> Carbohydrate uses up thiamine, so give thiamine first and feed slowly.",
"Pathophysiology|GI: Acute pancreatitis mechanism|Trypsinogen activates too early inside acinar cells (gallstones, alcohol, triglycerides above 1000, hypercalcaemia, ERCP, drugs), so the gland digests itself and systemic inflammation causes capillary leak. <b>Hypocalcaemia comes from fat necrosis binding calcium.</b> Moderate, goal-directed fluids over aggressive fluids.",
"Pathophysiology|GI: Chronic pancreatitis consequences|Steatorrhoea and fat-soluble vitamin deficiency appear only after about 90 percent of exocrine function is lost. <b>Islet loss causes type 3c diabetes; glucagon is lost too, so insulin carries a high hypoglycaemia risk.</b>",
"Pathophysiology|GI: Gallstone types|Cholesterol: supersaturation, stasis and nucleation, with female sex, obesity, rapid weight loss, pregnancy, fibrates and octreotide. <b>Black pigment: haemolysis and cirrhosis. Brown pigment: infection and stasis in the ducts.</b>",
"Pathophysiology|GI: Why pregnancy causes gallstones|Oestrogen increases cholesterol secretion into bile and progesterone slows gallbladder emptying. <b>Supersaturated bile plus stasis gives cholesterol stones.</b>",
"Pathophysiology|GI: Cholestatic labs|Obstruction raises ALP, GGT and conjugated bilirubin. Conjugated bilirubin is water soluble, so urine darkens while stools go pale; retained bile acids cause itch. <b>High ALP with a normal GGT points to bone.</b>",
"Pathophysiology|GI: Unconjugated versus conjugated hyperbilirubinaemia|Unconjugated (haemolysis, Gilbert with reduced UGT1A1, Crigler-Najjar) is not water soluble and never appears in urine. <b>Gilbert jaundice appears with fasting, stress or illness.</b> Conjugated: hepatitis, obstruction, Dubin-Johnson, Rotor.",
"Pathophysiology|GI: Why portal pressure rises in cirrhosis|Resistance rises from fibrosis and active sinusoidal vasoconstriction (too little intrahepatic nitric oxide), while splanchnic vasodilation increases inflow. <b>HVPG 10 or more is clinically significant; 12 or more is when varices bleed.</b>",
"Pathophysiology|GI: How ascites forms in cirrhosis|Splanchnic vasodilation lowers effective arterial volume, triggering RAAS, the sympathetic system and ADH, so sodium and water are retained and sodium falls. <b>Treat with sodium restriction and spironolactone plus furosemide in a 100 to 40 ratio.</b>",
"Pathophysiology|GI: SAAG and ascitic protein|SAAG 1.1 or more: portal hypertension. Below 1.1: peritoneal cause such as cancer, TB, nephrotic or pancreatitis. <b>High SAAG with protein 2.5 or more means heart failure or Budd-Chiari; below 2.5 means cirrhosis.</b>",
"Pathophysiology|GI: Hepatorenal syndrome|Intense renal vasoconstriction in response to splanchnic vasodilation, in structurally normal kidneys: bland sediment, very low urine sodium, no response to 2 days of stopping diuretics plus albumin. <b>Terlipressin or norepinephrine plus albumin; transplant is definitive.</b>",
"Pathophysiology|GI: Spontaneous bacterial peritonitis|Gut bacteria translocate into ascites with few defences; low ascitic protein means few opsonins. <b>Ascitic neutrophils 250 or more. Third-generation cephalosporin plus albumin on days 1 and 3, which lowers HRS and death.</b> Prophylaxis after an episode.",
"Pathophysiology|GI: Variceal bleed management logic|Octreotide constricts the splanchnic bed, then banding. Ceftriaxone lowers infection, rebleeding and death. <b>Transfuse to haemoglobin 7, because overtransfusion raises portal pressure.</b>",
"Pathophysiology|GI: How non-selective beta-blockers lower portal pressure|Beta-1 blockade lowers cardiac output, and beta-2 blockade leaves alpha vasoconstriction unopposed in splanchnic vessels, cutting portal inflow. <b>Propranolol, nadolol or carvedilol; selective beta-blockers do not work.</b>",
"Pathophysiology|GI: Hepatic encephalopathy mechanism and triggers|Gut-derived ammonia bypasses the liver; astrocytes turn it into glutamine and swell. Triggers: GI bleed, infection, hypokalaemia and alkalosis, sedatives, constipation, TIPS. <b>Lactulose acidifies the colon to trap NH4+; rifaximin cuts ammonia-producing bacteria. The ammonia level does not guide care.</b>",
"Pathophysiology|GI: Why hypokalaemia worsens encephalopathy|Low potassium raises renal ammonia production, and the accompanying alkalosis converts NH4+ to diffusible NH3, which crosses into the brain. <b>Correct potassium in any encephalopathic cirrhotic patient.</b>",
"Pathophysiology|GI: Clotting in cirrhosis|Procoagulant and anticoagulant factors (proteins C and S) both fall, so haemostasis is rebalanced. <b>A high INR does not predict bleeding, patients still clot, and vitamin K cannot fix synthetic failure.</b> Low platelets come from splenic sequestration and low thrombopoietin.",
"Pathophysiology|GI: HCC surveillance and hepatitis B|Screen everyone with cirrhosis with ultrasound, with or without AFP, every 6 months. <b>Hepatitis B can cause HCC without cirrhosis, because viral DNA integrates into the genome.</b>",
"Pathophysiology|GI: AST/ALT above 2 in alcohol|ALT depends more on pyridoxal phosphate (B6), which alcoholics lack, and alcohol damages mitochondria, which hold AST. <b>ALT usually stays below about 300 with a raised GGT. Thousands mean ischaemia, viral hepatitis or acetaminophen.</b>",
"Pathophysiology|GI: Acetaminophen toxicity mechanism|Overdose saturates glucuronidation and sulfation, so CYP2E1 makes NAPQI; glutathione runs out and zone 3 cells die. <b>NAC restores glutathione and works best within 8 hours; use the nomogram from 4 hours.</b> Chronic alcohol and fasting raise the risk.",
"Pathophysiology|GI: Ischaemic hepatitis|Zone 3 has the lowest oxygen and dies first in shock. <b>AST and ALT in the thousands with a very high LDH (ALT/LDH below 1.5), falling within days once perfusion returns.</b>",
"Pathophysiology|GI: MASLD mechanism|Insulin resistance increases fat breakdown and fatty acid delivery to the liver and drives new fat synthesis; fat toxicity leads to MASH and fibrosis. <b>FIB-4, then elastography. Weight loss of 7 to 10 percent helps; resmetirom and semaglutide are approved for MASH with moderate to advanced fibrosis.</b>",
"Pathophysiology|GI: Hereditary haemochromatosis mechanism|HFE C282Y lowers hepcidin, so ferroportin stays active: the gut absorbs, and macrophages release, too much iron. <b>Transferrin saturation above 45 percent first, then ferritin.</b> Liver, bronze diabetes, heart, hypogonadism, 2nd and 3rd MCP arthropathy, Vibrio vulnificus. Phlebotomy.",
"Pathophysiology|GI: Wilson disease mechanism|ATP7B defect: copper is not excreted into bile or loaded onto ceruloplasmin, so ceruloplasmin is low and urinary copper high. Liver, basal ganglia and psychiatric disease, Kayser-Fleischer rings. <b>Acute liver failure with Coombs-negative haemolysis and a low ALP is a classic clue.</b> Chelation or zinc.",
"Pathophysiology|GI: Hepatitis B serology|HBsAg means infection. Anti-HBs means immunity and is the only marker after vaccination. <b>IgM anti-HBc means acute infection and is the only marker in the window period.</b> IgG anti-HBc means past or chronic infection; HBeAg means active replication.",
"Pathophysiology|GI: Hepatitis B reactivation|HBsAg-positive or anti-HBc-positive patients can reactivate on rituximab, chemotherapy or strong immunosuppression. <b>Screen first and give entecavir or tenofovir prophylaxis.</b>",
"Pathophysiology|GI: Autoimmune hepatitis|Typically a young woman with ANA and anti-smooth muscle antibody (type 1) or anti-LKM1 (type 2), high IgG, and plasma cell interface hepatitis on biopsy. <b>Steroids, with or without azathioprine (check TPMT).</b>",
"Pathophysiology|GI: PBC versus PSC|PBC: middle-aged women, antimitochondrial antibody, small intrahepatic ducts, itch, xanthelasma, osteoporosis; ursodiol, then a PPAR agonist (obeticholic acid left the US market in 2025). <b>PSC: men with UC, p-ANCA, beaded large ducts, cholangiocarcinoma and colon cancer risk; no proven drug.</b>",
"Pathophysiology|GI: Acute liver failure|Encephalopathy plus INR 1.5 or more within 26 weeks, without prior liver disease. <b>Cerebral oedema is the main killer; transfer early to a transplant centre.</b> Causes: acetaminophen, viral hepatitis, drugs, Wilson disease.",
"Pathophysiology|GI: Budd-Chiari syndrome|Hepatic vein outflow obstruction (JAK2 disorders such as polycythaemia vera, oral contraceptives, pregnancy): tender hepatomegaly and ascites with a high SAAG and high protein. <b>The caudate lobe enlarges because it drains directly into the IVC.</b>"
