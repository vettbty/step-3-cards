"Pathophysiology|Heme: PNH mechanism|Acquired PIGA mutation means no GPI anchors, so CD55 and CD59 are missing and complement lyses cells. <b>Triad: intravascular haemolysis, clots in odd places (hepatic veins), marrow failure. Flow cytometry; C5 inhibitor after meningococcal vaccine.</b>",
"Pathophysiology|Heme: ITP mechanism|IgG against platelet glycoproteins leads to splenic clearance and lower production. Isolated low platelets, large platelets on smear. <b>Exclude HIV, hepatitis C and drugs. Treat below 30 or with bleeding: rituximab or a thrombopoietic agent plus a short steroid course; IVIG for a fast rise.</b> <i>[ASH 2026 ITP guideline]</i>",
"Pathophysiology|Heme: TTP mechanism|Low ADAMTS13 (usually an autoantibody) leaves ultra-large vWF multimers uncut, so platelets clump in small vessels. Schistocytes and very low platelets; normal PT and aPTT. <b>Plasma exchange, steroids and caplacizumab; avoid platelet transfusion.</b>",
"Pathophysiology|Heme: Typical vs atypical HUS|Typical: Shiga toxin from E coli O157:H7 damages glomerular endothelium after bloody diarrhoea, MAHA, low platelets and AKI; supportive care. <b>Atypical: uncontrolled complement (factor H mutations), treated with eculizumab.</b>",
"Pathophysiology|Heme: DIC labs and mechanism|Tissue factor exposure (sepsis, trauma, obstetric, APL) makes thrombin everywhere and consumes platelets and factors while plasmin breaks clots. <b>Long PT and aPTT, low fibrinogen, high D-dimer, schistocytes. Treat the cause.</b>",
"Pathophysiology|Heme: TTP vs DIC|Both have schistocytes and low platelets. <b>TTP: normal PT, aPTT and fibrinogen. DIC: long PT and aPTT, low fibrinogen.</b>",
"Pathophysiology|Heme: Why PT rises first|Factor VII has the shortest half-life, so warfarin, vitamin K deficiency and early liver failure lengthen PT before aPTT. <b>aPTT tests VIII, IX, XI, XII and heparin effect.</b>",
"Pathophysiology|Heme: Mixing study|Mix patient plasma with normal plasma. <b>Corrects: factor deficiency. Doesn't correct: an inhibitor, such as lupus anticoagulant or an acquired factor VIII inhibitor.</b>",
"Pathophysiology|Heme: Haemophilia vs von Willebrand disease|Haemophilia (X-linked VIII or IX loss): deep joint and muscle bleeds, long aPTT only. vWD (usually autosomal dominant): mucocutaneous bleeding, as vWF anchors platelets and carries VIII. <b>Desmopressin releases vWF in type 1 vWD and helps mild haemophilia A.</b>",
"Pathophysiology|Heme: Warfarin skin necrosis|Protein C has a short half-life and falls before factors II, IX and X, so early warfarin makes blood more clottable. <b>Skin necrosis, especially in protein C deficiency; bridge with heparin.</b>",
"Pathophysiology|Heme: Serious warfarin bleed reversal|<b>4-factor PCC plus IV vitamin K.</b> PCC acts within minutes; vitamin K takes hours but sustains the effect. Plasma if PCC unavailable.",
"Pathophysiology|Heme: Factor V Leiden|Factor V resists cleavage by activated protein C; the commonest inherited thrombophilia. <b>Antithrombin deficiency causes heparin resistance. Don't test protein-based thrombophilias during an acute clot or on anticoagulants.</b>",
"Pathophysiology|Heme: Antiphospholipid syndrome mechanism|Antibodies to phospholipid-binding proteins activate endothelium, platelets and complement: arterial and venous clots, pregnancy loss. Lupus anticoagulant lengthens aPTT in the lab. <b>Two positive tests 12 weeks apart; warfarin, not DOACs, especially if triple positive.</b>",
"Pathophysiology|Heme: Polycythaemia vera mechanism|JAK2 V617F switches on EPO signalling without EPO: all three lines rise, EPO low. Itching after hot showers (basophil histamine), gout, Budd-Chiari. <b>Phlebotomy to haematocrit below 45, low-dose aspirin. High EPO means secondary polycythaemia.</b>",
"Pathophysiology|Heme: Essential thrombocythaemia bleeding paradox|JAK2, CALR or MPL mutations drive megakaryocytes. <b>Platelets above 1000 soak up large vWF multimers (acquired von Willebrand syndrome), so patients bleed as well as clot.</b>",
"Pathophysiology|Heme: Myelofibrosis|Cytokines from abnormal megakaryocytes fibrose the marrow, so blood is made in spleen and liver. <b>Massive splenomegaly, teardrop cells, leukoerythroblastic smear, dry tap.</b>",
"Pathophysiology|Heme: CML mechanism|t(9;22) Philadelphia chromosome makes BCR-ABL, a tyrosine kinase stuck on. Very high WBC across all maturation stages, basophilia, low LAP score (unlike a leukaemoid reaction). <b>Imatinib and later TKIs block its ATP binding site.</b>",
"Pathophysiology|Heme: Leukostasis|Very high blast counts (often above 100,000, usually AML) sludge in small vessels of lung and brain: dyspnoea, hypoxia, confusion. <b>Urgent cytoreduction with hydroxyurea, leukapheresis or induction.</b>",
"Pathophysiology|Heme: APL mechanism and urgency|t(15;17) PML-RARA blocks maturation at promyelocytes, whose granules trigger DIC. <b>Start ATRA as soon as APL is suspected, before genetic confirmation.</b> Differentiation syndrome (fever, infiltrates, fluid retention): dexamethasone.",
"Pathophysiology|Heme: CLL features|Clonal mature B cells, CD5 and CD23 positive, smudge cells. Hypogammaglobulinaemia causes infections; warm AIHA and ITP occur. <b>Richter transformation: rapidly growing nodes, B symptoms, high LDH.</b>",
"Pathophysiology|Heme: Myeloma bone disease|Myeloma cells activate osteoclasts through RANKL and suppress osteoblasts. <b>Lytic lesions with cold bone scans and often normal alkaline phosphatase, so use skeletal survey, CT or MRI.</b>",
"Pathophysiology|Heme: Myeloma kidney|Light chains bind Tamm-Horsfall protein and form casts that block tubules; hypercalcaemia adds injury. <b>Dipstick misses light chains, so urine protein by another method is much higher than the dipstick.</b>",
"Pathophysiology|Heme: MGUS vs myeloma|MGUS: M-protein below 3 g/dL, fewer than 10 percent plasma cells, no end-organ damage, about 1 percent a year progression. <b>Myeloma: 10 percent or more plasma cells plus CRAB or a defining biomarker.</b>",
"Pathophysiology|Heme: Hypercalcaemia of malignancy mechanisms|PTHrP from squamous, breast and kidney cancers (commonest, PTH suppressed); lytic bone disease and myeloma; calcitriol from lymphoma. <b>Saline first, then zoledronic acid or denosumab; calcitonin for a fast, brief drop.</b>",
"Pathophysiology|Heme: Why neutropenic fever looks mild|Without neutrophils there is little pus or inflammation, so signs are subtle; gram-negatives including Pseudomonas dominate early. <b>Antipseudomonal beta-lactam within an hour; vancomycin only for specific reasons.</b>",
"Pathophysiology|Heme: Checkpoint inhibitor toxicity mechanism|Blocking CTLA-4 or PD-1/PD-L1 takes the brakes off T cells, which attack normal tissue: colitis, hepatitis, pneumonitis, thyroiditis, hypophysitis, type 1 diabetes, nephritis, myocarditis. <b>Grade 2 or worse: hold the drug, steroids. Endocrine damage is usually permanent.</b>",
"Pathophysiology|Heme: TRALI vs TACO|TRALI: donor antibodies activate recipient neutrophils in the lung, noncardiogenic oedema within 6 hours, normal or low BP. <b>TACO: volume overload, high BP, raised BNP, responds to diuretics.</b>",
"Pathophysiology|Heme: Acute haemolytic transfusion reaction|ABO mismatch (usually clerical): preformed IgM fixes complement, causing fever, flank pain, hypotension, haemoglobinuria and DIC. <b>Stop the transfusion; anaphylaxis instead suggests IgA deficiency.</b>",
"Pathophysiology|Heme: BRCA and PARP inhibitors|BRCA1 and BRCA2 repair double-strand breaks by homologous recombination; losing the second copy lets breast, ovarian, prostate and pancreatic cancer form. <b>PARP inhibitors block a backup repair route, so BRCA-deficient cells die (synthetic lethality).</b>",
"Pathophysiology|ID: Sepsis-3 definitions|Sepsis: life-threatening organ dysfunction (SOFA rise of 2 or more) from a dysregulated host response to infection. <b>Septic shock: vasopressors needed for MAP 65 or more and lactate above 2 despite adequate fluid.</b>",
"Pathophysiology|ID: Why septic shock is warm and leaky|Endotoxin and other microbial molecules hit Toll-like receptors; cytokines induce nitric oxide synthase, and nitric oxide dilates vessels. <b>Glycocalyx damage causes capillary leak, so patients are oedematous but intravascularly dry.</b>",
"Pathophysiology|ID: What a raised lactate means in sepsis|Hypoperfusion raises it, but so does adrenaline-driven glycolysis and poor liver clearance. <b>A marker of severity, not purely oxygen debt; serial lactates guide resuscitation.</b>",
"Pathophysiology|ID: Surviving Sepsis 2026 key numbers|Antibiotics within 1 hour for shock or probable sepsis (within 3 hours after rapid workup if only possible sepsis). At least 30 mL/kg crystalloid in 3 hours for hypoperfusion; balanced crystalloid over saline. <b>MAP 65, or 60 to 65 if aged 65 or over. Norepinephrine first (peripheral line OK), then vasopressin, then adrenaline; IV steroids suggested.</b>",
"Pathophysiology|ID: Superantigen mechanism|TSST-1 and streptococcal exotoxins bridge MHC II and the T-cell receptor outside the antigen groove, activating up to a fifth of all T cells. <b>Cytokine storm: fever, sunburn rash that peels, shock. Remove the source and add clindamycin to stop toxin production.</b>",
"Pathophysiology|ID: Staph vs strep toxic shock|Staph: tampons, nasal packing, wounds; blood cultures often negative. <b>Strep: deep soft tissue infection such as necrotising fasciitis; blood cultures usually positive, higher mortality.</b>",
"Pathophysiology|ID: Necrotising fasciitis early clue|Infection along the fascia clots vessels to skin and nerves. <b>Pain out of proportion to the skin early; later dusky skin, blisters, numbness, crepitus. Surgery first; don't wait for imaging.</b>",
"Pathophysiology|ID: Vibrio vulnificus|Seawater wounds or raw oysters. <b>Liver disease and iron overload let it cause sepsis with haemorrhagic bullae.</b> Doxycycline plus ceftazidime and debridement.",
"Pathophysiology|ID: Botulism mechanism|Toxin cleaves SNARE proteins, so acetylcholine isn't released at the neuromuscular junction. <b>Descending symmetric flaccid paralysis starting with cranial nerves, dilated pupils, no sensory loss, no fever. Antitoxin early; track vital capacity.</b> Infant: honey.",
"Pathophysiology|ID: Tetanus mechanism|Toxin travels up motor neurons and blocks GABA and glycine release from inhibitory interneurons, so muscles contract unopposed. <b>Trismus, risus sardonicus, opisthotonos. Tetanus immune globulin, vaccine, wound care, metronidazole, benzodiazepines.</b>",
"Pathophysiology|ID: C difficile toxin mechanism|Antibiotics clear normal flora so spores germinate. Toxins A and B inactivate Rho GTPases, breaking the colonic cell cytoskeleton and tight junctions and forming pseudomembranes. <b>Test only unformed stool, since carriage is common.</b>",
"Pathophysiology|ID: C difficile treatment now|First episode or first recurrence: fidaxomicin preferred (fewer relapses), oral vancomycin otherwise. <b>Fulminant: high-dose oral or NG vancomycin plus IV metronidazole and surgery review.</b> Bezlotoxumab is discontinued; microbiome products prevent repeated recurrences.",
"Pathophysiology|ID: How a vegetation forms|Damaged endothelium attracts a sterile platelet-fibrin clot; bacteria with adhesins in the blood stick and grow, shielded from neutrophils. <b>That's why endocarditis needs weeks of bactericidal antibiotics.</b>",
"Pathophysiology|ID: Endocarditis organism clues|S aureus: commonest, destructive; injection drug use favours the tricuspid valve with septic lung emboli. Viridans strep: after dental work, subacute. Enterococci: GU or bowel source in older adults. <b>Streptococcus gallolyticus (bovis): colonoscopy for colon cancer.</b>",
"Pathophysiology|ID: Culture-negative endocarditis|Commonest cause is antibiotics before cultures. <b>Otherwise HACEK, Coxiella (serology), Bartonella (homeless, cats) and fungi.</b>",
"Pathophysiology|ID: Endocarditis signs: emboli vs immune complex|Emboli: Janeway lesions (painless palms and soles), splinter haemorrhages, stroke, splenic and renal infarcts. <b>Immune complex: Osler nodes (painful finger pads), Roth spots, glomerulonephritis with low complement.</b>",
"Pathophysiology|ID: Endocarditis surgery indications|<b>Heart failure from valve destruction, uncontrolled infection (abscess, new heart block, resistant or fungal organisms), large vegetation with emboli.</b> 2023 Duke-ISCVID criteria add PCR, cardiac CT, PET-CT and surgical findings.",
"Pathophysiology|ID: Diabetic foot osteomyelitis|Neuropathy and poor perfusion let ulcers reach bone. <b>Positive probe-to-bone or ESR above 70 makes it likely; MRI is best. Bone biopsy for culture before antibiotics if stable.</b>",
"Pathophysiology|ID: Vertebral osteomyelitis|Haematogenous S aureus seeds the vertebral body and disc. Back pain, fever, raised ESR and CRP. <b>Think endocarditis and injection drug use; MRI; watch for epidural abscess with neurological signs.</b>",
"Pathophysiology|ID: Why meningitis damages the brain|Bacterial cell wall breakdown in the CSF triggers inflammation that causes oedema, raised pressure and vasculitis. <b>Dexamethasone just before or with the first antibiotic dose reduces hearing loss and death in pneumococcal meningitis.</b>",
"Pathophysiology|ID: CSF patterns|Bacterial: neutrophils, glucose low (CSF to serum below 0.4), protein high. Viral: lymphocytes, normal glucose. <b>TB and fungal: lymphocytes, low glucose, very high protein. HSV: lymphocytes with red cells.</b>",
"Pathophysiology|ID: Empirical meningitis cover|Ceftriaxone plus vancomycin. <b>Add ampicillin for Listeria over 50, in pregnancy or impaired cell-mediated immunity.</b> CT first only with focal signs, papilloedema, seizure, immunosuppression or reduced consciousness; don't delay antibiotics.",
"Pathophysiology|ID: HSV encephalitis|HSV-1 spreads to temporal and frontal lobes causing haemorrhagic necrosis: fever, confusion, personality change, aphasia, seizures. <b>Start IV acyclovir on suspicion; HSV PCR confirms. Hydrate to prevent acyclovir crystal nephropathy.</b>",
"Pathophysiology|ID: Cryptococcal meningitis pressure|CD4 below 100. The capsule clogs arachnoid granulations, so opening pressure is very high. <b>Repeated LPs to lower pressure; amphotericin plus flucytosine, then fluconazole. Delay ART 4 to 6 weeks to avoid IRIS.</b>",
"Pathophysiology|ID: Meningococcal contact prophylaxis|Close contacts (household, kissing, intubating without a mask). <b>Rifampin, ciprofloxacin or single-dose ceftriaxone.</b> Late complement deficiency (C5 to C9) predisposes to recurrent Neisseria infection.",
"Pathophysiology|ID: How HIV enters and persists|gp120 binds CD4 plus CCR5 or CXCR4; reverse transcriptase makes DNA, integrase inserts it. <b>CD4 T cells die directly and through chronic immune activation; gut lymphoid tissue is depleted early.</b>",
"Pathophysiology|ID: Acute HIV testing|Mono-like illness with rash and very high viral load, but antibody may not have formed. <b>4th generation antigen/antibody test plus HIV RNA if acute infection is suspected.</b>",
"Pathophysiology|ID: CD4 thresholds for infections|Below 200: Pneumocystis (TMP-SMX). Below 100: toxoplasma if IgG positive (TMP-SMX covers), cryptococcus. <b>Below 50: CMV retinitis and MAC; MAC prophylaxis not needed if ART starts straight away.</b>",
"Pathophysiology|ID: Pneumocystis features|Hypoxia out of proportion to a bilateral interstitial chest film, raised LDH, desaturation on exertion. <b>TMP-SMX; add steroids if PaO2 below 70 or A-a gradient 35 or more.</b>",
"Pathophysiology|ID: IRIS mechanism|As ART restores immunity, new T cells attack residual antigen, so an infection paradoxically worsens. <b>Start ART within 2 weeks of most infections, but delay in cryptococcal meningitis and take care in TB meningitis.</b>",
"Pathophysiology|ID: HIV prevention options|PrEP: daily oral tenofovir-based, or long-acting injectable cabotegravir or twice-yearly lenacapavir. <b>PEP: start within 72 hours, 28 days of ART.</b>",
"Pathophysiology|ID: TB granuloma|Bacilli survive inside alveolar macrophages. Th1 interferon-gamma activates macrophages; TNF holds the granuloma together. <b>TNF inhibitors, HIV, steroids, diabetes, CKD and silicosis weaken it, so screen before biologics.</b>",
"Pathophysiology|ID: Why TB reactivates at the apex|<b>The apices have the highest oxygen tension and lowest lymph flow, which suits the aerobic bacillus.</b> Primary infection is often mid or lower zone with hilar nodes (Ghon complex).",
"Pathophysiology|ID: IGRA vs TST|TST cross-reacts with BCG and some nontuberculous mycobacteria. <b>IGRA uses TB-specific antigens, so prefer it after BCG or when a return visit is unlikely.</b> Neither separates latent from active TB.",
"Pathophysiology|ID: Latent TB treatment|After a chest film excludes active disease: <b>3 months weekly isoniazid plus rifapentine, 4 months rifampin, or 3 months isoniazid plus rifampin.</b> Isoniazid: neuropathy (give B6), hepatitis. Rifampin: orange secretions, enzyme induction.",
"Pathophysiology|ID: Syphilis stages|Primary: painless chancre. Secondary: rash including palms and soles, condylomata lata, mucous patches. Tertiary: gummas, aortitis. <b>Neurosyphilis at any stage: Argyll Robertson pupil, tabes dorsalis.</b>",
"Pathophysiology|ID: Syphilis tests|Nontreponemal (RPR, VDRL): titre tracks activity and falls with treatment. <b>Treponemal (FTA-ABS, TP-PA, EIA): stays positive for life.</b> Benzathine penicillin G; desensitise in pregnancy or neurosyphilis if allergic.",
"Pathophysiology|ID: Jarisch-Herxheimer reaction|Hours after the first dose for syphilis or another spirochaete, lysed organisms release lipoproteins, causing fever, rigors and myalgia. <b>Not an allergy; give supportive care and continue treatment.</b>",
"Pathophysiology|ID: Lyme stages|Early local: erythema migrans, diagnosed clinically. Early disseminated: multiple EM, facial palsy, meningitis, carditis with AV block. Late: large-joint arthritis. <b>Doxycycline; IV ceftriaxone for high-grade heart block or meningitis.</b>",
"Pathophysiology|ID: Lyme prophylaxis|Ixodes tick attached usually 36 hours or more to transmit. <b>Single 200 mg doxycycline dose within 72 hours of removing an engorged tick in an endemic area.</b>",
"Pathophysiology|ID: Why falciparum is deadly|PfEMP1 makes infected red cells stick to small vessels in brain, kidney and placenta, avoiding the spleen. <b>Cerebral malaria, AKI, hypoglycaemia; severe disease gets IV artesunate.</b>",
"Pathophysiology|ID: Malaria host protection and relapse|Sickle trait, thalassaemia and G6PD deficiency protect against severe falciparum; Duffy-negative cells resist vivax. <b>Vivax and ovale leave liver hypnozoites: primaquine or tafenoquine after a G6PD test.</b>",
"Pathophysiology|ID: Invasive aspergillosis|Prolonged neutropenia, transplant or high-dose steroids. Hyphae invade vessels causing infarcts: halo sign on CT, then air crescent as neutrophils recover. <b>Galactomannan; voriconazole first.</b> ABPA in asthma or CF is hypersensitivity: steroids plus itraconazole.",
"Pathophysiology|ID: Mucormycosis and DKA|Acidosis frees iron from transferrin, which the fungus uses, and impairs neutrophils; deferoxamine also feeds it. <b>Black necrotic eschar of nose or palate spreading to orbit and brain. Emergency debridement plus amphotericin; voriconazole doesn't cover it.</b>",
"Pathophysiology|ID: MRSA and VRE mechanisms|MRSA: mecA makes PBP2a, which beta-lactams barely bind (except ceftaroline); vancomycin, daptomycin or linezolid. <b>Daptomycin fails in pneumonia because surfactant inactivates it.</b> VRE: D-Ala-D-Lac target; linezolid or daptomycin.",
"Pathophysiology|ID: ESBL and CRE|ESBLs hydrolyse penicillins and cephalosporins including ceftriaxone: use a carbapenem. <b>CRE: KPC (ceftazidime-avibactam, meropenem-vaborbactam) or metallo-beta-lactamases such as NDM (cefiderocol, or ceftazidime-avibactam plus aztreonam).</b>",
"Pathophysiology|Endo: Type 1 diabetes stages|Autoantibodies (GAD65, IA-2, ZnT8, insulin) appear years early. Stage 1: two or more antibodies, normal glucose. Stage 2: abnormal glucose. Stage 3: clinical diabetes. <b>Teplizumab (anti-CD3) delays stage 3 in stage 2.</b>",
"Pathophysiology|Endo: Type 2 diabetes mechanism|Insulin resistance in muscle, liver and fat, plus progressive beta-cell failure; glucose rises only when beta cells can't compensate. <b>Residual insulin blocks ketogenesis, so type 2 tends to HHS rather than DKA.</b>",
"Pathophysiology|Endo: MODY and LADA|MODY: autosomal dominant. GCK raises the glucose set point slightly, no treatment needed; HNF1A responds very well to sulfonylureas. <b>LADA: antibody-positive adult who looks like type 2 but needs insulin within years.</b>",
"Pathophysiology|Endo: SGLT2 inhibitor effects|Kidney spills glucose and sodium: heart failure and CKD benefit. <b>Genital infections and euglycaemic DKA (glucose may be under 250); hold before surgery and in acute illness.</b>",
"Pathophysiology|Endo: GLP-1 receptor agonist mechanism|Glucose-dependent insulin release, lower glucagon, slower gastric emptying, less appetite, so little hypoglycaemia alone. <b>Avoid with a history of medullary thyroid cancer or MEN2.</b> ADA 2026: first choice with MASLD and fibrosis; allowed in type 1 with obesity.",
"Pathophysiology|Endo: Why diabetes damages nerves, retina and kidney|These cells take up glucose without insulin. Aldose reductase makes sorbitol, which draws in water. <b>Advanced glycation end products stiffen vessels and basement membranes.</b>",
"Pathophysiology|Endo: DKA ketone mechanism|No insulin plus high glucagon, cortisol and catecholamines: lipolysis, then the liver makes ketones from fatty acids. <b>Beta-hydroxybutyrate is the main ketone; urine nitroprusside detects only acetoacetate.</b>",
"Pathophysiology|Endo: Potassium in DKA|Serum potassium is often high at first (insulin lack and high osmolality pull it out of cells) but total body potassium is low. <b>Below 3.5: replace and hold insulin, which drives potassium into cells.</b>",
"Pathophysiology|Endo: 2024 DKA and HHS criteria|DKA: glucose 200 or more or known diabetes, beta-hydroxybutyrate 3.0 or more, pH below 7.3 or bicarbonate below 18. <b>HHS: glucose 600 or more, effective osmolality above 300, little ketosis, pH 7.3 or more, bicarbonate 15 or more.</b> Altered mentation no longer required.",
"Pathophysiology|Endo: DKA treatment logic|Fluids first (balanced crystalloid preferred), check potassium, insulin 0.1 units/kg/h (0.05 in HHS). <b>Add dextrose when glucose falls below 250 so insulin keeps clearing ketones.</b> Bicarbonate only if pH below 7.0.",
"Pathophysiology|Endo: Hypoglycaemia work-up by C-peptide|C-peptide is cut from proinsulin in the beta cell, so injected insulin has none. <b>Exogenous insulin: high insulin, low C-peptide. Insulinoma: high insulin, C-peptide and proinsulin, negative screen. Sulfonylurea: high C-peptide, positive screen.</b>",
"Pathophysiology|Endo: Hypoglycaemia unawareness|Repeated lows blunt the adrenaline response, so warning symptoms vanish. <b>A few weeks of strict hypoglycaemia avoidance restores them; CGM helps.</b>",
"Pathophysiology|Endo: Graves mechanism|Antibodies stimulate the TSH receptor (TSI/TRAb): diffuse goitre, high uptake. <b>Orbital fibroblasts carry TSH and IGF-1 receptors, causing proptosis; smoking and radioiodine worsen it; teprotumumab blocks IGF-1R.</b>",
"Pathophysiology|Endo: Thyrotoxicosis by uptake|High uptake: Graves (diffuse), toxic nodules (patchy). <b>Low uptake: thyroiditis, exogenous hormone (low thyroglobulin), iodine load.</b>",
"Pathophysiology|Endo: Subacute thyroiditis|After a viral illness: tender gland, high ESR, low uptake; hyper, then hypo, then recovery. <b>Beta-blockers and NSAIDs or steroids; thionamides don't help because no new hormone is being made.</b>",
"Pathophysiology|Endo: Methimazole vs PTU|Both block thyroid peroxidase; both can cause agranulocytosis (sore throat and fever means check a count). <b>PTU also blocks peripheral T4 to T3: first trimester and thyroid storm, but more liver failure.</b>",
"Pathophysiology|Endo: Thyroid storm order|<b>Beta-blocker, then thionamide, then iodine at least 1 hour later (so the gland can't use it to make hormone), plus steroids.</b> Treat the trigger.",
"Pathophysiology|Endo: Myxoedema coma|Hypothermia, bradycardia, hypoventilation, hyponatraemia, confusion with a trigger. <b>IV hydrocortisone first, then IV levothyroxine; thyroid hormone raises cortisol demand.</b>",
"Pathophysiology|Endo: Amiodarone and the thyroid|37 percent iodine. Hypothyroid: gland can't escape Wolff-Chaikoff. <b>Type 1 thyrotoxicosis: iodine-fuelled overproduction, high Doppler flow, thionamides. Type 2: destructive thyroiditis, low flow, steroids.</b>",
"Pathophysiology|Endo: Sick euthyroid|Severe illness shunts T4 to reverse T3: low T3, normal or low TSH. <b>Don't treat; recheck after recovery.</b>",
"Pathophysiology|Endo: Thyroid in pregnancy|hCG weakly stimulates the TSH receptor, so TSH falls in the first trimester; oestrogen raises TBG and total T4. <b>On levothyroxine, raise the dose about 30 percent as soon as pregnancy is confirmed.</b>",
"Pathophysiology|Endo: Cushing work-up|Screen with two of: late-night salivary cortisol, 24-hour urine free cortisol, 1 mg dexamethasone test. <b>Then ACTH: low means adrenal; high means pituitary (MRI, petrosal sampling) or ectopic (very high cortisol, hypokalaemia, rapid onset).</b>",
"Pathophysiology|Endo: Why high cortisol causes hypokalaemia|11-beta-HSD2 in the kidney normally inactivates cortisol so it can't hit the mineralocorticoid receptor. <b>Huge cortisol levels (ectopic ACTH) overwhelm it: hypertension and low potassium.</b> Liquorice blocks the same enzyme.",
"Pathophysiology|Endo: Primary vs secondary adrenal insufficiency|Primary: cortisol and aldosterone lost, so low sodium, high potassium; high ACTH with MSH darkens skin. <b>Secondary: renin-angiotensin keeps aldosterone, so no hyperkalaemia or pigmentation.</b>",
"Pathophysiology|Endo: Adrenal crisis|Shock, abdominal pain, vomiting, low sodium, high potassium, low glucose. <b>100 mg IV hydrocortisone at once, before results if needed, plus saline and dextrose.</b> Sick-day rules: double or triple dose.",
"Pathophysiology|Endo: Congenital adrenal hyperplasia blocks|21-hydroxylase: salt wasting, hyperkalaemia, virilisation, high 17-hydroxyprogesterone. <b>11-beta: virilisation plus hypertension (11-deoxycorticosterone). 17-alpha: hypertension, no sex steroids.</b>",
"Pathophysiology|Endo: Primary aldosteronism|Aldosterone without renin: hypertension, often low potassium and metabolic alkalosis. <b>No oedema because of aldosterone escape.</b> Aldosterone-to-renin ratio, confirm, CT, adrenal vein sampling; spironolactone or eplerenone if bilateral.",
"Pathophysiology|Endo: Phaeochromocytoma pre-op|Plasma free or urine fractionated metanephrines. <b>Alpha blockade before any beta-blocker; beta first leaves alpha vasoconstriction unopposed.</b> About a third or more are hereditary (MEN2, VHL, NF1, SDH).",
"Pathophysiology|Endo: Adrenal incidentaloma work-up|Every one: 1 mg dexamethasone test and metanephrines. <b>Aldosterone-to-renin ratio if hypertensive or hypokalaemic.</b> Large size or high CT attenuation suggests carcinoma.",
"Pathophysiology|Endo: Causes of high prolactin|Dopamine inhibits prolactin, so dopamine blockers (antipsychotics, metoclopramide) and stalk compression raise it. <b>Primary hypothyroidism raises it via TRH; check TSH and pregnancy first.</b>",
"Pathophysiology|Endo: Prolactinoma treatment|High prolactin suppresses GnRH: amenorrhoea, galactorrhoea, low libido, bone loss. <b>Cabergoline shrinks even macroadenomas, so surgery is rarely first.</b>",
"Pathophysiology|Endo: Acromegaly diagnosis|GH acts through liver IGF-1. <b>Screen with IGF-1; confirm when GH fails to suppress after oral glucose.</b> Watch for sleep apnoea, cardiomyopathy, diabetes, colon polyps.",
"Pathophysiology|Endo: Hypopituitarism replacement order|<b>Replace cortisol before thyroid hormone, which speeds cortisol clearance and can trigger crisis.</b> Monitor free T4, not TSH, in central hypothyroidism.",
"Pathophysiology|Endo: Pituitary apoplexy and Sheehan|Apoplexy: bleeding into an adenoma, sudden headache, visual loss, ophthalmoplegia; urgent steroids. <b>Sheehan: postpartum infarction, failure to lactate then amenorrhoea.</b>",
"Pathophysiology|Endo: PTH actions|Frees calcium from bone, increases distal tubular calcium reabsorption, wastes phosphate. <b>Activates 1-alpha-hydroxylase to make calcitriol, which absorbs gut calcium.</b>",
"Pathophysiology|Endo: Primary hyperparathyroidism surgery|High calcium with high or inappropriately normal PTH, low phosphate. <b>Surgery for all symptomatic patients; if asymptomatic — calcium more than 1 mg/dL above normal, T-score −2.5 or lower or fragility fracture, eGFR below 60, stones or nephrocalcinosis, urine calcium above 400 mg/day with stone risk, age 50 or under, or cannot be observed.</b> <i>[Fifth International Workshop 2020 PHPT]</i>",
"Pathophysiology|Endo: FHH vs primary hyperparathyroidism|FHH: inactivating calcium-sensing receptor mutation, mild high calcium, normal or high PTH. <b>Calcium-to-creatinine clearance ratio below 0.01; benign, surgery doesn't help.</b>",
"Pathophysiology|Endo: Magnesium and calcium|Low magnesium blocks PTH release and action, causing refractory hypocalcaemia and hypokalaemia. <b>Correct magnesium first.</b>",
"Pathophysiology|Endo: Pseudohypoparathyroidism|Kidney resistance to PTH from a Gs-alpha defect. <b>High PTH, low calcium, high phosphate.</b> Albright osteodystrophy: short stature, short 4th and 5th metacarpals.",
"Pathophysiology|Endo: Hungry bone syndrome|After parathyroidectomy for long-standing disease, bone suddenly takes up calcium, phosphate and magnesium. <b>Severe prolonged hypocalcaemia; replace all three.</b>",
"Pathophysiology|Endo: Denosumab rebound|Denosumab blocks RANKL. <b>Stopping it causes rebound resorption and multiple vertebral fractures; follow with a bisphosphonate.</b>",
"Pathophysiology|Endo: Bone-building osteoporosis drugs|Teriparatide and abaloparatide: intermittent PTH builds bone. <b>Romosozumab blocks sclerostin, building bone and cutting resorption; cardiovascular warning.</b> Follow anabolics with an antiresorptive.",
"Pathophysiology|Endo: MEN syndromes|MEN1 (menin): parathyroid, pituitary, pancreatic NETs (gastrinoma). MEN2A (RET): medullary thyroid cancer, phaeo, parathyroid. MEN2B: MTC, phaeo, mucosal neuromas, marfanoid. <b>RET carriers: prophylactic thyroidectomy; exclude phaeo before any surgery.</b>",
"Pathophysiology|Rheum: Anti-CCP mechanism|Smoking and gum disease convert arginine to citrulline; HLA-DRB1 shared epitope carriers make anti-CCP years before arthritis. <b>More specific than RF and predicts erosions.</b>",
"Pathophysiology|Rheum: How RA erodes bone|TNF, IL-6 and IL-1 from synovium; pannus invades cartilage and RANKL-activated osteoclasts erode joint margins. <b>Symmetric MCP, PIP and wrist; DIPs spared; morning stiffness over an hour.</b>",
"Pathophysiology|Rheum: RA cervical spine|C1-C2 (atlantoaxial) subluxation from ligament erosion. <b>Flexion-extension films before intubation or surgery.</b>",
"Pathophysiology|Rheum: Extra-articular RA|Nodules, interstitial lung disease, scleritis, accelerated atherosclerosis. <b>Felty syndrome: RA, splenomegaly, neutropenia, infections.</b>",
"Pathophysiology|Rheum: RA drug essentials|Methotrexate first (folate antagonist: give folic acid; liver, marrow, lung toxicity; teratogenic). Then biologic or JAK inhibitor. <b>Screen TB and hepatitis B before biologics; JAK inhibitors carry clot, cancer and cardiac warnings.</b>",
"Pathophysiology|Rheum: Why lupus happens|Poor clearance of dying cells (early complement deficiency C1q, C2, C4) exposes nuclear antigen; type I interferon and anti-nuclear antibodies follow. <b>Immune complexes fix complement in kidney, skin, joints and serosa (type III).</b>",
"Pathophysiology|Rheum: Lupus activity markers|<b>Falling C3 and C4 with rising anti-dsDNA track flares, especially nephritis.</b> ANA is sensitive (negative largely excludes); anti-dsDNA and anti-Smith are specific.",
"Pathophysiology|Rheum: Anti-Ro in pregnancy|Anti-Ro (SSA) IgG crosses the placenta and damages the fetal conduction system. <b>Congenital heart block and neonatal lupus rash; monitor fetal heart rate, hydroxychloroquine lowers risk.</b>",
"Pathophysiology|Rheum: Drug-induced lupus|Hydralazine, procainamide, isoniazid, minocycline, TNF inhibitors. Anti-histone positive. <b>Kidney and brain usually spared; resolves after stopping the drug.</b>",
"Pathophysiology|Rheum: Lupus nephritis classes|Class III and IV proliferative: nephritic, induction with steroids plus mycophenolate or low-dose cyclophosphamide, with a third agent (belimumab, voclosporin or obinutuzumab) favoured by ACR 2025. <b>Class V membranous: nephrotic. Biopsy guides therapy.</b>",
"Pathophysiology|Rheum: Hydroxychloroquine in lupus|For every patient: fewer flares, clots and damage, better survival. <b>Retinal toxicity: dose 5 mg/kg/day or less, yearly retinal screening after 5 years.</b>",
"Pathophysiology|Rheum: Limited vs diffuse scleroderma|Limited (anti-centromere): CREST, late pulmonary arterial hypertension. <b>Diffuse (anti-Scl-70): skin above elbows and knees, early interstitial lung disease.</b>",
"Pathophysiology|Rheum: Scleroderma renal crisis|Narrowed renal arteries cause a renin surge: sudden severe hypertension and AKI, often after high-dose steroids; anti-RNA polymerase III is highest risk. <b>ACE inhibitor, even if creatinine rises.</b>",
"Pathophysiology|Rheum: Sjogren syndrome|Lymphocytes infiltrate salivary and lacrimal glands: dry eyes, dry mouth, parotid swelling; anti-Ro and anti-La. <b>Much higher MALT lymphoma risk: a new firm parotid mass or low complement needs work-up.</b>",
"Pathophysiology|Rheum: Dermatomyositis|Complement injures small vessels of muscle and skin: proximal weakness, high CK, heliotrope rash, Gottron papules. <b>Screen for cancer (ovary, lung, GI).</b>",
"Pathophysiology|Rheum: Myositis antibodies|Anti-Jo-1: antisynthetase syndrome (interstitial lung disease, mechanic's hands, arthritis). Anti-MDA5: rapidly progressive lung disease, little weakness. <b>Anti-HMGCR: statin-triggered necrotising myopathy that persists after stopping.</b>",
"Pathophysiology|Rheum: Spondyloarthritis mechanism|HLA-B27 and IL-23/IL-17 inflammation at entheses, then new bone forms: syndesmophytes and bamboo spine. <b>Inflammatory back pain: young, morning stiffness, better with exercise, night pain.</b>",
"Pathophysiology|Rheum: Ankylosing spondylitis extras|Sacroiliitis on MRI, anterior uveitis, aortic regurgitation, restrictive chest wall. <b>NSAIDs and exercise; TNF or IL-17 blockers for axial disease (methotrexate doesn't help).</b>",
"Pathophysiology|Rheum: Reactive and enteropathic arthritis|Reactive: weeks after Chlamydia or Salmonella, Shigella, Campylobacter, Yersinia; arthritis, urethritis, conjunctivitis. <b>IBD: peripheral arthritis follows gut activity; spinal disease doesn't. IL-17 blockers can worsen IBD.</b>",
"Pathophysiology|Rheum: Psoriatic arthritis|DIP joints, dactylitis, nail pitting, enthesitis; arthritis mutilans (pencil-in-cup). <b>Arthritis can precede skin disease.</b>",
"Pathophysiology|Rheum: Gout mechanism|Humans lack uricase. Urate crystals in cool, damaged joints are engulfed by macrophages; NLRP3 inflammasome releases IL-1-beta. <b>Needle-shaped, negatively birefringent; serum urate can be normal in a flare.</b>",
"Pathophysiology|Rheum: Causes of hyperuricaemia|Mostly under-excretion: CKD, thiazides and loops, low-dose aspirin, alcohol, cyclosporine. <b>Overproduction: tumour lysis, myeloproliferative disease, psoriasis.</b>",
"Pathophysiology|Rheum: Gout flare treatment|NSAIDs, colchicine (blocks microtubules and neutrophil migration; reduce in CKD) or steroids. <b>Don't start urate lowering without flare prophylaxis; don't stop it during a flare.</b>",
"Pathophysiology|Rheum: Allopurinol safety|Xanthine oxidase inhibitor to urate below 6. <b>Test HLA-B*58:01 in Southeast Asian and African American patients (SJS/TEN, DRESS). Never with azathioprine: levels rise and marrow fails.</b> Febuxostat: cardiovascular death warning.",
"Pathophysiology|Rheum: Pseudogout (CPPD)|Rhomboid, weakly positively birefringent crystals; knee and wrist; chondrocalcinosis. <b>In a young patient look for haemochromatosis, hyperparathyroidism, low magnesium, hypophosphatasia.</b>",
"Pathophysiology|Rheum: Septic joint synovial fluid|WBC above 50,000, mostly neutrophils, suggests infection; crystals don't exclude it. <b>Aspirate before antibiotics; washout. S aureus commonest; gonococcus in young adults (tenosynovitis, pustules).</b>",
"Pathophysiology|Rheum: Giant cell arteritis urgency|Over 50: headache, jaw claudication, scalp tenderness, very high ESR and CRP; blindness from optic nerve ischaemia. <b>High-dose steroids immediately; biopsy or ultrasound within 1 to 2 weeks still accurate; tocilizumab spares steroids.</b>",
"Pathophysiology|Rheum: Polymyalgia rheumatica|Over 50: shoulder and hip girdle stiffness, high ESR, normal CK. <b>Dramatic response to low-dose prednisone; ask about GCA symptoms.</b>",
"Pathophysiology|Rheum: Takayasu arteritis|Granulomatous inflammation of aorta and branches in young women. <b>Arm claudication, unequal arm BPs, absent pulses, bruits.</b>",
"Pathophysiology|Rheum: Polyarteritis nodosa|Necrotising medium-vessel vasculitis with microaneurysms; hepatitis B link; ANCA negative. <b>Renal artery hypertension and infarcts but no glomerulonephritis; lungs spared; mononeuritis multiplex.</b>",
"Pathophysiology|Rheum: Kawasaki disease|Young child: fever 5 days plus conjunctivitis, mucositis, rash, hand and foot changes, cervical node. <b>Coronary aneurysms: IVIG plus aspirin; echo.</b>",
"Pathophysiology|Rheum: IgA vasculitis|IgA immune complexes: palpable purpura on legs, arthralgia, abdominal pain (intussusception in children), IgA nephritis. <b>Adults have more kidney disease.</b>",
"Pathophysiology|Rheum: Cryoglobulinaemia|Usually hepatitis C: immune complexes precipitate in the cold. <b>Purpura, arthralgia, neuropathy, glomerulonephritis, very low C4; treat the hepatitis C.</b>",
"Pathophysiology|Neuro: Ischaemic cascade|No ATP, so the sodium-potassium pump fails and cells swell (cytotoxic oedema); glutamate over-activates NMDA receptors, calcium floods in, cells die. <b>The penumbra is stunned but alive, so restoring flow fast saves it.</b>",
"Pathophysiology|Neuro: 2026 thrombolysis rules|Within 4.5 hours: alteplase or tenecteplase for a disabling deficit, whatever the NIHSS. <b>Non-disabling minor stroke: dual antiplatelets instead. 4.5 to 9 hours or unknown onset: lysis if imaging shows salvageable tissue.</b>",
"Pathophysiology|Neuro: BP around stroke reperfusion|<b>Below 185/110 before lysis, below 180/105 for 24 hours after.</b> Pushing systolic below 140 after thrombolysis gives no benefit; after successful thrombectomy it is harmful.",
"Pathophysiology|Neuro: Thrombectomy expansion|Large vessel occlusion with salvageable tissue; 2026 guideline extends to selected large cores. <b>Basilar occlusion within 24 hours with NIHSS 10 or more: strong recommendation.</b>",
"Pathophysiology|Neuro: Lacunar stroke|Lipohyalinosis of small penetrating arteries from hypertension and diabetes. <b>Pure motor or pure sensory syndromes with no cortical signs (no aphasia, neglect or visual field loss).</b>",
"Pathophysiology|Neuro: Cardioembolic stroke clues|Sudden and maximal at onset, cortical signs, several territories. <b>AF, recent MI, endocarditis, PFO; prolonged rhythm monitoring in cryptogenic stroke.</b>",
"Pathophysiology|Neuro: Carotid endarterectomy|<b>Symptomatic stenosis of 70 percent or more (50 to 69 in selected men), ideally within 2 weeks.</b> Asymptomatic: mostly medical therapy.",
"Pathophysiology|Neuro: Deep vs lobar haemorrhage|Deep (basal ganglia, thalamus, pons, cerebellum): hypertension. <b>Lobar in older adults: amyloid angiopathy.</b> Haematoma grows early: reverse anticoagulation fast, systolic toward 140; cerebellar bleed with compression needs surgery.",
"Pathophysiology|Neuro: Anticoagulant reversal in ICH|<b>Warfarin: 4-factor PCC plus vitamin K. Dabigatran: idarucizumab. Factor Xa inhibitors: andexanet or PCC.</b>",
"Pathophysiology|Neuro: SAH diagnosis|Thunderclap headache from a ruptured berry aneurysm (PKD, Ehlers-Danlos, smoking). <b>CT very sensitive in first 6 hours; later, LP for xanthochromia, which takes hours to form.</b>",
"Pathophysiology|Neuro: SAH complications|Rebleeding (secure aneurysm early), hydrocephalus, hyponatraemia, vasospasm with delayed ischaemia at days 3 to 14. <b>Nimodipine improves outcome, mainly by protecting neurons.</b>",
"Pathophysiology|Neuro: Why benzodiazepines fail in late status|Ongoing seizures pull GABA-A receptors inside neurons and add NMDA receptors to the surface. <b>Give an adequate benzodiazepine dose at 5 minutes, then levetiracetam, fosphenytoin or valproate, then anaesthetic infusion.</b>",
"Pathophysiology|Neuro: Provoked seizure causes|Low or high sodium, low glucose, low calcium or magnesium, alcohol or benzodiazepine withdrawal, infection, stroke. <b>Drugs: bupropion, tramadol, isoniazid (give B6), carbapenems.</b>",
"Pathophysiology|Neuro: Antiseizure drug pearls|Valproate: neural tube defects, liver, pancreatitis, ammonia. Carbamazepine and phenytoin: enzyme inducers (contraception fails). <b>HLA-B*15:02 before carbamazepine in Asian ancestry (SJS). Lamotrigine: slow titration for rash.</b>",
"Pathophysiology|Neuro: Migraine mechanism|Cortical spreading depression causes aura and activates trigeminal nerves, which release CGRP: meningeal vessel dilation, inflammation, sensitisation. <b>Triptans block CGRP release but constrict vessels (avoid with coronary or cerebrovascular disease); gepants and CGRP antibodies don't.</b>",
"Pathophysiology|Neuro: Migraine with aura and oestrogen|<b>Migraine with aura plus combined oestrogen raises ischaemic stroke risk: avoid combined pills.</b> Progestin-only or non-hormonal options.",
"Pathophysiology|Neuro: Idiopathic intracranial hypertension|Young woman with obesity (or tetracyclines, vitamin A): headache, papilloedema, pulsatile tinnitus, CN VI palsy, normal imaging, high opening pressure. <b>Vision at risk: weight loss and acetazolamide (lowers CSF production).</b>",
"Pathophysiology|Neuro: Normal pressure hydrocephalus|Impaired CSF absorption enlarges ventricles and stretches periventricular fibres. <b>Magnetic gait first, then incontinence and dementia; improvement after large-volume LP predicts shunt benefit.</b>",
"Pathophysiology|Neuro: Multiple sclerosis mechanism|Autoreactive T and B cells cross the blood-brain barrier and demyelinate CNS white matter: lesions disseminated in time and space; CSF oligoclonal bands. <b>Heat slows conduction in demyelinated axons (Uhthoff).</b>",
"Pathophysiology|Neuro: MS signs and drugs|Optic neuritis, internuclear ophthalmoplegia (MLF), transverse myelitis, Lhermitte sign. <b>Relapses: high-dose steroids. Natalizumab risks PML (JC virus).</b>",
"Pathophysiology|Neuro: Guillain-Barre mechanism|Molecular mimicry after Campylobacter or other infection: antibodies to nerve gangliosides. Ascending weakness, lost reflexes, autonomic instability. <b>CSF high protein, normal cells. IVIG or plasma exchange; steroids don't help.</b>",
"Pathophysiology|Neuro: Monitoring neuromuscular respiratory failure|<b>Track vital capacity and negative inspiratory force; oxygen saturation falls late.</b> Intubate if VC below about 20 mL/kg or rapidly falling.",
"Pathophysiology|Neuro: Myasthenia gravis mechanism|Antibodies to postsynaptic acetylcholine receptors (or MuSK): fatigable ptosis, diplopia, bulbar weakness worse through the day. <b>CT for thymoma; pyridostigmine, immunosuppression, thymectomy; crisis: IVIG or plasma exchange.</b>",
"Pathophysiology|Neuro: Drugs that worsen myasthenia|<b>Aminoglycosides, fluoroquinolones, magnesium, beta-blockers, checkpoint inhibitors.</b> Also macrolides and some anaesthetic agents.",
"Pathophysiology|Neuro: Lambert-Eaton vs myasthenia|LEMS: antibodies to presynaptic calcium channels, often small cell lung cancer; proximal leg weakness that briefly improves with effort, low reflexes, dry mouth. <b>Repetitive stimulation: increment in LEMS, decrement in myasthenia.</b>",
"Pathophysiology|Neuro: ALS|Upper plus lower motor neuron loss: spasticity, brisk reflexes, wasting, fasciculations; sensation, eye movement and bladder spared. <b>Riluzole, edaravone, tofersen for SOD1; plan non-invasive ventilation early.</b>",
"Pathophysiology|Neuro: Parkinson mechanism|Nigral dopamine neurons die with alpha-synuclein Lewy bodies; symptoms appear after most are lost. <b>Constipation, anosmia and REM sleep behaviour disorder often come first.</b>",
"Pathophysiology|Neuro: Parkinson drug issues|Levodopa with carbidopa (blocks peripheral conversion) is most effective; dyskinesias over time. Dopamine agonists: impulse control disorders. <b>Avoid typical antipsychotics and metoclopramide; for psychosis use quetiapine, clozapine or pimavanserin.</b>",
"Pathophysiology|Neuro: Alzheimer mechanism and symptom drugs|Amyloid plaques outside and tau tangles inside neurons, starting in the hippocampus: memory first. <b>Donepezil (watch bradycardia) and memantine (NMDA blocker).</b>",
"Pathophysiology|Neuro: Anti-amyloid antibodies|Lecanemab and donanemab clear plaques and modestly slow early disease with confirmed amyloid. <b>ARIA (oedema, microbleeds) is the main risk, higher in APOE4 homozygotes; MRI monitoring; caution with anticoagulants.</b>",
"Pathophysiology|Neuro: Other dementias|Lewy body: fluctuations, visual hallucinations, parkinsonism, severe antipsychotic sensitivity. Frontotemporal: early personality change, younger. <b>Creutzfeldt-Jakob: rapid dementia, myoclonus, periodic sharp waves, RT-QuIC.</b>",
"Pathophysiology|Neuro: Wernicke mechanism|Thiamine is a cofactor for energy enzymes; high-demand areas (mammillary bodies, thalamus) fail. Confusion, eye signs, ataxia, often not all three. <b>IV thiamine before glucose; untreated leads to Korsakoff amnesia.</b>",
"Pathophysiology|Neuro: Osmotic demyelination|Chronic hyponatraemia corrected too fast shrinks adapted brain cells and damages pontine myelin. <b>Dysarthria, dysphagia, quadriparesis days later; limit correction to 8 per 24 hours in high-risk patients.</b>",
"Pathophysiology|Heme: HIT mechanism|IgG against heparin-PF4 complexes activates platelets through Fc receptors: platelets fall over 50 percent at 5 to 10 days, with venous and arterial clots, not bleeding. <b>4Ts score, PF4 antibody, functional assay.</b>",
"Pathophysiology|Heme: HIT treatment|<b>Stop all heparin including flushes; start argatroban, bivalirudin, fondaparinux or a DOAC.</b> No platelet transfusion; no warfarin until platelets recover (venous limb gangrene).",
"Pathophysiology|Heme: B12 vs folate biochemistry|B12 drives methylmalonyl-CoA and homocysteine reactions; folate only the homocysteine one. <b>B12 deficiency: both MMA and homocysteine high. Folate: homocysteine only.</b>",
"Pathophysiology|Heme: Subacute combined degeneration|B12 deficiency damages dorsal columns and lateral corticospinal tracts, even without anaemia; nitrous oxide inactivates B12. <b>Folate alone fixes the anaemia but lets the nerve damage progress.</b>",
"Pathophysiology|Heme: Aplastic anaemia vs MDS|Aplastic: T cells destroy stem cells, empty marrow, pancytopenia, low reticulocytes. <b>MDS: older adults, clonal dysplastic marrow, macrocytosis, AML risk.</b>",
"Pathophysiology|Heme: Hodgkin lymphoma|Reed-Sternberg cells (CD15, CD30) in an inflammatory background; spreads to neighbouring nodes; EBV link. <b>B symptoms; node pain with alcohol.</b>",
"Pathophysiology|Heme: Lymphoma translocations|Follicular: t(14;18), BCL2 overexpression blocks apoptosis. <b>Burkitt: t(8;14), MYC, very fast growth and tumour lysis risk.</b> Diffuse large B-cell: commonest, aggressive.",
"Pathophysiology|Heme: AL vs ATTR amyloidosis|AL: light chains, nephrotic syndrome, heart failure, macroglossia, periorbital purpura. ATTR: transthyretin, older men or V122I variant, heart failure, carpal tunnel, spinal stenosis. <b>Pyrophosphate scan diagnoses cardiac ATTR once AL is excluded; tafamidis stabilises it.</b>",
"Pathophysiology|Heme: HLH|T and NK cells fail to kill, so macrophages are over-stimulated and eat blood cells. <b>Fever, splenomegaly, cytopenias, very high ferritin, high triglycerides, low fibrinogen.</b> Triggers: EBV, lymphoma, autoimmune disease.",
"Pathophysiology|Heme: Lynch syndrome|Inherited mismatch repair defects (MLH1, MSH2, MSH6, PMS2) cause microsatellite instability: right-sided colon cancer when young, endometrial, ovarian, urinary tract. <b>Colonoscopy every 1 to 2 years from 20 to 25; MMR-deficient tumours respond to checkpoint inhibitors.</b>",
"Pathophysiology|Heme: Malignant spinal cord compression|Vertebral metastasis (breast, lung, prostate) compresses the cord from the front. <b>Back pain worse lying down comes before weakness: dexamethasone, urgent whole-spine MRI, then radiotherapy or surgery.</b>",
"Pathophysiology|ID: Legionella clues|Water systems: high fever, diarrhoea, confusion, hyponatraemia, raised LFTs. <b>Urine antigen; macrolide or fluoroquinolone, since beta-lactams don't reach it inside cells.</b>",
"Pathophysiology|ID: EBV mononucleosis|EBV enters B cells via CD21; cytotoxic T cells make atypical lymphocytes. Fever, exudative pharyngitis, posterior nodes, splenomegaly. <b>Amoxicillin rash; no contact sport for at least 3 to 4 weeks (splenic rupture).</b>",
"Pathophysiology|ID: Zoster reactivation|VZV latent in sensory ganglia reactivates as cell-mediated immunity falls. <b>Hutchinson sign (nose tip) means eye involvement; Ramsay Hunt: ear vesicles and facial palsy.</b> Antivirals within 72 hours; recombinant vaccine from 50.",
"Pathophysiology|ID: RMSF vs ehrlichiosis|RMSF: Rickettsia infects endothelium (vasculitis); rash from wrists and ankles inward, palms and soles; low platelets, low sodium. <b>Ehrlichia/Anaplasma infect white cells: leukopenia, low platelets, raised LFTs, usually no rash. Doxycycline at once, children too.</b>",
"Pathophysiology|ID: Endemic fungi|Histoplasma (Ohio/Mississippi, bird and bat droppings): intracellular in macrophages, disseminates in AIDS. Blastomyces (Great Lakes, rotting wood): lung, skin, bone; broad-based budding. <b>Coccidioides (Southwest): valley fever, erythema nodosum, spherules.</b>",
"Pathophysiology|Rheum: Hereditary angioedema|Low or dysfunctional C1 esterase inhibitor: excess bradykinin, non-itchy swelling of face, airway, gut, no hives; low C4. <b>Antihistamines, steroids and adrenaline fail: C1 inhibitor, icatibant or ecallantide.</b> ACE inhibitors cause the same bradykinin swelling.",
"Pathophysiology|Rheum: Common variable immunodeficiency|B cells don't mature into plasma cells: low IgG and IgA, poor vaccine responses, sinus and lung infections, bronchiectasis, Giardia, autoimmunity, lymphoma. <b>IVIG.</b> IgA deficiency: anaphylaxis to IgA-containing blood.",
"Pathophysiology|Rheum: IgG4-related disease|IgG4 plasma cells and storiform fibrosis: autoimmune pancreatitis mimicking cancer, sclerosing cholangitis, salivary and orbital swelling, retroperitoneal fibrosis. <b>Dramatic steroid response.</b>",
"Pathophysiology|Rheum: Familial Mediterranean fever|Pyrin (MEFV) mutations activate the inflammasome and IL-1: 1 to 3 day attacks of fever with peritonitis, pleuritis or arthritis. <b>Untreated: AA amyloidosis; colchicine prevents both.</b>",
"Pathophysiology|Endo: PCOS mechanism|Fast LH pulses drive ovarian androgens; high insulin adds androgen output and lowers SHBG. Anovulation, hirsutism, polycystic ovaries. <b>Unopposed oestrogen raises endometrial cancer risk.</b> Combined pill, metformin, weight loss; letrozole for ovulation.",
"Pathophysiology|Endo: Familial hypercholesterolaemia|LDL receptor (or APOB, PCSK9 gain) mutations block hepatic LDL clearance: LDL 190 or more, tendon xanthomas, early CAD. <b>Screen relatives; high-intensity statin, ezetimibe, PCSK9 inhibitor.</b>",
"Pathophysiology|Endo: Paget disease of bone|Overactive osteoclasts then disorganised new bone: enlarging skull, hearing loss, bone pain, bowing. <b>High alkaline phosphatase, normal calcium and phosphate; zoledronic acid.</b> Rare osteosarcoma.",
"Pathophysiology|Endo: Acute intermittent porphyria|PBG deaminase deficiency; drugs, fasting, alcohol and progesterone induce ALA synthase, so neurotoxic ALA and PBG build up. <b>Abdominal pain, neuropathy, psychiatric symptoms, hyponatraemia, no rash; urine PBG; IV haemin and glucose.</b>",
"Pathophysiology|Endo: Lead poisoning|Lead blocks ALA dehydratase and ferrochelatase: microcytic anaemia with basophilic stippling. <b>Abdominal pain, neuropathy (wrist drop), cognitive effects; chelation.</b>",
"Pathophysiology|Neuro: Neuromyelitis optica|IgG against aquaporin-4 on astrocytes: severe optic neuritis and myelitis over 3 or more segments; area postrema syndrome (hiccups, vomiting). <b>Not MS; some MS drugs worsen it. Steroids and plasma exchange; complement, IL-6 or B-cell blockers prevent relapses.</b>",
"Pathophysiology|Tox: Salicylate toxicity|Stimulates breathing (early respiratory alkalosis) and uncouples oxidative phosphorylation (anion gap acidosis, fever); tinnitus, pulmonary oedema. <b>Urine alkalinisation with bicarbonate; dialysis for high levels, confusion or pulmonary oedema. Intubation is dangerous.</b>",
"Pathophysiology|Tox: Tricyclic overdose|Blocks fast sodium channels (wide QRS, right axis, VT), muscarinic, alpha and histamine receptors. <b>QRS above 100 ms: sodium bicarbonate.</b>",
"Pathophysiology|Tox: Anticholinergic vs cholinergic|Anticholinergic: hot, dry, flushed, big pupils, delirium, retention. <b>Organophosphates block acetylcholinesterase: secretions everywhere, bradycardia, small pupils, then weakness. Atropine to dry the airways, pralidoxime before ageing.</b>",
"Pathophysiology|Tox: Serotonin syndrome vs NMS|Serotonin: hours after serotonergic drugs (SSRI plus linezolid, tramadol, MAOI), clonus, hyperreflexia, diarrhoea; benzodiazepines, cyproheptadine. <b>NMS: days after a dopamine blocker, lead-pipe rigidity, low reflexes, very high CK; dantrolene or bromocriptine.</b>",
"Pathophysiology|Tox: Alcohol withdrawal timeline|Chronic alcohol upregulates NMDA and downregulates GABA-A, so stopping leaves the brain excited. Tremor 6 to 24 hours, seizures 12 to 48, hallucinations with clear sensorium, <b>delirium tremens 48 to 96 hours.</b> Symptom-triggered benzodiazepines, thiamine.",
"Pathophysiology|Tox: Buprenorphine precipitated withdrawal|High-affinity partial agonist displaces full agonists. <b>Start in moderate withdrawal (or microdosing or high-dose induction after fentanyl).</b> Ceiling on respiratory depression makes overdose safer.",
"Pathophysiology|Tox: Heat stroke|Core above 40 with brain dysfunction; cytokines and gut leak cause multi-organ failure, rhabdomyolysis, DIC. <b>Cool fast (cold water immersion for exertional); antipyretics fail because the set point is normal.</b>",
"Pathophysiology|Tox: Hypothermia|Osborn J waves, bradycardia, cold diuresis, irritable myocardium prone to VF with rough handling. <b>Rewarm; not dead until warm and dead.</b>",
"Pathophysiology|Derm: SJS/TEN mechanism|Drug-specific cytotoxic T cells kill keratinocytes (granulysin, Fas ligand). Under 10 percent skin: SJS; over 30: TEN. Mucosa involved, Nikolsky positive, 4 to 28 days after the drug. <b>Stop the drug; burns-unit care.</b>",
"Pathophysiology|Derm: DRESS|2 to 8 weeks after anticonvulsants, allopurinol, sulfonamides or vancomycin: rash, facial oedema, fever, eosinophilia, organ involvement (liver most). <b>HHV-6 reactivation; stop the drug, steroids with slow taper.</b>",
"Pathophysiology|Derm: Pemphigus vs pemphigoid|Pemphigus: IgG to desmoglein, blister within epidermis, flaccid, mouth erosions, Nikolsky positive. <b>Pemphigoid: IgG to hemidesmosome (BP180/230), blister under epidermis, tense, itchy, older adults, mouth spared; DPP-4 inhibitor link.</b>",
"Pathophysiology|OB: Preeclampsia mechanism|Shallow placental invasion leaves spiral arteries narrow; the ischaemic placenta releases sFlt-1 and soluble endoglin, damaging maternal endothelium. <b>Magnesium prevents seizures (calcium gluconate reverses toxicity); delivery cures; low-dose aspirin from 12 weeks prevents.</b>",
"Pathophysiology|OB: HELLP vs acute fatty liver of pregnancy|HELLP: haemolysis, raised liver enzymes, low platelets; liver haematoma risk. <b>AFLP: mitochondrial fatty acid oxidation failure (fetal LCHAD), liver failure with hypoglycaemia, high ammonia, coagulopathy.</b> Both: prompt delivery.",
"Cardiology|Heart failure classes by LVEF|HFrEF: LVEF ≤40%. HFimpEF: previous LVEF ≤40%, now >40%. HFmrEF: 41–49%. HFpEF: ≥50%. <b>Mildly reduced and preserved both need evidence of raised filling pressures.</b> <i>[2022 AHA/ACC/HFSA HF guideline]</i>",
"Cardiology|HFrEF: which RAS inhibitor?|<b>ARNi is first-line</b> (Class 1). ACEi when an ARNi is not feasible; ARB if ACEi-intolerant. A patient doing well on an ACEi or ARB should still be <b>switched to an ARNi</b> for further risk reduction (Class 1). <i>[2022 AHA/ACC/HFSA HF guideline]</i>",
"Cardiology|HFrEF: MRA criteria|Recommended in NYHA II–IV <b>if eGFR >30 mL/min/1.73 m² and potassium <5.0 mEq/L</b>. <i>[2022 AHA/ACC/HFSA HF guideline]</i>",
"Cardiology|HFrEF: SGLT2 inhibitor|Class 1 in symptomatic chronic HFrEF <b>irrespective of type 2 diabetes</b>. <i>[2022 AHA/ACC/HFSA HF guideline]</i>",
"Cardiology|HFmrEF drug therapy|SGLT2 inhibitor <b>Class 2a</b>. ARNi/ACEi/ARB, MRA and beta-blocker <b>Class 2b</b>. <i>[2022 AHA/ACC/HFSA HF guideline]</i>",
"Cardiology|HFpEF drug therapy|SGLT2 inhibitor <b>Class 2a</b>; MRA 2b; ARNi 2b. Routine nitrates or PDE5 inhibitors: <b>Class 3, No Benefit</b>. <i>[2022 AHA/ACC/HFSA HF guideline]</i>",
"Cardiology|HFimpEF: can GDMT be stopped?|<b>No — continue GDMT even if asymptomatic.</b> In TRED-HF about 44% relapsed into dilated cardiomyopathy within 6 months of stopping. <i>[2022 AHA/ACC/HFSA HF guideline]</i>",
"Cardiology|AF: role of bleeding risk scores|<b>Do not use a bleeding score alone</b> to decide whether a patient gets an anticoagulant. Use it to find and modify bleeding risk factors. <i>[2023 ACC/AHA/ACCP/HRS AF guideline]</i>",
"Cardiology|Device-detected AF (AHRE)|≥24 h with CHA₂DS₂-VASc ≥2 → <b>reasonable</b> to anticoagulate (shared decision). 5 min to 24 h with score ≥3 → <b>may be reasonable</b>. <5 min and no other indication → <b>no anticoagulant</b>. <i>[2023 ACC/AHA/ACCP/HRS AF guideline]</i>",
"Cardiology|Left atrial appendage occlusion|CHA₂DS₂-VASc ≥2 with a contraindication to long-term anticoagulation → percutaneous LAAO <b>Class 2a</b>. Moderate–high stroke risk with high bleeding risk on anticoagulation → may be a reasonable alternative (<b>Class 2b</b>). <i>[2023 ACC/AHA/ACCP/HRS AF guideline]</i>",
"Cardiology|AF: catheter ablation as first-line|<b>Class 1</b> first-line in selected patients (generally younger, few comorbidities) with symptomatic paroxysmal AF, and <b>Class 1 in appropriate patients with AF and HFrEF</b>. <i>[2023 ACC/AHA/ACCP/HRS AF guideline]</i>",
"Cardiology|AF: risk-factor modification|A pillar of AF care: weight loss if BMI >27, exercise toward <b>210 min/week</b>, stop tobacco, minimise alcohol, control BP, screen for sleep-disordered breathing. <i>[2023 ACC/AHA/ACCP/HRS AF guideline]</i>",
"Cardiology|ACS: default antiplatelet strategy|Aspirin plus an oral P2Y12 inhibitor for <b>at least 12 months</b> if not at high bleeding risk (Class 1). <b>Ticagrelor or prasugrel preferred over clopidogrel</b> in patients undergoing PCI (Class 1). <i>[2025 ACC/AHA ACS guideline]</i>",
"Cardiology|NSTE-ACS: upstream P2Y12 inhibitor|If angiography is <b>more than 24 hours away</b>, upstream clopidogrel or ticagrelor may be considered to reduce MACE. <i>[2025 ACC/AHA ACS guideline]</i>",
"Cardiology|ACS: reducing bleeding on antiplatelets|PPI if at risk of GI bleeding. Tolerating ticagrelor → switch to <b>ticagrelor monotherapy ≥1 month after PCI</b> (Class 1). On long-term anticoagulation → <b>stop aspirin 1–4 weeks after PCI</b> and keep a P2Y12 inhibitor, preferably clopidogrel. <i>[2025 ACC/AHA ACS guideline]</i>",
"Cardiology|ACS with reported aspirin allergy|<b>Aspirin desensitisation is preferred</b> so that DAPT can start. <i>[2025 ACC/AHA ACS guideline]</i>",
"Cardiology|ACS: PCI technique|<b>Radial over femoral access</b> to reduce bleeding, vascular complications and death. Intravascular imaging to guide PCI of complex lesions. <i>[2025 ACC/AHA ACS guideline]</i>",
"Cardiology|ACS: how much to revascularise|<b>Complete revascularisation</b> is recommended in STEMI and NSTE-ACS. <b>Cardiogenic shock: culprit vessel only</b> — routine PCI of non-infarct arteries at the same time is Class 3: Harm. <i>[2025 ACC/AHA ACS guideline]</i>",
"Cardiology|ACS with anaemia: transfusion|Not actively bleeding → transfusing to a haemoglobin of about <b>10 g/dL</b> may be reasonable. <i>[2025 ACC/AHA ACS guideline]</i>",
"Lipids|Lipid lowering after ACS|<b>High-intensity statin for all</b> (Class 1). On maximal statin with <b>LDL-C ≥70</b> → add a non-statin (ezetimibe, evolocumab, alirocumab, inclisiran, bempedoic acid), Class 1. LDL-C <b>55 to <70</b> → further intensification reasonable (2a). Starting ezetimibe with the statin may be considered (2b). <i>[2025 ACC/AHA ACS guideline]</i>",
"Lipids|Follow-up after ACS lipid therapy|<b>Lipid panel 4–8 weeks</b> after starting or changing therapy, and refer to cardiac rehabilitation. <i>[2025 ACC/AHA ACS guideline]</i>",
"Preventive Medicine|Hypertension screening (USPSTF)|Screen all adults ≥18 with office BP, and <b>confirm with out-of-office readings before starting treatment</b> (Grade A). <i>[USPSTF]</i>",
"Pulmonary|CAP: site-of-care tool|A validated rule plus clinical judgment, <b>preferably the PSI</b> (strong, moderate quality). CURB-65 is only a conditional, low-quality recommendation. <i>[2019 ATS/IDSA CAP guideline]</i>",
"Pulmonary|CAP: who goes straight to the ICU|Patients <b>needing vasopressors or mechanical ventilation</b> (strong). Everyone else: the IDSA/ATS 2007 minor severity criteria plus judgment decide higher-intensity care. <i>[2019 ATS/IDSA CAP guideline]</i>",
"Pulmonary|CAP: clinical stability|Normal heart rate, respiratory rate, BP, oxygen saturation and temperature, <b>able to eat, normal mentation</b>. Most patients get there in 48–72 hours. <i>[2019 ATS/IDSA CAP guideline]</i>",
"Pulmonary|COPD: making the diagnosis|<b>Post-bronchodilator FEV₁/FVC <0.70 is mandatory</b>, in the right clinical context. Pre-bronchodilator spirometry can be used to <b>exclude</b> COPD. <i>[GOLD 2026]</i>",
"Pulmonary|COPD exacerbation: definition and mimics|Worse dyspnoea and/or cough and sputum over <b>up to 14 days</b>, ± tachypnoea and tachycardia. Graded mild, moderate or severe (Rome proposal). <b>Exclude pneumonia, PE, acute heart failure and pneumothorax.</b> <i>[GOLD 2026]</i>",
"Pulmonary|After a COPD exacerbation|Start long-acting bronchodilators <b>as soon as possible</b>. At discharge, consider adding ICS to dual bronchodilators if <b>≥1 moderate/severe exacerbation and raised blood eosinophils</b>. Recovery takes up to 4–6 weeks. <i>[GOLD 2026]</i>",
"Pulmonary|COPD case-finding vs lung cancer screening|GOLD recommends <b>targeted spirometry case-finding</b>, not universal spirometry screening. Lung cancer, by contrast, has a screening programme (annual LDCT). <i>[GOLD 2026; USPSTF]</i>",
"Pulmonary|Asthma: when to start ICS|<b>As soon as possible after diagnosis.</b> Early low-dose ICS gives better lung function than starting after 2–4 years of symptoms. <i>[GINA 2026]</i>",
"Pulmonary|Asthma: preferred reliever|Every patient needs a rapid-acting reliever. <b>Low-dose ICS-formoterol is preferred</b>, because it cuts severe exacerbations compared with a SABA reliever. <i>[GINA 2026]</i>",
"Pulmonary|SABA overuse thresholds|≥3 200-dose canisters a year → more severe exacerbations. <b>≥12 canisters a year → higher risk of asthma death.</b> Home nebulised SABA is also linked to asthma death. <i>[GINA 2026]</i>",
"Pulmonary|GINA Track 1 steps|Reliever is low-dose ICS-formoterol. <b>Steps 1–2: as-needed ICS-formoterol. Steps 3–4: maintenance-and-reliever therapy (MART)</b> with the same inhaler. Step 5: refer for expert add-on therapy. <i>[GINA 2026]</i>",
"Pulmonary|GINA Track 2|When ICS-formoterol is unavailable: ICS-SABA reliever, or <b>ICS taken whenever SABA is taken</b>, plus daily maintenance ICS. Track 1 is preferred — fewer severe exacerbations, similar control, simpler. <i>[GINA 2026]</i>",
"Pulmonary|Stepping down asthma treatment|After <b>2–3 months</b> of good control, cut the maintenance ICS dose by <b>25–50%</b>. <b>Never stop ICS completely</b> in adults or adolescents. <i>[GINA 2026]</i>",
"Pulmonary|Asthma: spirometry and reversibility|Spirometry for all patients (except preschool children or life-threatening attacks), and again before discharge. Bronchodilator response: <b>≥12% and ≥200 mL</b>. A >10%-predicted rule would under-diagnose asthma, especially in young males. <i>[GINA 2026]</i>",
"Pulmonary|PE clinical categories (2026)|<b>A</b> subclinical, incidental. <b>B</b> symptomatic, low severity score (PESI I–II, sPESI 0, Hestia 0). <b>C</b> symptomatic, elevated score (PESI III–V, sPESI ≥1, Hestia ≥1). <b>D</b> incipient cardiopulmonary failure (e.g. normotensive shock). <b>E</b> cardiopulmonary failure (persistent hypotension or shock). Respiratory modifier R. Replaces massive/submassive. <i>[2026 AHA/ACC multisociety PE guideline]</i>",
"Pulmonary|PE: disposition by category|<b>A: home from the ED. B: early discharge. C, D, E: hospitalise.</b> PE response teams are recommended. <i>[2026 AHA/ACC multisociety PE guideline]</i>",
"Pulmonary|PE: advanced therapies|Systemic thrombolysis, catheter thrombolysis, mechanical thrombectomy or surgical embolectomy: <b>reasonable in E1, can be considered in D1–2</b>. <i>[2026 AHA/ACC multisociety PE guideline]</i>",
"Pulmonary|PE: choice of anticoagulant|<b>LMWH over unfractionated heparin</b> for initial parenteral therapy. <b>DOAC over VKA</b> unless contraindicated. <i>[2026 AHA/ACC multisociety PE guideline]</i>",
"Pulmonary|PE: extended anticoagulation|Beyond the first 3–6 months is recommended after a first PE <b>without a major reversible risk factor</b>, and with a <b>persistent</b> risk factor. <i>[2026 AHA/ACC multisociety PE guideline]</i>",
"Pulmonary|PE anticoagulation: special cases|<b>Pregnancy: no DOAC or VKA. Breastfeeding: no DOAC.</b> Thrombotic antiphospholipid syndrome: VKA preferred. <i>[2026 AHA/ACC multisociety PE guideline]</i>",
"Pulmonary|After PE: screening for CTEPD|Ask about symptoms and functional limits <b>at every visit for at least 1 year</b> to detect chronic thromboembolic pulmonary disease. <i>[2026 AHA/ACC multisociety PE guideline]</i>",
"Pulmonary|PE severity scores|PESI classes I–V. <b>sPESI 0 = low risk; ≥1 = high 30-day mortality risk.</b> Hestia negative → consider outpatient care. Also Bova, CPES, shock index. <i>[2026 AHA/ACC multisociety PE guideline]</i>",
"Pulmonary|ARDS: lung-protective ventilation|Tidal volume <b>4–8 mL/kg predicted body weight</b> and <b>plateau <30 cmH₂O</b> (strong). Start at 6 mL/kg; may go up to 8 for double-triggering or airway pressure below PEEP. <i>[ATS 2023; ATS/ESICM/SCCM 2017; ESICM 2023]</i>",
"Pulmonary|Predicted body weight|Men: 50 + 0.91 × (height cm − 152.4). Women: 45.5 + 0.91 × (height cm − 152.4). <i>[ATS/ESICM/SCCM 2017]</i>",
"Pulmonary|ARDS: prone positioning|<b>More than 12 hours a day in severe ARDS</b> (strong, moderate certainty). <i>[ATS 2023; ATS/ESICM/SCCM 2017]</i>",
"Pulmonary|ARDS: HFOV, PEEP and recruitment|<b>Do not routinely use high-frequency oscillatory ventilation</b> in moderate or severe ARDS (strong, high certainty). Higher PEEP and recruitment manoeuvres are only conditional. <i>[ATS 2023]</i>",
"Neuro|Adjuncts given with thrombolysis|Argatroban or eptifibatide alongside IV thrombolysis: <b>no benefit, not recommended</b>. <i>[2026 AHA/ASA AIS guideline]</i>",
"Neuro|Thrombectomy: large cores and tirofiban|Within 6 h with <b>ASPECTS 0–2</b> → reasonable (2a). 6–24 h, age <80, NIHSS ≥6, mRS 0–1, <b>ASPECTS 3–5</b>, no major mass effect → Class 1. Tirofiban before EVT: <b>No Benefit</b>. <i>[2026 AHA/ASA AIS guideline]</i>",
"Neuro|Large hemispheric infarct: glibenclamide|IV glibenclamide is <b>Class 3: No Benefit</b>. <i>[2026 AHA/ASA AIS guideline]</i>",
"Neuro|Stroke door-to-needle target|<b>≤60 minutes.</b> <i>[AHA Target: Stroke]</i>",
"Neuro|DAPT at 24–72 hours|Minor stroke (NIHSS ≤5) or high-risk TIA with a <b>presumed atherosclerotic cause (≥50% stenosis)</b>, 24–72 h out → clopidogrel + aspirin for 21 days, then single antiplatelet (2a). <i>[2026 AHA/ASA AIS guideline]</i>",
"Neuro|Ticagrelor after minor stroke or TIA|Ticagrelor + aspirin for 30 days may be considered (NIHSS ≤5, ABCD² ≥6 or ≥50% stenosis), 2b. <b>CYP2C19 loss-of-function carriers: ticagrelor + aspirin for 21 days</b>, then ticagrelor alone, over clopidogrel (2b). <i>[2026 AHA/ASA AIS guideline]</i>",
"Neuro|Antithrombotic combinations to avoid after stroke|<b>Triple antiplatelet therapy</b> (aspirin + clopidogrel + dipyridamole): Harm. Stroke with AF and no active CAD or recent stent: <b>adding an antiplatelet to the anticoagulant</b> is potentially harmful. Long-term DAPT is not recommended. <i>[2026 AHA/ASA AIS guideline; 2021 AHA/ASA secondary prevention guideline]</i>",
"Neuro|ICH blood pressure (2022 AHA/ASA)|Smooth, sustained control. <b>Start within 2 h of onset, reach target within 1 h</b> (2a). Mild–moderate ICH with SBP 150–220: target 140, keep 130–150 (2b). <b>Lowering below 130 is potentially harmful.</b> Not established in large or surgical ICH. The 2025 BP guideline says 130 to <140 for ≥7 days. <i>[2022 AHA/ASA ICH guideline]</i>",
"Neuro|Anticoagulant-associated ICH: first step|<b>Stop the anticoagulant and reverse it immediately</b>, without waiting for the INR or other coagulation results (Class 1). <i>[2022 AHA/ASA ICH guideline]</i>",
"Neuro|Warfarin-associated ICH|INR ≥2.0: <b>4-factor PCC over fresh frozen plasma</b> (Class 1), with IV vitamin K straight after. INR 1.3–1.9: PCC may be reasonable (2b). <i>[2022 AHA/ASA ICH guideline]</i>",
"Neuro|DOAC-associated ICH|Factor Xa inhibitor: <b>andexanet alfa</b> (2a). Dabigatran: <b>idarucizumab</b> (2a). Without these: aPCC or 4-factor PCC; dialysis lowers dabigatran levels. <i>[2022 AHA/ASA ICH guideline]</i>",
"Neuro|ICH: treatments that do not help|Prophylactic steroids and continuous hyperosmolar therapy: no benefit. <b>Platelet transfusion</b> outside surgery or severe thrombocytopenia: worse outcome. Prophylactic antiseizure drugs: no benefit. Compression stockings alone: ineffective DVT prophylaxis. <i>[2022 AHA/ASA ICH guideline]</i>",
"Neuro|ICH: when to operate|Cerebellar haemorrhage: immediate evacuation for <b>volume >15 mL</b>, deterioration, brainstem compression or hydrocephalus. Minimally invasive evacuation of supratentorial or intraventricular bleeds lowers mortality; functional benefit unproven. <i>[2022 AHA/ASA ICH guideline]</i>",
"Neuro|Status epilepticus timeline|0–5 min: stabilise. <b>5–20 min: benzodiazepine</b> (Level A). 20–40 min: second therapy. 40+ min: third therapy. <i>[AES 2016 guideline]</i>",
"Neuro|Status epilepticus: benzodiazepine doses|<b>IM midazolam</b> 10 mg if >40 kg (5 mg if 13–40 kg), once. <b>IV lorazepam</b> 0.1 mg/kg, max 4 mg, may repeat once. <b>IV diazepam</b> 0.15–0.2 mg/kg, max 10 mg, may repeat once. Alternatives: IV phenobarbital 15 mg/kg; rectal diazepam, intranasal or buccal midazolam. <i>[AES 2016 algorithm]</i>",
"Neuro|Status epilepticus: benzodiazepine pitfalls|Give one <b>adequate full dose</b>, do not split it, and do not repeat more than once. <b>No IV access: IM midazolam beats IV lorazepam</b> (Level A). <i>[AES 2016 guideline]</i>",
"Neuro|Status epilepticus: second therapy|One dose of <b>fosphenytoin 20 mg PE/kg</b> (max 1500), <b>valproate 40 mg/kg</b> (max 3000) or <b>levetiracetam 60 mg/kg</b> (max 4500). Equivalent in ESETT. Phenobarbital 15 mg/kg if none available. <i>[AES 2016 algorithm; ESETT]</i>",
"Neuro|Status epilepticus: third therapy|Repeat second-line or <b>anaesthetic doses</b> of thiopental, midazolam, pentobarbital or propofol, <b>with continuous EEG</b>. Each later therapy works less well, so treat hard early. <i>[AES 2016 guideline]</i>",
"ID & Sepsis|Meningitis: antibiotic timing|As soon as possible and <b>within 1 hour</b> (ESCMID grade A; NICE: within 1 h of arrival). If LP is delayed for CT, give empiric therapy now. <b>Blood cultures first</b>; LP before antibiotics only if safe and quick. <i>[ESCMID 2016; NICE NG240; IDSA 2004]</i>",
"ID & Sepsis|Meningitis: CT before LP?|ESCMID: <b>focal deficit (not cranial nerve palsy), new seizures, GCS <10, or severe immunocompromise</b>; otherwise no routine imaging. NICE: image only for space-occupying lesion risk or raised ICP (new focal signs, abnormal pupils, GCS ≤9 or falling). <i>[ESCMID 2016; NICE NG240]</i>",
"ID & Sepsis|Meningitis: empiric antibiotics|<b>Vancomycin + ceftriaxone (or cefotaxime).</b> Add <b>ampicillin</b> for Listeria, e.g. gram-positive rods on Gram stain. <i>[IDSA 2004]</i>",
"ID & Sepsis|Meningitis: dexamethasone|IDSA: <b>0.15 mg/kg every 6 h for 2–4 days</b>, first dose 10–20 min before or with the first antibiotic, for suspected pneumococcal meningitis. NICE: continue only for pneumococcus or Hib; <b>never delay antibiotics for it</b>. <i>[IDSA 2004; NICE NG240]</i>",
"Neuro|Guillain-Barré: when to treat|<b>Unable to walk unaided</b> (GBS disability score ≥3). Consider if still walking but rapidly worsening, or with autonomic or bulbar involvement. <i>[EAN/PNS 2023 GBS guideline]</i>",
"Neuro|Guillain-Barré: IVIG or plasma exchange|IVIG 0.4 g/kg/day for 5 days within 2 weeks; plasma exchange 12–15 L in 4–5 exchanges over 1–2 weeks within 4 weeks. <b>No preference — equal efficacy.</b> <i>[EAN/PNS 2023 GBS guideline]</i>",
"Neuro|Guillain-Barré: do-not-do list|<b>No second IVIG course</b>, <b>no oral steroids</b> (IV steroids weakly against), <b>no plasma exchange followed by IVIG</b>, and no switching for slow response. Pain: gabapentinoids, TCAs or carbamazepine. <i>[EAN/PNS 2023 GBS guideline]</i>",
"Neuro|Guillain-Barré: prognosis tools|mEGOS predicts outcome; mEGRIS predicts need for ventilation. <b>Still progressing after 8 weeks → think acute-onset CIDP</b> (about 5%). <i>[EAN/PNS 2023 GBS guideline]</i>",
"Neuro|Plasma exchange in neurology|Established for <b>severe GBS</b> (Level A), probably effective in mild GBS (B). <b>Ineffective in chronic or secondary progressive MS</b> (A). <i>[AAN plasmapheresis guideline]</i>",
"Pulmonary|CAP: duration (2019 ATS/IDSA)|Guided by clinical stability: continue until stable and for <b>no less than 5 days in total</b> (strong, moderate). <b>7 days for MRSA or Pseudomonas.</b> Switch IV to oral using the same agent or class. <i>[2019 ATS/IDSA CAP guideline]</i>",
"Endocrine|Metformin and kidney function|Do not start if eGFR is below 45; reduce the dose below 45; <b>stop below 30</b>. Still the usual first glucose-lowering drug when no comorbidity steers the choice. <i>[ADA Standards of Care 2026]</i>",
"Endocrine|SGLT2i or GLP-1 RA by comorbidity|ASCVD or high risk → GLP-1 RA and/or SGLT2i. <b>Heart failure (HFrEF or HFpEF) → SGLT2i.</b> CKD (eGFR 20–60 or albuminuria) → SGLT2i or GLP-1 RA; <b>GLP-1 RA preferred at eGFR below 30</b>. Obesity with HFpEF → GLP-1 RA or GIP/GLP-1 RA. MASH → GLP-1 RA. All irrespective of A1c. <i>[ADA Standards of Care 2026]</i>",
"Endocrine|When to start insulin in type 2 diabetes|A1c above 10%, glucose 300 mg/dL or more, or symptomatic hyperglycaemia — whatever the other therapy. <b>Keep existing glucose-lowering drugs when insulin starts</b> unless contraindicated. <i>[ADA Standards of Care 2026]</i>",
"Fluids, DKA & Electrolytes|DKA and HHS resolution criteria|DKA: ketones <b>below 0.6 mmol/L</b> and venous pH 7.3 or more or bicarbonate 18 or more, ideally glucose below 200. <b>Do not use the anion gap or urine ketones.</b> HHS: osmolality below 300, glucose corrected, urine output above 0.5 mL/kg/h, better mentation. <i>[2024 ADA hyperglycaemic crises consensus]</i>",
"Fluids, DKA & Electrolytes|Insulin rate once glucose falls|DKA: fixed 0.1 units/kg/h, then <b>0.05 units/kg/h once glucose is below 250</b>, with dextrose added. HHS with significant ketonaemia (beta-hydroxybutyrate 3.0 or more, pH below 7.30 or bicarbonate below 18) → treat as mixed DKA/HHS at 0.1. <i>[2024 ADA hyperglycaemic crises consensus]</i>",
"Fluids, DKA & Electrolytes|Total-body potassium in DKA|Deficit 3–6 mmol/kg despite a normal or high serum level. Usual replacement 20–30 mmol per litre of fluid. Check potassium 2 h after insulin starts, then every 4 h. <b>Potassium 2.5 or lower roughly triples mortality.</b> <i>[2024 ADA hyperglycaemic crises consensus]</i>",
"Endocrine|Levothyroxine dosing|Levothyroxine alone — no routine T3, thyroid extract or compounded hormone. <b>Under 65 without CVD: 1.6 mcg/kg/day. 65 or older or CVD: 25–50 mcg/day and titrate.</b> TSH every 3 months until stable, then yearly; it can take 6 months to normalise. Subclinical with TSH below 10: individualise. <i>[ATA 2014 hypothyroidism; NICE NG145]</i>",
"Endocrine|Graves disease treatment choice|Antithyroid drugs, radioactive iodine and surgery are all options. <b>RAI is first-line definitive therapy</b> unless remission on drugs is likely or RAI is unsuitable (compression, suspected cancer, pregnancy within 4–6 months, active eye disease). CBC and LFTs before antithyroid drugs. PTU in the first trimester or after a carbimazole reaction. <i>[2016 ATA thyrotoxicosis guideline]</i>",
"Endocrine|Thyroid storm details|Clinical diagnosis; Burch-Wartofsky 45 or more → aggressive therapy, 25–44 → judgement. Beta-blocker, <b>PTU preferred</b> (blocks T4 to T3), iodide at least 1 h later, steroids, cooling with <b>acetaminophen, not aspirin</b> (aspirin frees T4), fluids, ICU. Mortality 8–25%. <i>[2016 ATA thyrotoxicosis guideline]</i>",
"Endocrine|Thyroid nodule: when to FNA|Ultrasound with a neck node survey for every nodule. <b>High or intermediate suspicion (hypoechoic solid): FNA at 1 cm. Low suspicion (iso- or hyperechoic solid): 1.5 cm. Very low (spongiform): consider at 2 cm. Purely cystic: no biopsy.</b> <i>[2015 ATA thyroid nodule guideline]</i>",
"Endocrine|Bethesda malignancy risk|Benign under 3% · AUS/FLUS 5–15% · follicular neoplasm 15–30% · suspicious for malignancy 60–75% · malignant 97–99%. <i>[2015 ATA thyroid nodule guideline]</i>",
"Endocrine|Adrenal insufficiency diagnosis|Think of it with unexplained volume depletion, hypotension, low sodium, high potassium, fever, abdominal pain, pigmentation or hypoglycaemia. <b>Crisis → IV stress-dose hydrocortisone before results.</b> 250 mcg cosyntropin test: peak cortisol below 18 mcg/dL (500 nmol/L) = AI. ACTH above twice normal = primary; check renin and aldosterone. <i>[Endocrine Society 2016 adrenal insufficiency]</i>",
