"Cardiovascular Medicine|CAD: Long-term antiplatelet therapy after ACS|• <b>Aspirin 81 mg lifelong</b><br>• <b>DAPT for 12 months</b> in most (prasugrel or ticagrelor preferred with PCI)<br>• High bleeding risk: de-escalate after ~1 month (ticagrelor monotherapy, or switch to clopidogrel)<br>• Extend beyond 1 year if high ischemic risk (low EF, vein graft stent, diabetes) and acceptable bleeding risk<br>• ACS needing oral anticoagulation: clopidogrel as the single antiplatelet up to 1 year <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: Other long-term care after ACS|• High-intensity statin indefinitely<br>• β-blocker long term if low EF or angina (may stop otherwise)<br>• ACEI/ARB indefinitely with LV dysfunction; helpful in diabetes<br>• <b>Avoid NSAIDs</b><br>• <b>No primary-prevention ICD within 40 days of MI or 3 months of revascularization</b> (reassess EF later); wearable defibrillator not routinely beneficial (VEST)<br>• Screen for <b>depression</b> (CBT, SSRIs) <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: Cardiac rehabilitation and return to activity after MI|• Refer <b>every</b> ACS patient to cardiac rehab: ↓ mortality, ↑ function, adherence, risk factors<br>• Home-based rehab fine if low risk (≤75 y, NYHA I–II, normal EF, no arrhythmia)<br>• Sex: ~<b>2 weeks</b> after uncomplicated MI in fit patients, ~<b>6 weeks</b> after large MI<br>• Erectile dysfunction is common; PDE-5 inhibitors safe if <b>not on nitrates</b> <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: MINOCA: definition and main causes|MI with <b>no obstructive CAD</b> (&lt;50% stenosis):<br>• <b>Spontaneous coronary artery dissection</b><br>• <b>Coronary vasospasm</b><br>• <b>Microvascular dysfunction</b> (cardiac syndrome X)<br>• <b>Stress (takotsubo) cardiomyopathy</b><br><b>No</b> fibrinolysis or stenting for these. <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: Spontaneous coronary artery dissection (SCAD)|• <b>Young women</b>, <b>peripartum</b> (also fibromuscular dysplasia, extreme stress)<br>• Intramural hematoma compresses the true lumen → ACS, even STEMI<br>• Diagnose at angiography (high suspicion)<br>• Manage <b>conservatively</b> (vessels usually heal); manipulation can extend dissection<br>• PCI/CABG only if high-risk anatomy or instability <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: Coronary vasospasm|• Spontaneous (often <b>at night</b>, at rest) or drug-triggered: <b>cocaine, methamphetamine, 5-fluorouracil, bromocriptine</b><br>• ECG may mimic STEMI<br>• Diagnosis of exclusion (angiography to rule out fixed disease); provocation testing rarely needed<br>• Treat: <b>calcium channel blockers</b> ± nitrates <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: Cocaine-associated chest pain/ACS: management|• <b>Benzodiazepines</b>, <b>nitrates</b>, <b>calcium channel blockers</b>, aspirin<br>• <b>Withhold β-blockers</b> until cocaine effect has worn off (unopposed α-stimulation → more spasm and HTN)<br>• Persistent HTN despite vasodilators: <b>labetalol</b> (mixed α/β) can be considered <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: Cardiac syndrome X (microvascular angina)|• Anginal pain with normal or nonobstructive (&lt;50%) coronaries<br>• Likely <b>microvascular dysfunction</b>; common in <b>women</b>, may carry worse outcomes<br>• Treat: β-blockers, CCBs, nitrates, <b>ranolazine</b> <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: Stress (takotsubo) cardiomyopathy|• Mostly <b>women</b> (postmenopausal), after emotional or physical stress<br>• Looks like MI: chest pain/dyspnea, anterior <b>ST elevation</b> or deep T inversions, troponin rise<br>• Angiography: no significant stenosis; echo/ventriculogram: <b>mid and apical ballooning</b> with basal sparing (variants exist)<br>• Supportive: β-blocker, ACEI/ARB; LV function <b>recovers in weeks–months</b> <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: Silent ischemia|Objective reversible ischemia (exercise ST depression, perfusion or wall motion defect) without symptoms. Worse prognosis, especially with known heart disease → treat with secondary prevention (<b>aspirin, statin</b>). <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: CAD in adults older than 75|• More prevalent and extensive disease; exercise testing often limited<br>• Often undertreated (antiplatelets, β-blockers, ACEI, statins) and less often revascularized<br>• Lifestyle, antiplatelets, lipid lowering, BP and glucose control still benefit at suitable risk; lipid treatment reduces events and disability <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: CAD in diabetes: key management points|• 2–3× CAD risk; atypical symptoms (dyspnea, nausea) common<br>• <b>Do not screen</b> asymptomatic patients with stress testing<br>• BP goal <b>&lt;130/80</b>; <b>ACEI/ARB</b> preferred; β-blocker for CAD<br>• <b>High-intensity statin</b> regardless of LDL; icosapent ethyl if TG 135–499 on statin; no fibrate/niacin add-on<br>• Aspirin 75–162 mg; rivaroxaban 2.5 bid + aspirin an option if low bleeding risk<br>• <b>SGLT2i and/or GLP-1 RA</b> with proven CV benefit (may combine)<br>• Multivessel CAD → <b>CABG</b> favored (fewer repeat procedures; lower death/MI/stroke) <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|HF: EF categories and common causes|• <b>HFrEF</b>: LVEF <b>≤40%</b>. Causes: <b>CAD</b> (#1 in US, &gt;50%), HTN, obesity, diabetes, valve disease<br>• <b>HFmrEF</b>: LVEF <b>41–49%</b> with symptoms (10–25% of HF)<br>• <b>HFpEF</b>: LVEF <b>≥50%</b>; stiff LV, impaired relaxation. Causes: <b>HTN</b> (#1), aging, obesity, diabetes, AF, CAD; <b>ATTR amyloid in &gt;10%</b><br>• Improved EF (was low, now better): <b>continue all GDMT</b> <i>[MKSAP CV: Heart Failure]</i>",
"Cardiovascular Medicine|HF: Neurohormonal activation in HFrEF and why it matters|• <b>RAAS</b>: angiotensin II → vasoconstriction, thirst; aldosterone → Na and water retention<br>• <b>Sympathetic</b>: ↑ HR, contractility, vascular resistance<br>• Both → <b>vasopressin</b> → more water retention<br>Adaptive short term; long term → <b>remodeling</b> (myocyte damage, LV dilation, falling EF). GDMT works by blocking these systems. <i>[MKSAP CV: Heart Failure]</i>",
"Cardiovascular Medicine|HF: Preventing HF in stage A (at risk)|• Biggest modifiable risks: <b>hypertension</b> and <b>diabetes</b><br>• BP goal <b>&lt;130/80</b>; each 10 mm Hg ↓ SBP → ~28% ↓ HF incidence<br>• Diabetes: <b>metformin</b> and/or <b>SGLT2 inhibitor</b><br>• Weight loss, exercise, stop smoking<br>• BNP screening + team-based care may prevent LV dysfunction (no standard yet)<br>• Risk tools: PCP-HF (uses race) → PREVENT preferred <i>[MKSAP CV: Heart Failure]</i>",
"Cardiovascular Medicine|HF: ACC/AHA stages vs NYHA classes|<b>Stages (only move forward)</b>:<br>• A: at risk (HTN, diabetes, CAD, obesity), no structural disease<br>• B: structural disease/low EF, <b>no symptoms</b><br>• C: structural disease <b>with symptoms</b><br>• D: refractory, advanced HF<br><b>NYHA (can go up or down)</b>: I no limitation • II slight • III marked (IIIA less than ordinary activity, IIIB minimal exertion) • IV symptoms at rest/any activity <i>[MKSAP CV: Heart Failure]</i>",
"Cardiovascular Medicine|HF: Symptoms and signs of congestion vs low output|<b>Congestion</b>: dyspnea → orthopnea → PND; weight gain; <b>bendopnea</b>; ↑ JVP, crackles, S3, ascites, edema. Most present with congestion + normal output.<br><b>Low output (\"cold\")</b>: hypotension or BP far below usual, <b>narrow pulse pressure</b>, cool extremities, confusion, worsening kidney/liver function (which can also be from congestion). <i>[MKSAP CV: Heart Failure]</i>",
"Cardiovascular Medicine|HF: BNP and NT-proBNP: cut-offs and confounders|<b>BNP</b>: &lt;<b>100</b> → HF unlikely (NPV 90–97%); &gt;<b>400</b> → HF likely; 100–400 gray zone. Lower in HFpEF than HFrEF.<br><b>NT-proBNP</b>: &lt;<b>300</b> → HF very unlikely; HF likely if &gt;450 (&lt;50 y), &gt;900 (50–75 y), &gt;1800 (&gt;75 y).<br><b>Falsely high</b>: CKD, older age, sepsis, <b>sacubitril-valsartan</b> (raises BNP, not NT-proBNP), female sex.<br><b>Falsely low</b>: <b>obesity</b>. <i>[MKSAP CV: Heart Failure]</i>",
"Cardiovascular Medicine|HF: Initial work-up of new heart failure|• <b>ECG</b> (prior MI, arrhythmia, LVH) and <b>chest x-ray</b> (cardiomegaly, congestion, <b>Kerley B lines</b>, effusions; or a lung cause)<br>• Labs: CBC, electrolytes, kidney and liver tests, glucose, lipids, <b>TSH</b> (thyroid disease is reversible), <b>iron studies</b> (hemochromatosis, iron deficiency)<br>• <b>Echocardiogram</b> = key test: EF, chamber size, wall thickness, valves, wall motion<br>• Diagnosis = EF + evidence of high filling pressure (JVP, BNP, echo, or cath)<br>• Evaluate for <b>CAD</b> in all (stress test or angiography by risk/symptoms) <i>[MKSAP CV: Heart Failure]</i>",
"Cardiovascular Medicine|HF: When is cardiac MRI useful in heart failure?|Not routine. Use for poor echo windows or a specific suspected cause: <b>myocarditis</b>, <b>infiltrative</b> disease (amyloid, sarcoid, hemochromatosis), <b>hypertrophic cardiomyopathy</b>. <i>[MKSAP CV: Heart Failure]</i>",
"Cardiovascular Medicine|HF: Less common causes of HF and their clues|• <b>Cardiotoxins</b>: chemotherapy, hydroxychloroquine, ADHD stimulants, <b>immune checkpoint inhibitors</b><br>• <b>Infection</b>: HIV, COVID-19, <b>Chagas</b><br>• <b>Tachycardia-mediated</b>: persistent atrial tachyarrhythmia or <b>PVCs &gt;10%</b> of beats<br>• <b>Amyloid</b>: LVH on echo but <b>low ECG voltage</b>, neuropathy, <b>carpal tunnel</b><br>• Hemochromatosis (diabetes, bronze skin); sarcoid (AV block, VT, lymphadenopathy)<br>• Peripartum; stress cardiomyopathy; alcohol, cocaine, methamphetamine; familial (3-generation history) <i>[MKSAP CV: Heart Failure]</i>",
"Cardiovascular Medicine|HF: Ischemic cardiomyopathy: does revascularization help?|CAD causes &gt;50% of US HF → evaluate all new HF for CAD. Revascularize for angina or other indications, but a recent trial found <b>no reduction in death or HF hospitalization</b> from PCI vs medical therapy in ischemic cardiomyopathy with viable myocardium. <i>[MKSAP CV: Heart Failure]</i>",
"Cardiovascular Medicine|HF: The four pillars of GDMT for symptomatic HFrEF|1. <b>ARNI</b> (sacubitril-valsartan) — or ACEI/ARB if ARNI not possible<br>2. <b>Evidence-based β-blocker</b> (metoprolol succinate, carvedilol, bisoprolol)<br>3. <b>MRA</b> (spironolactone, eplerenone)<br>4. <b>SGLT2 inhibitor</b> (dapagliflozin, empagliflozin; or sotagliflozin)<br>• Start all <b>quickly</b> (even in hospital), then up-titrate every ~2 weeks as BP/HR allow<br>• Order flexible: β-blocker first if AF/CAD needing rate control; ARNI first if diabetes<br>• Start the second drug before maxing the first<br>• Stop \"competing\" drugs (amlodipine, nifedipine, HCTZ) to make room <i>[MKSAP CV: Heart Failure]</i>",
"Cardiovascular Medicine|HF: Treatment of stage B HFrEF (low EF, no symptoms)|<b>ACE inhibitor (or ARB) + β-blocker</b>. No evidence for ARNI in stage B. <i>[MKSAP CV: Heart Failure]</i>",
"Cardiovascular Medicine|HF: Sacubitril-valsartan (ARNI): evidence, rules and cautions|• Neprilysin inhibition ↑ natriuretic peptides and bradykinin → diuresis, natriuresis<br>• <b>PARADIGM-HF</b>: ~20% ↓ death and HF hospitalization vs enalapril; more hypotension but less AKI, hyperkalemia, cough<br>• Use <b>instead of</b> ACEI/ARB for new HFrEF, or switch chronic NYHA II–IV, EF ≤40%<br>• <b>36-hour washout</b> after last ACEI dose (angioedema)<br>• <b>Contraindicated with prior angioedema</b><br>• Caution SBP &lt;100<br>• FDA label: HF at any EF (most benefit at lower EF) <i>[MKSAP CV: Heart Failure]</i>",
"Cardiovascular Medicine|HF: ACE inhibitors and ARBs in HFrEF: practical points|• Reduce morbidity and mortality; use in symptomatic and asymptomatic HFrEF if not on ARNI<br>• AEs: hypotension, kidney dysfunction, hyperkalemia, <b>cough (up to 20%)</b>, angioedema<br>• Cough → switch to <b>ARB</b>; angioedema → ARB possible but rare cross-reaction (warn patient)<br>• Many avoid starting/up-titrating if creatinine ≥<b>2.5</b> or eGFR &lt;<b>30</b>; monitor eGFR during titration <i>[MKSAP CV: Heart Failure]</i>",
"Cardiovascular Medicine|HF: β-blockers in HFrEF: which, how and when not|• Only <b>carvedilol</b> (target 25 mg bid; 50 mg bid if &gt;85 kg), <b>metoprolol succinate</b> (200 mg daily), <b>bisoprolol</b> (10 mg daily) — not a class effect<br>• ↑ EF, reverse remodeling, ↓ hospitalization and death<br>• Start low, titrate over <b>weeks</b>; watch dizziness, hypotension, bradycardia<br>• <b>Don't start</b> during acute decompensation (negative inotropy); start before discharge once stable<br>• Contraindicated: cardiogenic shock, 2nd/3rd-degree AV block; avoid starting during active bronchospasm <i>[MKSAP CV: Heart Failure]</i>",
"Cardiovascular Medicine|HF: Mineralocorticoid receptor antagonists in HFrEF|• Spironolactone or eplerenone: ↓ death and HF hospitalization in NYHA II–IV and post-MI HFrEF — <b>underused</b><br>• Start if <b>eGFR ≥30</b> and K normal; stop K supplements; recheck K and creatinine within <b>1 week</b><br>• Risk: <b>hyperkalemia</b> (potassium binders allow higher doses, but sodium zirconium cyclosilicate trial showed more deaths/HF events)<br>• Not a diuretic for congestion<br>• <b>Eplerenone</b> more selective → less gynecomastia/breast tenderness <i>[MKSAP CV: Heart Failure]</i>",
"Cardiovascular Medicine|HF: SGLT2 inhibitors in heart failure|• First-line in <b>all HFrEF</b>, with or without diabetes; also benefit in HFpEF/HFmrEF<br>• ↓ CV death and HF hospitalization (mechanism beyond glucose loss)<br>• eGFR needed to start: <b>≥30 dapagliflozin</b>, <b>≥20 empagliflozin</b>; sotagliflozin (SGLT1/2) also approved<br>• Contraindicated: <b>type 1 diabetes</b>, prior DKA; caution with recurrent UTIs, foot ulcers; may need to lower diuretic dose <i>[MKSAP CV: Heart Failure]</i>",
"Cardiovascular Medicine|HF: Diabetes drugs: which help, which harm in HF?|• <b>SGLT2i</b>: ↓ HF hospitalization and CV death (HFrEF and HFpEF) — prioritize<br>• <b>Metformin</b>: survival benefit; stop in lactic acidosis or shock<br>• <b>GLP-1 RA / tirzepatide</b>: ↓ MACE; semaglutide/tirzepatide improve symptoms and function in obese HFpEF<br>• <b>Thiazolidinediones (pioglitazone)</b>: <b>avoid</b> (fluid retention, worse HF)<br>• Insulin: observational ↑ HF; sulfonylureas: no data; DPP-4 inhibitors: no CV benefit (saxagliptin ↑ HF) <i>[MKSAP CV: Heart Failure]</i>",
"Cardiovascular Medicine|HF: Hydralazine-isosorbide dinitrate|• Added for <b>Black patients</b> with NYHA III–IV still symptomatic on full GDMT (mortality benefit in trial); race-based use is being reconsidered<br>• Option for anyone who <b>can't take ACEI/ARB/ARNI</b> (e.g., CKD, hyperkalemia)<br>• AE: headache <i>[MKSAP CV: Heart Failure]</i>",
"Cardiovascular Medicine|HF: Loop diuretics in chronic HF|• Treat congestion/symptoms; no mortality benefit<br>• Furosemide most used; <b>torsemide, bumetanide</b> have better bioavailability (no need to switch if working)<br>• Use the <b>lowest dose</b> that keeps euvolemia; reduce/stop if euvolemic and salt-restricted<br>• Resistance → add <b>thiazide</b> (e.g., metolazone) given ~30 min before the loop<br>• Watch <b>hypokalemia, hypomagnesemia</b> <i>[MKSAP CV: Heart Failure]</i>",
"Cardiovascular Medicine|HF: Ivabradine: who qualifies?|HFrEF <b>EF ≤35%</b>, NYHA II–III, <b>sinus rhythm with HR ≥70</b> despite <b>maximally tolerated β-blocker</b> → ↓ HF hospitalization (and death + hospitalization composite). Blocks If current; no negative inotropy. <i>[MKSAP CV: Heart Failure]</i>",
"Cardiovascular Medicine|HF: Digoxin in HFrEF|• ↓ HF <b>hospitalizations</b>, <b>no mortality benefit</b><br>• Uses: rate control with concomitant AF; symptoms refractory to GDMT<br>• Monitor levels; toxicity more likely with CKD, older age, women <i>[MKSAP CV: Heart Failure]</i>",
"Cardiovascular Medicine|HF: Vericiguat|Soluble guanylate cyclase stimulator (↑ cGMP). VICTORIA: EF &lt;45%, NYHA II–IV, BNP &gt;300 after recent worsening on GDMT → small ↓ death or HF hospitalization. Weak (2b) recommendation. <i>[MKSAP CV: Heart Failure]</i>",
"Cardiovascular Medicine|HF: Drugs to avoid or not bother with in HFrEF|• <b>Non-dihydropyridine CCBs</b> (verapamil, diltiazem): harmful<br>• <b>Amlodipine/felodipine</b>: neutral, OK for resistant HTN<br>• <b>NSAIDs</b>: raise BP, worsen HF<br>• <b>Thiazolidinediones</b>: worsen HF<br>• <b>Statins</b>: no HF benefit (rosuvastatin trials); use only for another indication<br>• IV iron: improves function/QoL in iron deficiency in small studies, but a large RCT showed no hard-outcome benefit <i>[MKSAP CV: Heart Failure]</i>",
"Cardiovascular Medicine|HF: ICD indications in heart failure|• <b>EF ≤35%</b> + <b>NYHA II–III</b> on ≥3 months GDMT, life expectancy &gt;1 year<br>• NYHA I: EF <b>≤30%</b> ≥40 days after MI<br>• NYHA IV: only if transplant/LVAD candidate (or with CRT)<br>• <b>Wait and recheck EF</b>: <b>40 days after MI</b> (and 3 months after revascularization), <b>3 months</b> for nonischemic — EF often improves<br>• Wearable defibrillator: no guideline role (VEST: no ↓ sudden death) <i>[MKSAP CV: Heart Failure]</i>",
"Cardiovascular Medicine|HF: Cardiac resynchronization therapy (CRT) indications|• <b>EF ≤35%</b><br>• <b>NYHA II–IV</b> despite GDMT<br>• <b>Sinus rhythm</b><br>• <b>LBBB with QRS ≥150 ms</b> (most benefit; non-LBBB with QRS ≥150 gets less)<br>Biventricular pacing (RV + LV lead via coronary sinus) → ↑ EF, ↓ symptoms and mortality. Most also qualify for ICD → <b>CRT-D</b>. <i>[MKSAP CV: Heart Failure]</i>",
"Cardiovascular Medicine|HF: Pacemakers and ICD types|• Transvenous pacemaker / <b>leadless</b> pacemaker: bradycardia (SND, AV block)<br>• <b>Transvenous ICD</b>: pacing + antitachycardia pacing + shock<br>• <b>Subcutaneous ICD</b>: shock only (no pacing, no ATP) → not for patients needing pacing<br>• <b>Extravascular (substernal) ICD</b>: ATP + shock<br>• CRT-P / CRT-D: resynchronization ± defibrillator <i>[MKSAP CV: Heart Failure]</i>",
"Cardiovascular Medicine|HF: Monitoring chronic HF: what NOT to do routinely|• <b>No routine surveillance echo</b> unless clinical change or a device decision (do recheck EF ~3 months after starting GDMT in new HF)<br>• <b>No serial BNP-guided therapy</b> (no outcome benefit); BNP useful for diagnosis and prognosis<br>• Each visit: symptoms, function, volume, electrolytes, kidney function, medication doses, adherence, barriers, education <i>[MKSAP CV: Heart Failure]</i>",
"Cardiovascular Medicine|HF: Sleep apnea in heart failure|• Underdiagnosed; get a sleep study if NYHA II–IV with daytime sleepiness or suspected sleep-disordered breathing<br>• First optimize GDMT (helps both)<br>• Persistent <b>obstructive</b> apnea → <b>CPAP</b><br>• <b>Central</b> apnea with <b>EF &lt;45%</b>: <b>avoid adaptive servo-ventilation</b> (↑ death) <i>[MKSAP CV: Heart Failure]</i>",
"Cardiovascular Medicine|HF: Self-care, diet and exercise advice|• <b>Daily weights</b> (rapid gain = early decompensation)<br>• Sodium &lt;1.5 g/d and fluid 1.5–2 L/d commonly advised (limited evidence)<br>• Alcohol in moderation; stop smoking; lose weight<br>• <b>Avoid OTC NSAIDs</b><br>• <b>Cardiac rehab / exercise training for all symptomatic HF</b> (HF-ACTION: better function, QoL; survival benefit in higher-risk subgroups)<br>• Multidisciplinary team care (many have ≥4 comorbidities) <i>[MKSAP CV: Heart Failure]</i>",
"Cardiovascular Medicine|HF: Markers of poor prognosis → refer to HF specialist|• Repeated HF hospitalizations (especially needing inotropes)<br>• NYHA III–IV, poor exercise tolerance<br>• Recurrent VA / ICD shocks<br>• <b>Hyponatremia</b><br>• Worsening kidney or liver function; <b>cachexia</b><br>• Loop dose &gt;<b>1 mg/kg</b> or needing metolazone<br>• Hypotension forcing GDMT reduction<br>• RV dysfunction, pulmonary HTN<br>HF hospitalization → 10–20% mortality over 6 months. Discuss LVAD/transplant or palliative care/hospice. <i>[MKSAP CV: Heart Failure]</i>",
"Cardiovascular Medicine|HF: HFpEF: who gets it and how to treat|• Older, <b>women</b>, <b>obesity</b>, <b>hypertension</b>; less overt CAD<br>• <b>Diuretics</b> for congestion<br>• BP control to SBP <b>&lt;130</b><br>• <b>SGLT2 inhibitor</b> (2a): ↓ hospitalization and CV death<br>• <b>MRA</b> (2b) if BNP high or HF hospitalization within 1 year (TOPCAT: fewer hospitalizations; finerenone ↓ worsening HF, more hyperkalemia)<br>• <b>ARNI/ARB</b> (2b), most benefit at lower-normal EF (45–55%)<br>• Obesity (BMI ≥30): <b>semaglutide or tirzepatide</b> → weight loss, better symptoms and function<br>• AF: rate or rhythm control <i>[MKSAP CV: Heart Failure]</i>",
"Cardiovascular Medicine|HF: Acute decompensated HF: common triggers|• <b>Dietary nonadherence</b> (salt/fluid)<br>• <b>Medication nonadherence</b><br>• <b>Ischemia</b> (in ischemic cardiomyopathy)<br>• Uncontrolled <b>hypertension</b><br>• Arrhythmia (AF), infection or other illness<br>• Progression of LV dysfunction<br>• Drugs: NSAIDs, TZDs, non-DHP CCBs<br>Find the trigger to prevent recurrence. <i>[MKSAP CV: Heart Failure]</i>",
"Cardiovascular Medicine|HF: Bedside and POCUS signs of volume overload in acute HF|• JVD; crackles (much more likely in acute than chronic HF); ascites; edema<br>• POCUS: <b>E/e′ &gt;15</b>, <b>IVC &gt;2.1 cm with &lt;50% inspiratory collapse</b>, lung <b>B lines</b><br>• Classify as wet/dry and warm/cold (perfusion: cool extremities, narrow pulse pressure, confusion, worsening kidney function) <i>[MKSAP CV: Heart Failure]</i>",
"Cardiovascular Medicine|HF: Diuresis in acute decompensated HF|• <b>IV loop diuretic</b> is the main therapy<br>• High dose (<b>2.5× home oral daily dose</b> IV) → more diuresis (transient creatinine rise)<br>• <b>Bolus = continuous infusion</b><br>• Inadequate response → increase dose or add <b>thiazide</b><br>• <b>Low-dose dopamine does not help</b><br>• Poor perfusion → inotropes / advanced therapy<br>• Respiratory distress → <b>noninvasive ventilation</b> (↓ intubation) <i>[MKSAP CV: Heart Failure]</i>",
"Cardiovascular Medicine|HF: Cardiorenal syndrome during diuresis|• Common; from neurohormones, renal venous congestion, low output<br>• Usually <b>keep diuresing</b> (higher doses) despite rising creatinine<br>• May temporarily hold <b>ACEI/ARB/ARNI and MRA</b><br>• If creatinine rises as patient nears euvolemia → hold diuretic 1 day to let fluid re-equilibrate <i>[MKSAP CV: Heart Failure]</i>",
"Cardiovascular Medicine|HF: β-blockers during an HF admission|• Admitted with congestion but <b>warm</b> (adequate output) → <b>continue</b> (same or lower dose)<br>• <b>Low output/shock</b> → stop; restart only once improved<br>• Never start a β-blocker during acute decompensation; start before discharge when euvolemic<br>• Keep or restart all other GDMT before discharge <i>[MKSAP CV: Heart Failure]</i>",
"Cardiovascular Medicine|HF: Prognostic labs in acute HF and invasive monitoring|• BNP on admission and before discharge: high admission BNP or BNP that doesn't fall → higher mortality and readmission<br>• Elevated troponin → worse outcomes<br>• <b>Pulmonary artery catheter</b> for selected patients: persistent symptoms, unclear hemodynamics, worsening kidney function despite therapy <i>[MKSAP CV: Heart Failure]</i>",
"Cardiovascular Medicine|HF: Cardiogenic shock: definition and vasoactive drugs|<b>Definition</b>: SBP &lt;90 (or MAP &lt;60) + hypoperfusion (confusion, cool extremities, oliguria, <b>lactate &gt;2</b>).<br><b>Drugs</b>:<br>• <b>Dobutamine</b> (β1/β2): strong inotrope, mild vasodilation<br>• <b>Milrinone</b> (PDE-3 inhibitor): inotrope + vasodilator (renally cleared)<br>• <b>Norepinephrine</b>: mostly α (pressor) + some β1<br>• <b>Dopamine</b>: dose-dependent (β1 mid, α high)<br>• <b>Vasopressin</b>: pure vasoconstrictor<br>• <b>Nitroprusside, nitroglycerin</b>: vasodilators (no inotropy)<br>Fix the cause (reperfuse ACS); shock team; microaxial pump helped in trials, IABP did not. <i>[MKSAP CV: Heart Failure]</i>",
"Cardiovascular Medicine|HF: Preventing readmission after an HF hospitalization|• Treat the reversible trigger; discharge only when near <b>euvolemia</b><br>• Medication reconciliation with GDMT on board<br>• Education: diet, meds, daily weights, warning signs, who to call<br>• <b>Home nurse visit</b> + <b>clinic follow-up within 7 days</b><br>• <b>Implantable PA pressure sensor</b> (CardioMEMS): ↓ hospitalizations in NYHA III with HF admission in prior year <i>[MKSAP CV: Heart Failure]</i>",
"Cardiovascular Medicine|HF: Heart transplantation: candidacy and outcomes|• Stage D despite max therapy; usually age &lt;<b>65–70</b><br>• Exclusions: diabetes with end-organ damage, cancer within 5 years, kidney dysfunction, other survival-limiting illness, poor social support/adherence<br>• Median survival <b>~11 years</b>, usually normal quality of life<br>• Only ~half of eligible patients get a heart (donor shortage); many bridge with LVAD <i>[MKSAP CV: Heart Failure]</i>",
"Cardiovascular Medicine|HF: LVAD: indications, physiology, complications|<b>Indication</b>: <b>EF &lt;25%</b>, NYHA III–IV on max therapy, high 1–2-year mortality or <b>inotrope-dependent</b>; bridge to transplant or <b>destination therapy</b>. 1-year survival ≈ transplant; ~54% at 5 years.<br><b>Physiology</b>: continuous flow → often <b>no palpable pulse</b>; measure BP by <b>Doppler</b>.<br><b>Care</b>: anticoagulation (warfarin), GDMT, diuretics.<br><b>Complications (2 y)</b>: infection (driveline/pump) ~58%, arrhythmia ~36%, <b>GI bleeding</b> ~25% (small-bowel AVMs), stroke ~10%, pump thrombosis ~1%. <i>[MKSAP CV: Heart Failure]</i>",
"Cardiovascular Medicine|HF: Complications after heart transplant|• Year 1: <b>infection</b> most common; <b>CMV</b> → valganciclovir/ganciclovir prophylaxis for <b>6 months</b> if donor CMV+ (D+/R− highest risk)<br>• <b>Rejection</b>: highest in first <b>6 months</b>, usually silent → scheduled <b>endomyocardial biopsy</b> or gene-expression profiling; severe = acute HF, atrial arrhythmia, conduction block<br>• Immunosuppression: <b>HTN</b> (&gt;90%), diabetes (15–20%)<br>• Late: <b>allograft CAD</b>, cancers (<b>skin</b> common, PTLD/B-cell lymphoma)<br>• <b>Cyclosporine/tacrolimus are CYP3A4 substrates</b>: diltiazem, verapamil, atorvastatin, simvastatin interact <i>[MKSAP CV: Heart Failure]</i>",
"Cardiovascular Medicine|HF: Heart failure in diabetes|• &gt;2× HF risk and worse outcomes; tight glucose control doesn't improve HF outcomes<br>• In T2DM with CVD or high CV risk → <b>prioritize SGLT2 inhibitor</b> (prevents HF hospitalization)<br>• Avoid TZDs; caution saxagliptin <i>[MKSAP CV: Heart Failure]</i>",
"Cardiovascular Medicine|HF: Stress (takotsubo) cardiomyopathy as a cause of HF|• Older women after emotional/physical stress; catecholamine toxicity<br>• Low EF, troponin rise, ischemic ECG; wall motion abnormality <b>not in one coronary territory</b> (apical ballooning, basal sparing)<br>• Usually needs angiography to exclude ACS<br>• Supportive HF therapy; recovery in weeks–months; <b>repeat echo at 3–6 months</b>; most continue GDMT ≥1 year <i>[MKSAP CV: Heart Failure]</i>",
"Cardiovascular Medicine|HF: Drug-induced cardiomyopathy|• <b>Hydroxychloroquine/chloroquine</b> (long use): <b>restrictive</b> cardiomyopathy, thick walls, small cavity; biopsy diagnostic<br>• <b>Cocaine, methamphetamine</b><br>• Chemo: <b>anthracyclines</b>, alkylators, antimicrotubule agents, <b>trastuzumab</b>, proteasome inhibitors, TKIs, <b>checkpoint inhibitors</b><br>Stopping the drug may reverse dysfunction. <i>[MKSAP CV: Heart Failure]</i>",
"Cardiovascular Medicine|HF: Acute myocarditis: causes and presentation|• Usually <b>viral</b> (often after viral prodrome: fever, myalgia, URI); also bacterial, toxins (doxorubicin, trastuzumab, <b>checkpoint inhibitors</b>), autoimmune; genetic predisposition<br>• Acute-onset HF, chest pain, arrhythmia, troponin rise<br>• COVID-19 myocarditis: rare in population, more in hospitalized<br>• <b>mRNA vaccine myocarditis</b>: young (<b>&lt;30</b>) <b>males</b>; usually good prognosis<br>• Diagnose with <b>cardiac MRI</b> or biopsy <i>[MKSAP CV: Heart Failure]</i>",
"Cardiovascular Medicine|HF: Myocarditis: when to biopsy and how to treat|<b>Endomyocardial biopsy</b> if:<br>• New HF (≤2 weeks) with <b>hemodynamic compromise</b><br>• <b>High-degree AV block</b> or <b>ventricular arrhythmias</b><br>• Peripheral <b>eosinophilia</b><br>• On <b>immune checkpoint inhibitors</b><br>• MRI not possible<br><b>Treatment</b>: standard HF therapy; anti-inflammatories don't help; immunosuppression only for giant cell, eosinophilic, sarcoid, checkpoint-inhibitor, lupus, COVID-triggered. <b>No strenuous exercise for 3–6 months</b>. <i>[MKSAP CV: Heart Failure]</i>",
"Cardiovascular Medicine|HF: Giant cell myocarditis|• Young adults; fulminant, often fatal; biventricular failure<br>• <b>High-grade AV block</b> and <b>VT</b><br>• Can go from well to moribund in hours → <b>transfer early</b> to a center with mechanical support<br>• Confirm with (MRI-guided) biopsy<br>• <b>Aggressive immunosuppression helps</b>; often needs MCS, LVAD or transplant <i>[MKSAP CV: Heart Failure]</i>",
"Cardiovascular Medicine|HF: Cardiac sarcoidosis|• Found in up to 25% of systemic sarcoid at autopsy<br>• Presents with <b>VT</b>, <b>2nd/3rd-degree AV block</b> (young patient with heart block → think sarcoid), HFrEF<br>• Diagnosis: noncaseating granulomas (cardiac or extracardiac biopsy) + cardiac findings; <b>CMR</b> (patchy late gadolinium) or <b>FDG-PET</b> can replace endomyocardial biopsy (which is insensitive because patchy)<br>• Treat: HF therapy + <b>high-dose prednisone</b> tapered over 3–6 months for flares; often ICD/pacing <i>[MKSAP CV: Heart Failure]</i>",
"Cardiovascular Medicine|HF: Tachycardia-mediated cardiomyopathy|• From persistent SVT, AF with RVR, or frequent PVCs<br>• <b>Reversible</b> with rate/rhythm control<br>• AF + HF: <b>rhythm control better than rate control</b>; <b>catheter ablation</b> recommended (2023 AF guideline) to improve symptoms, EF and outcomes<br>• PVC cardiomyopathy when PVCs &gt;<b>10,000/day</b> or &gt;<b>10%</b> of beats (Holter) → <b>ablation</b>, especially unifocal <i>[MKSAP CV: Heart Failure]</i>",
"Cardiovascular Medicine|Arrhythmia: Choosing an ambulatory ECG monitor|• <b>Resting 12-lead ECG</b>: first test in everyone; diagnostic only if the rhythm is captured<br>• <b>Holter</b> (24–48 h, up to 14 d): symptoms at least <b>daily</b>; records every beat (full disclosure: burden, ectopy counts) but no real-time alerts<br>• <b>Event recorder / external loop</b> (up to 30 d): <b>infrequent</b> symptoms; loop saves the 30 s–2 min before activation, so onset is captured<br>• <b>Mobile cardiac outpatient telemetry</b> (up to 30 d): real-time alerts + full disclosure; costly<br>• <b>Implantable loop recorder</b> (years): <b>very infrequent</b> events, unexplained infrequent syncope, occult AF after cryptogenic stroke<br>• <b>Exercise ECG</b>: exertional arrhythmia<br>• <b>EP study</b>: invasive; defines mechanism and allows ablation at the same sitting <i>[MKSAP CV: Arrhythmias]</i>",
"Cardiovascular Medicine|Arrhythmia: Consumer wearables|• Devices that record an actual <b>ECG</b> (smartwatch single-lead, 6-lead pocket devices) act as patient-triggered event monitors; tracings can be diagnostic<br>• Pulse/<b>photoplethysmography</b>-only devices just flag abnormal rate or irregularity<br>• Algorithms are imperfect; clinician should review the tracing <i>[MKSAP CV: Arrhythmias]</i>",
"Cardiovascular Medicine|Arrhythmia: Class IC drugs (flecainide, propafenone)|• Na-channel blockers → <b>QRS widening</b> (toxicity = very wide, bizarre QRS)<br>• Use: <b>AF and SVT in structurally normal hearts</b><br>• Give with an <b>AV nodal blocker</b> to prevent 1:1 conduction of slowed atrial flutter<br>• <b>Contraindicated</b>: <b>CAD/prior MI or structural heart disease</b> (↑ VT and death), sinus node dysfunction, 2nd/3rd-degree AV block or bundle branch disease without a pacemaker <i>[MKSAP CV: Arrhythmias]</i>",
"Cardiovascular Medicine|Arrhythmia: Class IB drugs (lidocaine, mexiletine)|• Na-channel blockers used for <b>ventricular arrhythmias</b><br>• Neurologic side effects (headache, dizziness); <b>lidocaine toxicity → seizures</b><br>• Avoid in <b>advanced liver disease</b> <i>[MKSAP CV: Arrhythmias]</i>",
"Cardiovascular Medicine|Arrhythmia: Class III drugs (sotalol, dofetilide)|• K-channel blockers → <b>QT prolongation</b>; risk of torsades<br>• Use: AF, flutter, ventricular arrhythmias<br>• <b>Start inpatient</b> with serial QTc monitoring<br>• <b>Dofetilide</b>: notorious for dangerous <b>drug–drug interactions</b><br>• Avoid with <b>renal insufficiency</b>, baseline long QT, bradycardia or AV block without a pacemaker <i>[MKSAP CV: Arrhythmias]</i>",
"Cardiovascular Medicine|Arrhythmia: Amiodarone — uses, toxicity and monitoring|• Multichannel blocker; AF and recurrent <b>VT</b>; <b>low proarrhythmia</b> risk<br>• Toxicities: <b>thyroid</b> (hypo or hyper), <b>liver</b>, <b>lung</b> (fibrosis), <b>eye</b>, neurologic, plus GI and tremor<br>• Monitoring: <b>TSH and LFTs every 6 months</b>; <b>chest x-ray or PFTs at least yearly</b>; <b>eye exam yearly</b><br>• Interactions: ↑ <b>warfarin</b>, <b>statins</b>, <b>digoxin</b> levels<br>• Avoid in advanced liver, lung or thyroid disease <i>[MKSAP CV: Arrhythmias]</i>",
"Cardiovascular Medicine|Arrhythmia: Dronedarone|• Multichannel blocker for <b>paroxysmal AF without overt HF</b><br>• <b>Contraindicated</b>: <b>permanent AF</b>, recent decompensated or <b>NYHA III–IV HF</b>, advanced liver disease <i>[MKSAP CV: Arrhythmias]</i>",
"Cardiovascular Medicine|Arrhythmia: β-blockers and nondihydropyridine CCBs as antiarrhythmics|• Class II (metoprolol, carvedilol etc.) and class IV (<b>verapamil, diltiazem</b>) slow AV conduction: ↓ HR, ↑ PR<br>• Use: rate control in AF/flutter, SVT, some ventricular arrhythmias<br>• Avoid both with <b>2nd/3rd-degree AV block</b> (no pacer) and <b>preexcitation</b><br>• β-blocker: avoid severe asthma, cardiogenic shock<br>• CCB: avoid significant sinus node dysfunction and <b>LV systolic dysfunction</b> <i>[MKSAP CV: Arrhythmias]</i>",
"Cardiovascular Medicine|Arrhythmia: Digoxin and adenosine|• <b>Digoxin</b>: ↑ vagal tone, slows AV node; adjunct AF rate control (esp. with HF). Toxicity: nausea, vomiting, <b>blurry/yellow vision</b>, thrombocytopenia, <b>atrial tachycardia with AV block</b>. Dose-adjust in kidney disease<br>• <b>Adenosine</b> (IV only): brief AV block; terminates AV-node–dependent SVT and unmasks atrial rhythms. Side effects: flushing, dyspnea, chest pain, hypotension. Avoid in <b>severe asthma</b> <i>[MKSAP CV: Arrhythmias]</i>",
"Cardiovascular Medicine|Arrhythmia: Bradycardia workup|• Bradycardia = HR <b>&lt;50/min</b>; may be normal (athletes, sleep)<br>• Do: history, exam, <b>electrolytes, TSH</b>, 12-lead ECG; echo for structural disease; exercise test for <b>chronotropic incompetence</b>; ambulatory monitor<br>• Look for reversible causes: <b>ischemia (esp. RCA)</b>, myocarditis, endocarditis, <b>hypothyroidism</b>, <b>Lyme disease</b>, neurologic events (↑ ICP), electrolytes, <b>drugs</b><br>• Nocturnal bradycardia/block → think <b>sleep apnea</b>; isolated asymptomatic sleep bradycardia rarely needs a pacer <i>[MKSAP CV: Arrhythmias]</i>",
"Cardiovascular Medicine|Arrhythmia: Sinus bradycardia and drugs that suppress the sinus node|• Sinus rhythm &lt;60/min (pragmatically &lt;50/min matters)<br>• #1 extrinsic cause: <b>medications</b> — β-blockers, verapamil/diltiazem, <b>donepezil</b> (and other cholinergics: neostigmine, pyridostigmine), clonidine, opioids/sedatives, digoxin, amiodarone, sotalol, <b>ivabradine</b><br>• #1 intrinsic cause: <b>age-related fibrosis</b> (sinus node dysfunction); also RCA ischemia, hypothyroidism, ↑ ICP, post-cardiac surgery, sarcoidosis<br>• Note: AV nodal blockers rarely cause <b>infranodal</b> (complete) heart block — look for intrinsic disease <i>[MKSAP CV: Arrhythmias]</i>",
"Cardiovascular Medicine|Arrhythmia: AV block types on ECG|• <b>1st degree</b>: PR <b>&gt;200 ms</b>; asymptomatic but linked to ↑ AF and mortality<br>• <b>Mobitz I (Wenckebach)</b>: PR progressively lengthens until a QRS drops → grouped beating; usually AV node/vagal; low progression risk<br>• <b>Mobitz II</b>: constant PR with sudden nonconducted P; usually <b>infranodal</b>; high risk of complete block<br>• <b>2:1 block</b>: type cannot be determined<br>• <b>High-degree</b>: ≥2 consecutive nonconducted P waves<br>• <b>3rd degree</b>: no P waves conduct; <b>AV dissociation</b> <i>[MKSAP CV: Arrhythmias]</i>",
"Cardiovascular Medicine|Arrhythmia: Acute treatment of unstable bradycardia|• <b>Atropine</b> first<br>• If ineffective: <b>dopamine or epinephrine</b> infusion as a bridge<br>• Then <b>transcutaneous pacing</b> or (preferred) <b>temporary transvenous pacing</b> for transient causes<br>• Cause-specific therapy: antidotes for overdose (e.g., β-blocker/CCB/digoxin toxicity)<br>• Stable patient: fix reversible causes <b>before</b> considering a permanent pacer <i>[MKSAP CV: Arrhythmias]</i>",
"Cardiovascular Medicine|Arrhythmia: Permanent pacemaker indications|<b>Pace:</b><br>• Symptomatic bradycardia with no reversible cause (incl. <b>chronotropic incompetence</b>)<br>• Permanent AF with symptomatic bradycardia<br>• <b>Alternating bundle branch block</b><br>• <b>Mobitz II, high-degree, or complete heart block — even if asymptomatic</b><br><b>Don't pace:</b><br>• Mobitz I without symptoms or disease (fix the cause)<br>• Stable isolated LBBB or RBBB ± long PR (progression only <b>1–3%/yr</b>) <i>[MKSAP CV: Arrhythmias]</i>",
"Cardiovascular Medicine|Arrhythmia: Types of cardiac implantable devices|• <b>Transvenous pacemaker</b>: generator + leads; pacing only<br>• <b>Leadless pacemaker</b>: sits entirely inside RV (and now RA); no leads or pocket<br>• <b>Transvenous ICD</b>: pacing + antitachycardia pacing + shock<br>• <b>Subcutaneous ICD</b>: lead over the sternum; shocks only, <b>no pacing or ATP</b><br>• <b>Extravascular ICD</b>: lead under the sternum; ATP + shock, no bradycardia pacing<br>• <b>CRT-P / CRT-D</b>: adds coronary sinus LV lead to resynchronize in HF<br>• <b>Conduction system pacing</b>: lead in His/left bundle area to mimic native activation <i>[MKSAP CV: Arrhythmias]</i>",
"Cardiovascular Medicine|Arrhythmia: Tachycardia — first approach|• HR <b>&gt;100/min</b>; symptoms range from none to palpitations, presyncope, syncope, HF<br>• Key: capture an ECG <b>during symptoms</b><br>• <b>Narrow QRS</b> = supraventricular (uses AV node) unless aberrancy/BBB<br>• <b>Wide QRS</b> = ventricular origin (or SVT with aberrancy/preexcitation/pacing)<br>• Consider TSH and echo; review meds and substances <i>[MKSAP CV: Arrhythmias]</i>",
"Cardiovascular Medicine|Arrhythmia: Sinus tachycardia|• Most common tachycardia; usually a <b>response to stress</b>: pain, hypovolemia, anemia, fever, stimulants or withdrawal (alcohol, opioids), <b>hyperthyroidism</b>, <b>PE</b> or other acute cardiopulmonary event<br>• In inpatients, can be one of the most worrisome rhythms<br>• Diagnose benign causes (anxiety, exercise) only after excluding serious ones<br>• Treat the cause; <b>don't give β-blockers just to lower the rate</b> <i>[MKSAP CV: Arrhythmias]</i>",
"Cardiovascular Medicine|Arrhythmia: Inappropriate sinus tachycardia (IST)|• High resting HR with exaggerated rise on light activity; <b>falls during sleep</b><br>• Typically <b>women aged 20s–40s</b>; palpitations, presyncope, fatigue, dyspnea<br>• <b>Diagnosis of exclusion</b>: rule out hyperthyroidism, anemia, pheochromocytoma, structural heart disease<br>• First line: remove triggers + <b>exercise training</b>; drugs only for persistent symptoms; often improves over time <i>[MKSAP CV: Arrhythmias]</i>",
"Cardiovascular Medicine|Arrhythmia: POTS — criteria and treatment|• Dysautonomia with orthostatic intolerance<br>• Criteria: HR rises <b>≥30/min</b> or to <b>&gt;120/min within 10 min of standing</b><br>• First line: behavioral changes, <b>compression stockings</b>, <b>exercise training</b>, <b>more fluid (and salt)</b><br>• Drugs: β-blockers, <b>ivabradine</b> (off-label; avoid in pregnancy), fludrocortisone, midodrine, SSRIs, droxidopa, pyridostigmine <i>[MKSAP CV: Arrhythmias]</i>",
"Cardiovascular Medicine|Arrhythmia: SVT — presentation and acute treatment|• More common in <b>women</b>; recurrent abrupt palpitations, <b>neck pounding</b>, presyncope<br>• Usually narrow QRS; wide if BBB, aberrancy, pacing, or antidromic preexcitation<br>• Usually no structural disease but get an <b>echo</b><br>• Acute: <b>vagal maneuvers first</b> (Valsalva, carotid massage) → <b>IV adenosine</b><br>• Adenosine response: <b>terminates</b> → AV-node dependent (AVNRT/AVRT); <b>P waves continue</b> during block → atrial tachycardia/flutter <i>[MKSAP CV: Arrhythmias]</i>",
"Cardiovascular Medicine|Arrhythmia: AVNRT|• <b>~2/3 of SVTs</b> (excluding AF/flutter); reentry in the AV node using slow and fast pathways<br>• ECG: <b>short RP</b>, retrograde P buried in or just after QRS<br>• Acute: vagal maneuvers, adenosine; <b>intranasal etripamil</b> (CCB) approved for as-needed self-termination<br>• Prevent: β-blocker or CCB<br>• <b>Catheter ablation is also first-line</b> (high success; &lt;1% risk of AV block needing a pacer) <i>[MKSAP CV: Arrhythmias]</i>",
"Cardiovascular Medicine|Arrhythmia: AVRT and preexcitation|• Uses an <b>accessory pathway</b>; sinus ECG shows <b>short PR + delta wave</b> (slurred QRS upstroke)<br>• <b>Orthodromic</b> (90–95%): down the AV node, up the pathway → narrow QRS<br>• <b>Antidromic</b>: down the pathway → wide QRS <i>[MKSAP CV: Arrhythmias]</i>",
"Cardiovascular Medicine|Arrhythmia: WPW syndrome — risk and treatment|• WPW = <b>symptomatic AVRT + preexcitation</b> on resting ECG<br>• AF occurs in up to <b>1/3</b>; fast conduction down the pathway can → <b>VF/SCD</b> (&lt;1%)<br>• Avoid AV nodal blockers in preexcited AF<br>• Risk-stratify with exercise test or (usually) <b>EP study</b><br>• <b>Catheter ablation = first line</b>; antiarrhythmics second line<br>• <b>Asymptomatic preexcitation</b>: invasive testing usually not needed unless <b>high-risk job</b> (e.g., airline pilot) <i>[MKSAP CV: Arrhythmias]</i>",
"Cardiovascular Medicine|Arrhythmia: PACs, atrial tachycardia, MAT|• <b>PACs</b>: nearly universal (only 1% have none on Holter); high burden → ↑ AF risk; symptomatic → β-blocker or CCB<br>• <b>Atrial tachycardia</b>: &gt;100/min from a non-sinus atrial focus; 1st line β-blocker/CCB; 2nd ablation or antiarrhythmic (ablation less successful than other SVTs)<br>• <b>Multifocal atrial tachycardia</b>: <b>≥3 P-wave morphologies</b>, HR &gt;100; seen in <b>severe lung disease</b> — treat the lung disease <i>[MKSAP CV: Arrhythmias]</i>",
"Cardiovascular Medicine|Arrhythmia: AF — epidemiology and risk factors|• Most common sustained arrhythmia; lifetime risk <b>25% after age 40</b><br>• ↑ stroke, HF, <b>dementia</b><br>• Risk factors: <b>HTN</b>, diabetes, <b>obesity</b>, smoking, <b>alcohol</b>, CAD, HF, <b>sleep apnea</b><br>• Reduce risk: activity, <b>weight loss</b> (consider bariatric surgery), quit smoking, <b>stop alcohol</b>, BP/glucose control, treat OSA<br>• <b>Caffeine restriction is not needed</b><br>• Reversible triggers: PE, critical illness, hyperthyroidism, post-cardiac surgery <i>[MKSAP CV: Arrhythmias]</i>",
"Cardiovascular Medicine|Arrhythmia: AF — classification by duration|• <b>Paroxysmal</b>: stops on its own within <b>7 days</b><br>• <b>Persistent</b>: <b>≥7 days</b> or needs cardioversion<br>• <b>Long-standing persistent</b>: continuous <b>&gt;1 year</b><br>• <b>Permanent</b>: patient and physician have stopped trying to restore sinus rhythm<br>• Newer staging treats AF as a continuum (prevention → risk factors → screening → therapy) <i>[MKSAP CV: Arrhythmias]</i>",
"Cardiovascular Medicine|Arrhythmia: New AF — required workup|• <b>TSH</b> in everyone<br>• <b>Echocardiogram</b> in everyone (structural disease)<br>• <b>Sleep study</b> if OSA risk or symptoms<br>• Rule out reversible causes<br>• Cryptogenic stroke/TIA age ≥55: occult AF in up to 25% → <b>14–30 day monitor</b>; if negative, consider <b>implantable loop recorder</b> <i>[MKSAP CV: Arrhythmias]</i>",
"Cardiovascular Medicine|Arrhythmia: AF — when to cardiovert urgently|• AF with rapid rate causing <b>hypotension, acute ischemia, or decompensated HF</b> → <b>urgent cardioversion regardless of duration</b><br>• If AF &gt;48 h or unknown: start anticoagulation <b>as soon as possible</b> and continue <b>≥4 weeks</b> after<br>• Stable patients — goals: prevent stroke, control rate, relieve symptoms, modify risk factors <i>[MKSAP CV: Arrhythmias]</i>",
"Cardiovascular Medicine|Arrhythmia: Anticoagulation around elective AF cardioversion|• <b>AF clearly &lt;48 h</b>: low thrombus risk. Anticoagulate before (ASAP) and ≥4 weeks after if <b>CHA2DS2-VASc ≥2 (men) / ≥3 (women)</b>; otherwise only consider it<br>• <b>AF ≥48 h or unknown</b>: <b>3 weeks of anticoagulation before</b> and <b>≥4 weeks after</b><br>• Need it sooner: <b>TEE</b> (or contrast CT/cardiac MRI) to exclude LA appendage thrombus, then cardiovert<br>• Long-term anticoagulation after that is based on stroke and bleeding risk<br>• No cardioversion planned: IV heparin usually unnecessary; start oral anticoagulation if risk warrants <i>[MKSAP CV: Arrhythmias]</i>",
"Cardiovascular Medicine|Arrhythmia: AF rate control targets and drugs|• Acute goal HR <b>60–110/min</b><br>• Chronic: <b>&lt;80/min</b> resting for symptomatic patients; <b>lenient &lt;110/min</b> OK if asymptomatic with normal LV function<br>• Drugs: <b>metoprolol or diltiazem</b> (IV or oral); combinations may be needed<br>• <b>Avoid CCBs with LV systolic dysfunction</b><br>• <b>Digoxin</b>: add-on, especially in HF<br>• Check rate with activity too (6-min walk, stress test, Holter) <i>[MKSAP CV: Arrhythmias]</i>",
"Cardiovascular Medicine|Arrhythmia: CHA2DS2-VASc score|• <b>C</b>HF 1 · <b>H</b>TN 1 · <b>A</b>ge ≥75 <b>2</b> · <b>D</b>iabetes 1 · <b>S</b>troke/TIA/thromboembolism <b>2</b> · <b>V</b>ascular disease (MI, PAD, aortic plaque) 1 · <b>A</b>ge 65–74 1 · <b>S</b>ex female 1 (max 9)<br>• Annual stroke risk rises: score 0 → 0.2%; 2 → 2.2%; 4 → 4.8%; 6+ → 10.3%<br>• <b>Not used</b> in <b>valvular AF</b> (mechanical valve, moderate–severe mitral stenosis) or <b>hypertrophic cardiomyopathy</b> → anticoagulate all of them <i>[MKSAP CV: Arrhythmias]</i>",
"Cardiovascular Medicine|Arrhythmia: Who gets anticoagulation for AF|• <b>2023 ACC/AHA/HRS</b>: anticoagulate if CHA2DS2-VASc <b>≥2 in men, ≥3 in women</b><br>• Score 1 (men) / 2 (women): <b>consider</b>; other factors (CKD, AF burden) can tip it<br>• ACCP: anticoagulate with ≥1 non-sex risk factor<br>• Score 0 (men) / 1 (women): none<br>• Same rules for paroxysmal, persistent, permanent AF and for <b>atrial flutter</b><br>• <b>Aspirin is no longer recommended</b> for stroke prevention in AF <i>[MKSAP CV: Arrhythmias]</i>",
"Cardiovascular Medicine|Arrhythmia: DOAC vs warfarin in AF|• <b>DOACs preferred</b> over warfarin when eligible<br>• <b>Warfarin only</b> (INR 2–3) for <b>valvular AF</b>: mechanical valve or moderate–severe mitral stenosis<br>• Warfarin also: cheap; but monitoring and many food/drug interactions; avoid in pregnancy<br>• <b>Dabigatran and rivaroxaban</b>: more <b>GI bleeding</b> than warfarin; dabigatran causes <b>dyspepsia</b><br>• Check kidney and liver function before a DOAC and <b>at least yearly</b> <i>[MKSAP CV: Arrhythmias]</i>",
"Cardiovascular Medicine|Arrhythmia: DOAC dosing rules in AF|• <b>Apixaban</b> BID: reduce dose if <b>2 of 3</b>: Cr <b>≥1.5 mg/dL</b>, age <b>≥80</b>, weight <b>≤60 kg</b><br>• <b>Rivaroxaban</b> daily (with evening meal): reduce for CrCl <b>30–50</b>; MKSAP advises avoiding CrCl <b>&lt;30</b>, also with moderate liver impairment<br>• <b>Dabigatran</b> BID: avoid CrCl <b>&lt;30</b>; reduce for CrCl 15–30 (US label); caution with P-gp inhibitors<br>• <b>Edoxaban</b> daily: <b>avoid if CrCl &gt;95</b> (less effective); reduce for CrCl 30–50, weight ≤60 kg, or verapamil/quinidine<br>• All: avoid strong CYP3A4/P-gp inducers and inhibitors <i>[MKSAP CV: Arrhythmias]</i>",
"Cardiovascular Medicine|Arrhythmia: DOAC reversal|• Factor Xa inhibitors (apixaban, rivaroxaban, edoxaban), life-threatening bleed → <b>4-factor PCC</b><br>• Dabigatran → <b>idarucizumab</b><br>• No quick routine assay of DOAC effect; shorter half-lives than warfarin <i>[MKSAP CV: Arrhythmias]</i>",
"Cardiovascular Medicine|Arrhythmia: AF plus PCI/ACS — antithrombotic plan|• CHA2DS2-VASc ≥2 with ACS-PCI or DES: needs both anticoagulant and antiplatelet<br>• <b>Triple therapy</b> (OAC + aspirin + P2Y12) only <b>1–4 weeks</b><br>• Then <b>double therapy</b>: DOAC + <b>clopidogrel</b> (or ticagrelor)<br>• After <b>1 year</b>: OAC alone is reasonable<br>• On ≥2 antithrombotics: add a <b>PPI</b>, avoid NSAIDs<br>• AF + <b>stable CAD</b>: <b>rivaroxaban alone</b> as good as plus aspirin, with less bleeding <i>[MKSAP CV: Arrhythmias]</i>",
"Cardiovascular Medicine|Arrhythmia: Rate vs rhythm control in AF|<b>Favors rhythm control</b>: young age; AF &lt;1 yr; <b>HF</b> (esp. HFrEF); highly symptomatic; rate control failed; high CV risk (EAST-AFNET 4 profile)<br><b>Favors rate control</b>: long-standing persistent AF; very old or severe comorbidity; contraindications to antiarrhythmics; asymptomatic with normal heart; multiple failed rhythm attempts<br>• Rate + rhythm gives better symptom control than rate alone; decide with shared decision making <i>[MKSAP CV: Arrhythmias]</i>",
"Cardiovascular Medicine|Arrhythmia: Early rhythm control (EAST-AFNET 4)|• Rhythm control within <b>1 year of diagnosis</b> (drugs or ablation) in high-risk patients ↓ CV death, stroke, HF/ACS hospitalization<br>• High risk = <b>age &gt;75</b> or prior <b>stroke/TIA</b>, or <b>2 of</b>: age &gt;65, female, HF, HTN, diabetes, severe CAD, CKD, LVH <i>[MKSAP CV: Arrhythmias]</i>",
"Cardiovascular Medicine|Arrhythmia: Catheter ablation for AF|• <b>Pulmonary vein isolation</b>; more effective than antiarrhythmic drugs<br>• Now <b>first-line</b> for selected younger (<b>&lt;75</b>), symptomatic patients; slows progression<br>• Works best without big LA or many comorbidities; paroxysmal AF: <b>70–90% symptom-free at 1 yr</b><br>• Risks: thromboembolism <b>0.5–1%</b>, tamponade, vascular (hematoma, pseudoaneurysm, AV fistula, retroperitoneal bleed); rare PV stenosis<br>• <b>Keep anticoagulating per CHA2DS2-VASc</b> after ablation (stopping only in highly selected patients &gt;1 yr out) <i>[MKSAP CV: Arrhythmias]</i>",
"Cardiovascular Medicine|Arrhythmia: AV node ablation (\"ablate and pace\")|• For symptomatic AF tachycardia despite rate and rhythm attempts<br>• Requires a <b>permanent pacemaker</b><br>• Patient <b>stays in AF</b> → <b>still needs anticoagulation</b> <i>[MKSAP CV: Arrhythmias]</i>",
"Cardiovascular Medicine|Arrhythmia: Left atrial appendage occlusion|• For AF patients who <b>can't take long-term anticoagulation</b> (10–25% have contraindications or stop) with CHA2DS2-VASc <b>≥3</b><br>• Percutaneous device or surgical closure<br>• Must tolerate <b>short-term OAC or DAPT</b> while the device endothelializes, then <b>lifelong single antiplatelet</b><br>• Residual risk: peri-device leak, device thrombus <i>[MKSAP CV: Arrhythmias]</i>",
"Cardiovascular Medicine|Arrhythmia: AF with heart failure|• AF complicates ~<b>40%</b> of HF and worsens outcomes<br>• Favor <b>rhythm control</b><br>• <b>Catheter ablation in HFrEF improves survival</b> vs drugs (select patients; less benefit in very advanced disease)<br>• Rate control: β-blocker ± digoxin; <b>no diltiazem/verapamil</b> with low EF <i>[MKSAP CV: Arrhythmias]</i>",
"Cardiovascular Medicine|Arrhythmia: Subclinical (device-detected) AF|• Brief, asymptomatic AF found on implanted devices, monitors, smartwatches<br>• Rarely needs rate control; does progress to AF → address risk factors<br>• Consider anticoagulation if:<br>  – episodes <b>≥24 h</b> and CHA2DS2-VASc <b>≥2</b>, or<br>  – episodes <b>5 min–24 h</b> and CHA2DS2-VASc <b>≥3</b><br>• <b>Cryptogenic stroke + AF &gt;30 s</b> → anticoagulate <i>[MKSAP CV: Arrhythmias]</i>",
"Cardiovascular Medicine|Arrhythmia: Atrial flutter|• Organized macro-reentry, atrial rate <b>250–300/min</b> (often 2:1 → ventricular rate ~150)<br>• <b>Typical</b>: counterclockwise around the tricuspid annulus; <b>sawtooth, negative flutter waves in II, III, aVF</b>, positive in V1<br>• <b>Atypical</b>: after AF ablation or cardiac surgery; harder to ablate<br>• <b>Anticoagulate like AF</b><br>• Rate control is hard (needs high doses) → favor <b>rhythm control</b><br>• <b>Catheter ablation = definitive</b> for typical flutter (<b>&gt;95%</b> success) <i>[MKSAP CV: Arrhythmias]</i>",
"Cardiovascular Medicine|Arrhythmia: PVCs|• Present in up to <b>75%</b> of healthy people; \"skipped\" or forceful beats<br>• More common with HTN, LVH, prior MI, cardiomyopathy<br>• <b>No high-risk features</b> (syncope, family history of premature SCD, structural disease) → <b>reassure</b><br>• Treat if bothersome or frequent: <b>&gt;10% of beats or &gt;10,000/day</b><br>• <b>PVC cardiomyopathy</b> usually with burden &gt;10–15%<br>• 1st line: β-blocker or CCB → <b>ablation</b> if refractory, intolerant, or PVC cardiomyopathy <i>[MKSAP CV: Arrhythmias]</i>",
"Cardiovascular Medicine|Arrhythmia: Wide-complex tachycardia — is it VT?|• QRS <b>≥120 ms</b><br>• With known structural heart disease, <b>95% are VT</b> — no need for more criteria<br>• ECG clues for VT: <b>AV dissociation</b>, <b>fusion beats</b>, <b>capture beats</b><br>• Differential: SVT with aberrancy, antidromic preexcited tachycardia, paced rhythm<br>• <b>If in doubt, treat as VT</b><br>• Normal BP/no symptoms does <b>not</b> exclude VT <i>[MKSAP CV: Arrhythmias]</i>",
"Cardiovascular Medicine|Arrhythmia: Acute treatment of monomorphic VT|• <b>Unstable</b> → immediate <b>DC cardioversion</b> (ACLS); IV <b>amiodarone</b> if it persists or recurs<br>• VT/VF with <b>STEMI</b> → emergency revascularization<br>• <b>Stable</b>, no acute MI → IV <b>procainamide</b> (or amiodarone, sotalol) <i>[MKSAP CV: Arrhythmias]</i>",
"Cardiovascular Medicine|Arrhythmia: VT with structural heart disease — workup and long-term care|• ECG, imaging (echo; <b>cardiac MRI</b> for ARVC, scar, sarcoid, amyloid), ± exercise test<br>• Ischemic cardiomyopathy → angiography/revascularization to reduce ischemia (doesn't fix the VT itself)<br>• GDMT with <b>β-blocker</b><br>• Recurrent VT on β-blocker → other antiarrhythmic or <b>ablation (more effective)</b><br>• <b>ICD for secondary prevention</b> after sustained VT/VF if no reversible cause (acute ischemia, cocaine) <i>[MKSAP CV: Arrhythmias]</i>",
"Cardiovascular Medicine|Arrhythmia: Idiopathic VT|• No structural disease; from <b>outflow tracts</b>, fascicles, or papillary muscles<br>• Palpitations, age 30s–50s; syncope uncommon; triggered by stress, emotion, poor sleep<br>• Benign prognosis; <b>SCD unlikely</b><br>• 1st line: <b>verapamil</b> (or other CCB) and β-blockers → ablation if persistent<br>• <b>ICD generally not needed</b> <i>[MKSAP CV: Arrhythmias]</i>",
"Cardiovascular Medicine|Arrhythmia: Torsades de pointes|• Polymorphic VT from <b>long QT</b> + PVC on the T wave (\"R-on-T\")<br>• Usually acquired: <b>drugs</b> (antidepressants, <b>macrolides</b>, antiarrhythmics etc.), ischemia, <b>low K/Mg</b>; less often congenital<br>• Acute: <b>defibrillation + IV magnesium</b><br>• Recurrent \"storm\": <b>isoproterenol</b> or <b>overdrive pacing</b> to raise the rate<br>• Long term: stop offending drugs, fix electrolytes, revascularize; β-blockers for congenital LQTS <i>[MKSAP CV: Arrhythmias]</i>",
"Cardiovascular Medicine|Arrhythmia: When to suspect an inherited arrhythmia syndrome|• Age <b>&lt;40</b> without ischemic/structural disease and: unexplained cardiac arrest, <b>unexplained near drowning</b>, <b>syncope with exercise</b>, recurrent high-risk syncope<br>• First-degree relative with unexplained death <b>&lt;35 y</b> or sudden death <b>&lt;40 y</b><br>• → refer to cardiology; genetic counseling/testing<br>• Ask whether family deaths were from MI or nonischemic SCD <i>[MKSAP CV: Arrhythmias]</i>",
"Cardiovascular Medicine|Arrhythmia: Long QT syndrome|• Most common inherited arrhythmia (1 in 1,000–5,000)<br>• QTc &gt;<b>440 ms men, &gt;460 ms women</b> is <b>not enough</b> to diagnose — acquired causes (drugs, structural disease, electrolytes) are far more common; refer to specialist<br>• Triggers by subtype: <b>exercise (esp. swimming)</b>, <b>auditory triggers</b> (alarm clock), sleep<br>• Treatment: <b>β-blockers first line</b>, avoid QT-prolonging drugs; select patients ICD, left cardiac <b>sympathectomy</b>, exercise limits<br>• HR &lt;60: use absolute QT rather than QTc <i>[MKSAP CV: Arrhythmias]</i>",

"aki~Acute kidney injury in hospital~Inpatient~20~76F admitted with volume depletion, on an ACE inhibitor, furosemide and ibuprofen. Creatinine has risen from 1.1 to 2.6 over 48 hours. Urine output 0.3 mL/kg/hr. BP 102/58, HR 98.~Recognise the <b>triple whammy</b> — a RAS inhibitor plus a diuretic plus an NSAID — and stop all three; <b>furosemide does not treat AKI</b>, it treats congestion, and giving it to a hypovolaemic patient worsens the injury; you must exclude post-renal obstruction with a bladder scan and consideration of renal ultrasound; and you need the urine indices to distinguish pre-renal from intrinsic — FENa under 1 percent suggests pre-renal, but <b>FENa is unreliable on diuretics so use FEUrea</b>~IV access;Assess volume status carefully;Pulse oximetry;Hold nephrotoxic and volume-depleting medications;Bladder scan to exclude retention~BMP with creatinine and potassium;Urinalysis with microscopy for casts;Urine sodium and FENa, or FEUrea if on diuretics;CBC;Renal ultrasound if obstruction is suspected;Medication review for every nephrotoxin~Restore volume with isotonic crystalloid if hypovolaemic;Hold the RAS inhibitor, diuretic, SGLT2 inhibitor, NSAID and metformin;Relieve obstruction if present;Treat hyperkalaemia if present;Dose-adjust all renally cleared drugs~Serial creatinine and potassium;Strict hourly intake and output;Daily weights;Watch for hyperkalaemia, acidosis and pulmonary oedema~Admit or manage closely as an outpatient depending on severity;Nephrology consult if severe or the cause is unclear;Plan medication restart once euvolaemic — usually restart the RAS inhibitor with monitoring rather than abandon it;Counsel on sick-day rules and NSAID avoidance;Follow-up with repeat labs within 1 to 2 weeks",

"afib~Rapid atrial fibrillation with decompensation~ED~20~72M with palpitations, dyspnoea and light-headedness for 6 hours. HR 148 irregular, BP 104/66, RR 24, SpO2 93 percent. History of hypertension and diabetes, no prior stroke. ECG confirms atrial fibrillation.~Recognise that <b>rate control is the immediate priority in a haemodynamically stable patient</b>, and that if the patient becomes unstable — hypotension, ischaemia, pulmonary oedema or altered mentation — <b>synchronised cardioversion is the answer and no one will ask you about anticoagulation first</b>; note that <b>aspirin is not an acceptable alternative to anticoagulation</b> for stroke prevention, which is a common distractor; remember that <b>cardioversion requires either 3 weeks of prior anticoagulation or a transoesophageal echocardiogram first if the duration exceeds 48 hours or is unknown</b>; and this patient has a CHA2DS2-VASc score of at least 3, which is Class 1 for anticoagulation~IV access;Cardiac monitor;Pulse oximetry;Supplemental oxygen if hypoxaemic;Fingerstick glucose;Assess haemodynamic stability~12-lead ECG;CBC;BMP including potassium and magnesium;TSH;Troponin;Coagulation studies;Echocardiogram;Chest radiograph;Thyroid function tests~Rate control with a beta-blocker or non-dihydropyridine calcium channel blocker, chosen by comorbidity and ejection fraction;Anticoagulation with a DOAC;Treat precipitating factors — infection, thyroid disease, alcohol, electrolyte derangement;Correct potassium and magnesium;Consider rhythm control including early catheter ablation in selected patients~Serial heart rate and rhythm on telemetry;Reassess symptoms and haemodynamics;Monitor for bleeding if anticoagulated;Check renal function before dosing a DOAC~Admit if unstable or rate poorly controlled;Cardiology consult for rhythm strategy;Counsel on anticoagulation duration, bleeding precautions and adherence;Address risk factor modification — alcohol, weight, sleep apnoea, blood pressure;Follow-up appointment scheduled;Guideline-directed treatment of hypertension and diabetes",
"hypothy~Severe hypothyroidism and myxedema~Inpatient~20~68F with months of fatigue, cold intolerance and weight gain, now with increasing somnolence and confusion. HR 52, BP 92/58, temperature 35.4, RR 10 shallow. Dry skin, periorbital oedema, delayed reflexes. TSH markedly elevated with low free T4; sodium 126.~Recognise <b>myxedema coma as a clinical diagnosis that must be treated before confirmation</b> — mortality is high and waiting for labs costs lives; remember the treatment order matters: <b>give stress-dose glucocorticoids until adrenal insufficiency is excluded, because treating with thyroid hormone alone in a patient with coexisting adrenal insufficiency precipitates an adrenal crisis</b>; treat hypothermia with passive rewarming only, and support ventilation rather than stimulating; and note the hyponatraemia is part of the syndrome, correcting with treatment of the hypothyroidism rather than aggressive fluid~Airway assessment and ventilatory support;IV access;Cardiac monitor;Pulse oximetry;Passive rewarming;Continuous temperature monitoring~TSH and free T4;Morning cortisol before steroids if it does not delay treatment;CBC;BMP including sodium;ABG for hypoventilation;ECG for bradycardia and QT prolongation;Thyroid peroxidase antibodies;Consider chest radiograph and blood cultures for a precipitant~<b>Intravenous levothyroxine</b>;Stress-dose glucocorticoids until adrenal insufficiency is excluded;Passive rewarming;Ventilatory support;Treat the precipitant — infection, myocardial infarction, sedatives, cold exposure;Avoid aggressive fluid for the hyponatraemia;Avoid stimulating or invasive rewarming~Recheck temperature and haemodynamics;Serial thyroid function and electrolytes;Cardiac monitoring for arrhythmia;Neurological checks for improvement~Admit to a monitored or intensive setting;Endocrinology consult;Identify and document the precipitant;Counsel on lifelong therapy and adherence;Follow-up with repeat thyroid function in 6 to 8 weeks;Preventive: vaccination, falls assessment, medication review",
"giard~Chronic diarrhoea with malabsorption~Clinic~10~34F with 5 weeks of watery diarrhoea, bloating, fatigue and 4 kg weight loss after a hiking trip where she drank untreated stream water. No blood, no fever. Mild diffuse abdominal tenderness.~Recognise that you must <b>distinguish malabsorptive from inflammatory from osmotic diarrhoea</b> before ordering — greasy bulky stools with weight loss suggests malabsorption, blood and mucus suggests inflammation, and improvement with fasting suggests osmotic; the critical practical point is that <b>a standard stool culture will miss Giardia</b>, so you must specifically request ova and parasites and a Giardia stool antigen; and celiac disease is the other diagnosis not to miss, which requires <b>tissue transglutaminase IgA plus a total IgA</b>, because IgA deficiency causes false negatives~Assess volume status;Review of systems for alarm features;Medication review;Detailed travel and water exposure history~Stool studies including ova and parasites and Giardia antigen;Stool culture;CBC with differential and iron studies;BMP;Celiac serology with tissue transglutaminase IgA and total IgA;TSH;Faecal calprotectin to separate inflammatory from functional;Stool osmotic gap~Treat the identified pathogen;Rehydration and electrolyte replacement;Avoid lactose temporarily if secondary lactase deficiency is suspected;Consider empiric therapy if the diagnosis is strongly suspected while testing is pending;Nutritional support for the weight loss~Weight and symptom diary;Repeat stool studies if symptoms persist;Monitor electrolytes and renal function;Reassess after treatment~Follow up all results, including any referral for endoscopy if the workup is negative;Counsel on safe drinking water when travelling;Follow-up appointment scheduled;Preventive: nutrition review and iron repletion if deficient",
"thyroidca~Thyroid nodule evaluation~Clinic~10~46F with an incidentally found 2.4 cm thyroid nodule on a CT scan performed for another reason. Euthyroid on examination and bloodwork. No compressive symptoms, no hoarseness, no family history of thyroid cancer, no prior neck radiation.~Recognise that the first step is <b>TSH</b>, because a hyperfunctioning nodule essentially never needs biopsy; the ATA size threshold for biopsy is <b>1 cm for a high- or intermediate-suspicion (solid hypoechoic) nodule, 1.5 cm for a low-suspicion solid iso- or hyperechoic nodule and 2 cm for a very-low-suspicion spongiform nodule</b>, so this nodule needs an ultrasound-guided fine-needle aspiration; remember the <b>Bethesda system</b> for reporting cytology and that Bethesda 3 and 4 are indeterminate categories where molecular testing helps guide management; and note that <b>routine thyroid function should be checked before any contrast study</b> in a patient with a nodule~TSH;Free T4 if TSH is abnormal;Dedicated thyroid and neck ultrasound with nodule characterisation;Ultrasound-guided fine-needle aspiration if size and features meet criteria;Cervical lymph node assessment;Calcitonin if medullary carcinoma is a concern~If TSH is suppressed, obtain a radioactive iodine uptake scan rather than biopsying a likely hyperfunctioning nodule;If thyroid function is normal and the nodule has suspicious features, proceed to fine-needle aspiration;Bethesda 5 and 6 go to surgery;Bethesda 3 and 4 consider molecular testing or repeat biopsy~Reassess the nodule with serial ultrasound if a benign aspirate is followed by growth;Monitor thyroid function if suppressed;Document nodule size and features for future comparison~Explain results and the Bethesda category;Surgical referral for Bethesda 5 and 6, or for compressive symptoms;Annual ultrasound surveillance for growth of a benign nodule;Counsel that most nodules are benign;Follow-up appointment scheduled for results and shared decision-making",
"copdasth~Asthma exacerbation in a known asthmatic with poor control~ED~20~24F with known asthma, four prior emergency visits in the past year, now with severe dyspnoea and inability to speak in full sentences. HR 126, RR 32, SpO2 90 percent on room air, peak flow 38 percent of personal best. Audible wheeze. On no controller inhaler, uses albuterol daily.~Recognise that <b>this patient needs inhaled corticosteroid-containing therapy started before discharge, not just a rescue inhaler</b> — GINA recommends against SABA-only treatment at any age, and <b>four exacerbations in a year means the preventive plan has failed, not that the patient is non-compliant</b>; remember that <b>oxygen should not be given unless saturation is below 92 percent</b> and the upper target is 95 percent; <b>over-treatment with SABA causes lactic acidosis</b>, which drives compensatory hyperventilation that can be mistaken for worsening asthma and lead to even more SABA; and <b>spirometry should be measured before discharge to confirm the diagnosis</b>~Assess severity and airway;Controlled oxygen only if SpO2 is below 92 percent;IV access if severe;Fingerstick glucose;Pulse oximetry~Objective severity assessment with peak flow;Spirometry before discharge;ABG if severe or deteriorating;Chest radiograph only if pneumothorax or pneumonia is suspected;CBC~Inhaled SABA in conservative doses with reassessment;Ipratropium for moderate to severe presentation;Systemic corticosteroids;Magnesium sulfate for severe exacerbation;Consider ICS-formoterol as a reliever;Epinephrine first if there are anaphylaxis features;Non-invasive ventilation if in respiratory failure~Review the response after the initial bronchodilator dose rather than writing repeat doses;Serial peak flow;Reassess work of breathing and speech each interval;Watch specifically for SABA toxicity and lactic acidosis~Start or optimise ICS-containing controller therapy — this is the whole point of the case;Inhaler technique with a spacer rechecked;Written asthma action plan;Follow-up appointment within 2 to 7 days;Consider referral to a specialist and biologic assessment if severe;Identify and address the trigger",
"obesity~Obesity with cardiometabolic risk~Clinic~10~48M with a BMI of 38, hypertension, prediabetes and a 10-year ASCVD risk of 11 percent. He has tried diet and exercise on his own without sustained success. BP 146/92, A1c 6.3 percent, LDL-C 138.~Recognise that obesity is a chronic disease requiring a staged, multimodal plan rather than a single intervention; <b>the foundation is an intensive multicomponent behavioural programme with more than 6 months and at least 14 sessions</b>, not generic advice to eat less; <b>pharmacotherapy is appropriate at a BMI of 30 or above, or 27 or above with comorbidity</b>, and a GLP-1 based agent is now among the most effective options; and given the 10-year risk of 11 percent, <b>he is in the high-risk primary prevention category, so a high-intensity statin is recommended with an LDL-C goal below 70</b>~Measure blood pressure with correct technique;Weight and BMI;Screen for obstructive sleep apnoea and depression;Assess diet, activity and readiness to change;Medication review including any weight-promoting agents~Fasting lipid panel;HbA1c;BMP with eGFR and liver enzymes;Urine albumin-to-creatinine ratio;TSH;Screen for obstructive sleep apnoea;CAC scoring if the statin decision remains uncertain;Calculated 10-year ASCVD risk by PREVENT~Intensive multicomponent behavioural intervention over at least 6 months;Pharmacotherapy — a GLP-1 based agent given the comorbidity, or another agent based on cost and access;High-intensity statin with an LDL-C goal below 70 and non-HDL-C below 100;Blood pressure therapy to a target below 130/80;Consider metabolic surgery, which is appropriate for a BMI of 35 or above with comorbidity;Nutrition and exercise counselling~Weight trajectory and waist circumference;Repeat A1c in about 3 months;Monitor lipids after starting the statin;Home blood pressure monitoring;Adverse effects of pharmacotherapy~Referral to a registered dietitian and a structured weight programme;Statin and blood pressure follow-up;Counsel on realistic weight-loss goals and long-term maintenance;Set a specific follow-up interval rather than return as needed;Preventive: age-appropriate screening, immunisations and depression screening;Discuss the trajectory of prediabetes and monitor for progression",
"divert~Acute diverticulitis~ED~20~62F with 2 days of left lower quadrant pain, fever and nausea. HR 102, BP 128/78, T 38.4. Left lower quadrant tenderness with mild guarding, no rebound.~Recognise that <b>uncomplicated diverticulitis may be managed without antibiotics in mild cases</b>, which is a genuine change from older practice; the decision hinges on severity and complications, so <b>CT with contrast is the key study</b> to identify abscess, perforation, obstruction or fistula; <b>avoid colonoscopy during the acute episode</b> because of perforation risk — it is arranged after recovery; and remember the indications for surgery: perforation, generalised peritonitis, or failure to improve on medical management~IV access;Pulse oximetry;Fingerstick glucose;Assess for peritonitis and haemodynamic stability~CT of the abdomen and pelvis with contrast;CBC;BMP;Urinalysis to exclude a urinary source;Blood cultures if febrile;Consider pelvic ultrasound in women if the diagnosis is unclear~IV fluids;Analgesia;Antibiotics covering gram-negatives and anaerobes if complicated, immunocompromised, or systemically unwell;Percutaneous drainage for a large abscess;Surgical consult for perforation or peritonitis;Bowel rest or a low-residue diet during the acute phase~Recheck vitals, temperature and abdominal examination each interval;Serial inflammatory markers;Watch for perforation with a rising lactate and worsening examination;Monitor for obstruction~Admit if complicated or systemically unwell;Surgery consult for complicated disease;Discharge on a low-residue diet with a plan for <b>colonoscopy after recovery</b> to exclude malignancy;Counsel on a high-fibre diet and the symptoms that warrant urgent return;Follow-up appointment scheduled",
"thyroid~Suspected hyperthyroidism with atrial fibrillation~Clinic~10~58M with 3 months of palpitations, weight loss despite good appetite, heat intolerance and tremor. HR 112 irregular, BP 138/76. Diffuse smooth goitre, lid lag, fine tremor. ECG shows atrial fibrillation.~Recognise that <b>TSH is the initial test, and a suppressed TSH points to hyperthyroidism</b>, but you must then obtain free T4 and T3 to grade severity; note the diagnostic distinction — <b>diffuse uptake on a radioactive iodine uptake scan suggests Graves disease, while a high uptake in a single nodule suggests toxic adenoma, and low uptake suggests thyroiditis</b>, and these have entirely different treatments; <b>atrial fibrillation from hyperthyroidism may not rate-control well until the thyroid is treated</b>; and in a patient over 60 with new atrial fibrillation, <b>always check thyroid function</b>, because subclinical hyperthyroidism is a common and reversible cause~TSH;Free T4 and total or free T3;Thyroid stimulating immunoglobulin or TSH receptor antibody;Radioactive iodine uptake scan to distinguish Graves from toxic nodule from thyroiditis;ECG;Echocardiogram for atrial fibrillation and to assess for heart failure;Liver function tests and CBC before antithyroid drugs;Beta-hCG if pregnancy is possible~Antithyroid drug — methimazole is preferred unless the patient is in the first trimester, when propylthiouracil is used;Beta-blocker for symptomatic control and rate control;Anticoagulation for atrial fibrillation based on annual stroke risk;Radioactive iodine ablation or surgery as definitive therapy for Graves disease;Treat the atrial fibrillation and reassess the rhythm once euthyroid~Recheck thyroid function in 4 to 6 weeks;Monitor for agranulocytosis, which presents as a sore throat or fever — check a CBC and stop the drug;Monitor liver function;Reassess heart rate and rhythm;Reassess anticoagulation need once euthyroid~Endocrinology consult;Counsel on radioiodine or surgery as definitive options and the need for lifelong thyroid replacement after ablation;Counsel on the warning symptoms of agranulocytosis;Follow-up appointment in 4 to 6 weeks;Manage the atrial fibrillation with rate and anticoagulation decisions documented;Preventive: bone density assessment given the hyperthyroid state",
"nsclc~Suspected lung cancer~Clinic~10~64M with a 30 pack-year history who quit 3 years ago, presenting with 6 weeks of a persistent cough, haemoptysis and 5 kg weight loss. SpO2 94 percent, right-sided expiratory wheeze. Never had a low-dose CT. On no medications.~Recognise that <b>any haemoptysis with weight loss and a smoking history requires urgent evaluation, and the initial test is a chest radiograph or, better, low-dose CT</b>; note that <b>this patient was eligible for screening — 30 pack-years, quit 3 years ago, age 64, so he meets the criteria of age 50 to 80 with 20 or more pack-years and quitting within 15 years</b>; remember that <b>staging is the priority once cancer is found, because it determines whether the intent is curative or palliative</b>; and <b>do not delay referral waiting for the imaging to return</b> if the clinical suspicion is high~Complete history including occupational and family history;Weight and performance status;Pulse oximetry;Assess for superior vena cava syndrome, hoarseness and bone pain~Chest radiograph then CT of the chest;Low-dose CT screening eligibility review despite this being diagnostic;Complete staging with PET-CT and brain imaging;Sputum cytology or bronchoscopy for tissue and molecular diagnosis;Pulmonary function tests before any planned resection;CBC and comprehensive metabolic panel, including calcium and sodium for paraneoplastic findings~Refer urgently to pulmonology and thoracic oncology;Do not delay referral pending imaging;Tissue sampling for histology and molecular markers;Multidisciplinary tumour board for treatment planning;Treat complications such as hypercalcaemia or obstruction~Surveillance for post-obstructive pneumonia;Monitor for superior vena cava obstruction, spinal cord compression and hypercalcaemia;Reassess performance status and symptoms~Explain the diagnosis and staging clearly and with empathy;Refer to thoracic oncology, radiation oncology and a multidisciplinary tumour board;Discuss goals of
