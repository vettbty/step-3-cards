<script>
var LSK='s3app2',mem={},lok=true;
function gs(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){lok=false;return mem[k]!==undefined?mem[k]:d}}
function ss(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){lok=false;mem[k]=v}}
var S=gs(LSK,{p:{},ccs:[],rev:0});if(!S.p)S.p={};if(!S.ccs)S.ccs=[];
function save(){ss(LSK,S)}
function pcode(){var j=JSON.stringify({v:3,p:S.p,ccs:S.ccs,rev:S.rev});return 'S3P:'+btoa(unescape(encodeURIComponent(j)))}
function pread(t){t=String(t||'').trim();if(!t)return null;var d=null;
 try{if(t.indexOf('S3P:')===0)d=JSON.parse(decodeURIComponent(escape(atob(t.slice(4).replace(/\s+/g,'')))));else d=JSON.parse(t)}catch(e){return null}
 return d&&typeof d==='object'&&d.p&&typeof d.p==='object'?d:null}
function pbetter(a,b){if((a.r||0)!==(b.r||0))return(a.r||0)>(b.r||0);if((a.t||0)!==(b.t||0))return(a.t||0)>(b.t||0);return(a.due||0)>(b.due||0)}
function pmerge(d){var n={add:0,up:0,ccs:0};
 for(var k in d.p){if(!Object.prototype.hasOwnProperty.call(d.p,k))continue;var x=d.p[k];if(!x||typeof x!=='object')continue;
  var m=/^k(\d+)$/.exec(k);if(m&&CD[+m[1]])k=pk(+m[1]);
  if(!S.p[k]){S.p[k]=x;n.add++}else if(pbetter(x,S.p[k])){S.p[k]=x;n.up++}}
 var have={};S.ccs.forEach(function(c){have[c.id+'@'+c.t]=1});
 (d.ccs||[]).forEach(function(c){if(c&&c.id&&!have[c.id+'@'+c.t]){S.ccs.push(c);have[c.id+'@'+c.t]=1;n.ccs++}});
 S.ccs.sort(function(a,b){return a.t-b.t});
 var tot=0;for(var q in S.p)tot+=S.p[q].r||0;S.rev=Math.max(S.rev||0,d.rev||0,tot);save();return n}
function T(m){var t=document.getElementById('tst');t.innerHTML=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(function(){t.style.display='none'},3400)}
function E(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

/* deck|front|back */
var C=[
"Cardiovascular Medicine|Epi & Risk: How common is CVD in US adults, and how does it rank as a cause of death?|<b>Scope of CVD</b>: CAD, stroke/TIA, congenital heart disease, arrhythmias, subclinical atherosclerosis, HF, valve disease, venous disease, PAD.<br><b>Burden</b><br>• <b>#1 cause of death</b> in the US; cardiac disease alone &gt;1 in 5 US deaths (2022); ~1/3 of deaths worldwide<br>• About <b>half</b> of US adults have some form of CVD; <b>&gt;75%</b> of those aged 60–79<br>• Rising since 1990 (men more than women) and premature CVD is increasing<br>• ~<b>6.2 million</b> US adults have HF; HF prevalence projected to grow ~46% (2012→2030)<br><b>Trends</b>: age-adjusted death rates have fallen (CVD ~16% 2007–2017; CAD ~56% 1990–2021).<br><b>Cost</b>: ~4.7 million hospital discharges/year; ~$600+ billion/year, rising steeply in adults ≥65. <i>[MKSAP CV: Epidemiology & Risk Factors]</i>",
"Cardiovascular Medicine|Epi & Risk: How does MI present differently in women, and how do their outcomes compare?|<b>Presentation</b><br>• Chest pain is still the most common anginal symptom in <b>both</b> sexes<br>• Women more often report dyspnea, fatigue, dizziness or abdominal pain → attributed to something else<br>• ~<b>2/3</b> of women who die of MI had no symptoms or unrecognized ones<br><b>Outcomes after ACS</b><br>• Fewer interventions, more complications, higher unadjusted mortality<br>• 1-year mortality after first MI ~<b>23% women vs 18% men</b><br>• Highest MI mortality and CVD prevalence among <b>Black women</b><br><b>Why</b>: unequal access, social factors, institutional and individual bias; women and minorities underrepresented in trials → evidence harder to generalize.<br>CVD kills more women than cancer, diabetes and kidney disease combined. <i>[MKSAP CV: Epidemiology & Risk Factors]</i>",
"Cardiovascular Medicine|Epi & Risk: Traditional CVD risk factors (beyond age and sex)|• <b>Dyslipidemia</b> (high LDL, low HDL)<br>• <b>Tobacco</b> use<br>• <b>Diabetes</b><br>• <b>Hypertension</b><br>• <b>Obesity</b> and <b>CKM syndrome</b><br>• <b>CKD</b><br>• Sedentary behavior / inadequate exercise<br>• Poor <b>sleep</b><br>• Poor <b>diet</b><br>Risk is driven by the <b>combination</b> of factors, which is why multivariable calculators (PREVENT, PCE) are used rather than any single factor. <i>[MKSAP CV: Epidemiology & Risk Factors]</i>",
"Cardiovascular Medicine|Epi & Risk: Nontraditional CVD risk factors|• Elevated <b>apolipoprotein B</b> (atherogenic particle number)<br>• Elevated <b>lipoprotein(a)</b> (≥50 mg/dL; genetic)<br>• <b>Chronic inflammatory</b> disease (RA, SLE, psoriasis, HIV)<br>• <b>Early menopause</b> and adverse pregnancy outcomes<br>• <b>High-risk ancestry</b> (e.g., South Asian, Filipino)<br>• <b>Social determinants</b> of health<br>These are often not captured by risk calculators → used as \"risk enhancers\" to tip borderline/intermediate decisions toward treatment. <i>[MKSAP CV: Epidemiology & Risk Factors]</i>",
"Cardiovascular Medicine|Epi & Risk: Life's Essential 8 (ideal cardiovascular health metrics)|<b>Behaviors</b>: healthy diet • physical activity • no tobacco • healthy sleep<br><b>Factors</b>: healthy weight (energy balance) • optimal lipids • optimal blood pressure • optimal glucose<br>• Very few adults meet all 8<br>• Only ~22.5% of US adults meet both aerobic and strength-training targets<br>• Average intake: &lt;1 cup fruit/day (goal 1.5–2) and &lt;1.5 cups vegetables (goal 2–3)<br><b>Lifelong healthy lifestyle is the single most important way to prevent ASCVD.</b> <i>[MKSAP CV: Epidemiology & Risk Factors]</i>",
"Cardiovascular Medicine|Epi & Risk: Diabetes Prevention Program: what cut diabetes incidence, and by how much?|• Population: adults at <b>high risk</b> of diabetes (prediabetes)<br>• Intervention: diet change + exercise aiming for <b>5–7% weight loss</b><br>• Result: diabetes risk ↓ about <b>58%</b><br>• Lesson: lifestyle change is powerful and is the first step for metabolic risk <i>[MKSAP CV: Epidemiology & Risk Factors]</i>",
"Cardiovascular Medicine|Epi & Risk: Why prioritize smoking cessation, and what is done at each visit?|• Tobacco = <b>leading preventable</b> cause of disease, disability and death in the US; major CVD risk factor<br>• Prevalence falling (~13% of men, ~9% of women smoked in 2023)<br>• Benefit of quitting: after ~<b>15 years</b>, most former smokers' HF and death risk approaches never-smokers<br><b>At every visit</b>: ask about tobacco; offer <b>counseling + pharmacotherapy</b> (NRT, varenicline, bupropion) to all who smoke. <i>[MKSAP CV: Epidemiology & Risk Factors]</i>",
"Cardiovascular Medicine|Epi & Risk: Recommended nightly sleep for cardiovascular health|• Adults: <b>7–9 hours</b> per night<br>• Poor sleep hygiene ↑ CVD risk and contributes to depression/anxiety<br>• Sleep is now one of the Life's Essential 8 metrics <i>[MKSAP CV: Epidemiology & Risk Factors]</i>",
"Cardiovascular Medicine|Epi & Risk: Depression, anxiety and anger: effect on CVD, and does treating them lower CV risk?|• Depression, anxiety and anger → <b>worse CV outcomes</b>; depression linked to more CV events<br>• Psychosocial stress worsens adherence to treatment and lifestyle after an event<br>• Screen and treat for the patient's sake, but <b>no evidence</b> that detecting/treating them lowers CV risk itself <i>[MKSAP CV: Epidemiology & Risk Factors]</i>",
"Cardiovascular Medicine|Epi & Risk: Which lipid markers independently predict CVD?|• ~1 in 4 US adults has high cholesterol; &gt;3 million deaths/year worldwide attributed to it<br>• <b>High LDL-C</b> and <b>low HDL-C</b>: each independently ↑ CVD risk<br>• <b>apoB</b> and <b>Lp(a)</b> add predictive value beyond LDL<br>• Lowering cholesterol lowers risk (primary and secondary prevention) <i>[MKSAP CV: Epidemiology & Risk Factors]</i>",
"Cardiovascular Medicine|Epi & Risk: Hypertension threshold, prevalence, sex pattern and population attributable risk|• Definition: BP <b>≥130/80</b> mm Hg<br>• Prevalence ~<b>46%</b> of adults ≥20 y<br>• More common in <b>men before 45</b>; in <b>women after 65</b><br>• Population attributable risk: <b>48% of strokes</b>, <b>32% of HF</b><br>• Treatment ↓ stroke, HF and kidney disease<br>• Early detection and control could cut CVD mortality ~30% in men and ~38% in women <i>[MKSAP CV: Epidemiology & Risk Factors]</i>",
"Cardiovascular Medicine|Epi & Risk: Diabetes and CVD: key facts|• Diabetes is an <b>independent indication for a statin</b><br>• ~<b>68%</b> of people with diabetes eventually die of heart disease<br>• ↑ ischemic stroke at all ages; relative risk highest <b>before 65</b> (RR &gt;5)<br>• CAD is more <b>extensive</b>, more often <b>multivessel</b><br>• Worse outcomes in any CVD hospitalization<br>• <b>SGLT2 inhibitors</b> and <b>GLP-1 receptor agonists</b> have proven CV benefit<br>→ Start risk reduction <b>earlier and more aggressively</b> than in people without diabetes <i>[MKSAP CV: Epidemiology & Risk Factors]</i>",
"Cardiovascular Medicine|Epi & Risk: Metabolic syndrome criteria|Diagnosis = any <b>3 of 5</b>:<br>1. Elevated fasting glucose (hallmark = <b>glucose intolerance</b>)<br>2. <b>Central</b> (abdominal) obesity<br>3. Low HDL<br>4. Elevated triglycerides<br>5. Elevated BP<br>• ~<b>1/3</b> of US adults qualify<br>• ↑ risk of CVD and diabetes, rising with each added component<br>• Obesity is rising (~42% of adults; class III, BMI &gt;40, ~9%) and can raise CVD risk even without metabolic abnormalities <i>[MKSAP CV: Epidemiology & Risk Factors]</i>",
"Cardiovascular Medicine|Epi & Risk: What is cardiovascular-kidney-metabolic (CKM) syndrome?|• A unifying construct: <b>metabolic</b> risk (obesity, metabolic syndrome, diabetes) + <b>CKD</b> + <b>CVD</b>, recognizing they drive one another<br>• Broader than metabolic syndrome<br>• Its components (eGFR, albuminuria, HbA1c, BMI) are built into the <b>PREVENT</b> equations<br>• Listed as an ASCVD <b>risk enhancer</b> in the 2026 dyslipidemia guideline <i>[MKSAP CV: Epidemiology & Risk Factors]</i>",
"Cardiovascular Medicine|Epi & Risk: Sex-specific (reproductive) factors that raise a woman's CVD risk|<b>Pregnancy-related</b><br>• Preeclampsia<br>• Gestational hypertension<br>• Gestational diabetes<br>• Preterm delivery or low-birth-weight infant<br><b>Other</b><br>• <b>Early / premature menopause</b><br>• <b>Polycystic ovary syndrome</b><br>Ask about these in every woman's CV risk assessment; they count as risk enhancers when deciding on a statin. <i>[MKSAP CV: Epidemiology & Risk Factors]</i>",
"Cardiovascular Medicine|Epi & Risk: Definition of premature CAD in a family history, and the risk it confers|• Premature = onset in a parent or sibling at <b>&lt;55 y in men</b> or <b>&lt;65 y in women</b><br>• Parental premature CAD → MI risk about <b>doubled in men</b> and <b>~70% higher in women</b><br>• Reflects shared genes <b>and</b> shared lifestyle<br>• Often <b>not included</b> in risk calculators → acts as a risk enhancer <i>[MKSAP CV: Epidemiology & Risk Factors]</i>",
"Cardiovascular Medicine|Epi & Risk: Family history of stroke or AF: how much does it raise risk?|• Stroke in a first-degree relative → own stroke risk ~<b>+50%</b><br>• Parental atrial fibrillation → odds of AF ~<b>+80%</b><br>• Genetic contribution is usually missing from risk calculators <i>[MKSAP CV: Epidemiology & Risk Factors]</i>",
"Cardiovascular Medicine|Epi & Risk: ASCVD risk enhancers (2026 ACC/AHA dyslipidemia guideline)|<b>History / demographics</b><br>• Premature ASCVD in parent or sibling (men &lt;55, women &lt;65)<br>• Higher-risk ancestry (South Asian, Filipino)<br>• High polygenic risk score (if measured)<br><b>Conditions</b><br>• Chronic inflammatory disease: SLE, RA, advanced psoriasis, inflammatory arthritis<br>• CKM syndrome<br>• Reproductive markers: premature menopause, preeclampsia, gestational diabetes, gestational HTN, preterm delivery<br><b>Labs</b>: see the lab-threshold card<br>Use: tip borderline or intermediate risk toward starting/intensifying a statin. <i>[MKSAP CV: Epidemiology & Risk Factors]</i>",
"Cardiovascular Medicine|Epi & Risk: Lab thresholds that count as ASCVD risk enhancers|• <b>Lp(a) ≥50 mg/dL</b> (≥125 nmol/L)<br>• <b>hsCRP ≥2 mg/L</b> on more than one occasion<br>• <b>Triglycerides</b> persistently ≥175 mg/dL nonfasting or ≥150 mg/dL fasting<br>• <b>LDL-C</b> persistently 160–189 mg/dL, <b>non-HDL-C</b> 190–219 mg/dL, or <b>apoB ≥120 mg/dL</b> <i>[MKSAP CV: Epidemiology & Risk Factors]</i>",
"Cardiovascular Medicine|Epi & Risk: Which risk tool does the 2026 ACC/AHA dyslipidemia guideline recommend, and why?|<b>PREVENT</b> (AHA Predicting Risk of CVD Events) equations, ages 30–79:<br>• <b>Sex-specific</b> and <b>race-free</b> (race is a social, not biologic, variable)<br>• Estimates <b>10-year and 30-year</b> risk<br>• Adds <b>kidney function</b> (eGFR) to routine assessment<br>• Optional CKM variables (albuminuria, HbA1c) and social-deprivation index<br>• Outcomes include <b>total CVD</b> (ASCVD <b>+ heart failure</b>), not just ASCVD<br>Recommended for its validity and individualized estimates; use is expected to grow. <i>[MKSAP CV: Epidemiology & Risk Factors]</i>",
"Cardiovascular Medicine|Epi & Risk: Pooled Cohort Equations: what they estimate and who endorses them|• ACC/AHA tool from several diverse community cohorts<br>• Estimates <b>10-year ASCVD</b> risk (MI, CHD death, stroke)<br>• For adults <b>40–75 y</b> without ASCVD<br>• Recommended by the <b>USPSTF</b> to guide statin decisions<br>• Problem: <b>race</b> is an input → overestimates/misclassifies some groups; ACC/AHA now favors <b>PREVENT</b> <i>[MKSAP CV: Epidemiology & Risk Factors]</i>",
"Cardiovascular Medicine|Epi & Risk: Framingham vs Reynolds vs MESA risk scores|• <b>Framingham</b>: 10-y risk of hard CHD events (MI, coronary death) from age, sex, SBP, total cholesterol, HDL, smoking, diabetes<br>• <b>Reynolds</b>: <b>sex-specific</b>; adds <b>family history</b> and <b>hsCRP</b><br>• <b>MESA</b>: traditional factors + <b>coronary artery calcium</b> score (includes race)<br>• Others that include race: PCE, STS cardiac surgery risk calculator <i>[MKSAP CV: Epidemiology & Risk Factors]</i>",
"Cardiovascular Medicine|Epi & Risk: Tests and history that can refine borderline CV risk|• <b>CKD</b> (eGFR, albuminuria)<br>• <b>hsCRP</b> (≥2 mg/L)<br>• <b>Ankle-brachial index</b> (&lt;0.9 = PAD)<br>• <b>Family history</b> of premature CAD<br>• <b>Coronary artery calcium</b> score (0 may allow deferring a statin; &gt;0, especially &gt;100, favors treatment)<br>Use when the calculated risk leaves the decision uncertain. <i>[MKSAP CV: Epidemiology & Risk Factors]</i>",
"Cardiovascular Medicine|Epi & Risk: PAD and coronary disease: overlap and risk|• Same risk factors as CAD: <b>smoking</b>, <b>diabetes</b>, dyslipidemia (plus HTN, age)<br>• &gt;<b>40%</b> of CAD patients also have PAD<br>• PAD → CAD risk ~<b>+45%</b>, stroke risk ~<b>+35%</b><br>• Clinically significant PAD = <b>ABI &lt;0.9</b>: ~<b>2.5×</b> the prevalence of MI, more extensive CAD, worse outcomes after MI<br>→ PAD counts as clinical ASCVD: treat with secondary-prevention intensity <i>[MKSAP CV: Epidemiology & Risk Factors]</i>",
"Cardiovascular Medicine|Epi & Risk: CKD and cardiovascular risk|• CKD ↑ CVD incidence and worsens CV outcomes<br>• Incidence per 1000 person-years with vs without CKD: <b>CAD 24.5 vs 8.4</b>, <b>stroke 13.4 vs 4.8</b> (~3×)<br>• On <b>dialysis</b>: CV death risk <b>5–30×</b> higher than matched patients with normal kidney function<br>• Unclear whether CKD-specific prevention beyond standard BP, lipid and diabetes management changes risk<br>• eGFR is built into PREVENT <i>[MKSAP CV: Epidemiology & Risk Factors]</i>",
"Cardiovascular Medicine|Epi & Risk: Rheumatoid arthritis and SLE: how much is CAD risk raised, and why?|• <b>RA</b>: CAD risk ~<b>60% higher</b><br>• <b>SLE</b>: CAD risk about <b>doubled</b><br><b>Mechanisms beyond traditional factors</b><br>• Systemic inflammation<br>• Prothrombotic state<br>• Insulin resistance<br>• <b>Glucocorticoids</b> and other immunosuppressants<br>→ Chronic inflammatory disease is a risk enhancer; strongly consider lipid-lowering therapy (especially RA). <i>[MKSAP CV: Epidemiology & Risk Factors]</i>",
"Cardiovascular Medicine|Epi & Risk: HIV: risk-enhancing factors for CVD and what to do|HIV risk enhancers can make true risk <b>1.5–2×</b> the calculated estimate:<br>• Prolonged viremia or <b>delayed ART</b><br>• Low current or nadir <b>CD4 &lt;350/µL</b><br>• <b>Treatment failure</b> or nonadherence<br>Even with suppressed virus and normal CD4: <b>HCV coinfection</b>, ART-related <b>metabolic syndrome</b>, <b>lipodystrophy/lipoatrophy</b>, fatty liver.<br><b>Management</b>: intensive lifestyle change, <b>statin</b> (recommended for all aged 40–75 with HIV regardless of risk score), or specialist referral; check ART–statin interactions. <i>[MKSAP CV: Epidemiology & Risk Factors]</i>",
"Cardiovascular Medicine|Lipids: When to start lipid screening: USPSTF vs 2026 ACC/AHA|<b>USPSTF</b><br>• Screen all adults <b>40–75</b><br>• Calculate 10-y ASCVD risk with the <b>Pooled Cohort Equations</b><br><b>2026 ACC/AHA multisociety guideline</b><br>• Start at age <b>19</b>; repeat at least every <b>5 years</b><br>• Ages <b>30–75</b>: use <b>PREVENT</b> for 10- and 30-year ASCVD risk (sex-specific, race-free)<br>• Children: screen once at 9–11 y for FH<br><b>Other reasons to check lipids</b>: suspected FH, adherence/response on therapy, complications such as pancreatitis. <i>[MKSAP CV: Dyslipidemia]</i>",
"Cardiovascular Medicine|Lipids: Familial hypercholesterolemia screening in children (2026 ACC/AHA)|Screen <b>all children once at 9–11 y</b>; earlier if family history of FH, severe hypercholesterolemia or premature ASCVD. <i>[MKSAP CV: Dyslipidemia]</i>",
"Cardiovascular Medicine|Lipids: Is a fasting lipid panel needed?|Usually <b>no</b> for screening. Consider fasting for familial dyslipidemia, family history of premature ASCVD, or diagnosing hypertriglyceridemia (especially TG &gt;400). <i>[MKSAP CV: Dyslipidemia]</i>",
"Cardiovascular Medicine|Lipids: Secondary causes of high LDL to rule out|Check in <b>every</b> patient with high LDL before labeling it primary:<br>• <b>Hypothyroidism</b> (TSH)<br>• <b>Poorly controlled diabetes</b><br>• <b>Nephrotic syndrome</b> (urine protein, albumin)<br>• <b>Drugs</b>: glucocorticoids, diuretics (thiazides), amiodarone<br>(Other classic causes: cholestasis, e.g., primary biliary cholangitis; anorexia; pregnancy.)<br>Treating the cause may normalize LDL. <i>[MKSAP CV: Dyslipidemia]</i>",
"Cardiovascular Medicine|Lipids: When is genetic testing for familial hypercholesterolemia reasonable in adults?|• LDL <b>&gt;190</b> mg/dL<br>• Consider at LDL 160–189 if higher risk (first-degree relative with similar LDL or premature CAD) <i>[MKSAP CV: Dyslipidemia]</i>",
"Cardiovascular Medicine|Lipids: Causes of hypertriglyceridemia|• Diabetes • obesity • hypothyroidism<br>• Excess alcohol • high sugar intake<br>• Drugs: glucocorticoids, <b>protease inhibitors</b>, estrogens (also β-blockers)<br>TG ≥500 with no cause → evaluate for <b>familial</b> hypertriglyceridemia <i>[MKSAP CV: Dyslipidemia]</i>",
"Cardiovascular Medicine|Lipids: At what triglyceride level does pancreatitis risk appear, and when should TG be checked in pancreatitis?|• TG <b>&gt;500–1000</b> mg/dL (chylomicronemia) can cause acute pancreatitis<br>• Check TG in pancreatitis without a clear cause (no gallstones, no alcohol) <i>[MKSAP CV: Dyslipidemia]</i>",
"Cardiovascular Medicine|Lipids: HDL: role in risk and in treatment|• Higher HDL is <b>protective</b>; low HDL independently ↑ risk and is used in risk calculators<br>• Weaker predictor than LDL<br>• Raising HDL with drugs (niacin, CETP inhibitors) has <b>not reduced events</b> in RCTs → <b>not recommended</b><br>• Raise it with lifestyle: exercise, weight loss, stopping smoking <i>[MKSAP CV: Dyslipidemia]</i>",
"Cardiovascular Medicine|Lipids: Non-HDL cholesterol: how calculated and why useful|<b>Total cholesterol − HDL</b> = cholesterol in all atherogenic particles. Tracks risk at least as well as LDL; especially useful for judging <b>response to therapy</b>. <i>[MKSAP CV: Dyslipidemia]</i>",
"Cardiovascular Medicine|Lipids: ApoB: what it measures and its two main uses|• One apoB per atherogenic particle (LDL, VLDL, Lp(a)) = <b>particle count</b><br>• Better risk marker than LDL in ASCVD, T2DM, high TG, CKM syndrome<br>• Uses: refine risk in untreated patients; decide on <b>intensifying</b> therapy once LDL and non-HDL goals are met <i>[MKSAP CV: Dyslipidemia]</i>",
"Cardiovascular Medicine|Lipids: Lp(a): key facts|• LDL-like particle; risk rises in proportion to level, sharply above <b>50 mg/dL (125 nmol/L)</b><br>• Risk is <b>independent of LDL</b><br>• Largely <b>genetic</b>; diet and exercise barely change it<br>• <b>Measure at least once in every adult's lifetime</b><br>• Lp(a)-targeted drugs are still in outcome trials<br>• Elevated Lp(a) → standard lipid-lowering therapy (lower LDL further) + aggressive control of all other risk factors; counts as a risk enhancer <i>[MKSAP CV: Dyslipidemia]</i>",
"Cardiovascular Medicine|Lipids: Heart-healthy diet for dyslipidemia|• More: fruits, vegetables, nuts, seeds, legumes, whole grains, fiber, poly- and monounsaturated fats<br>• Less: saturated and trans fat, simple carbs, red meat<br>• Saturated fat <b>&lt;6% of calories</b> if high CV risk<br>• Models: DASH, Mediterranean; refer to dietitian or behavioral program <i>[MKSAP CV: Dyslipidemia]</i>",
"Cardiovascular Medicine|Lipids: Exercise recommendation (ACC/AHA)|≥<b>150 min/week moderate</b> or ≥<b>75 min/week vigorous</b> activity, plus muscle strengthening ≥<b>2 days/week</b>. <i>[MKSAP CV: Dyslipidemia]</i>",
"Cardiovascular Medicine|Lipids: High- vs moderate-intensity statin doses|• <b>High</b> (LDL ↓ ≥50%): atorvastatin <b>40–80</b>, rosuvastatin <b>20–40</b><br>• <b>Moderate</b> (↓30–49%): atorva 10–20, rosuva 5–10, simva 20–40, prava 40–80, lova 40–80, fluva 40 bid, pitava 1–4 <i>[MKSAP CV: Dyslipidemia]</i>",
"Cardiovascular Medicine|Lipids: Which add-on drugs are NOT recommended to lower LDL on top of a statin?|<b>Fibrates, niacin and dietary supplements</b>. (Fibrates still have a role in severe hypertriglyceridemia.) <i>[MKSAP CV: Dyslipidemia]</i>",
"Cardiovascular Medicine|Lipids: Ezetimibe: LDL effect and adverse effects|• Mechanism: blocks intestinal cholesterol absorption (NPC1L1)<br>• LDL ↓ ~20–25% added to a statin<br>• <b>Proven ASCVD event reduction</b> as a statin add-on<br>• Cheap, oral → usually the <b>first add-on</b> when LDL goal not met<br>• AEs: diarrhea, arthralgia, abdominal pain, myositis; ↑ aminotransferases when combined with a statin <i>[MKSAP CV: Dyslipidemia]</i>",
"Cardiovascular Medicine|Lipids: PCSK9 monoclonal antibodies (alirocumab, evolocumab)|• SC injection every 2–4 weeks; block PCSK9 → more LDL receptors<br>• <b>Largest LDL drop</b> of the add-on drugs (~50–60%)<br>• <b>Proven ASCVD event reduction</b><br>• Use: high-risk or ASCVD patients not at goal on max statin ± ezetimibe; LDL ≥190; FH; statin intolerance<br>• AEs: nasopharyngitis, injection-site reactions, possible cognitive effects<br>• Expensive <i>[MKSAP CV: Dyslipidemia]</i>",
"Cardiovascular Medicine|Lipids: Inclisiran: what it is and where it fits|PCSK9-directed <b>siRNA</b> injection. Large LDL drop, outcome benefit not yet established. Use when a PCSK9 antibody is unavailable or not tolerated.<br>AEs: injection-site reactions, arthralgia, UTI, diarrhea, bronchitis. <i>[MKSAP CV: Dyslipidemia]</i>",
"Cardiovascular Medicine|Lipids: Bempedoic acid: role and adverse effects|• Oral; inhibits ATP citrate lyase (upstream of HMG-CoA reductase), active in liver only → little muscle toxicity<br>• LDL ↓ ~15–25%<br>• Reduces CV events in <b>statin-intolerant</b> patients<br>• AEs: <b>hyperuricemia/gout</b>, <b>tendon rupture</b>, muscle spasms, back/limb/abdominal pain, <b>anemia</b>, ↑ liver enzymes<br>• Avoid with gout or prior tendon disorders <i>[MKSAP CV: Dyslipidemia]</i>",
"Cardiovascular Medicine|Lipids: Bile acid sequestrants: key caveats|Moderate LDL drop (cholestyramine has outcome data).<br>• Constipation, bloating<br>• <b>Interfere with absorption of other drugs</b><br>• <b>Raise TG</b> if TG already high → avoid in hypertriglyceridemia <i>[MKSAP CV: Dyslipidemia]</i>",
"Cardiovascular Medicine|Lipids: Icosapent ethyl: effect and adverse effects|• Highly purified <b>EPA</b> (prescription fish oil)<br>• Lowers TG; no meaningful LDL effect<br>• <b>Reduces ASCVD events</b> (the only TG-focused drug with outcome benefit)<br>• Indication: age ≥50, TG 150–499 on max statin with LDL &lt;100, plus ASCVD or diabetes + another risk factor<br>• AEs: <b>atrial fibrillation</b>, <b>pneumonia</b> (also bleeding)<br>• OTC fish-oil supplements do <b>not</b> reduce events <i>[MKSAP CV: Dyslipidemia]</i>",
"Cardiovascular Medicine|Lipids: PREVENT 10-year risk categories (2026 ACC/AHA, ages 30–79, LDL 70–189, no diabetes)|• <b>High ≥10%</b><br>• <b>Intermediate 5 to &lt;10%</b><br>• <b>Borderline 3 to &lt;5%</b><br>• <b>Low &lt;3%</b> <i>[MKSAP CV: Dyslipidemia]</i>",
"Cardiovascular Medicine|Lipids: Primary prevention, high risk (PREVENT ≥10%): statin and goals|<b>High-intensity statin</b>. Goals: LDL ↓ ≥50%, <b>LDL &lt;70</b>, <b>non-HDL &lt;100</b>.<br>Not at goal → add <b>ezetimibe</b> → then PCSK9 mAb or bempedoic acid. <i>[MKSAP CV: Dyslipidemia]</i>",
"Cardiovascular Medicine|Lipids: Primary prevention, intermediate risk (5 to &lt;10%): statin and goals|At least <b>moderate-intensity statin</b> (high intensity if upper end). Goals: LDL ↓ 30–50%, <b>LDL &lt;100</b>, <b>non-HDL &lt;130</b>.<br>Unsure? <b>CAC score</b> (men ≥40, women ≥45). <i>[MKSAP CV: Dyslipidemia]</i>",
"Cardiovascular Medicine|Lipids: Primary prevention, borderline risk (3 to &lt;5%): approach|Moderate-intensity statin is <b>reasonable</b>. Goals: LDL ↓ ≥30%, LDL &lt;100, non-HDL &lt;130.<br>Risk enhancers tip the decision; <b>hsCRP ≥2</b> → high-intensity statin. CAC 0 → may defer. <i>[MKSAP CV: Dyslipidemia]</i>",
"Cardiovascular Medicine|Lipids: Primary prevention, low risk (&lt;3%): when is a statin still reasonable?|Lifestyle alone for most. Moderate-intensity statin is reasonable at ages 30–59 if <b>LDL 160–189</b> or <b>30-year risk ≥10%</b>. <i>[MKSAP CV: Dyslipidemia]</i>",
"Cardiovascular Medicine|Lipids: How does a coronary artery calcium (CAC) score change statin decisions?|• For intermediate or borderline risk when undecided<br>• <b>CAC 0</b> (and no smoking, FH, family history of premature ASCVD, or diabetes over 40) → may defer statin; repeat CAC in <b>3–7 y</b><br>• <b>CAC &gt;0</b>, especially <b>&gt;100</b> → start lipid lowering<br>• Age &gt;75: defer if CAC ≤10 <i>[MKSAP CV: Dyslipidemia]</i>",
"Cardiovascular Medicine|Lipids: USPSTF statin recommendation for primary prevention|Ages <b>40–75</b>, no ASCVD, ≥1 risk factor (dyslipidemia, diabetes, HTN, smoking):<br>• 10-y risk <b>≥10%</b> → moderate-intensity statin (<b>grade B</b>)<br>• <b>7.5–10%</b> → selectively offer (<b>grade C</b>) <i>[MKSAP CV: Dyslipidemia]</i>",
"Cardiovascular Medicine|Lipids: Diabetes-specific risk factors that push toward statin therapy|• Long duration (≥10 y T2DM, ≥20 y T1DM)<br>• Albuminuria ≥30 mg/g or eGFR &lt;60<br>• Retinopathy • neuropathy<br>• <b>ABI &lt;0.9</b> <i>[MKSAP CV: Dyslipidemia]</i>",
"Cardiovascular Medicine|Lipids: Diabetes age 20–39: when to start a statin (ACC/AHA)|Moderate-intensity statin if diabetes-specific risk factors are present; at 30–39 also if 10-y risk ≥3% or 30-y risk ≥10%. Otherwise focus on healthy behaviors. <i>[MKSAP CV: Dyslipidemia]</i>",
"Cardiovascular Medicine|Lipids: Diabetes age 40–75: statin intensity and goals|• No multiple risk factors and 10-y risk &lt;10% → <b>moderate</b>: LDL &lt;100, non-HDL &lt;130 (optional apoB &lt;90)<br>• Multiple risk factors or risk ≥10% → <b>high</b>: LDL ↓ ≥50%, <b>LDL &lt;70</b>, non-HDL &lt;100 (optional apoB &lt;70); add ezetimibe or PCSK9 mAb if short<br>• TG 150–500 with LDL &lt;100 → add <b>icosapent ethyl</b> <i>[MKSAP CV: Dyslipidemia]</i>",
"Cardiovascular Medicine|Lipids: Statin for diabetes over age 75|Risk-benefit discussion; consider a <b>moderate-intensity</b> statin (ACC/AHA and ADA agree). <i>[MKSAP CV: Dyslipidemia]</i>",
"Cardiovascular Medicine|Lipids: LDL ≥190 mg/dL: treatment and goals|<b>High-intensity statin</b> regardless of calculated risk.<br>• No other risk factors/subclinical ASCVD/FH: <b>LDL &lt;100</b>, non-HDL &lt;130<br>• With them: <b>LDL &lt;70</b>, non-HDL &lt;100<br>Add ezetimibe, PCSK9 mAb (or inclisiran) or bempedoic acid as needed. <i>[MKSAP CV: Dyslipidemia]</i>",
"Cardiovascular Medicine|Lipids: Which conditions count as clinical ASCVD (secondary prevention)?|• ACS, prior MI, stable or unstable angina<br>• Coronary or other arterial revascularization<br>• Stroke or TIA<br>• Peripheral artery disease<br>• <b>Aortic aneurysm</b> <i>[MKSAP CV: Dyslipidemia]</i>",
"Cardiovascular Medicine|Lipids: Who is \"very high risk\" ASCVD (2026 ACC/AHA)?|<b>2 major events</b>, or <b>1 major event + ≥2 high-risk conditions</b>.<br>• Major: ACS within 12 mo, prior MI, ischemic stroke, symptomatic PAD<br>• High-risk: age ≥65, CABG/PCI, current smoking, diabetes, HF, HTN, LDL ≥100 despite statin + ezetimibe <i>[MKSAP CV: Dyslipidemia]</i>",
"Cardiovascular Medicine|Lipids: Secondary prevention, NOT very high risk: statin and goals|High-intensity statin (age ≤75). Goals: LDL ↓ ≥50%, <b>LDL &lt;70</b>, <b>non-HDL &lt;100</b> (optional: LDL &lt;55, non-HDL &lt;85, apoB &lt;70).<br>Short → ezetimibe, PCSK9 mAb or bempedoic acid; inclisiran if mAb not possible. <i>[MKSAP CV: Dyslipidemia]</i>",
"Cardiovascular Medicine|Lipids: Secondary prevention, VERY high risk: statin and goals|High-intensity statin. Goals: <b>LDL &lt;55</b>, <b>non-HDL &lt;85</b>.<br>Short → add <b>ezetimibe or PCSK9 mAb</b> (inclisiran if mAb unavailable) → still short or apoB ≥55 → add <b>bempedoic acid</b>. <i>[MKSAP CV: Dyslipidemia]</i>",
"Cardiovascular Medicine|Lipids: Can't tolerate a high-intensity statin in ASCVD: what next?|Use a <b>moderate-intensity</b> (max tolerated) statin; add nonstatin therapy if still above LDL goal. <i>[MKSAP CV: Dyslipidemia]</i>",
"Cardiovascular Medicine|Lipids: When to recheck lipids after starting therapy, and then?|Lipid panel <b>4–12 weeks</b> after starting; if response is poor, check adherence and lifestyle. Once at goal, every <b>6–12 months</b>. <i>[MKSAP CV: Dyslipidemia]</i>",
"Cardiovascular Medicine|Lipids: Statin monitoring: which labs at baseline and during therapy?|<b>Before starting</b>: lipid panel and <b>baseline liver chemistry</b> tests.<br><b>On therapy</b>: do <b>not</b> routinely recheck liver tests or CK unless symptoms of liver injury or myopathy.<br><b>Safety numbers</b><br>• Asymptomatic dose-related aminotransferase rise ~1%<br>• Clinically significant liver injury <b>&lt;0.001%</b><br>• Muscle symptoms ≤1% in RCTs (higher in observational data, mostly nocebo)<br>• Myopathy/rhabdomyolysis <b>&lt;0.1%</b> <i>[MKSAP CV: Dyslipidemia]</i>",
"Cardiovascular Medicine|Lipids: Statin adverse effects beyond muscle and liver|• New T2DM ~0.2%/year (mainly if already at risk)<br>• Possible ↑ hemorrhagic stroke after prior cerebrovascular disease, but total stroke ↓<br>• Interactions raise statin levels → myopathy (e.g., fibrates); also with dabigatran; <b>↑ INR on warfarin</b><br>• Avoid in pregnancy <i>[MKSAP CV: Dyslipidemia]</i>",
"Cardiovascular Medicine|Lipids: Statin intolerance: stepwise approach|1. Stop to see if symptoms resolve (most AEs reverse)<br>2. <b>Switch to another statin</b><br>3. Lower dose and/or dose less often<br>4. Least preferred: stop statin, use nonstatin drugs <i>[MKSAP CV: Dyslipidemia]</i>",
"Cardiovascular Medicine|Lipids: Hypertriglyceridemia: lifestyle cornerstone|• Cut sugar, total fat, <b>alcohol</b>; 5–10% weight loss<br>• 150 min moderate / 75 min vigorous + resistance 2×/week<br>• Stop TG-raising drugs if possible (estrogens, β-blockers, glucocorticoids)<br>• Eat fish; OTC omega-3 supplements do <b>not</b> lower CV events <i>[MKSAP CV: Dyslipidemia]</i>",
"Cardiovascular Medicine|Lipids: TG 150–499, no ASCVD or diabetes (age 40–75): management focus|Calculate PREVENT risk and treat to <b>LDL and non-HDL goals</b> with a statin. TG-specific drugs are not the priority. <i>[MKSAP CV: Dyslipidemia]</i>",
"Cardiovascular Medicine|Lipids: Severe hypertriglyceridemia: drug choices by level|• Persistent <b>≥500</b>: add <b>fibrate (fenofibrate preferred)</b> or prescription omega-3 to prevent pancreatitis; fibrates lower TG 30–50%<br>• <b>≥1000</b>: refer to lipid specialist; fibrate, Rx omega-3, or <b>olezarsen</b> (familial chylomicronemia) <i>[MKSAP CV: Dyslipidemia]</i>",
"Cardiovascular Medicine|Lipids: Who gets icosapent ethyl?|Age <b>≥50</b> with persistent high TG (150–499) on max statin with LDL &lt;100, and either <b>ASCVD</b> or <b>diabetes + ≥1 other risk factor</b>. In ASCVD, first push LDL below 55 / non-HDL below 85. <i>[MKSAP CV: Dyslipidemia]</i>",
"Cardiovascular Medicine|Lipids: Statins after age 75|• Primary prevention (LDL 70–189): shared decision; start moderate intensity; CAC ≤10 → may defer<br>• Reasonable to skip or stop with frailty, functional decline, multimorbidity or limited life expectancy<br>• Secondary prevention: <b>continue</b> if tolerated; same goals as younger patients <i>[MKSAP CV: Dyslipidemia]</i>",
"Cardiovascular Medicine|Lipids: Statins in pregnancy and breastfeeding|• Not proven harmful, not proven safe → generally avoid<br>• Use reliable contraception; stop <b>1–2 months before</b> trying to conceive, or once pregnancy confirmed<br>• May continue with a lipid specialist in FH or established ASCVD<br>• Other lipid drugs also avoided; <b>no statins while breastfeeding</b> <i>[MKSAP CV: Dyslipidemia]</i>",
"Cardiovascular Medicine|Lipids: Statin therapy in HIV|Age <b>40–75</b> with HIV → statin recommended <b>regardless of calculated risk</b>. Watch interactions with antiretrovirals and antimicrobials. <i>[MKSAP CV: Dyslipidemia]</i>",
"Cardiovascular Medicine|Lipids: Eruptive xanthomas|Crops of small red-yellow papules on extensor arms, legs and buttocks. <b>Pathognomonic of hypertriglyceridemia</b> (often with diabetes). Biopsy optional if TG &gt;1000 or metabolic picture; resolve when TG controlled. <i>[MKSAP CV: Dyslipidemia]</i>",
"Cardiovascular Medicine|Lipids: Xanthelasma and plane xanthomas|• Plane: yellow-red plaques in neck/trunk folds; familial dyslipidemia or <b>hematologic cancers</b><br>• Xanthelasma: soft plaques on upper medial eyelid; can be normal in older adults, suggests familial dyslipidemia if young; classic in <b>primary biliary cholangitis</b> <i>[MKSAP CV: Dyslipidemia]</i>",
"Cardiovascular Medicine|Lipids: Tuberous and tendon xanthomas|• Tuberous: waxy yellow papules over extensor joints<br>• Tendon: nodules on hand extensor tendons and <b>Achilles</b><br>Both suggest <b>familial hypercholesterolemia</b> <i>[MKSAP CV: Dyslipidemia]</i>",
"Cardiovascular Medicine|Dx Testing: Anatomic vs functional tests for CAD: which is which?|<b>Anatomic</b> (shows plaque/stenosis): invasive coronary angiography, <b>coronary CT angiography (CCTA)</b>, <b>CAC score</b>.<br><b>Functional</b> (shows ischemia):<br>• Perfusion: SPECT, PET, CMR<br>• Blood flow: PET, FFR-CT, invasive FFR<br>• Wall motion: stress echo, CMR<br>Choose based on symptoms, pretest probability, whether the result will change management, and shared decision making. <i>[MKSAP CV: Diagnostic Testing in Cardiology]</i>",
"Cardiovascular Medicine|Dx Testing: Stable suspected CAD: CCTA vs stress imaging: who gets which first?|• <b>CCTA</b> preferred: age <b>&lt;65</b> or less obstructive disease suspected<br>• <b>Stress imaging</b> preferred: age <b>≥65</b> or more obstructive disease suspected<br>• <b>Exercise ECG</b> still reasonable if it can be interpreted (normal resting ECG, able to exercise)<br>PROMISE trial: CCTA-first vs functional-first in ~10,000 symptomatic patients → same 2-year outcomes, event rates &lt;1%/year. <i>[MKSAP CV: Diagnostic Testing in Cardiology]</i>",
"Cardiovascular Medicine|Dx Testing: Who benefits most from stress testing, and who should not get one?|• Best for <b>symptomatic</b> patients with <b>intermediate pretest probability (10–90%)</b>: a positive raises and a negative lowers likelihood meaningfully<br>• Pretest probability uses age, sex, symptoms, CAC if known<br>• <b>Low</b> probability (young, atypical symptoms) → false positives, cascades of testing, harm<br>• <b>High</b> probability → go to <b>invasive angiography</b> instead<br>• Always use <b>exercise</b> if the patient can exercise<br>• A normal adequate stress test is \"good\" for ~<b>1 year</b> if symptoms are unchanged <i>[MKSAP CV: Diagnostic Testing in Cardiology]</i>",
"Cardiovascular Medicine|Dx Testing: Should β-blockers and nitrates be held before a stress test?|• <b>Diagnosing</b> CAD with exercise: hold <b>β-blockers ≥24 h</b> (they blunt heart rate → inadequate test)<br>• Evaluating symptoms on therapy, efficacy of therapy or prognosis in known CAD: <b>continue</b> usual cardiac meds<br>• Otherwise individualize <i>[MKSAP CV: Diagnostic Testing in Cardiology]</i>",
"Cardiovascular Medicine|Dx Testing: When can a plain exercise ECG be used, and which baseline ECGs make it uninterpretable?|<b>Use when</b>: normal resting ECG + able to exercise (no frailty, BMI &gt;40, PAD, COPD or orthopedic limits). Cheap, available, gives exercise capacity, BP/HR response, symptoms.<br><b>Uninterpretable baseline ECG</b>:<br>• ST depression <b>&gt;1 mm</b><br>• <b>LBBB</b><br>• <b>LVH</b><br>• <b>Paced rhythm</b><br>• <b>Pre-excitation</b> (WPW)<br>→ use stress imaging or CCTA instead <i>[MKSAP CV: Diagnostic Testing in Cardiology]</i>",
"Cardiovascular Medicine|Dx Testing: Exercise ECG: what is an adequate test, and when do you stop?|<b>Adequate</b>: ≥<b>85% of age-predicted max HR</b> (but ideally exercise to symptom limit); rate-pressure product (HR × SBP) ≥<b>25,000</b>. Bruce protocol raises speed and grade every 3 min.<br><b>Stop for</b>: maximal effort or patient request; angina or light-headedness; <b>exertional hypotension</b>; BP &gt;<b>200/110</b>; ST elevation or marked ST depression; significant arrhythmia. <i>[MKSAP CV: Diagnostic Testing in Cardiology]</i>",
"Cardiovascular Medicine|Dx Testing: Exercise ECG: what counts as ischemia?|• <b>Horizontal or downsloping ST depression ≥1 mm</b>, 80 ms after the J point<br>• ST depression does <b>not localize</b> the culprit artery (unlike ST elevation)<br>• <b>Fall in BP</b> or failure of BP to rise with exercise → suggests severe/multivessel disease <i>[MKSAP CV: Diagnostic Testing in Cardiology]</i>",
"Cardiovascular Medicine|Dx Testing: Prognostic markers on an exercise test|• <b>Exercise capacity</b> is a powerful predictor: unable to reach <b>5 METs</b> (first Bruce stage) → higher all-cause mortality<br>• <b>Heart rate recovery</b> &lt;<b>12 beats/min</b> in the first minute after stopping → higher mortality<br>• <b>Duke Treadmill Score</b>: exercise duration + angina + degree of ST depression → 5-year mortality (no known CAD) <i>[MKSAP CV: Diagnostic Testing in Cardiology]</i>",
"Cardiovascular Medicine|Dx Testing: The ischemic cascade and why imaging adds sensitivity|Order of events as ischemia develops:<br>1. <b>Perfusion</b> abnormality<br>2. <b>Diastolic</b> dysfunction<br>3. <b>Systolic</b> dysfunction (wall motion)<br>4. <b>ECG</b> changes<br>5. <b>Angina</b><br>Imaging detects ischemia earlier than ECG and <b>localizes</b> it. Stress imaging is a good first-line test and is required when the ECG is uninterpretable or exercise ECG is indeterminate. <i>[MKSAP CV: Diagnostic Testing in Cardiology]</i>",
"Cardiovascular Medicine|Dx Testing: Interpreting stress SPECT or stress echo: rest vs stress patterns|• Normal rest, <b>new defect/wall motion abnormality with stress</b> → <b>ischemia</b><br>• Same defect at rest and stress (<b>fixed</b>) → <b>infarct or hibernating</b> myocardium (viability test distinguishes)<br>• Normal perfusion but <b>LV cavity dilates</b> with stress (transient ischemic dilation) → <b>balanced ischemia / multivessel CAD</b> <i>[MKSAP CV: Diagnostic Testing in Cardiology]</i>",
"Cardiovascular Medicine|Dx Testing: Pharmacologic stress: dobutamine vs vasodilators: how they work|• <b>Dobutamine</b>: ↑ HR and contractility → ↑ O2 demand (like exercise); used with echo (up to 40 µg/kg/min, add atropine if HR target not reached) or perfusion imaging<br>• <b>Vasodilators</b> (adenosine, regadenoson, dipyridamole): hyperemia → flow mismatch between normal arteries and stenotic ones (whose beds are already maximally dilated); used with SPECT, PET, CMR<br>Exercise is preferred whenever possible. <i>[MKSAP CV: Diagnostic Testing in Cardiology]</i>",
"Cardiovascular Medicine|Dx Testing: Contraindications to dobutamine stress|• Severe baseline <b>hypertension</b><br>• <b>Unstable angina</b><br>• Severe <b>tachyarrhythmias</b><br>• <b>Hypertrophic cardiomyopathy</b> (obstructive)<br>• Severe <b>aortic stenosis</b><br>• Large <b>aortic aneurysm</b> <i>[MKSAP CV: Diagnostic Testing in Cardiology]</i>",
"Cardiovascular Medicine|Dx Testing: Contraindications and side effects of vasodilator stress (adenosine, regadenoson)|<b>Contraindicated</b>:<br>• Active <b>bronchospasm</b> / wheezing<br>• <b>Theophylline</b> use (hold theophylline and <b>caffeine 12–24 h</b>)<br>• <b>Sick sinus syndrome</b> or <b>high-degree AV block</b><br>• <b>SBP &lt;90</b> / hypotension<br><b>Side effects</b>: chest pain, dyspnea, headache, flushing, AV block, bronchospasm → reversed with <b>theophylline/aminophylline</b>. <i>[MKSAP CV: Diagnostic Testing in Cardiology]</i>",
"Cardiovascular Medicine|Dx Testing: Stress test choice for LBBB or a paced rhythm|<b>Vasodilator myocardial perfusion imaging</b> or <b>exercise stress echo</b>.<br>Why: exercise/dobutamine with LBBB causes false-positive <b>septal</b> perfusion defects (septal conduction delay); vasodilator stress avoids this. With echo in LBBB/paced rhythm, exercise is preferred over dobutamine. <i>[MKSAP CV: Diagnostic Testing in Cardiology]</i>",
"Cardiovascular Medicine|Dx Testing: Best test by clinical scenario|• Can't exercise → <b>pharmacologic stress</b> or CCTA<br>• Abnormal ECG from LVH, pre-excitation, ST depression &gt;1 mm → vasodilator MPI, stress echo, adenosine CMR, or CCTA<br>• LBBB or paced → <b>vasodilator MPI</b> or exercise echo<br>• Need to know which territory is ischemic → SPECT, stress CMR, stress echo<br>• <b>High BMI</b> → <b>PET/CT</b> or CCTA <i>[MKSAP CV: Diagnostic Testing in Cardiology]</i>",
"Cardiovascular Medicine|Dx Testing: Stress echocardiography: strengths and limits|<b>Strengths</b>: no radiation, portable, cheaper than nuclear, &lt;1 h; also shows valves and pulmonary pressures with exercise.<br><b>Limits</b>: poor windows in some (improved with microbubble contrast); harder with baseline wall motion abnormalities, LV dysfunction or single-vessel disease; treadmill images must be taken within <b>90 s</b> of stopping.<br>New wall motion abnormality = ischemia; resting abnormality that doesn't improve = infarct or hibernation. <i>[MKSAP CV: Diagnostic Testing in Cardiology]</i>",
"Cardiovascular Medicine|Dx Testing: SPECT myocardial perfusion imaging: key facts and high-risk features|• Tracer injected at rest and at peak stress; uptake ∝ flow<br>• <b>Technetium</b> agents: better images, higher sensitivity/specificity, allow delayed imaging<br>• <b>Thallium</b>: uptake needs active metabolism → useful for <b>viability</b> (redistribution at 4–24 h)<br>• Pitfalls: <b>breast or diaphragm attenuation</b> artifacts; radiation; lower accuracy with single-vessel disease<br><b>High-risk findings</b>: multiple defects, <b>post-stress EF falls or fails to rise</b>, <b>transient cavity dilation</b>, wall motion abnormalities <i>[MKSAP CV: Diagnostic Testing in Cardiology]</i>",
"Cardiovascular Medicine|Dx Testing: Cardiac PET: advantages and limits|• Best perfusion images in <b>obesity</b> or after nondiagnostic SPECT<br>• Perfusion + function + <b>viability</b> (metabolism) + <b>absolute myocardial blood flow</b><br>• Shorter, <b>lower radiation</b> than SPECT; can add CAC score<br>• Limits: <b>no exercise protocol</b> (short-half-life tracers → vasodilator only), expensive, not widely available <i>[MKSAP CV: Diagnostic Testing in Cardiology]</i>",
"Cardiovascular Medicine|Dx Testing: Myocardial viability testing: how each modality shows viable myocardium|• <b>Thallium SPECT</b>: defect at rest that <b>fills in</b> on repeat imaging 4–24 h later → viable; persistent → scar<br>• <b>PET</b>: perfusion defect that is still <b>metabolically active</b> (FDG uptake) → viable<br>• <b>Dobutamine echo</b>: <b>biphasic</b> response (improves at low dose, worsens at high dose) → viable<br>• <b>CMR</b>: extent of scar (late gadolinium enhancement)<br>Use: decide whether revascularization will help. <i>[MKSAP CV: Diagnostic Testing in Cardiology]</i>",
"Cardiovascular Medicine|Dx Testing: Stress CMR: uses and limitations|• Dobutamine CMR (wall motion) or adenosine CMR (perfusion with gadolinium)<br>• Excellent resolution; shows infarct size, viability, anomalous coronary origin<br>• Limits: claustrophobia, some older devices, needs sinus rhythm + slow HR, limited availability<br>• Gadolinium: <b>group I agents contraindicated if eGFR &lt;30 or ESKD</b> (nephrogenic systemic fibrosis); group II agents acceptable in CKD <i>[MKSAP CV: Diagnostic Testing in Cardiology]</i>",
"Cardiovascular Medicine|Dx Testing: Coronary CT angiography: indications and limits|<b>Use</b>: stable chest pain at intermediate risk, especially age &lt;65; ED chest pain at intermediate risk with no known CAD and negative/inconclusive ACS work-up (faster diagnosis, same safety); anomalous coronaries.<br><b>Limits</b>: needs HR ~<b>&lt;60–65</b> and sinus rhythm; heavy <b>calcification</b> or <b>stents</b> obscure lumen; poor distal vessel detail; iodinated contrast + radiation; still need cath for intervention.<br><b>FFR-CT</b> adds functional significance → higher specificity than CCTA alone. <i>[MKSAP CV: Diagnostic Testing in Cardiology]</i>",
"Cardiovascular Medicine|Dx Testing: When to go straight to invasive coronary angiography|• Symptoms with <b>high likelihood</b> of CAD<br>• <b>High-risk findings</b> on noninvasive testing<br>• <b>Acute coronary syndrome</b><br>• Known CAD with symptoms <b>refractory</b> to medical therapy<br>Advantage: PCI can be done in the same procedure. <i>[MKSAP CV: Diagnostic Testing in Cardiology]</i>",
"Cardiovascular Medicine|Dx Testing: Fractional flow reserve (FFR) and iFR|• FFR = pressure/flow distal ÷ proximal to a stenosis at <b>maximal hyperemia</b> (adenosine), via pressure wire at cath<br>• <b>FFR &lt;0.80</b> = hemodynamically significant → favors revascularization<br>• <b>iFR</b> (instantaneous wave-free ratio): same idea, <b>no vasodilator</b> needed<br>• <b>FFR-CT</b>: computed from CCTA data <i>[MKSAP CV: Diagnostic Testing in Cardiology]</i>",
"Cardiovascular Medicine|Dx Testing: CAC scoring: who should get it and how to read it|<b>Who</b>: asymptomatic men <b>≥40</b> and women <b>≥45</b> at <b>borderline or intermediate</b> risk, or whenever the statin decision is unclear.<br><b>Reading</b>:<br>• Shows plaque <b>burden</b>, not degree of stenosis<br>• <b>CAC 0</b> → low short-term risk (but younger people may calcify later)<br>• CAC 0 does <b>not</b> lower risk in smokers, FH, family history of premature ASCVD, or diabetes over 40<br>• CAC &gt;0 = subclinical atherosclerosis; &gt;100 strongly favors treatment <i>[MKSAP CV: Diagnostic Testing in Cardiology]</i>",
"Cardiovascular Medicine|Dx Testing: Exercise stress test risk and absolute contraindications|Risk of MI or death ≈ <b>1 in 2500</b>.<br><b>Absolute contraindications</b>:<br>• Unstable angina or acute MI<br>• Uncontrolled arrhythmia<br>• Decompensated HF<br>• Acute PE or DVT<br>• Acute pericarditis or myocarditis<br>• Acute aortic dissection<br>• <b>Symptomatic severe aortic stenosis</b><br><b>Relative</b>: left main stenosis, severe obstructive HCM, electrolyte abnormalities, high-degree AV block, significant arrhythmias. <i>[MKSAP CV: Diagnostic Testing in Cardiology]</i>",
"Cardiovascular Medicine|Dx Testing: Contrast-related risks across cardiac imaging|• <b>Iodinated</b> (CT, cath): acute kidney injury, allergy<br>• <b>Gadolinium</b> (CMR): rare nephrogenic systemic fibrosis in ESKD (group I agents)<br>• <b>Microbubble</b> (echo): rare hypersensitivity<br>• Radiation: SPECT, PET, CAC, CCTA, angiography (not echo or CMR) <i>[MKSAP CV: Diagnostic Testing in Cardiology]</i>",
"Cardiovascular Medicine|Dx Testing: Complications after cardiac catheterization and how to diagnose them|• <b>Retroperitoneal hemorrhage</b> (femoral access): hypotension, back/flank pain, falling Hb → <b>CT abdomen/pelvis</b><br>• <b>Pseudoaneurysm</b> or <b>AV fistula</b>: large hematoma or new <b>bruit</b> at site → <b>arterial duplex ultrasound</b><br>• Others: bleeding, coronary or aortic dissection, atheroemboli (stroke, MI, kidney), contrast AKI <i>[MKSAP CV: Diagnostic Testing in Cardiology]</i>",
"Cardiovascular Medicine|Dx Testing: When is imaging for structural heart disease indicated?|• HF symptoms<br>• Systolic murmur <b>≥3/6</b>, or <b>late/holosystolic</b> murmur<br>• Any <b>diastolic</b> or <b>continuous</b> murmur<br>• Murmur with symptoms (exertional dyspnea, light-headedness, chest pain)<br>• Repeat imaging when clinical status or exam changes; routine surveillance in valve/congenital disease by severity<br>First test: <b>transthoracic echo (TTE)</b>. <i>[MKSAP CV: Diagnostic Testing in Cardiology]</i>",
"Cardiovascular Medicine|Dx Testing: Transthoracic echo: what it can assess|• Chamber size, wall thickness, systolic function and wall motion<br>• <b>Diastolic</b> function, hemodynamics, pulmonary pressure<br>• Valves (including endocarditis vegetations), pericardium, aorta<br>• <b>Agitated saline</b> (\"bubble\") study → intracardiac shunt<br>• <b>Low-dose dobutamine</b> echo: separates true severe from pseudo-severe low-gradient AS with low EF<br>• POCUS: gross function, chamber size, <b>IVC</b> (volume), effusion<br>Limits: operator dependent; poor windows (COPD, obesity). <i>[MKSAP CV: Diagnostic Testing in Cardiology]</i>",
"Cardiovascular Medicine|Dx Testing: Indications for transesophageal echo (TEE)|• <b>Infective endocarditis</b> and its complications (abscess)<br>• <b>Prosthetic valves</b> and implanted devices<br>• Valve disease when <b>intervention is planned</b><br>• <b>Left atrial appendage thrombus</b> before cardioversion<br>• Acute <b>aortic</b> disease (dissection)<br>• ASD and other congenital disease; <b>embolic stroke source</b><br>• Poor TTE images<br>Needs moderate sedation; contraindicated with esophageal stricture or active varices; rare perforation/bleeding. <i>[MKSAP CV: Diagnostic Testing in Cardiology]</i>",
"Cardiovascular Medicine|Dx Testing: Cardiac MRI: main uses in structural disease|• Myocardial disease: <b>myocarditis</b>, <b>infiltrative</b> (amyloid, sarcoid), ischemic scar<br>• <b>Hypertrophic cardiomyopathy</b>, especially <b>apical</b> or eccentric hypertrophy missed on echo<br>• <b>ARVC</b>; accurate <b>RV</b> volumes and EF<br>• Pericardial disease<br>• Valve disease when TTE is inadequate (alternative to TEE)<br>• Congenital heart disease<br>No ionizing radiation. <i>[MKSAP CV: Diagnostic Testing in Cardiology]</i>",
"Cardiovascular Medicine|Dx Testing: Technetium pyrophosphate (99mTc-PYP) scan|• Detects <b>transthyretin (ATTR) cardiac amyloidosis</b><br>• Cardiac uptake ≥ bone uptake = positive<br>• Specificity <b>&gt;99%</b> only if <b>no monoclonal protein</b> (always check serum/urine immunofixation and free light chains to exclude AL)<br>• Echo can raise suspicion; CMR or biopsy confirm <i>[MKSAP CV: Diagnostic Testing in Cardiology]</i>",
"Cardiovascular Medicine|Dx Testing: MUGA (radionuclide angiography): main use|Precise, reproducible <b>LVEF</b> → serial monitoring, e.g., for <b>chemotherapy cardiotoxicity</b>. Downsides: radiation, no information on other structures. <i>[MKSAP CV: Diagnostic Testing in Cardiology]</i>",
"Cardiovascular Medicine|Dx Testing: Suspected arrhythmia: first test and how to choose a monitor|<b>First</b>: 12-lead resting ECG (pre-excitation, ectopy, AV block, conduction delay); echo if structural disease suspected.<br><b>Choose by symptom frequency</b>:<br>• Daily → <b>Holter</b> 24–48 h<br>• Weekly/monthly → <b>long-term patch / event monitor</b> up to 30 days<br>• High risk, needs real-time alerts → <b>mobile cardiac outpatient telemetry</b><br>• Rare (e.g., infrequent syncope) or <b>AF after cryptogenic stroke</b> → <b>implantable loop recorder</b> (1–4 years)<br>• Exercise-triggered → exercise ECG <i>[MKSAP CV: Diagnostic Testing in Cardiology]</i>",
"Cardiovascular Medicine|Dx Testing: Event recorders: patient-triggered vs looping|• <b>Patient-triggered</b>: held to chest during symptoms; arrhythmia must last long enough to activate<br>• <b>Looping</b>: continuously records and saves the preceding <b>30 s–2 min</b> when triggered → captures <b>onset</b>; good for brief episodes and syncope<br>• Consumer wearables (watch, phone ECG up to 6 leads): may capture diagnostic tracings; variable quality and regulation <i>[MKSAP CV: Diagnostic Testing in Cardiology]</i>",
"Cardiovascular Medicine|Dx Testing: When is an invasive electrophysiology study indicated?|Most patients don't need one. Use when the diagnosis is still unclear, or when treatment such as <b>catheter ablation</b> or a device is planned (EP study defines mechanism and ablation can follow). Some arrhythmias can't be induced. <i>[MKSAP CV: Diagnostic Testing in Cardiology]</i>",
"Cardiovascular Medicine|Dx Testing: Genetic testing in cardiovascular disease: principles|• Start with a <b>3-generation family history</b>; test the most clearly affected relative (proband) first<br>• Pre- and post-test <b>genetic counseling</b> (yield, discrimination, cost, distress); refer to a CV genetics team<br>• Mostly <b>autosomal dominant</b> with variable penetrance<br>• Variant classes: pathogenic, likely pathogenic, <b>VUS</b>, likely benign, benign (don't act on a VUS)<br>• Positive result → <b>cascade testing</b> of relatives; can guide care (ICD in genetic arrhythmogenic cardiomyopathy, aortic surgery threshold in syndromic aortopathy, tafamidis in hereditary ATTR) <i>[MKSAP CV: Diagnostic Testing in Cardiology]</i>",
"Cardiovascular Medicine|Dx Testing: Approximate yield of genetic testing by condition|• <b>FH</b> 60–80%<br>• Long QT 50–75%<br>• Arrhythmogenic cardiomyopathy ~60%<br>• <b>HCM 30–60%</b><br>• CPVT ~50%<br>• DCM 30–40%<br>• Brugada (SCN5A) 20–25%<br>• Sudden death/VA 15–30%<br>• Familial aortic aneurysm/dissection 10–20% <i>[MKSAP CV: Diagnostic Testing in Cardiology]</i>",
"Cardiovascular Medicine|CAD: Stable vs unstable angina: definitions|<b>Stable angina</b>: reproducible chest (or neck, arm, abdominal) pressure for <b>&gt;2 months</b>, triggered by a consistent level of exertion or emotion, relieved by rest or the same dose of nitroglycerin.<br><b>Unstable angina</b> (an ACS): <b>new-onset</b>, at <b>rest</b> or low exertion, or <b>accelerating</b> in frequency/severity → ↑ short-term MI risk; troponin normal. <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: Features of cardiac vs noncardiac chest pain|<b>Cardiac</b>: pressure/heaviness/tightness; retrosternal; radiates to arm(s), jaw, throat; gradual onset; stops within minutes of rest; triggered by exertion or stress; relieved by rest/nitroglycerin; with dyspnea, diaphoresis, nausea, fatigue.<br><b>Noncardiac</b>: sharp, stabbing, pleuritic, <b>fleeting (seconds)</b> or <b>constant &gt;30 min</b>; localized to a point; reproduced by <b>palpation</b>, breathing or position; inframammary; lower abdomen.<br>Women, older adults and people with diabetes more often have dyspnea, nausea, fatigue instead of pain. <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: Initial evaluation of stable chest pain|• History + exam (look for mimics: <b>aortic stenosis</b>, HCM, HF, pulmonary HTN; and for HTN, PAD)<br>• <b>Resting ECG in everyone</b><br>• Estimate <b>pretest probability</b> (age, sex, symptom type, ± CAC score)<br>• Shared decision on testing: <b>CCTA</b> if &lt;65 or lower suspicion; <b>stress imaging</b> if ≥65 or higher suspicion; high probability → testing still gives prognosis or go to angiography<br>• Inconclusive test + ongoing symptoms → try another modality <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: Stress test findings that should prompt invasive angiography|• Extensive or <b>multisegment</b> ischemia<br>• <b>LVEF &lt;45%</b><br>• Large fixed defects<br>• <b>Transient LV cavity dilation</b> or stress-induced arrhythmia<br>• Markedly reduced myocardial flow reserve on PET <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: Canadian Cardiovascular Society angina classes|• <b>I</b>: only with strenuous or rapid activity<br>• <b>II</b>: slight limitation: walking &gt;2 blocks or &gt;1 flight briskly, uphill, after meals, cold, emotion<br>• <b>III</b>: marked limitation: 1 block or 1 flight at normal pace<br>• <b>IV</b>: with minimal activity or at rest <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: Three pillars of guideline-directed therapy for stable ischemic heart disease|1. <b>Risk factor modification</b>: exercise, weight loss, stop smoking, diet; control BP (ACEI/β-blocker good choices) and diabetes (prefer <b>SGLT2i or GLP-1 RA</b>)<br>2. <b>Cardioprotective drugs</b> (prevent events): aspirin, high-intensity statin, ACEI/ARB when indicated<br>3. <b>Antianginal drugs</b> (symptoms): β-blocker, CCB, nitrates, ranolazine <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: Antiplatelet therapy in stable CAD|• <b>Low-dose aspirin 75–162 mg</b> (as effective as 325 mg, less bleeding) for everyone without contraindication<br>• Aspirin intolerant/allergic → <b>clopidogrel 75 mg</b><br>• Prasugrel and ticagrelor: not studied in stable angina (role not established)<br>• Selected low-bleeding-risk CAD or PAD: <b>rivaroxaban 2.5 mg bid + aspirin</b> may be considered <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: Lipid goals in established CAD|• <b>High-intensity statin</b> for all (moderate if &gt;75 y or intolerant)<br>• Goal <b>LDL &lt;70</b>; <b>&lt;55</b> if very high risk<br>• Not at goal or intolerant → ezetimibe, PCSK9 mAb, inclisiran (284 mg SC every 6 mo), bempedoic acid<br>• High TG on statin → icosapent ethyl<br>• After ACS: add nonstatin if LDL ≥70 on max statin; consider if 55–69; recheck lipids 4–8 weeks after changes <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: When is an ACE inhibitor or ARB indicated in stable angina?|Concomitant <b>diabetes</b>, <b>CKD</b>, <b>LVEF ≤40%</b>, <b>heart failure</b> (also hypertension). Also: diabetes age ≥55 with ASCVD or multiple risk factors, even without HTN.<br>Benefits beyond CAD (kidney protection, LV function). <b>Never combine</b> ACEI + ARB (more harm, no benefit). <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: β-blockers for angina: how to use them|• First-line antianginal: ↓ HR, contractility, BP → ↓ O2 demand<br>• All equally antianginal; titrate to resting <b>HR 55–60</b><br>• Lung disease → <b>β1-selective</b> (metoprolol, bisoprolol)<br>• LVEF reduced → <b>metoprolol succinate, bisoprolol, carvedilol</b> (mortality benefit)<br>• Caution with verapamil/diltiazem (additive bradycardia, negative inotropy), conduction disease<br>• AEs: fatigue, sleep disturbance, erectile dysfunction <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: Calcium channel blockers for angina: key do's and don'ts|• Work by coronary vasodilation + ↓ BP and contractility<br>• <b>Avoid short-acting nifedipine</b>: abrupt BP drop → reflex tachycardia → worse angina<br>• <b>Avoid non-dihydropyridines</b> (verapamil, diltiazem) with <b>LV systolic dysfunction</b><br>• Good choice for vasospastic angina or β-blocker intolerance <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: Nitrates for angina: use and pitfalls|• SL nitroglycerin for acute relief; long-acting (isosorbide mononitrate/dinitrate, patch) for prevention<br>• Mechanism: ↓ preload (wall stress) + coronary dilation; reflex tachycardia unless with β-blocker or CCB<br>• Need a <b>nitrate-free interval of 8–12 h</b> (usually overnight) to prevent tolerance<br>• AEs: headache, flushing, hypotension<br>• <b>Contraindicated with PDE-5 inhibitors</b> (sildenafil within 24 h, tadalafil 48 h) <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: Ranolazine|• Blocks <b>late sodium current</b> → less Ca overload, ↓ wall tension and O2 use<br>• Reduces angina and ↑ exercise time <b>without changing BP or HR</b><br>• Add-on when angina persists on β-blocker, CCB and/or nitrate<br>• Mild <b>QT prolongation</b> (not proarrhythmic): monitor with other QT drugs<br>• Reduce dose with moderate <b>CYP3A4</b> inhibitors (verapamil, diltiazem); <b>avoid</b> with strong ones (clarithromycin, ketoconazole, itraconazole, some HIV drugs) <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: Ivabradine and refractory angina options|• Ivabradine (If channel blocker, ↓ HR): approved in US for HF, <b>not recommended</b> for angina without HF in US guidelines; AEs: visual disturbance (phosphenes), bradycardia, QT effects<br>• Refractory angina, not a revascularization candidate → <b>enhanced external counterpulsation (EECP)</b>; coronary sinus reducer is a newer option <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: Goals and indications for revascularization in stable CAD|• Main goal: <b>relieve angina</b>, improve quality of life<br>• Also improves survival with high-risk features: <b>left main</b> disease, large ischemic burden, heart failure<br>• Candidates for angiography: angina refractory to meds, markedly abnormal stress test or CCTA<br>• <b>FFR/iFR</b> decides whether an intermediate lesion needs stenting<br>• PCI is <b>not</b> better than optimal medical therapy for death/MI in stable angina unless high-risk anatomy <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: When does CABG improve survival in chronic CAD?|<b>Improves survival</b>:<br>• <b>Left main</b> disease<br>• <b>Three-vessel</b> disease (normal EF)<br>• Multivessel disease with <b>EF &lt;35%</b><br>• <b>Diabetes + multivessel disease involving the LAD</b><br><b>May improve</b>: multivessel disease with EF 35–50%.<br>Even without these, CABG (especially with internal mammary arterial grafts) gives less angina, fewer MIs and repeat procedures than PCI. Viability testing before revascularization: role not established. <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: PCI: stent choice and indications|• <b>Drug-eluting stents</b> preferred over bare metal (less restenosis, MI, stent thrombosis)<br>• Indications: refractory angina, can't tolerate meds, high-risk noninvasive findings<br>• Antiplatelet therapy indefinitely afterward <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: DAPT duration after PCI for STABLE CAD|• Bare metal stent: ≥<b>1 month</b><br>• Drug-eluting stent: ≥<b>6 months</b>; longer if high thrombotic risk (low EF, vein graft stent, diabetes) and low bleeding risk<br>• High bleeding risk: stop aspirin after 1–3 months and keep P2Y12, or stop P2Y12 after 3 months and keep aspirin<br>• Aspirin (or single antiplatelet) <b>lifelong</b><br>• After CABG for stable CAD: 12 months DAPT may help vein graft patency <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: Patient on anticoagulation for AF who gets a stent: antithrombotic plan|1. <b>Triple therapy</b> (DOAC preferred + aspirin + <b>clopidogrel</b>) for <b>1–4 weeks</b><br>2. Stop aspirin → DOAC + clopidogrel to <b>6–12 months</b><br>3. Then <b>DOAC alone</b> lifelong<br>• Mechanical valve: <b>warfarin + clopidogrel</b> (DOACs contraindicated)<br>• Add PPI or H2 blocker for GI protection<br>• Use clopidogrel, not prasugrel/ticagrelor, in triple therapy <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: Routine follow-up stress testing in chronic CAD?|<b>Not recommended</b> without a change in symptoms or functional status, including after revascularization. Test only when the clinical picture changes. <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: Spectrum of acute coronary syndromes|• <b>STEMI</b>: complete persistent occlusion → ST elevation + troponin rise<br>• <b>NSTEMI</b>: partial/transient occlusion → troponin rise, often ST depression or T inversion, no ST elevation<br>• <b>Unstable angina</b>: new/worsening ischemic symptoms, <b>normal troponin</b><br>NSTEMI + UA = NSTE-ACS. Usual cause: plaque rupture or erosion with thrombus. <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: Initial evaluation of suspected ACS|• <b>ECG within 10 minutes</b>; repeat every 15–30 min if unclear<br>• ST elevation → reperfusion pathway now<br>• No ST elevation → serial ECGs + serial <b>high-sensitivity troponin</b><br>• <b>HEART score &lt;3 + 3-hour troponin</b> (HEART pathway) → very low risk (&lt;1% 30-day events), safe for discharge without inpatient work-up<br>• Higher risk → admit; use <b>TIMI</b> or <b>GRACE</b> to set intensity <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: TIMI risk score for NSTE-ACS|1 point each (predicts 14-day death, MI, urgent revascularization):<br>• Age <b>≥65</b><br>• <b>≥3</b> CAD risk factors (HTN, high cholesterol, diabetes, smoking, family history)<br>• Known CAD with stenosis <b>≥50%</b><br>• <b>ST deviation</b><br>• <b>≥2 angina episodes</b> in 24 h<br>• <b>Aspirin</b> in the past week<br>• <b>Elevated biomarkers</b><br>0–2 low, 3–4 intermediate, 5–7 high <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: ECG criteria for STEMI|• New ST elevation <b>≥1 mm</b> in ≥2 contiguous leads<br>• In <b>V2–V3</b>: ≥<b>2 mm in men</b>, ≥<b>1.5 mm in women</b><br>• <b>New LBBB</b> can be a STEMI equivalent (LAD occlusion); old LBBB or paced rhythm makes ECG diagnosis unreliable<br>• <b>RBBB does not hide</b> ST elevation <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: Posterior MI on ECG|• ST <b>depression &gt;2 mm in V1–V4</b> with <b>tall R waves</b> (mirror image of posterior ST elevation)<br>• Confirm with posterior leads <b>V7–V9</b> (ST elevation)<br>• Usually circumflex or RCA occlusion, often with inferior/lateral involvement → treat as STEMI <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: de Winter and Wellens patterns|Both signal critical <b>proximal LAD</b> disease and may evolve into STEMI:<br>• <b>de Winter</b>: tall, symmetric \"hyperacute\" T waves in V1–V4 with upsloping ST depression &gt;1 mm at the J point<br>• <b>Wellens</b>: deep symmetric or <b>biphasic T-wave inversions</b> in V2–V3, often after the pain has resolved<br>→ urgent angiography; avoid stress testing <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: STEMI mimics|• <b>Pericarditis</b>: pleuritic/positional pain; <b>diffuse concave</b> ST elevation with <b>PR depression</b>, not in one territory (myopericarditis can raise troponin)<br>• <b>Aortic dissection</b> involving a coronary (usually RCA): tearing back pain, <b>arm BP difference</b>, wide mediastinum → surgery, no thrombolytics<br>• <b>Severe hypercalcemia</b>: ST elevation with <b>short QT</b> and flat T waves <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: Interpreting an elevated high-sensitivity troponin|• High and <b>rising/falling</b> → acute MI or acute injury<br>• Low and <b>stable</b> → <b>chronic injury</b> (LVH, stable CAD, HF, CKD)<br>• <b>Any</b> troponin elevation worsens prognosis<br><b>MI requires troponin rise/fall PLUS ≥1 sign of ischemia</b>: ischemic symptoms, new ischemic ECG changes, new Q waves, new regional wall motion abnormality, or coronary thrombus at angiography<br>Rise/fall <b>without</b> ischemia = <b>acute myocardial injury</b> → treat the cause. <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: Type 1 vs type 2 MI|• <b>Type 1</b>: atherothrombotic (plaque rupture/erosion) → ACS treatment, antithrombotics, angiography<br>• <b>Type 2</b>: <b>supply-demand mismatch</b> without plaque rupture: hypotension, severe hypertension, severe <b>anemia</b>, AF with rapid ventricular rate, hypoxemia, sepsis<br>→ <b>No</b> routine angiography or revascularization; treat the underlying condition <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: Medical therapy for every ACS patient: checklist|• <b>Aspirin</b> 162–325 mg load (non-enteric, chewed) → 75–100 mg/day<br>• <b>P2Y12</b> inhibitor load (choice depends on strategy and bleeding risk)<br>• <b>Anticoagulant</b><br>• <b>Oral β-blocker</b> within 24 h (unless contraindicated)<br>• <b>High-intensity statin</b> (start in hospital)<br>• <b>ACEI/ARB</b> if EF &lt;40%, HTN, anterior STEMI, diabetes, CKD<br>• <b>Nitrates</b> for pain<br>• <b>Oxygen only if SpO2 &lt;90%</b> (routine O2 with normal saturation ↑ mortality) <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: P2Y12 inhibitors: doses and key differences|• <b>Clopidogrel</b> 300–600 mg → 75 mg: stable PCI, with fibrinolysis, with oral anticoagulant, or when others unavailable<br>• <b>Ticagrelor</b> 180 mg → <b>90 mg bid</b>: ACS (PCI, CABG or medical); fast, no hepatic activation; AE <b>dyspnea</b>; keep aspirin ≤100 mg<br>• <b>Prasugrel</b> 60 mg → 10 mg (5 mg if &lt;60 kg or ≥75 y): ACS treated with PCI; <b>contraindicated with prior stroke/TIA</b>; black-box bleeding<br>• IV GP IIb/IIIa inhibitors: only selectively during PCI (big thrombus, no-reflow) <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: Anticoagulant choice in ACS|• Going to cath: anticoagulate until PCI/CABG; <b>UFH</b> preferred for PCI (monitor with ACT; better in kidney disease); <b>bivalirudin</b> alternative<br>• <b>Fondaparinux: not alone during PCI</b> (catheter thrombosis)<br>• With fibrinolysis: UFH, enoxaparin or fondaparinux<br>• Medically managed (no invasive plan): <b>enoxaparin or fondaparinux</b> preferred, ≥<b>48 h</b> or until discharge <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: β-blockers in ACS: when to give and when to hold|• <b>Oral</b> (not IV) within <b>24 h</b>: ↓ reinfarction, ventricular arrhythmias; ↑ survival especially with low EF<br>• <b>Hold</b> if: hypotension, <b>cardiogenic shock</b> or risk of it, <b>pulmonary congestion/HF</b>, AV block, <b>cocaine</b> intoxication<br>• Long-term: continue if reduced EF or angina; stopping may be considered if no other indication <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: Eplerenone after MI|Indicated after STEMI with <b>EF ≤40%</b> plus <b>heart failure or diabetes</b>, best started within <b>1 week</b>. Watch potassium and creatinine (especially with CKD or ACEI/ARB). <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: When to avoid nitrates in ACS|• <b>PDE-5 inhibitor</b> within 24–48 h<br>• <b>RV infarction</b> (preload dependent)<br>• SBP &lt;90 or ≥30 below baseline; shock<br>• Marked bradycardia or tachycardia<br>• <b>Severe aortic stenosis</b>, HCM<br>IV nitroglycerin (start ~5–10 µg/min) for persistent pain, HTN or HF; tolerance develops with prolonged infusion. <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: STEMI reperfusion: timing targets|• Reperfuse everyone with STEMI (unless limited life expectancy); faster = better<br>• <b>Primary PCI preferred</b>: goal first medical contact → PCI <b>≤90 min</b> (≤120 min if transfer)<br>• PCI indicated if symptoms &lt;<b>12 h</b>; with <b>cardiogenic shock</b> or instability, PCI/CABG helps <b>regardless of time</b><br>• PCI not available within <b>120 min</b> → <b>fibrinolytic</b> (if within 12 h of onset), then transfer to PCI center<br>• 12–24 h with instability or large territory and no timely PCI → consider lytic <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: Multivessel disease in STEMI|• Stable patient: after culprit PCI, <b>PCI of significant non-culprit lesions</b> is recommended (staged shortly after, or at the same time if simple) → ↓ death/MI<br>• <b>Cardiogenic shock</b>: culprit-only PCI acutely (immediate multivessel PCI worsens kidney and CV outcomes)<br>• NSTE-ACS PCI: treat non-culprit lesions too (same or staged) <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: Fibrinolysis for STEMI: practical points|• Most effective within <b>3–6 h</b> of onset<br>• Fibrin-specific agents (alteplase, reteplase, <b>tenecteplase</b>) preferred over streptokinase<br>• Co-therapy: aspirin load, <b>clopidogrel 300 mg</b>, and UFH/enoxaparin/fondaparinux<br>• Transfer to PCI center; check ECG at <b>60–90 min</b>: success = ≥<b>50% ST resolution</b><br>• Failed (¼–⅓ of patients) → <b>rescue PCI</b> ASAP<br>• Successful → still do <b>angiography within 2–24 h</b><br>• Intracranial hemorrhage ~1% <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: Absolute contraindications to fibrinolysis|• <b>Any prior intracranial hemorrhage</b><br>• Known cerebral vascular lesion (AVM) or <b>malignant intracranial tumor</b><br>• <b>Ischemic stroke within 3 months</b> (except acute stroke within 4.5 h)<br>• Suspected <b>aortic dissection</b><br>• Active bleeding or bleeding diathesis (not menses)<br>• Significant head/face trauma within 3 months<br>• Intracranial or spinal surgery within 2 months<br>• Severe HTN unresponsive to emergency therapy<br>• Streptokinase within 6 months (for streptokinase) <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: Relative contraindications to fibrinolysis|• Chronic severe poorly controlled HTN, or BP &gt;<b>180/110</b> on arrival<br>• Ischemic stroke &gt;3 months ago, dementia, other intracranial pathology<br>• Traumatic or prolonged (&gt;<b>10 min</b>) CPR<br>• Major surgery within <b>3 weeks</b><br>• Internal bleeding within 2–4 weeks<br>• Noncompressible vascular puncture<br>• <b>Pregnancy</b><br>• Active peptic ulcer<br>• Taking an oral anticoagulant <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: NSTE-ACS: timing of invasive strategy|• <b>No fibrinolytics</b> in NSTE-ACS<br>• <b>Immediate (&lt;2 h)</b>: hemodynamic instability, refractory pain, acute HF, ventricular arrhythmias<br>• <b>Early (&lt;24 h)</b>: high risk: <b>GRACE &gt;140</b>, troponin rise, new ST depression<br>• <b>Delayed (&lt;72 h)</b>: intermediate (GRACE 109–140)<br>• Low risk (TIMI &lt;2, GRACE &lt;109): delayed invasive or <b>ischemia-guided</b> (stress test or CCTA before discharge; cath only if ischemia or refractory angina)<br>• Type 2 MI: no angiography; treat cause <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: Right ventricular infarction|• Complicates <b>RCA</b> (inferior) MI; ST elevation in right-sided leads (<b>V4R</b>, V1)<br>• Triad: <b>hypotension</b>, <b>high JVP</b>, <b>clear lungs</b><br>• Echo: dilated hypokinetic RV<br>• Treat: <b>IV fluids</b> first; inotropes (dobutamine) or RV mechanical support if needed; recovery in 2–3 days<br>• <b>Avoid nitrates</b> (and diuretics, morphine): drop preload <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: LV free wall rupture after MI|• Day <b>3–5</b>; sudden chest pain or syncope → <b>PEA</b> / tamponade<br>• Risk: older, <b>women</b>, anterior MI, NSAID/steroid use, <b>late reperfusion</b><br>• Echo: pericardial effusion or <b>pseudoaneurysm</b><br>• Emergency surgery; very high mortality <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: Post-MI ventricular septal defect|• Within <b>5 days</b>, anterior or inferior MI, often multivessel disease<br>• Sudden HF/shock + new <b>harsh holosystolic murmur at left lower sternal border</b> (often with thrill)<br>• Echo confirms (left-to-right shunt; O2 step-up RA→RV)<br>• Temporize with afterload reduction + <b>IABP</b>; <b>surgery</b> (mortality ~50%; medical ~100%); device closure often fails <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: Papillary muscle rupture after MI|• <b>Posteromedial</b> papillary muscle (single supply from <b>posterior descending artery</b>) → inferior MI<br>• Days after MI: sudden <b>acute severe MR</b>, pulmonary edema, shock; murmur may be soft or absent<br>• Afterload reduction + IABP to bridge → <b>urgent surgery</b><br>• Contrast: <b>functional ischemic MR</b> (posterior leaflet tethering after inferior MI) → revascularization + medical therapy <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: LV thrombus and LV aneurysm after MI|• Apical thrombus in ~<b>10–20%</b> of anterior STEMI; found on predischarge echo<br>• Treat with <b>anticoagulation ≥3 months</b>, then reimage<br>• LV aneurysm <b>without</b> thrombus: no anticoagulation unless another indication (e.g., AF) <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: Arrhythmias after MI: what needs treatment?|• <b>AF</b> in up to 20% of STEMI<br>• VT/VF during MI or reperfusion; recurrent/sustained beyond <b>48 h</b> → longer telemetry and consider ICD before discharge<br>• <b>Don't suppress PVCs</b> with antiarrhythmics (↑ mortality)<br>• <b>Accelerated idioventricular rhythm</b> after reperfusion: benign, no treatment<br>• Inferior MI: vagal AV block (Wenckebach, even complete) → temporary pacing; usually resolves<br>• Anterior MI with <b>Mobitz II</b> or complete block → <b>permanent pacemaker</b> <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: Cardiogenic shock in MI|• Usually large anterior MI; mortality <b>50–80%</b><br>• Signs: hypotension, sinus tachycardia, oliguria, <b>cool extremities</b>, confusion → end-organ failure<br>• <b>Emergent reperfusion</b> of the culprit (benefit especially &lt;75 y); no immediate non-culprit PCI<br>• Inotropes/vasopressors; diuretics for congestion; avoid β-blockers initially<br>• Mechanical support: <b>microaxial flow pump</b> improved survival in STEMI with LV shock; <b>IABP</b> and VA-ECMO did not<br>• When stable: wean support, slowly add afterload reducers (captopril) <i>[MKSAP CV: Coronary Artery Disease]</i>",
"Cardiovascular Medicine|CAD: Mechanical circulatory support devices compared|• <b>IABP</b>: inflates in diastole (↑ coronary perfusion), deflates in systole (↓ afterload); least support; used as bridge for <b>VSD or acute MR</b>; can't use with <b>aortic regurgitation</b>; limb ischemia<br>• <b>Microaxial flow pump</b> (across aortic valve, LV → aorta): more support; hemolysis, positioning issues; survival benefit in STEMI shock<br>• <b>VA-ECMO</b>: full heart + lung support; most invasive; bleeding, stroke, limb ischemia <i>[MKSAP CV: Coronary Artery Disease]</i>",
