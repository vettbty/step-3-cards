"Rheumatology & MSK|Septic arthritis vs crystal arthritis|Both present with a hot, swollen, painful joint. <b>Septic arthritis is an emergency</b> — if there is real doubt, aspirate and start antibiotics. Crystals do not exclude infection. Get blood cultures and a cell count.",
"Rheumatology & MSK|Rheumatoid arthritis|Symmetrical inflammatory polyarthritis of small joints with morning stiffness over an hour, positive rheumatoid factor and anti-CCP, which is the more specific. <b>Start methotrexate early</b>; add a biologic if uncontrolled after 3–6 months. Steroids bridge only.",
"Rheumatology & MSK|RA extra-articular disease|Subcutaneous nodules · interstitial lung disease · pericarditis · anaemia of chronic disease · Felty syndrome with splenomegaly and neutropenia · <b>atlantoaxial subluxation</b>, which matters before intubation.",
"Rheumatology & MSK|Osteoporosis treatment|Correct vitamin D and calcium first. <b>Bisphosphonates are first-line.</b> Denosumab is potent but must never be stopped abruptly — rebound vertebral fractures. Teriparatide and abaloparatide are anabolic. Romosozumab carries cardiovascular cautions.",
"Rheumatology & MSK|Polymyalgia rheumatica|Bilateral shoulder and hip girdle pain and stiffness with a markedly elevated ESR or CRP and a dramatic response to low-dose prednisone. Associated with giant cell arteritis — ask about headache and jaw claudication.",
"Rheumatology & MSK|Giant cell arteritis|<b>Start high-dose steroids immediately — do not wait for temporal artery biopsy</b>, which stays positive for up to two weeks after treatment begins. Risk of irreversible blindness. Jaw claudication, scalp tenderness, visual symptoms.",
"Rheumatology & MSK|Ankylosing spondylitis|Inflammatory back pain — insidious onset, worse at night and in the morning, improved by exercise, in a young adult. MRI shows early sacroiliitis before radiographic change. NSAIDs first; TNF or IL-17 inhibitors if persistent. Screen for uveitis, psoriasis and IBD.",
"Rheumatology & MSK|Cauda equina syndrome|Saddle anaesthesia · bowel or bladder dysfunction · bilateral leg symptoms · progressive deficit. <b>Surgical emergency requiring urgent MRI.</b> The single most important back pain diagnosis not to miss.",
"Rheumatology & MSK|Low back pain red flags|Age under 20 or over 50 with new onset · trauma · cancer history · weight loss · fever · IV drug use · night pain · neurological deficit · saddle anaesthesia · bladder dysfunction. Absent red flags, no imaging in the first 4–6 weeks.",
"Rheumatology & MSK|SLE|Malar rash · photosensitivity · oral ulcers · arthritis · serositis · renal disease · haematologic and neurologic involvement · positive ANA with anti-dsDNA or anti-Smith. <b>Anti-dsDNA and low complement track with renal flares.</b>",
"Rheumatology & MSK|Scleroderma|Limited — skin distal to elbows and knees with calcinosis, Raynaud, oesophageal dysmotility, sclerodactyly and telangiectasia, anti-centromere, and risk of pulmonary hypertension. Diffuse — proximal skin, anti-topoisomerase (Scl-70), and risk of interstitial lung disease and renal crisis.",
"Rheumatology & MSK|Fibromyalgia|Widespread pain with fatigue, unrefreshing sleep and cognitive fog, without inflammatory markers or synovitis. Treat with graded exercise, CBT, and duloxetine, milnacipran, pregabalin or amitriptyline. Opioids do not help.",
"Geriatrics|Falls prevention|Exercise has the strongest evidence (USPSTF grade B). Add multifactorial assessment — medication review, vision, footwear, home hazards, orthostatic blood pressure, vitamin D, gait and balance.",
"Geriatrics|Orthostatic hypotension|A drop of at least 20 mmHg systolic or 10 mmHg diastolic within 3 minutes of standing. Review diuretics, alpha-blockers, nitrates, tricyclics and dopaminergics. Treat with fluids, compression stockings, slow rises, and midodrine or fludrocortisone if needed.",
"Geriatrics|Polypharmacy|Five or more medications. Highest-risk classes in older adults are benzodiazepines, anticholinergics, sulfonylureas, NSAIDs and opioids. <b>Deprescribe one drug at a time and monitor.</b>",
"Geriatrics|Advance care planning|Document what matters to the patient, not just code status. Ask about a health-care proxy, and revisit after any major change in health. POLST is for seriously ill patients and is actionable by EMS.",
"Geriatrics|Elder abuse|Suspect with unexplained injuries, injuries of differing ages, delay in presentation, poor hygiene, malnutrition, dehydration, or a caregiver who refuses to leave the room. <b>Reporting is mandatory and overrides confidentiality.</b>",
"Geriatrics|Incontinence in older adults|Distinguish transient causes (delirium, infection, medications, retention, constipation, restricted mobility) from persistent. <b>Ask about retention first</b> — an overflow bladder is worsened by antimuscarinics.",
"Geriatrics|Urinary retention|Post-void residual over 200 mL suggests retention. Commonest causes in older men are benign prostatic hyperplasia and anticholinergic medications. Relieve with catheterisation, then treat the cause.",
"Geriatrics|Osteoarthritis vs inflammatory arthritis|OA — worse with activity, improves with rest, brief morning stiffness, Heberden and Bouchard nodes, joint space narrowing with osteophytes. Inflammatory — prolonged morning stiffness and improvement with activity.",
"Geriatrics|Goals of care in frailty|Deintensify diabetes therapy to avoid hypoglycaemia, with deliberately higher A1c targets. Stop routine cancer screening when life expectancy is under 10 years. Prioritise function and symptom control.",
"Geriatrics|Pressure injuries|Staged by depth — non-blanchable erythema is stage 1 and the only reversible stage. Prevention is the whole game: repositioning, offloading, nutrition, moisture management and skin inspection.",
"Vaccines|ACIP status — check the source|A March 2026 court order stayed ACIP votes taken from June 2025 onward, and the July 2, 2025 CDC adult schedule is the currently posted version. <b>Check cdc.gov for the current schedule before your exam.</b>",
"Vaccines|Pneumococcal|Routine for all adults 50 and older. PCV20 or PCV21 single dose completes the series. If PCV15 is used, follow with PPSV23.",
"Vaccines|RSV|All adults 75 and older. Ages 50–74 with increased risk — chronic heart, lung or liver disease, end-stage renal disease, diabetes with end-organ damage, severe obesity (BMI over 40), nursing home residence, moderate-to-severe immune compromise. Best given August to October.",
"Vaccines|Zoster|Recombinant zoster vaccine, two doses, for adults 50 and older and for immunocompromised adults 19 and older. It is not a live vaccine.",
"Vaccines|Tdap and tetanus|One dose of Tdap, then Td or Tdap every 10 years. One dose of Tdap in every pregnancy, preferably at 27–36 weeks. Wound management may require a booster.",
"Vaccines|HPV|Routine through age 26. Shared clinical decision-making from 27 to 45. Two doses if started before age 15, three doses if 15 or older.",
"Vaccines|Hepatitis B|All adults 19–59, and risk-based for 60 and older. Three-dose or the two-dose HepB-CpG schedule.",
"Vaccines|Influenza|Annually for everyone 6 months and older. High-dose, recombinant or adjuvanted formulations are preferred at 65 and older.",
"Vaccines|Live vaccines to avoid|MMR, varicella, live zoster and intranasal influenza are contraindicated in pregnancy and in significant immunocompromise. <b>Give at least two weeks before starting immunosuppression where possible.</b>",
"Vaccines|Vaccines in pregnancy|Tdap at 27–36 weeks · influenza in any trimester · RSV vaccine from 32 to 36 weeks between September and January. Avoid MMR, varicella and live zoster.",
"Pediatrics|Immunisation schedule anchors|Birth — hepatitis B. 2, 4 and 6 months — DTaP, IPV, Hib, hepatitis B, pneumococcal, rotavirus. 12 months — MMR, varicella, pneumococcal, Hib. 4–6 years — DTaP, IPV, MMR and varicella boosters. 11–12 years — Tdap, HPV, meningococcal. Check cdc.gov; the schedule has been in legal flux.",
"Pediatrics|Bronchiolitis|The commonest cause of hospitalisation in infants, usually RSV. Wheeze, crackles, tachypnoea and poor feeding in a child under 2. <b>Supportive care only — oxygen, hydration, suctioning.</b> Bronchodilators, steroids and antibiotics do not work.",
"Pediatrics|Croup|Barking cough, inspiratory stridor and hoarse voice in a child 6 months to 3 years, usually parainfluenza. Treat with a single dose of <b>dexamethasone</b>; add nebulised epinephrine for moderate to severe presentations.",
"Pediatrics|Epiglottitis|Rapid onset of fever, drooling, muffled voice and a preference to sit forward. <b>Do not examine the throat or lie the child flat.</b> Airway is the priority — prepare for intubation in theatre.",
"Pediatrics|Otitis media|Bulging, erythematous tympanic membrane with reduced mobility. Observe for 48–72 hours in children over 2 with mild symptoms; give amoxicillin for younger children, severe symptoms, bilateral disease, or failure to improve.",
"Pediatrics|Intussusception|Colicky pain with drawing up of the legs, a sausage-shaped abdominal mass, and <b>currant jelly stool</b> late. Usually ages 6–36 months. Diagnose with ultrasound; treat with air or contrast enema.",
"Pediatrics|Pyloric stenosis|Projectile non-bilious vomiting at 3–6 weeks in a firstborn male. Visible peristalsis, an olive-shaped mass, and <b>hypochloraemic hypokalaemic metabolic alkalosis</b>. Correct the electrolytes before surgery.",
"Pediatrics|Child abuse — sentinel injuries|Any injury in a pre-mobile infant. Bruising in a pattern (loop, hand, belt), bruising in a protected area (ears, neck, trunk, buttocks, genitals), torn frenulum, rib and metaphyseal corner fractures, and injuries of differing ages. Reporting is mandatory.",
"Pediatrics|Developmental screening|Loss of previously attained milestones is always abnormal. Screen for autism at 18 and 24 months. Refer early — early intervention improves outcomes and waiting costs development.",
"Pediatrics|Febrile seizure|Simple — generalised, under 15 minutes, once in 24 hours, in a child 6 months to 5 years. No workup or treatment needed beyond treating the source. Complex — focal, over 15 minutes, or recurrent within 24 hours; needs evaluation.",
"Pediatrics|Neonatal sepsis risk factors|Maternal group B streptococcus colonisation, prolonged rupture of membranes, maternal fever or chorioamnionitis, and prematurity. Any febrile neonate under 28 days gets a full workup and empiric antibiotics.",
"Pediatrics|Failure to thrive|Weight falls first, then length, then head circumference; recovery reverses the order. Causes are inadequate intake, malabsorption, increased metabolic demand, endocrine disease, and psychosocial factors. Always plot and calculate mid-parental height.",
"Psychiatry|Substance use screening|Screen all adults for unhealthy alcohol use and provide brief intervention (USPSTF grade B). Ask non-judgementally and use a validated instrument — a single-question screen or AUDIT-C.",
"Psychiatry|Benzodiazepine withdrawal|Can be life-threatening — tremor, anxiety, insomnia, seizures and delirium. <b>Taper slowly and never stop abruptly.</b> Substitute a long-acting benzodiazepine and reduce gradually.",
"Psychiatry|Alcohol withdrawal timeline|6–12 hours — tremor, anxiety, diaphoresis. 12–24 hours — hallucinations. 24–48 hours — seizures. 48–96 hours — delirium tremens. Treat with benzodiazepines guided by CIWA.",
"Psychiatry|First-episode psychosis|Assess for substance-induced psychosis, medical causes (thyroid, B12, syphilis, HIV, autoimmune encephalitis) and neurological disease before assuming a primary psychotic disorder. Treat early — duration of untreated psychosis predicts outcome.",
"Psychiatry|Neuroleptic malignant syndrome|Hyperthermia, lead-pipe rigidity, bradyreflexia, autonomic instability, raised CK and leucocytosis after dopamine antagonists. <b>Stop the drug, cool, hydrate, and consider dantrolene or bromocriptine.</b>",
"Psychiatry|Tardive dyskinesia|Late-onset involuntary oro-bucco-lingual movements after months to years of dopamine antagonist exposure. <b>Valbenazine or deutetrabenazine</b> are approved treatments. Prevention means the lowest effective dose and regular monitoring.",
"Psychiatry|Lithium monitoring|Narrow therapeutic index — check levels, renal function, thyroid function and calcium. <b>Toxicity is precipitated by dehydration, NSAIDs, thiazides and ACE inhibitors.</b> Tremor, ataxia, confusion and seizures suggest toxicity.",
"Psychiatry|Depression in older adults|Often presents with somatic complaints, cognitive impairment or withdrawal rather than sadness. <b>Screen for suicide risk</b> — older men have the highest completed-suicide rate. Avoid tricyclics because of anticholinergic and cardiac effects.",
"Psychiatry|Postpartum depression|Screen at the postpartum visit (USPSTF grade B) and refer those at increased risk for counselling. Distinguish from postpartum psychosis, which is a psychiatric emergency with risk to mother and infant.",
"Psychiatry|Grief vs major depression|Grief comes in waves, is triggered by reminders, and preserves self-esteem and the capacity for pleasure. Depression is persistent, pervasive, and includes worthlessness and anhedonia. Grief persisting beyond a year with functional impairment is prolonged grief disorder.",
"Psychiatry|Capacity and the involuntary hold|Medical decision-making capacity is separate from the legal threshold for civil commitment. A patient who lacks capacity and poses a danger to self or others should be held for evaluation and treated for the medical emergency under state law.",
"Psychiatry|Antidepressant selection|SSRIs are first-line for most. Choose by side-effect profile — sexual dysfunction, weight, sleep, interactions. Mirtazapine helps insomnia and poor appetite; bupropion avoids sexual side effects but lowers the seizure threshold and is activating.",
"Antimicrobials|Empiric choice by site|Skin and soft tissue — cover streptococci and MSSA. Community pneumonia — beta-lactam plus macrolide, or a respiratory fluoroquinolone. Cystitis — nitrofurantoin, TMP-SMX or fosfomycin; pyelonephritis — ceftriaxone or a fluoroquinolone. Intra-abdominal — cover gram-negatives and anaerobes.",
"Antimicrobials|MRSA risk factors|Recent hospitalisation or surgery, indwelling devices, dialysis, IV drug use, prior MRSA colonisation, and long-term care residence. Empiric coverage should follow local resistance patterns.",
"Antimicrobials|Pseudomonas risk factors|Structural lung disease (bronchiectasis, cystic fibrosis), recent hospitalisation or ICU stay, prior Pseudomonas infection, and immunosuppression. Requires an antipseudomonal agent.",
"Antimicrobials|Endocarditis prophylaxis|Indicated only for the highest-risk patients undergoing certain dental procedures — prosthetic valve, prior endocarditis, unrepaired cyanotic congenital heart disease, or a repaired defect with residual shunt. Amoxicillin is standard.",
"Antimicrobials|Perioperative prophylaxis|A single dose within 60 minutes before incision; redose for long operations or major blood loss. <b>Continue no longer than 24 hours.</b> Prolonged prophylaxis drives resistance without reducing infection.",
"Antimicrobials|Antibiotic-associated colitis|Beyond C. difficile, consider Klebsiella oxytoca and other organisms in the ICU. Stop the offending agent and avoid antiperistaltic drugs.",
"Antimicrobials|Fungal infections by host|Candida — ICU, lines, diabetes, broad-spectrum antibiotics. Aspergillus — neutropenia and transplant. Cryptococcus, PCP and histoplasmosis — HIV with low CD4. Mucormycosis — diabetes with ketoacidosis.",
"Antimicrobials|Antiviral timing|Influenza — oseltamivir works best within 48 hours but give it in severe or high-risk disease regardless. Herpes zoster — within 72 hours. HIV post-exposure — within hours, no later than 72 hours. Early treatment matters more than the drug chosen.",
"Antimicrobials|Resistance mechanisms|MRSA — altered penicillin-binding protein (mecA). VRE — altered cell wall precursors. ESBL — beta-lactamase. Carbapenem-resistant Enterobacteriaceae — carbapenemase. Extended-spectrum resistance usually forces carbapenem therapy.",
"Antimicrobials|Therapeutic drug monitoring|Vancomycin (trough 15–20 for serious infection) · aminoglycosides (trough and peak) · voriconazole · phenytoin · digoxin · lithium · warfarin (INR). Narrow-index drugs with wide variability between patients.",
"Heme & Onc|Transfusion thresholds|Restrictive for most — haemoglobin 7 g/dL, or 8 with significant cardiovascular disease. Platelets under 10,000, or under 50,000 before an invasive procedure or with active bleeding. <b>Restrictive strategies reduce complications without harm.</b>",
"Heme & Onc|Acute transfusion reactions|Febrile non-haemolytic, which is the commonest · allergic · acute haemolytic from ABO incompatibility, with fever, flank pain, haemoglobinuria and hypotension — stop immediately · TRALI, with respiratory distress and bilateral infiltrates · bacterial contamination.",
"Heme & Onc|Delayed transfusion reactions|Delayed haemolytic reaction at 3–14 days · post-transfusion purpura · transfusion-associated graft-versus-host disease, prevented by irradiating blood for immunocompromised recipients.",
"Heme & Onc|Sickle cell acute chest syndrome|Fever, chest pain, hypoxia and a new infiltrate — the leading cause of death in sickle cell disease. <b>Treat with oxygen, fluids, analgesia, antibiotics and transfusion, and do not miss it.</b>",
"Heme & Onc|Sickle cell pain crisis|Precipitants — dehydration, infection, cold, stress, hypoxia. Treat with hydration, opioids titrated to effect, oxygen, and treatment of the precipitant. Hydroxyurea reduces crises long-term.",
"Heme & Onc|Thrombophilia|Factor V Leiden and prothrombin gene mutation for venous events; antithrombin, protein C and S deficiency; antiphospholipid syndrome for both arterial and venous. <b>Do not screen routinely after a first unprovoked VTE</b> — it rarely changes management.",
"Heme & Onc|Antiphospholipid syndrome|Thrombosis or recurrent pregnancy loss with persistently positive lupus anticoagulant, anticardiolipin or anti-beta-2-glycoprotein antibodies. Prolonged PTT that does <b>not</b> correct with mixing. Treat with anticoagulation, not platelets.",
"Heme & Onc|Multiple myeloma|CRAB — hyperCalcaemia, Renal failure, Anaemia, Bone lesions. Plus a monoclonal protein on electrophoresis, plasma cells over 10% on marrow, and immune paresis. <b>Consider it in any older adult with back pain and anaemia.</b>",
"Renal|Urinalysis interpretation|RBC casts — glomerulonephritis. WBC casts — pyelonephritis or interstitial nephritis. Granular casts — acute tubular necrosis. Hyaline casts — normal or dehydration. Broad waxy casts — chronic kidney disease. Eosinophils — interstitial nephritis.",
"Renal|Pre-renal vs intrinsic AKI|Pre-renal — FENa under 1%, urine sodium under 20, BUN to creatinine ratio over 20, and it corrects with volume. Intrinsic — FENa over 2%, and it does not correct with fluid. <b>FENa is unreliable on diuretics</b> — use the FEUrea instead.",
"Renal|Contrast-induced nephropathy|Rising creatinine 48–72 hours after iodinated contrast. Risk factors are pre-existing CKD, diabetes, dehydration and heart failure. <b>Prevent with hydration</b>; N-acetylcysteine has not held up. Hold NSAIDs and diuretics.",
"Renal|Rhabdomyolysis and the kidney|Myoglobin causes pigment nephropathy. Prevent with aggressive intravenous fluids targeting good urine output. Watch for hyperkalaemia, hyperphosphataemia and hypocalcaemia.",
"Renal|Dialysis indications — AEIOU|<b>A</b>cidosis that is refractory · <b>E</b>lectrolytes, meaning refractory hyperkalaemia · <b>I</b>ntoxications such as lithium, methanol, ethylene glycol and salicylates · <b>O</b>verload with pulmonary oedema · <b>U</b>raemia with encephalopathy or pericarditis.",
"Renal|Kidney stones by composition|Calcium oxalate — commonest, radiopaque, associated with hypercalciuria, hyperoxaluria and low fluid intake. Uric acid — radiolucent, associated with gout and low urine pH. Struvite — infection with urease-producing organisms. Cystine — hexagonal crystals, genetic.",
"Renal|Nephrolithiasis treatment|Acute — analgesia with NSAIDs, hydration, and tamsulosin for distal stones. Prevention by stone type — <b>calcium oxalate: thiazide plus low oxalate; uric acid: alkalinise the urine; struvite: treat the infection.</b>",
"Renal|Post-streptococcal glomerulonephritis|Nephritic syndrome 1–3 weeks after pharyngitis or 3–6 weeks after impetigo, with <b>low complement</b>, cola-coloured urine and hypertension. Children recover well; adults have a worse prognosis.",
"GI & Liver|Dysphagia — oropharyngeal vs oesophageal|Oropharyngeal — difficulty initiating a swallow, associated with neurological disease. Oesophageal — food sticking, progressive, and either mechanical or motor. <b>Progressive solid-food dysphagia is a malignancy until excluded.</b>",
"GI & Liver|Achalasia|Progressive dysphagia for solids and liquids with regurgitation and weight loss. Barium swallow shows a bird-beak narrowing; manometry shows absent peristalsis with failure of relaxation. Treat with pneumatic dilation or Heller myotomy.",
"GI & Liver|Barrett oesophagus|Intestinal metaplasia of the distal oesophagus from chronic acid exposure, raising the risk of adenocarcinoma. Surveillance with upper endoscopy and biopsy. Chronic GERD is the risk factor.",
"GI & Liver|Diverticulitis|Left lower quadrant pain, fever and leucocytosis in an older adult. Uncomplicated — outpatient oral antibiotics and a liquid diet, or observation in mild cases. Complicated — abscess, obstruction, fistula or perforation, requiring imaging and possibly drainage or surgery.",
"GI & Liver|Acute mesenteric ischaemia|Pain out of proportion to the examination in an older adult with atrial fibrillation or vascular disease. <b>Lactate and acidosis are late findings and CT angiography is diagnostic.</b> Mortality is high and treatment is surgical.",
"GI & Liver|Hepatorenal syndrome|Functional kidney failure in advanced liver disease — rising creatinine with minimal proteinuria, bland sediment, and a lack of response to volume. Diagnosed after excluding other causes and after a volume challenge. Treat with terlipressin plus albumin.",
"GI & Liver|Ascending cholangitis|Charcot triad — fever, right upper quadrant pain and jaundice. Reynolds pentad adds hypotension and altered mental status. Treat with <b>antibiotics and urgent biliary drainage</b>, not antibiotics alone.",
"GI & Liver|Wilson disease|Copper accumulation with hepatitis, tremor, psychiatric symptoms and Kayser-Fleischer rings. <b>Low ceruloplasmin and high urinary copper.</b> Treat with chelation or zinc. Consider it in any young person with unexplained liver disease.",
"OB/GYN|Contraception effectiveness|Long-acting reversible contraception — the implant and the intrauterine device — is most effective. Then sterilisation, then pills, patch and ring, then condoms. <b>Offer LARC first in the postpartum period and to anyone wanting the most reliable option.</b>",
"OB/GYN|Postpartum endometritis|Fever and uterine tenderness after delivery, usually 24 hours to 10 days. Treat with <b>clindamycin plus gentamicin</b>; add ampicillin for enterococcal coverage or if there is no response.",
"OB/GYN|Prolapsed cord|Umbilical cord below the presenting part after rupture of membranes — a cord compression emergency. <b>Relieve pressure by elevating the presenting part and put the patient head-down; deliver by caesarean.</b> Do not attempt to replace the cord.",
"OB/GYN|Shoulder dystocia|McRoberts manoeuvre first, then suprapubic pressure, then internal rotation manoeuvres. <b>Avoid fundal pressure.</b> Document the manoeuvres used and the neonatal outcome.",
"OB/GYN|Placenta praevia vs abruption|Praevia — painless bright red bleeding with a soft, non-tender uterus; <b>never perform a digital examination.</b> Abruption — painful bleeding with a tender, rigid uterus, often with fetal distress.",
"OB/GYN|Ovarian torsion|Sudden severe unilateral pelvic pain with nausea in a woman with an adnexal mass. <b>Surgical emergency</b> — detorsion preserves the ovary. Doppler flow may be normal, so do not rely on it to exclude the diagnosis.",
"OB/GYN|Infertility workup|After 12 months of trying, or 6 months if over 35. <b>Evaluate both partners.</b> Basic workup is semen analysis, ovulation assessment, tubal patency, and thyroid and prolactin as indicated.",
"OB/GYN|Cervical cancer prevention|HPV vaccination plus screening. Current screening — cytology every 3 years from 21 to 29; cytology every 3 years, hrHPV every 5 years, or cotesting every 5 years from 30 to 65. Stop after 65 with adequate prior screening.",
"Cardiology|ECG — a systematic read|Rate from the R-R interval, then regular or irregular, P waves before each QRS, PR interval, QRS width, axis, then ST-T changes. <b>A consistent sequence beats pattern-spotting.</b>",
"Cardiology|ST elevation — is it a STEMI?|Consider normal variants, early repolarisation, left ventricular hypertrophy, left bundle branch block, hyperkalaemia, pericarditis and Brugada. <b>Use the clinical picture and repeat the ECG — do not delay reperfusion when the presentation fits.</b>",
"Cardiology|Atrioventricular block|First degree — prolonged PR, benign. Mobitz I with progressive PR prolongation then a dropped beat — usually benign. Mobitz II with a constant PR and intermittent dropped beats — <b>risk of complete heart block, needs pacing.</b> Third degree — complete dissociation.",
"Cardiology|Narrow-complex tachycardia|Regular, fast, and a rate near 150 suggests atrial flutter with 2 to 1 block. Rate control, and synchronised cardioversion if unstable. Vagal manoeuvres first for stable SVT.",
"Cardiology|Wide-complex tachycardia|Treat as ventricular tachycardia until proven otherwise, especially with structural heart disease. <b>Unstable — synchronised cardioversion. Stable — amiodarone.</b> Do not give verapamil.",
"Cardiology|Valvular murmurs|Aortic stenosis — crescendo-decrescendo systolic murmur radiating to the carotids with a slow-rising pulse. Aortic regurgitation — early diastolic murmur with a wide pulse pressure. Mitral stenosis — mid-diastolic rumble with an opening snap. Mitral regurgitation — holosystolic murmur at the apex.",
"Cardiology|When to suspect endocarditis|A new or changing murmur with fever, plus a risk factor such as a prosthetic valve, IV drug use, or recent dental work. <b>Get three blood culture sets before antibiotics</b> and an echocardiogram.",
"Cardiology|Pericarditis|Positional sharp chest pain worse lying flat and better sitting forward, with diffuse ST elevation and PR depression. Treat with NSAIDs plus colchicine. Look for tamponade — hypotension, distended neck veins, muffled heart sounds.",
"Cardiology|Hypertrophic cardiomyopathy|Harsh systolic murmur that worsens with Valsalva and improves with squatting, with a risk of sudden death in young athletes. <b>Avoid vasodilators and diuretics that reduce preload.</b>",
"Cardiology|Antithrombotic therapy in ACS|High-intensity statin for all, dual antiplatelet therapy, and anticoagulation during the index event. Duration of dual therapy depends on whether a stent was placed, the bleeding risk, and the clinical setting.",
"Endocrine|Primary hyperaldosteronism|Hypertension with hypokalaemia, though most patients are normokalaemic. <b>Screen with an aldosterone-to-renin ratio regardless of potassium</b> — a Class 1 recommendation in the 2025 hypertension guideline. Confirm, then lateralise with adrenal vein sampling.",
"Endocrine|Phaeochromocytoma|Episodic headache, palpitations, sweating and severe hypertension. Diagnose with plasma free metanephrines. <b>Alpha-blockade before beta-blockade</b> — reversing the order precipitates hypertensive crisis.",
"Endocrine|Cushing syndrome|Central obesity, moon face, buffalo hump, proximal myopathy, purple striae, easy bruising, hyperglycaemia and hypertension. <b>Screen with late-night salivary cortisol, 24-hour urinary free cortisol, or an overnight dexamethasone suppression test.</b>",
"Endocrine|Adrenal insufficiency|Fatigue, weight loss, hypotension, hyponatraemia and hyperkalaemia. Diagnose with a morning cortisol and an ACTH stimulation test. <b>Treat with hydrocortisone before confirming</b> if the patient is unstable.",
"Endocrine|Hypopituitarism|Deficiencies follow a pattern — growth hormone and gonadotrophins first, then TSH, then ACTH. <b>Replace cortisol before thyroid hormone</b> or you can precipitate an adrenal crisis.",
"Endocrine|Prolactinoma|Amenorrhoea, galactorrhoea and infertility in women; headache, visual field defects and hypogonadism in men, who present later because their tumours are larger. Treat with cabergoline. Exclude other causes of hyperprolactinaemia first — drugs, pregnancy, hypothyroidism.",
"Endocrine|Diabetes insipidus|Polyuria and hypernatraemia with dilute urine. Central — deficient ADH, responds to desmopressin. Nephrogenic — kidney resistance, no response to desmopressin. <b>Distinguish from primary polydipsia with a water deprivation test.</b>",
"Endocrine|Insulin regimens|Basal-bolus mimics physiology — long-acting once or twice daily plus rapid-acting with meals. Premixed is simpler but less flexible. <b>Total daily dose starts around 0.3–0.6 units/kg</b>, split roughly half basal and half prandial.",
"Ambulatory|Headache — when to image|Thunderclap onset · new onset over 50 · fever or neck stiffness · focal deficit or altered consciousness · papilloedema · worse lying flat or with Valsalva · pregnancy or postpartum · cancer or immunosuppression · changed pattern in a stable headache.",
"Ambulatory|Dizziness — a practical frame|Distinguish vertigo (vestibular), presyncope (cardiac or orthostatic), disequilibrium (neurological) and light-headedness (metabolic or psychiatric). <b>The HINTS examination outperforms early MRI in central vertigo.</b>",
"Ambulatory|Insomnia|Cognitive behavioural therapy for insomnia is first-line and outperforms medication long-term. Components are sleep restriction, stimulus control, sleep hygiene, relaxation and cognitive restructuring. Avoid long-term benzodiazepines, especially in older adults.",
"Ambulatory|CKD screening in primary care|For every patient with hypertension or diabetes, check eGFR and urine albumin-to-creatinine ratio. <b>Albuminuria often changes before eGFR</b>, so it is the earlier signal.",
"Ambulatory|Colorectal surveillance intervals|1–2 small tubular adenomas — 7 to 10 years. 3–10 adenomas or any high-risk feature — 3 years. More than 10 adenomas — consider a hereditary syndrome.",
"Ambulatory|Outpatient anticoagulation decisions|By annual stroke risk in atrial fibrillation, or by provoked versus unprovoked VTE. DOACs over warfarin except for mechanical valves and moderate-to-severe rheumatic mitral stenosis.",
"Ambulatory|Statins and muscle symptoms|Muscle aches are common; true myopathy is rare. Check creatine kinase with significant weakness or pain. <b>Immune-mediated necrotising myopathy</b> shows persistently elevated CK that does not improve off the drug and needs immunosuppression.",
"Ambulatory|Well-adult visit structure|Risk factors, then age-appropriate screening, immunisations, counselling on tobacco, alcohol, diet, activity and safety, and a scheduled follow-up. <b>The follow-up appointment is itself a scored action.</b>",
/* Card pack 3 */
"Biostats: Measures|Rate versus proportion|A proportion has people in the denominator; a rate has person-time. That distinction is why incidence rate handles participants entering and leaving at different times.",
"Biostats: Measures|Point versus period prevalence|Point prevalence counts cases at one instant. Period prevalence counts anyone affected during an interval, so it is always the larger number.",
"Biostats: Measures|Cumulative incidence|New cases divided by the population at risk at the start. Requires complete follow-up of a fixed cohort — it cannot accommodate people dropping in and out.",
"Biostats: Measures|Crude, specific and adjusted rates|Crude rates compare whole populations but are confounded by age structure. Age-specific rates describe subgroups. Adjusted rates remove the age effect so populations can be compared fairly.",
"Biostats: Measures|Direct versus indirect standardization|Direct applies the study population's age-specific rates to a standard population, and needs large numbers. Indirect applies standard rates to the study population and yields the standardized mortality ratio — use it with small numbers.",
"Biostats: Measures|Infant mortality rate|Deaths under one year per 1,000 live births in the same year. It reflects health care access and social conditions, which is why it is used as a population health marker.",
"Biostats: Measures|Maternal mortality ratio|Maternal deaths per 100,000 live births. The United States performs far worse than comparable high-income countries, driven largely by cardiovascular causes and inequitable access.",
"Biostats: Measures|Case fatality versus proportionate mortality|Case fatality is deaths divided by diagnosed cases — a measure of severity. Proportionate mortality is deaths from one cause over all deaths, which rises when competing causes fall.",
"Biostats: Measures|Years of potential life lost|Each death is weighted by remaining life expectancy. This is why suicide, overdose and injury dominate YPLL despite far lower overall mortality than heart disease.",
"Biostats: Measures|Disability-adjusted life years|Years lost to premature death plus years lived with disability. The standard metric for global burden of disease and for comparing conditions across populations.",
"Biostats: Measures|Cause-specific mortality rate|Deaths from one cause per population at risk. The backbone of prevention research because it is directly comparable across populations and over time.",
"Biostats: Measures|Five-year survival and its flaw|Proportion alive five years after diagnosis. It is distorted by lead-time and length bias, which is precisely why screening programmes are judged on mortality instead.",
"Biostats: Measures|Median versus mean survival|Median is preferred for survival data because a few long survivors distort the mean. The mean is only computable once every participant has died.",
"Biostats: Study Design|Case-crossover design|Each case serves as their own control, comparing the period immediately before the event with a control period. Used for triggers of acute events, such as exertion and myocardial infarction.",
"Biostats: Study Design|Nested case-control|Cases and controls are drawn from an existing cohort, so exposure data are already collected. Efficient and resistant to recall bias — it borrows the strengths of both designs.",
"Biostats: Study Design|Superiority, non-inferiority and equivalence|Superiority asks whether the new is better. Non-inferiority asks whether it is not meaningfully worse, used when it is safer, cheaper or easier. Equivalence asks whether it is neither better nor worse within a two-sided margin.",
"Biostats: Study Design|The non-inferiority margin|A pre-specified clinical threshold, not a statistical one. A poorly chosen margin can make any inferior drug look non-inferior. Inspect both intention-to-treat and per-protocol analyses.",
"Biostats: Study Design|Simple versus block randomization|Simple randomization can produce imbalance by chance in small trials. Block randomization with fixed block sizes keeps groups balanced over time, but block sizes must not be predictable.",
"Biostats: Study Design|Stratified randomization|Randomizes within strata of important prognostic variables such as centre, age or disease severity, guaranteeing balance on those factors specifically.",
"Biostats: Study Design|Cluster randomization|Randomizes groups rather than individuals — clinics, villages, schools. Analysis must account for intra-cluster correlation, or the study is badly over-powered.",
"Biostats: Study Design|Factorial design|Tests two or more interventions simultaneously in the same trial, each independently randomized. Efficient, and can detect interactions, but power for the interaction is usually low.",
"Biostats: Study Design|Equipoise|Genuine uncertainty about which arm is better. Randomization is only ethical while equipoise exists; once one arm is clearly superior, continuing to randomize is not permissible.",
"Biostats: Study Design|Interim analyses and alpha spending|Pre-planned looks at accumulating data that allow early stopping for benefit, harm or futility. Trials stopped early tend to overestimate the treatment effect, which is a lasting source of inflated results.",
"Biostats: Study Design|Adaptive designs|Pre-specified rules that allow the trial to change — dropping an arm, shifting allocation ratios, or adjusting sample size — based on interim data. Flexible, but must be planned in advance or the results become uninterpretable.",
"Biostats: Interpretation|Confidence interval|If the study were repeated many times, 95% of intervals constructed this way would contain the true value. It describes the procedure, not the probability that this particular interval is correct.",
"Biostats: Interpretation|CI crossing the null|For a relative measure, crossing 1 means not significant. For a difference, crossing 0 means not significant. A wide interval signals imprecision, usually from small sample size.",
"Biostats: Interpretation|Bonferroni correction|Divide alpha by the number of comparisons. Conservative — it controls type I error but raises type II error, so it is best reserved for a small number of pre-planned comparisons.",
"Biostats: Interpretation|Heterogeneity and I-squared|I-squared is the proportion of between-study variability due to heterogeneity rather than chance. Above 50 percent is often considered substantial, and a pooled estimate should then be interpreted cautiously or not at all.",
"Biostats: Interpretation|Funnel plot and publication bias|Plots effect size against precision. Asymmetry suggests small negative studies were never published. The Egger test quantifies it.",
"Biostats: Interpretation|Interpreting a null intention-to-treat result|A null ITT result alongside a positive per-protocol result usually means adherence was poor rather than that the drug does not work. It does not license switching to per-protocol.",
"Biostats: Interpretation|Missing data|Complete-case analysis assumes data are missing at random, which is often false. Multiple imputation or mixed models are preferred. Differential missingness between arms is a major source of bias.",
"Biostats: Interpretation|Regression to the mean|Extreme values revert toward the average on their own. This explains why treating the sickest patients, or targeting the worst-performing hospitals, appears to produce improvement.",
"Biostats: Interpretation|Hazard ratio|The instantaneous relative risk of the event over the whole follow-up period. It assumes proportional hazards, so a crossing survival curve invalidates it.",
"Biostats: Interpretation|Odds ratio as an approximation of risk|The odds ratio approximates the risk ratio only when the outcome is rare — generally under 10 percent. For common outcomes it substantially exaggerates the effect.",
"Biostats: Interpretation|Absolute versus relative measures|A 50 percent relative reduction from 2 in 1,000 to 1 in 1,000 is an absolute reduction of 1 in 1,000, so the NNT is 1,000. Relative measures belong in journals; absolute measures belong in conversations with patients.",
"Biostats: Statistical Tests|Choosing the right test|By outcome type and comparison. Continuous, normally distributed means — t-test or ANOVA. Continuous, non-normal — Mann-Whitney or Kruskal-Wallis. Proportions — chi-square or Fisher exact. Time to event — log-rank.",
"Biostats: Statistical Tests|Independent versus paired t-test|Independent compares means in two unrelated groups. Paired compares before and after within the same people, which removes between-person variability and sharply increases power.",
"Biostats: Statistical Tests|ANOVA|Compares means across three or more groups in a single test, avoiding repeated t-tests and the inflated type I error they cause. It rejects the null that all means are equal, then requires post-hoc testing to identify which groups differ.",
"Biostats: Statistical Tests|Why pairing increases power|Pairing removes the component of variance attributable to differences between people, so a smaller effect becomes detectable with fewer participants. It is the reason crossover trials are efficient.",
"Biostats: Statistical Tests|Chi-square versus Fisher exact|Chi-square tests association between two categorical variables. Fisher exact is used when expected cell counts are small, conventionally under five.",
"Biostats: Statistical Tests|Non-parametric tests|Used when data are not normally distributed, are ordinal, or contain outliers. They compare ranks rather than means, so they are robust but slightly less powerful when the parametric assumptions actually hold.",
"Biostats: Statistical Tests|Mann-Whitney versus Wilcoxon|Mann-Whitney U compares two independent groups without assuming normality. Wilcoxon signed-rank is the paired equivalent, used for non-normal or ordinal paired data.",
"Biostats: Statistical Tests|Correlation versus regression|Correlation quantifies the strength of a linear relationship and treats both variables symmetrically. Regression models how an outcome depends on predictors and produces an equation.",
"Biostats: Statistical Tests|Pearson versus Spearman correlation|Pearson measures linear association and assumes approximate normality. Spearman measures monotonic association using ranks and is used for ordinal or non-normal data.",
"Biostats: Statistical Tests|Linear regression|Models a continuous outcome against predictors, with each coefficient representing the change in outcome per unit change in the predictor. Confounders are handled by including them in the model.",
"Biostats: Statistical Tests|Logistic regression|Models a binary outcome and reports an odds ratio for each predictor. Used to adjust for confounders in case-control studies and to build clinical prediction models.",
"Biostats: Statistical Tests|Cox proportional hazards|Models time to event and reports a hazard ratio per predictor, accounting for censoring. It assumes the hazard ratio stays constant over time.",
"Biostats: Statistical Tests|Kaplan-Meier curve|Estimates survival over time while accounting for censored observations — people who have not had the event by the end of follow-up. The curve steps down at each event.",
"Biostats: Statistical Tests|Log-rank test|Compares two or more Kaplan-Meier curves. It is the standard unadjusted test for differences in time-to-event outcomes.",
"Biostats: Statistical Tests|Propensity scores|The probability of receiving treatment given measured covariates. Used in observational research to balance measured confounders between groups, approximating randomization imperfectly.",
"Biostats: Statistical Tests|Adjustment versus stratification|Both control for confounding. Stratification analyses within subgroups and then pools the estimates. Adjustment includes the confounder as a covariate in a regression model.",
"Biostats: Statistical Tests|Bootstrapping|Resampling with replacement to estimate the sampling distribution of a statistic. Used when the theoretical distribution is unknown or the sample is small.",
"Biostats: Statistical Tests|Number needed to treat, done properly|One divided by the absolute risk reduction. Round up, because a fraction of a patient does not exist. Always report the absolute numbers alongside it or the NNT is uninterpretable.",
"Screening & Decision Rules|Screening versus diagnosis|Screening tests asymptomatic people; diagnostic testing evaluates a symptomatic patient. Applying a screening test to someone with symptoms changes the predictive value completely.",
"Screening & Decision Rules|Program sensitivity|The proportion of all disease in the population detected by the whole programme, not by a single test. Even a highly sensitive test yields low programme sensitivity if uptake is poor.",
"Screening & Decision Rules|Moving the decision threshold|Lowering the cut-off increases sensitivity and decreases specificity. The right threshold depends on the relative cost of a missed diagnosis versus a false positive — it is a value judgment, not a statistical one.",
"Screening & Decision Rules|Harms of screening|False positives leading to biopsy and anxiety, overdiagnosis leading to treatment of disease that would never have caused harm, and procedural or radiation risk. These are why screening decisions are individualised rather than universal.",
"Screening & Decision Rules|Why mortality is the screening endpoint|Survival from diagnosis is distorted by lead-time and length bias. Disease-specific mortality is not. It is the only endpoint that answers whether screening actually saves lives.",
"Epidemiology|Person-time denominator|Person-years accumulate as each participant contributes time until the event, death, or the end of follow-up.",
"Epidemiology|Outbreak investigation steps|Confirm the outbreak, define a case, describe by time place and person, generate hypotheses, test them with a cohort or case-control study, implement control measures, communicate the findings.",
"Epidemiology|Epidemic curve patterns|Point source gives a single sharp peak. Continuous common source gives a plateau then fall. Propagated gives successive peaks one incubation period apart, each taller than the last.",
"Epidemiology|Herd immunity threshold|Approximately one minus one over R0. Higher R0 requires higher coverage. Measles approaches 95 percent.",
"Epidemiology|Secondary attack rate|The proportion of susceptible contacts who become ill. Measures transmissibility within households and closed settings.",
"Epidemiology|Modes of transmission|Contact, including direct, indirect and droplet; airborne; common vehicle such as food, water and blood; and vector-borne. The mode determines which control measure works.",
"Epidemiology|Levels of prevention|Primordial — prevent risk factors emerging. Primary — prevent disease in susceptible people, such as vaccination. Secondary — detect disease early. Tertiary — limit disability and complications.",
"Epidemiology|Ecological fallacy|A group-level association does not necessarily hold at the individual level. A country with higher fat intake and higher colon cancer rates does not tell you that individuals who eat fat get cancer.",
"Ophthalmology|Sudden painless vision loss|Think retinal artery occlusion, retinal detachment, vitreous haemorrhage or central retinal vein occlusion. Retinal artery occlusion is an emergency — attempt to lower intraocular pressure and refer immediately.",
"Ophthalmology|Acute angle-closure glaucoma|Severe eye pain, headache, nausea and vomiting with a mid-dilated fixed pupil and a hazy cornea. <b>A medical emergency requiring immediate ophthalmology referral and pressure-lowering therapy.</b>",
"Ophthalmology|Anterior uveitis|Painful red eye with photophobia, consensual photophobia and a constricted pupil. Associated with HLA-B27, sarcoidosis and inflammatory bowel disease. Treat with topical steroids and cycloplegics.",
"Ophthalmology|Conjunctivitis|Viral — watery, bilateral, with a preauricular node. Bacterial — purulent and unilateral. Allergic — itchy and bilateral with an atopic history. <b>Pain and photophobia are not conjunctivitis — think deeper.</b>",
"Ophthalmology|Painful red eye red flags|Reduced vision, photophobia, a fixed mid-dilated pupil, corneal haze, ciliary flush, or any history of trauma all warrant immediate ophthalmology referral.",
"Ophthalmology|Retinal detachment|Sudden flashes, floaters and a curtain across the vision. <b>Surgical emergency.</b> Risk factors are high myopia, prior cataract surgery, trauma and family history.",
"Ophthalmology|Diabetic retinopathy|Non-proliferative shows microaneurysms, dot-blot haemorrhages and hard exudates. Proliferative shows neovascularization and vitreous haemorrhage and is treated with panretinal photocoagulation. <b>Annual dilated examination, or more often once findings are present.</b>",
"Ophthalmology|Macular degeneration|Central vision loss with preserved peripheral vision. Dry disease shows drusen and is most common. Wet disease involves choroidal neovascularization and is treated with antivascular endothelial growth factor injections.",
"Ophthalmology|Papilloedema|Bilateral disc swelling from raised intracranial pressure, with an enlarged blind spot, transient visual obscurations and headache worse lying flat. Requires urgent evaluation for a mass lesion.",
"Ophthalmology|Optic neuritis|Unilateral painful vision loss worsened by eye movement, with a relative afferent pupillary defect and colour desaturation. Associated with multiple sclerosis. Steroids speed recovery but do not change final acuity.",
"Ophthalmology|Hypertensive retinopathy|Arteriolar narrowing, arteriovenous nicking, flame haemorrhages and cotton-wool spots. <b>Papilloedema makes it a hypertensive emergency.</b>",
"Ophthalmology|Amaurosis fugax|Transient monocular vision loss, often described as a curtain descending. <b>A retinal TIA — evaluate urgently for carotid disease and treat as a stroke risk equivalent.</b>",
"ENT|Epistaxis|Anterior bleeding from Little area is usually self-limiting — treat with pressure, topical oxymetazoline and cautery. Posterior bleeding from the sphenopalatine artery is more severe and often needs packing or embolization.",
"ENT|Sudden sensorineural hearing loss|Sudden unilateral hearing loss, often with tinnitus. <b>A medical emergency — treat with high-dose corticosteroids, ideally within 72 hours</b>, because delay reduces the chance of recovery.",
"ENT|Vertigo, central versus peripheral|Peripheral gives horizontal or rotatory nystagmus that suppresses with fixation, with hearing loss or tinnitus. Central gives vertical or direction-changing nystagmus that does not suppress, with focal neurological signs.",
"ENT|Benign paroxysmal positional vertigo|Brief positional vertigo with a positive Dix-Hallpike test and rotatory nystagmus. Treat with an Epley repositioning manoeuvre — medication is not the answer.",
"ENT|Meniere disease|Episodic vertigo lasting minutes to hours with fluctuating sensorineural hearing loss, tinnitus and aural fullness. Treated with salt restriction, diuretics and betahistine.",
"ENT|Peritonsillar abscess|Unilateral severe sore throat with trismus, a hot-potato voice, uvular deviation and a bulging tonsil. Treat with drainage plus antibiotics covering streptococci and anaerobes.",
"ENT|Acute bacterial sinusitis|Symptoms persisting beyond 10 days without improvement, or severe symptoms with fever over 39 and purulent discharge for 3 to 4 days. Amoxicillin-clavulanate if antibiotics are indicated.",
"ENT|Epiglottitis|Rapid onset of fever, drooling, muffled voice and a preference to sit forward. <b>Do not examine the throat or lie the patient flat.</b> The airway is the priority — prepare for intubation in theatre.",
"ENT|Otitis externa|Painful ear with tenderness on moving the tragus or pinna and a swollen canal. Treat with topical antibiotic drops. Consider malignant otitis externa in a diabetic with severe pain and cranial nerve involvement.",
"ENT|Cholesteatoma|Foul-smelling ear discharge with hearing loss and a retraction pocket or attic crust. <b>Treat surgically</b> — it erodes bone and can cause intracranial complications.",
"Allergy & Immunology|Biphasic anaphylaxis|Recurrence of symptoms hours after apparent resolution without further exposure. This is why observation for 4 to 6 hours is standard, and longer after a severe presentation.",
"Allergy & Immunology|Hereditary angioedema|Recurrent angioedema without urticaria, often with abdominal pain, and a family history. <b>It does not respond to epinephrine or antihistamines</b> — treat with C1 inhibitor concentrate, icatibant or lanadelumab.",
"Allergy & Immunology|Delabelling penicillin allergy|About 9 in 10 patients labelled penicillin-allergic are not. Non-severe delayed rashes can generally be challenged. Anaphylaxis, angioedema and severe cutaneous reactions are the histories to respect.",
"Allergy & Immunology|Common variable immunodeficiency|Recurrent sinopulmonary infections with low immunoglobulin G and low IgA or IgM, plus poor vaccine responses. Treat with immunoglobulin replacement.",
"Allergy & Immunology|Selective IgA deficiency|The commonest primary immunodeficiency, usually asymptomatic. Can cause anaphylaxis to blood products because of anti-IgA antibodies.",
"Allergy & Immunology|Chronic urticaria|Daily or near-daily wheals for over 6 weeks. Exclude thyroid disease and consider autoimmune causes. Treat with second-generation antihistamines and escalate to omalizumab — not long-term corticosteroids.",
"Allergy & Immunology|Drug allergy types|Type I — immediate IgE-mediated anaphylaxis. Type II — antibody-mediated, such as drug-induced haemolysis. Type III — immune complex, such as serum sickness. Type IV — delayed T-cell-mediated, such as contact dermatitis and SJS.",
"Allergy & Immunology|Mast cell activation|Flushing, urticaria, abdominal pain and hypotension with a raised tryptase. Confirm with a tryptase level and consider bone marrow evaluation if systemic mastocytosis is suspected.",
"Surgery & Urology|Appendicitis|Periumbilical pain migrating to the right lower quadrant with anorexia, nausea and fever. <b>CT with contrast is diagnostic in adults; ultrasound is preferred in children and pregnancy.</b> Treat with appendectomy plus antibiotics.",
"Surgery & Urology|Small bowel obstruction|Vomiting, distension, colicky pain and obstipation in a patient with prior surgery. <b>Adhesions are the commonest cause.</b> Treat with nasogastric decompression and fluids; operate for strangulation, closed loop, or failure to improve.",
"Surgery & Urology|Large bowel obstruction|Distension and obstipation with a more gradual onset. <b>Malignancy is the commonest cause in adults.</b> A coffee-bean sign on radiograph suggests sigmoid volvulus, which may be decompressed endoscopically.",
"Surgery & Urology|Ischaemic colitis|Bloody diarrhoea with lower abdominal pain in an older adult with low flow or atrial fibrillation. Usually affects the watershed splenic flexure. Most cases resolve with supportive care.",
"Surgery & Urology|Acute limb ischaemia|The six Ps — pain, pallor, pulselessness, paraesthesia, paralysis and poikilothermia. <b>A limb-threatening emergency requiring surgical embolectomy or revascularization, not heparin alone.</b>",
"Surgery & Urology|Ruptured abdominal aortic aneurysm|Sudden severe abdominal or back pain with hypotension and a pulsatile mass. <b>Do not delay for imaging in an unstable patient — go to the operating room.</b>",
"Surgery & Urology|Incarcerated and strangulated hernia|A hernia that cannot be reduced, with pain, tenderness and signs of obstruction. <b>Strangulation is a surgical emergency</b> — operating before it develops dramatically reduces mortality.",
"Surgery & Urology|Testicular torsion|Sudden severe testicular pain with a high-riding, transversely lying testis and an absent cremasteric reflex. <b>Surgical emergency — detorsion within 6 hours preserves the testis.</b> Doppler may be normal, so do not use it to exclude.",
"Surgery & Urology|Epididymitis|Gradual-onset pain with dysuria, fever and a tender epididymis with a preserved cremasteric reflex. Treat with antibiotics for chlamydia and gonorrhoea in young men, or enteric organisms in older men.",
"Surgery & Urology|Benign prostatic hyperplasia|Nocturia, hesitancy, weak stream and incomplete emptying. Treat with an alpha-blocker for rapid symptom relief and a 5-alpha-reductase inhibitor to shrink larger glands. <b>Check a post-void residual and creatinine.</b>",
"Surgery & Urology|Acute urinary retention|Painful inability to void with a distended bladder. Relieve with catheterisation, then treat the cause. <b>Watch for post-obstructive diuresis</b> after decompression.",
"Surgery & Urology|Renal cell carcinoma|Classically haematuria, flank pain and a palpable mass, though most are now incidental. Associated with smoking, obesity and von Hippel-Lindau disease. Treat localized disease with nephrectomy.",
"Surgery & Urology|Bladder cancer|Painless gross haematuria, usually in a smoker. <b>Any painless haematuria in an adult requires cystoscopy and upper tract imaging.</b>",
"Surgery & Urology|Bowel obstruction versus ileus|Both cause distension and vomiting. Obstruction has colicky pain, high-pitched bowel sounds and no flatus. Ileus is painless with absent bowel sounds and follows surgery or illness. Management differs fundamentally.",
"Vascular|Deep vein thrombosis|Unilateral leg swelling with calf tenderness, warmth and oedema. Diagnose with a Wells score plus D-dimer, then compression ultrasound. Anticoagulate for 3 months if provoked.",
"Vascular|Peripheral arterial disease|Claudication relieved by rest, diminished pulses and an ankle-brachial index of 0.90 or below. Treat with supervised exercise, high-intensity statin, antiplatelet therapy, smoking cessation and cilostazol.",
"Vascular|Critical limb ischaemia|Rest pain, non-healing ulcers, gangrene and an ankle-brachial index usually under 0.4. <b>Requires urgent revascularization to avoid amputation.</b>",
"Vascular|Carotid artery stenosis|Symptomatic stenosis of 50 to 99 percent warrants revascularization plus medical therapy. <b>Asymptomatic disease is now generally managed medically</b>, since trials showed surgery added little benefit.",
"Vascular|Venous insufficiency|Bilateral oedema, hyperpigmentation, lipodermatosclerosis and ulcers near the medial malleolus. Treat with compression therapy and elevation — the ulcer will not heal without compression.",
"Vascular|Varicose veins|Dilated superficial veins with aching and heaviness. Treat with compression; consider endovenous ablation for symptomatic disease.",
"Vascular|Thoracic outlet syndrome|Neck and arm pain with paraesthesia in the ulnar distribution, worse with overhead activity. Diagnosis is clinical using provocative manoeuvres.",
"Vascular|Chronic mesenteric ischaemia|Postprandial abdominal pain with weight loss and food fear in a patient with vascular disease. Diagnose with CT or MR angiography.",
"Cardiology|Systolic versus diastolic heart failure|Reduced ejection fraction of 40 percent or below has four pillars of therapy. Preserved ejection fraction at 50 percent or above is the commoner form in older adults, and an SGLT2 inhibitor is the key evidence-based addition.",
"Cardiology|BNP and NT-proBNP caveats|Elevated in heart failure, but also in renal failure, with older age and in women, which reduces specificity. A low value is more useful for excluding heart failure than a high value is for confirming it.",
"Cardiology|Brugada syndrome|Right bundle branch pattern with ST elevation in V1 and V2 in a structurally normal heart, with a risk of sudden death. <b>Avoid sodium channel blockers.</b>",
"Cardiology|Long QT syndrome|Prolonged QT with a risk of torsades de pointes. Treat with beta-blockers, avoid QT-prolonging drugs, correct electrolytes, and consider an implantable defibrillator.",
"Cardiology|Torsades de pointes|Polymorphic ventricular tachycardia with a twisting axis. <b>Treat with intravenous magnesium sulfate</b> and correct the precipitant, particularly hypokalaemia and hypomagnesaemia.",
"Cardiology|Wolff-Parkinson-White|Short PR with a delta wave and a risk of pre-excited atrial fibrillation. <b>Avoid AV nodal blocking agents in pre-excited atrial fibrillation</b> — they can accelerate conduction down the accessory pathway.",
"Cardiology|Spontaneous coronary artery dissection|Occurs in younger women, especially peripartum, with acute severe chest pain and ischaemic ECG changes. <b>Treat with reperfusion or surgery, not thrombolysis.</b>",
"Cardiology|Cardiac tamponade|Beck triad of hypotension, distended neck veins and muffled heart sounds, with pulsus paradoxus and low-voltage ECG. <b>Treat with urgent pericardiocentesis.</b>",
"Endocrine|Diabetic autonomic neuropathy|Gastroparesis, orthostatic hypotension, resting tachycardia, erectile dysfunction and silent myocardial infarction. Screen for hypoglycaemia unawareness, which is a major safety issue.",
"Endocrine|Diabetic foot|Neuropathy plus peripheral arterial disease plus minor trauma. <b>A deep, foul-smelling wound with crepitus suggests deep infection — urgent surgical involvement and MRI.</b>",
"Endocrine|Osteoporosis workup|DXA for women 65 and over and postmenopausal women under 65 at increased risk. <b>Evaluate for secondary causes in men, premenopausal women and anyone with an unexpected fracture</b> — vitamin D, calcium, phosphate, parathyroid hormone, TSH and testosterone.",
"Endocrine|Hypercalcaemia of malignancy|PTHrP-mediated with squamous cell cancers, or osteolytic with myeloma and breast cancer. <b>Treat with aggressive saline and then a bisphosphonate</b> — and avoid thiazides, which raise calcium further.",
"Endocrine|Carcinoid syndrome|Flushing, diarrhoea and bronchospasm with a raised 24-hour urinary 5-HIAA. Associated with metastatic midgut carcinoid. Treat with somatostatin analogues, and avoid adrenergic stimuli during anaesthesia.",
"Endocrine|Thyroid nodule follow-up|A benign aspirate still requires ultrasound surveillance for growth. <b>If a nodule grows or develops suspicious features, repeat the aspiration.</b>",
"Endocrine|Hyperosmolar therapy caution|Correcting sodium too quickly causes osmotic demyelination, and correcting glucose too quickly in HHS risks cerebral oedema. Sodium should not fall more than 10 mmol/L in 24 hours and glucose no faster than 90 to 120 mg/dL per hour.",
"Endocrine|Metabolic bone disease in CKD|Falling eGFR raises phosphate and parathyroid hormone and lowers calcium and vitamin D. Treat with phosphate binders, active vitamin D and dietary restriction — the goal is to avoid both hypercalcaemia and adynamic bone disease.",
"Neuro|Status epilepticus|Continuous seizure for 5 minutes or recurrent seizures without recovery. <b>Benzodiazepines first, then a loading dose of an antiepileptic, then escalation to anaesthetic doses.</b>",
"Neuro|Subarachnoid haemorrhage|Thunderclap headache with neck stiffness and photophobia. <b>Non-contrast head CT is the initial test, but CT can miss it after 6 hours, so proceed to lumbar puncture for xanthochromia</b> if the CT is negative and suspicion remains.",
"Neuro|Peripheral neuropathy pattern|Symmetric length-dependent sensory loss suggests diabetes or alcohol. Mononeuritis multiplex suggests vasculitis. Areflexia with ascending weakness suggests Guillain-Barre. <b>Always check B12, HbA1c, TSH and consider paraproteinaemia.</b>",
"Neuro|Brainstem syndromes|Crossed findings — ipsilateral cranial nerve deficit with contralateral limb findings — localize the lesion to the brainstem.",
"Neuro|Spinal cord compression|Back pain worse lying flat with a sensory level, lower motor neuron signs at the level and upper motor neuron signs below. <b>An oncologic emergency — give dexamethasone and obtain urgent MRI.</b>",
"Neuro|Myasthenic crisis|Respiratory failure from myasthenia, triggered by infection, surgery or medication. <b>Monitor vital capacity and negative inspiratory force, intubate before respiratory failure, and treat with IVIG or plasma exchange.</b>",
"Neuro|Wernicke encephalopathy|Confusion, ophthalmoplegia and ataxia in a malnourished or alcohol-dependent patient. <b>Give thiamine before glucose</b> — glucose without thiamine can precipitate it.",
"Neuro|Lambert-Eaton versus myasthenia|Lambert-Eaton improves with use, has facilitated reflexes and is linked to small-cell lung cancer. Myasthenia fatigues with use, has normal reflexes, and is linked to thymoma. Repetitive stimulation shows increment in the first and decrement in the second.",
"Heme & Onc|Disseminated intravascular coagulation|Prolonged PT and PTT, low fibrinogen, raised D-dimer and falling platelets, with both bleeding and thrombosis. <b>Treat the underlying cause — the coagulopathy follows it.</b>",
"Heme & Onc|Thrombotic thrombocytopenic purpura|Microangiopathic haemolytic anaemia with schistocytes, thrombocytopenia, neurological symptoms, renal failure and fever. <b>Treat with plasma exchange — and do not give platelets.</b>",
"Heme & Onc|Myeloproliferative neoplasms|Elevated platelets, red cells or white cells with a risk of both thrombosis and haemorrhage. <b>Look for JAK2 and CALR mutations</b> to confirm the diagnosis.",
"Heme & Onc|G6PD deficiency|Episodic haemolysis triggered by oxidant stress — infection, fava beans, sulfonamides, nitrofurantoin, dapsone or primaquine. Bite cells and Heinz bodies on the smear.",
"Heme & Onc|Hereditary spherocytosis|Spherocytes with an elevated mean corpuscular haemoglobin concentration, splenomegaly, pigment gallstones, and an aplastic crisis with parvovirus B19.",
"Heme & Onc|Febrile neutropenia risk stratification|High-risk patients need admission and intravenous antibiotics. Low-risk patients who meet criteria may be managed with oral antibiotics as an outpatient, but the assessment must be explicit and documented.",
"Preventive Medicine|Adolescent preventive visit|Immunisations including HPV and meningococcal, screening for depression, anxiety and substance use, and counselling on sexual health, driving and firearm access.",
"Preventive Medicine|Well-child visit|Growth and development, immunisations, hearing and vision, lead screening where indicated, and anticipatory guidance with injury prevention.",
"Preventive Medicine|Prenatal first visit|Dating ultrasound, blood type and screen, complete blood count, rubella and varicella immunity, hepatitis B, syphilis, HIV, chlamydia and gonorrhoea, urinalysis and urine culture. Start folic acid, and discuss low-dose aspirin if preeclampsia risk factors are present.",
"Preventive Medicine|Travel medicine|Assess destination, duration and activities. Vaccines by region include hepatitis A, typhoid, yellow fever, rabies and Japanese encephalitis. Choose malaria prophylaxis by species and resistance pattern.",
"Preventive Medicine|Physical activity counselling|150 minutes of moderate or 75 minutes of vigorous activity weekly, plus strength training twice weekly. Arguably the most cost-effective preventive intervention available.",
"Preventive Medicine|Older adult home safety|Remove loose rugs, improve lighting, install grab bars, review medications and consider a personal emergency response system. Exercise has the strongest evidence for preventing falls.",
"Preventive Medicine|Deprescribing|Stop medications without an ongoing indication, especially in older adults. Taper rather than stop abruptly for benzodiazepines, opioids, proton pump inhibitors and beta-blockers.",
"Preventive Medicine|Smoking cessation pharmacotherapy|Varenicline is the most effective single agent, combination nicotine replacement is also highly effective, and bupropion is an alternative. Combine with behavioural counselling — pharmacotherapy alone underperforms.",
"Ethics|Informed refusal|A competent patient may refuse any treatment, including life-sustaining treatment, even when the refusal will lead to death. Document capacity and the discussion.",
"Ethics|Physician-assisted death|Legal in some states with strict criteria — terminal illness, capacity, two oral requests and a written request, a waiting period and a second opinion. Physicians may also decline to participate.",
"Ethics|Unrepresented patients|A patient without decision-making capacity and without a surrogate requires a formal process — usually an ethics committee or a court-appointed guardian — rather than a unilateral physician decision.",
"Ethics|Genetic results and relatives|A patient's genetic result may have implications for relatives, but confidentiality generally prevails. Encourage disclosure; disclosure without consent is only rarely justified.",
"Ethics|Conscientious objection|A clinician may decline to participate in a specific intervention on moral grounds, but must not abandon the patient and should facilitate referral or transfer.",
"Ethics|Gifts and conflicts|Modest gifts from patients are acceptable if they create no obligation. Industry gifts of any value can create conflicts — the standard is to decline or fully disclose.",
"Safety, QI & Systems|Diagnostic error|The commonest category of harmful error in ambulatory care, contributing to more harm than medication errors. Mitigations include differential diagnosis checklists, second reads and safety-netting.",
"Safety, QI & Systems|Safety-netting|Specific instructions to the patient about what to watch for and when to recontact, plus a documented contingency plan. A key defence against diagnostic error in primary care.",
"Safety, QI & Systems|Health IT safety|Alert fatigue, copy-forward documentation errors and incorrect default settings are leading sources of harm. Mitigations include tuning alerts and using structured order sets.",
"Safety, QI & Systems|Diagnostic stewardship|Using tests appropriately, avoiding unnecessary or duplicate testing and reducing low-value care. Includes avoiding routine preoperative testing and reflexive imaging.",
"Safety, QI & Systems|Team communication failures|Handoffs, hierarchical barriers and ambiguous orders are leading contributors to harm. Structured tools include I-PASS, SBAR and closed-loop communication.",
"Safety, QI & Systems|Balancing measures|Whenever you change a system, measure something that could get worse as a result. Without a balancing measure you cannot tell whether you moved the problem rather than solving it.",
/* Card pack 4 */
"Perioperative Care|Preoperative cardiac risk assessment|Use the Revised Cardiac Risk Index — ischaemic heart disease, heart failure, cerebrovascular disease, insulin-treated diabetes, creatinine over 2, and high-risk surgery. <b>Zero or one factor is low risk; three or more warrants further evaluation.</b>",
"Perioperative Care|When to order preoperative testing|Only when the result will change management. <b>Routine testing before low-risk surgery in an asymptomatic patient does not improve outcomes and causes harm through false positives and delay.</b>",
"Perioperative Care|Perioperative beta-blockers|Do not start a beta-blocker on the day of surgery. <b>Continue beta-blockers that are already prescribed — abrupt withdrawal causes rebound tachycardia and ischaemia.</b> If blockade is indicated, start it weeks in advance.",
"Perioperative Care|Perioperative anticoagulation|Low bleeding risk — continue or hold a single dose. High bleeding risk — hold warfarin 5 days and direct oral anticoagulants 1 to 2 days. <b>Bridging with heparin is now reserved for the highest thrombotic risk</b>, because bridging increases bleeding without reducing thromboembolism.",
"Perioperative Care|Perioperative antiplatelets|Continue aspirin in a patient with a recent stent or high cardiovascular risk. Delay elective surgery 6 weeks after a bare metal stent and 6 months after a drug-eluting stent if possible. <b>If surgery cannot wait, continue dual antiplatelet therapy and accept the bleeding risk.</b>",
"Perioperative Care|Perioperative diabetes management|Hold metformin on the day of surgery. Hold SGLT2 inhibitors 3 to 4 days before surgery because of euglycaemic ketoacidosis risk. <b>Long-acting insulin should generally be reduced rather than stopped entirely.</b>",
"Perioperative Care|Perioperative medication review|Continue beta-blockers, statins, most antihypertensives and psychotropics. <b>Hold metformin, SGLT2 inhibitors, ACE inhibitors on the day of major surgery, monoamine oxidase inhibitors for 2 weeks, and most anticoagulants.</b>",
"Perioperative Care|Postoperative fever timing|Immediate — atelectasis or aspiration. Early, 24 to 72 hours — pneumonia, urinary infection or line infection. <b>Days 5 to 7 — anastomotic leak, intra-abdominal abscess, deep vein thrombosis or pulmonary embolism.</b>",
"Perioperative Care|Postoperative VTE prophylaxis|Risk-stratify and give pharmacologic prophylaxis, mechanical prophylaxis, or both. <b>Delay or avoid pharmacologic prophylaxis with active bleeding or high bleeding risk and use mechanical measures instead.</b>",
"Perioperative Care|Postoperative ileus versus obstruction|Both cause distension and vomiting. Ileus is painless with absent bowel sounds and no flatus. Obstruction has colicky pain and high-pitched sounds. <b>Obstruction needs imaging and often surgery; ileus is managed supportively.</b>",
"Perioperative Care|Postoperative wound infection|Erythema, warmth, purulent drainage and fever around day 3 to 7. <b>Open and drain — antibiotics alone will not fix an undrained collection.</b>",
"Perioperative Care|Perioperative pulmonary risk|Smoking, pre-existing lung disease, obstructive sleep apnoea, and upper abdominal or thoracic surgery. <b>Counsel smoking cessation at least 4 to 8 weeks before elective surgery</b> for the largest reduction in pulmonary complications.",
"Perioperative Care|Preoperative fasting|Clear liquids up to 2 hours and solids up to 6 to 8 hours before anaesthesia. <b>Prolonged fasting does not reduce aspiration risk and causes dehydration and hypoglycaemia.</b>",
"Perioperative Care|Consent for anesthesia|The patient must separately consent to the anesthesiologist and the anesthesiologist's role, including the possibility of a substitute clinician. Document allergies, airway assessment and prior anaesthetic problems.",
"Palliative & End-of-Life|Pain crisis dosing|For severe pain give opioids parenterally and titrate. <b>Base the dose on prior opioid exposure, not on the severity of the disease</b> — use frequent small doses rather than one large dose.",
"Palliative & End-of-Life|Opioid conversion|Convert to morphine equivalents for comparison. <b>Reduce by 25 to 50 percent when switching drug or route because of incomplete cross-tolerance.</b> This is a critical safety point and a favourite exam trap.",
"Palliative & End-of-Life|Opioid adverse effects|Constipation is universal and does not resolve — prescribe a bowel regimen with every opioid. Nausea and sedation usually improve within a week. <b>Respiratory depression is the dangerous one — monitor and titrate.</b>",
"Palliative & End-of-Life|Dyspnoea in terminal illness|Treat with opioids. <b>Opioids reduce the sensation of breathlessness; anxiolytics treat the anxiety, not the dyspnoea.</b> Oxygen helps only if the patient is genuinely hypoxaemic rather than simply breathless.",
"Palliative & End-of-Life|Terminal secretions|Rattling breathing from retained secretions. <b>Reposition and stop unnecessary fluids first. Anticholinergic agents such as glycopyrrolate or scopolamine reduce secretions.</b>",
"Palliative & End-of-Life|Hospice versus palliative care|<b>Palliative care is appropriate at any stage alongside curative treatment. Hospice requires a prognosis of 6 months or less and the patient forgoing curative treatment for the terminal illness.</b>",
"Palliative & End-of-Life|Withdrawal of life-sustaining treatment|Ethically equivalent to withholding. <b>Sedation and analgesia should continue or increase during withdrawal — the goal is comfort, neither hastening nor prolonging death.</b>",
"Palliative & End-of-Life|Advance care planning conversation|Ask what matters most to the patient rather than which specific interventions they want. Frame the discussion around goals, values and acceptable quality of life.",
"Palliative & End-of-Life|Depression at the end of life|Common and commonly missed. Treating it improves quality of life even when life expectancy is short. Treat with the same agents as in other settings, adjusted for organ function.",
"Palliative & End-of-Life|Caregiver burden|Caregivers carry significant physical and emotional burden and have higher mortality themselves. <b>Evaluate caregiver burden explicitly and offer support services and respite care.</b>",
"Palliative & End-of-Life|Cultural considerations in dying|Religious and cultural needs around death, autopsy and tissue donation vary widely. <b>Ask the patient and family what they need rather than assuming.</b>",
"Palliative & End-of-Life|Concern about addiction at the end of life|Physical dependence is expected and the duty to treat suffering outweighs any concern about addiction. <b>Fear of addiction in a dying patient is not a reason to withhold adequate analgesia.</b>",
"Palliative & End-of-Life|Non-pain symptom management|Nausea — metoclopramide, haloperidol or ondansetron. Agitation and delirium — haloperidol or a benzodiazepine. Anxiety — a benzodiazepine. <b>Benzodiazepines for anxiety and agitation, opioids for pain and dyspnoea.</b>",
"Chief Complaint Approach|Fatigue|Exclude the treatable and dangerous first — anaemia, thyroid disease, sleep apnoea, depression, diabetes, renal and hepatic disease, medication effects, cardiac disease. <b>Depression and obstructive sleep apnoea are the two most commonly missed.</b>",
"Chief Complaint Approach|Unintentional weight loss|Defined as over 5 percent of body weight over 6 to 12 months. Causes are malignancy, malabsorption, chronic disease, endocrine, psychiatric and psychosocial. <b>New weight loss warrants age-appropriate cancer screening and imaging, and is often a paraneoplastic clue.</b>",
"Chief Complaint Approach|Chest pain|Immediate ECG and troponin for ischaemia, then consider the other killers — aortic dissection, pulmonary embolism, tension pneumothorax, oesophageal rupture and pericarditis. <b>Do not anchor on the most likely diagnosis while the dangerous alternatives remain.</b>",
"Chief Complaint Approach|Abdominal pain by location|Right upper quadrant — biliary disease, hepatitis. Epigastric — peptic ulcer, pancreatitis, and acute coronary syndrome. Right lower quadrant — appendicitis, ovarian pathology, ectopic pregnancy. Left lower quadrant — diverticulitis. Diffuse — mesenteric ischaemia, obstruction, perforation, peritonitis.",
"Chief Complaint Approach|Dyspnoea|Divide into cardiac, pulmonary, and other — anaemia, metabolic acidosis, deconditioning, anxiety. <b>Metabolic acidosis presenting as breathlessness is a common and dangerous miss.</b>",
"Chief Complaint Approach|Syncope|Distinguish cardiac from neurocardiogenic from orthostatic. <b>Cardiac causes carry the highest mortality and include arrhythmia, outflow obstruction and ischaemia.</b> Red flags are no prodrome, occurrence during exertion, a family history of sudden death, and an abnormal ECG.",
"Chief Complaint Approach|Jaundice|Unconjugated — haemolysis or Gilbert syndrome. Conjugated — hepatocellular or obstructive. <b>Painless jaundice with a palpable gallbladder suggests malignant obstruction — Courvoisier sign.</b>",
"Chief Complaint Approach|Edema|Bilateral — cardiac, renal, hepatic, venous insufficiency, medication or lymphedema. Unilateral — deep vein thrombosis, cellulitis or obstruction. <b>Cardiac oedema classically improves with leg elevation; lymphedema does not.</b>",
"Chief Complaint Approach|Lymphadenopathy|Localized nodes drain an infection or malignancy. Generalized nodes suggest infection such as EBV or HIV, autoimmune disease, or malignancy such as lymphoma. <b>Any node over 2 cm or persisting beyond 4 to 6 weeks needs biopsy, and a supraclavicular node is always abnormal.</b>",
